<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Матрица целей и последствий</title><style>
:root{--text:#222831;--muted:#6b7280;--line:#d9dde4;--soft:#f3f5f7;--dark:#303744;--ok:#edf6f0;--bad:#faf0ef;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{display:flex;justify-content:center;padding:8px}.app{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{padding:13px 15px 10px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:18px;line-height:1.2}.count{font-size:12px;color:var(--muted);white-space:nowrap}.progress{display:flex;gap:5px;margin-top:8px}.progress i{flex:1;height:5px;border-radius:999px;background:var(--soft)}.progress i.active{background:var(--dark)}.progress i.done{background:#aab1bb}
.main{padding:12px 15px 14px}.case{background:var(--soft);border-radius:10px;padding:10px 11px;font-size:13.5px;line-height:1.35;font-weight:700;margin-bottom:9px}.sub{font-size:11.5px;line-height:1.35;color:var(--muted);margin:0 0 9px}
.options{display:grid;gap:6px}.options.two{grid-template-columns:1fr 1fr}.opt{width:100%;min-height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;text-align:left;font:inherit;font-size:12px;line-height:1.25;cursor:pointer}.opt.selected{border-color:#697384;background:#f7f8fa}.opt.correct{border-color:#9bb8a3;background:var(--ok)}.opt.wrong{border-color:#d6aaa4;background:var(--bad)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:11.5px;line-height:1.25;cursor:pointer}.chip.selected{background:#eef1f5;border-color:#7b8593}.chip.correct{background:var(--ok);border-color:#9bb8a3}.chip.wrong{background:var(--bad);border-color:#d6aaa4}
.feedback{display:none;margin-top:8px;padding:8px 9px;border-radius:9px;background:var(--soft);font-size:11.5px;line-height:1.35}.feedback.show{display:block}.feedback.ok{background:var(--ok)}.feedback.bad{background:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}button{min-height:36px;border:0;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:var(--soft);color:var(--text)}button:disabled{opacity:.4;cursor:default}
.inputgrid{display:grid;grid-template-columns:104px 1fr;gap:7px;align-items:center}.label{font-size:11.8px;font-weight:700;line-height:1.2}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12px;color:var(--text);background:#fff;outline:none}input{height:36px}textarea{min-height:58px;resize:vertical}select{height:36px}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px}.card b{font-size:12px}.small{font-size:11.5px;line-height:1.35;color:var(--muted)}
.matrix-card{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px}.matrix-card .name{font-size:12px;font-weight:700;margin-bottom:5px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;line-height:1.25}.metrics span b{font-weight:700;color:#444}
.summary{display:none;padding:16px}.summary.show{display:block}.summary h2{font-size:18px;margin:0 0 7px}.summary p{font-size:12.5px;line-height:1.4;color:var(--muted)}.summarylist{display:grid;gap:6px}.summaryitem{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11.5px}
.modal{position:fixed;inset:0;background:rgba(24,29,37,.36);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.modalbox{width:min(500px,100%);max-height:78vh;overflow:auto;background:#fff;border-radius:14px;padding:13px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}.modalhead strong{font-size:13px}.close{width:32px;min-height:32px;padding:0;background:var(--soft)}.example{font-size:12px;line-height:1.45}
@media(max-width:430px){.actions{grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}.chips,.options.two{grid-template-columns:1fr}.inputgrid{grid-template-columns:88px 1fr}}
</style></head><body>
<div class="app"><section id="task"><div class="top"><div class="row"><h1>Сравните варианты</h1><div class="count" id="count"></div></div><div class="progress" id="progress"></div></div><div class="main" id="main"></div></section><section class="summary" id="summary"><h2>Готово</h2><p id="result"></p><div class="actions"><button class="secondary" id="backSummary">Вернуться</button><button class="primary" id="restart">Начать заново</button></div></section></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><strong>Пример ответа</strong><button class="close" id="close">×</button></div><div class="example" id="exampleText"></div></div></div>
<script>
const variants=[
{id:'A',name:'Распределить между всеми',launch:2,cost:0,left:130,error:'Высокий',load:'Высокая',other:'Низкое',stable:'Низкая'},
{id:'B',name:'Создать временную группу',launch:5,cost:180,left:60,error:'Средний',load:'Высокая для 4 сотрудников',other:'Среднее',stable:'Средняя'},
{id:'C',name:'Привлечь внешних исполнителей',launch:10,cost:420,left:40,error:'Высокий',load:'Низкая',other:'Низкое',stable:'Низкая'},
{id:'D',name:'Приостановить менее важные работы',launch:3,cost:0,left:75,error:'Низкий',load:'Средняя',other:'Высокое',stable:'Средняя'}
];
const qs=[
{q:'Какой вариант запускается быстрее всего?',a:'A'},{q:'Какой вариант оставляет меньше всего задач в очереди?',a:'C'},{q:'Какой вариант дает самый низкий риск ошибок?',a:'D'},{q:'У каких вариантов нет дополнительных расходов?',a:'A,D',multi:true},{q:'Какой вариант сильнее всего влияет на другие работы?',a:'D'}
];
const extraOpts=[['Зависимость от смежных подразделений',true],['Сложность поддержки после 6 недель',true],['Цвет интерфейса системы',false],['Количество совещаний в прошлом квартале',false],['Доступность нужных компетенций',true]];
let step=0;const total=8;const state={answers:Array(5).fill(null),extra:[],missing:[],finalists:[],tradeoff:'',ok:Array(total).fill(false)};const $=id=>document.getElementById(id);
function prog(){$('count').textContent=`${step+1} из ${total}`;$('progress').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i===step?'active':state.ok[i]?'done':''}"></i>`).join('')}
function cards(){return variants.map(v=>`<div class="matrix-card"><div class="name">${v.id}. ${v.name}</div><div class="metrics"><span><b>Запуск:</b> ${v.launch} дн.</span><span><b>Расходы:</b> ${v.cost} тыс.</span><span><b>Остаток:</b> ${v.left}</span><span><b>Риск:</b> ${v.error}</span><span><b>Нагрузка:</b> ${v.load}</span><span><b>Другие работы:</b> ${v.other}</span><span><b>Устойчивость:</b> ${v.stable}</span></div></div>`).join('')}
function render(){prog(); if(step<5)renderQ(); else if(step===5)renderExtra(); else if(step===6)renderMissing(); else renderFinal();}
function renderQ(){let q=qs[step];let selected=state.answers[step]||[];if(!Array.isArray(selected))selected=[selected];$('main').innerHTML=`<div class="case">${q.q}</div>${cards()}<div class="options two">${variants.map(v=>`<button class="opt ${selected.includes(v.id)?'selected':''}" data-v="${v.id}">${v.id}. ${v.name}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let id=b.dataset.v;if(q.multi){let arr=Array.isArray(state.answers[step])?state.answers[step]:[];state.answers[step]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];}else state.answers[step]=id;renderQ()});$('prev').disabled=step===0;$('prev').onclick=prev;$('next').onclick=()=>{let ans=state.answers[step],ok;if(q.multi){let exp=q.a.split(',').sort().join(',');ok=(ans||[]).slice().sort().join(',')===exp}else ok=ans===q.a;state.ok[step]=ok;let fb=$('fb');fb.textContent=ok?'Верно.':'Проверьте значения в карточках вариантов.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},220)}}
function renderExtra(){$('main').innerHTML=`<div class="case">Выберите два дополнительных критерия, которые могут изменить выбор руководителя.</div><div class="chips">${extraOpts.map(([x],i)=>`<button class="chip ${state.extra.includes(i)?'selected':''}" data-e="${i}">${x}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let i=+b.dataset.e;if(state.extra.includes(i))state.extra=state.extra.filter(x=>x!==i);else if(state.extra.length<2)state.extra.push(i);renderExtra()});$('prev').onclick=prev;$('next').onclick=()=>{let ok=state.extra.length===2&&state.extra.every(i=>extraOpts[i][1]);state.ok[5]=ok;let fb=$('fb');fb.textContent=ok?'Подходящие критерии выбраны.':'Выберите два критерия, которые действительно могут повлиять на управленческий выбор.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},220)}}
function renderMissing(){const opts=[['Как изменится входящий поток новых задач за 6 недель',true],['Сколько сотрудников смогут работать во временной группе весь период',true],['Как контролировать качество внешних исполнителей',true],['Какой цвет использовать в отчетной таблице',false],['Сколько писем отправил руководитель за месяц',false]];$('main').innerHTML=`<div class="case">Отметьте данные, которых не хватает для надежного сравнения.</div><div class="chips">${opts.map(([x],i)=>`<button class="chip ${state.missing.includes(i)?'selected':''}" data-m="${i}">${x}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let i=+b.dataset.m;state.missing=state.missing.includes(i)?state.missing.filter(x=>x!==i):[...state.missing,i];renderMissing()});$('prev').onclick=prev;$('next').onclick=()=>{let correct=[0,1,2];let ok=state.missing.length===3&&correct.every(i=>state.missing.includes(i));state.ok[6]=ok;let fb=$('fb');fb.textContent=ok?'Верно: эти данные могут изменить сравнение вариантов.':'Выберите три пробела в данных, которые реально влияют на решение.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},220)}}
function renderFinal(){$('main').innerHTML=`<div class="case">Выберите два финалиста и сформулируйте главный компромисс между ними.</div><div class="chips">${variants.map(v=>`<button class="chip ${state.finalists.includes(v.id)?'selected':''}" data-f="${v.id}">${v.id}. ${v.name}</button>`).join('')}</div><textarea id="tradeoff" placeholder="Например: один вариант быстрее и дешевле, другой устойчивее...">${state.tradeoff}</textarea><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="secondary" id="example">Пример</button><button class="primary wide" id="finish">Завершить</button></div>`;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let id=b.dataset.f;if(state.finalists.includes(id))state.finalists=state.finalists.filter(x=>x!==id);else if(state.finalists.length<2)state.finalists.push(id);renderFinal()});$('tradeoff').oninput=()=>state.tradeoff=$('tradeoff').value;$('prev').onclick=prev;$('example').onclick=()=>showEx('Например, финалисты B и D. Временная группа сильнее снижает очередь и меньше мешает другим работам, но требует 180 тыс. рублей и перегружает четырех сотрудников. Приостановка менее важных работ дешевле и безопаснее по качеству, но сильнее бьет по другим задачам.');$('finish').onclick=()=>{state.tradeoff=$('tradeoff').value.trim();state.ok[7]=state.finalists.length===2&&state.tradeoff.length>15;let fb=$('fb');if(!state.ok[7]){fb.textContent='Выберите двух финалистов и опишите компромисс между ними.';fb.className='feedback show bad';return}$('task').style.display='none';$('summary').classList.add('show');$('result').textContent='Вы сравнили варианты по единым данным, добавили критерии, отметили пробелы и сформулировали компромисс между финалистами.';}}
function prev(){if(step>0){step--;render()}}function showEx(t){$('exampleText').textContent=t;$('modal').classList.add('show')}$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('backSummary').onclick=()=>{$('summary').classList.remove('show');$('task').style.display='block';step=7;render()};$('restart').onclick=()=>{state.answers=Array(5).fill(null);state.extra=[];state.missing=[];state.finalists=[];state.tradeoff='';state.ok=Array(total).fill(false);step=0;$('summary').classList.remove('show');$('task').style.display='block';render();};render();
</script></body></html>
