<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Как еще</title><style>
:root{--text:#222831;--muted:#6b7280;--line:#d9dde4;--soft:#f3f5f7;--dark:#303744;--ok:#edf6f0;--bad:#faf0ef;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{display:flex;justify-content:center;padding:8px}.app{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{padding:13px 15px 10px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:18px;line-height:1.2}.count{font-size:12px;color:var(--muted);white-space:nowrap}.progress{display:flex;gap:5px;margin-top:8px}.progress i{flex:1;height:5px;border-radius:999px;background:var(--soft)}.progress i.active{background:var(--dark)}.progress i.done{background:#aab1bb}
.main{padding:12px 15px 14px}.case{background:var(--soft);border-radius:10px;padding:10px 11px;font-size:13.5px;line-height:1.35;font-weight:700;margin-bottom:9px}.sub{font-size:11.5px;line-height:1.35;color:var(--muted);margin:0 0 9px}
.options{display:grid;gap:6px}.options.two{grid-template-columns:1fr 1fr}.opt{width:100%;min-height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;text-align:left;font:inherit;font-size:12px;line-height:1.25;cursor:pointer}.opt.selected{border-color:#697384;background:#f7f8fa}.opt.correct{border-color:#9bb8a3;background:var(--ok)}.opt.wrong{border-color:#d6aaa4;background:var(--bad)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:11.5px;line-height:1.25;cursor:pointer}.chip.selected{background:#eef1f5;border-color:#7b8593}.chip.correct{background:var(--ok);border-color:#9bb8a3}.chip.wrong{background:var(--bad);border-color:#d6aaa4}
.feedback{display:none;margin-top:8px;padding:8px 9px;border-radius:9px;background:var(--soft);font-size:11.5px;line-height:1.35}.feedback.show{display:block}.feedback.ok{background:var(--ok)}.feedback.bad{background:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}button{min-height:36px;border:0;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:var(--soft);color:var(--text)}button:disabled{opacity:.4;cursor:default}
.inputgrid{display:grid;grid-template-columns:104px 1fr;gap:7px;align-items:center}.label{font-size:11.8px;font-weight:700;line-height:1.2}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12px;color:var(--text);background:#fff;outline:none}input{height:36px}textarea{min-height:58px;resize:vertical}select{height:36px}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px}.card b{font-size:12px}.small{font-size:11.5px;line-height:1.35;color:var(--muted)}
.matrix-card{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px}.matrix-card .name{font-size:12px;font-weight:700;margin-bottom:5px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;line-height:1.25}.metrics span b{font-weight:700;color:#444}
.summary{display:none;padding:16px}.summary.show{display:block}.summary h2{font-size:18px;margin:0 0 7px}.summary p{font-size:12.5px;line-height:1.4;color:var(--muted)}.summarylist{display:grid;gap:6px}.summaryitem{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11.5px}
.modal{position:fixed;inset:0;background:rgba(24,29,37,.36);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.modalbox{width:min(500px,100%);max-height:78vh;overflow:auto;background:#fff;border-radius:14px;padding:13px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}.modalhead strong{font-size:13px}.close{width:32px;min-height:32px;padding:0;background:var(--soft)}.example{font-size:12px;line-height:1.45}
@media(max-width:430px){.actions{grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}.chips,.options.two{grid-template-columns:1fr}.inputgrid{grid-template-columns:88px 1fr}}
</style></head><body>
<div class="app"><section id="task"><div class="top"><div class="row"><h1>Найдите альтернативы</h1><div class="count" id="count"></div></div><div class="progress" id="progress"></div></div><div class="main" id="main"></div></section><section class="summary" id="summary"><h2>Готово</h2><p id="score"></p><div class="actions"><button class="secondary" id="backSummary">Вернуться</button><button class="primary" id="restart">Начать заново</button></div></section></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><strong>Пример адаптации</strong><button class="close" id="close">×</button></div><div class="example" id="exampleText"></div></div></div>
<script>
const contexts=[
{title:'Производственный участок',text:'Срочные заявки на ремонт оборудования распределяют по критичности.',opts:['Разделять заявки по срочности и влиянию на работу','Передавать все заявки одному специалисту','Обрабатывать заявки только в порядке поступления'],correct:0,ex:'Разделить закупочные заявки по срочности и риску: критичные для остановки проекта согласовывать по ускоренному маршруту, остальные — в обычной очереди.'},
{title:'Сервисный центр',text:'Типовые обращения отделяют от сложных и направляют по разным маршрутам.',opts:['Разделять типовые и нестандартные случаи','Добавить одинаковый контроль ко всем заявкам','Увеличить число согласующих для каждого случая'],correct:0,ex:'Типовые закупки по заранее одобренным условиям направлять по упрощенному маршруту, сложные — специалисту.'},
{title:'Проектная команда',text:'Независимые изменения согласуют параллельно с несколькими специалистами.',opts:['Параллелить независимые этапы согласования','Согласовывать все строго последовательно','Передавать решение одному участнику без проверки'],correct:0,ex:'Юридическую, финансовую и техническую части заявки согласовывать параллельно, если одна не зависит от другой.'}
];
const cards=[
['Упростить маршрут типовых заявок','Изменение процесса'],['Автоматически проверять обязательные поля','Автоматизация'],['Назначить единого координатора сложных заявок','Перераспределение ответственности'],['Обучить сотрудников на типовых ошибках','Развитие компетенций'],['Добавить чек-лист перед передачей заявки','Небольшое локальное вмешательство'],['Параллельно согласовывать независимые части','Изменение процесса'],['Настроить автонапоминания согласующим','Автоматизация'],['Назначить замещающего согласующего','Перераспределение ответственности']
];
const cats=['Изменение процесса','Автоматизация','Перераспределение ответственности','Развитие компетенций','Небольшое локальное вмешательство'];
let step=0;const total=contexts.length+cards.length+1;const state={ctx:contexts.map(()=>({pick:null,adapt:'',ok:false})),cards:cards.map(()=>({pick:'',ok:false})),own:'',ownOk:false};const $=id=>document.getElementById(id);
function prog(){$('count').textContent=`${step+1} из ${total}`;$('progress').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i===step?'active':i<step?'done':''}"></i>`).join('')}
function render(){prog(); if(step<contexts.length)renderCtx(); else if(step<contexts.length+cards.length)renderCard(step-contexts.length); else renderOwn();}
function renderCtx(){let i=step,c=contexts[i],s=state.ctx[i];$('main').innerHTML=`<div class="case">${c.title}: ${c.text}</div><p class="sub">Выберите переносимый принцип.</p><div class="options">${c.opts.map((x,j)=>`<button class="opt ${s.pick===j?'selected':''}" data-o="${j}">${x}</button>`).join('')}</div><div class="inputgrid" style="margin-top:9px"><div class="label">Адаптация</div><input id="adapt" value="${s.adapt}" placeholder="Как применить к закупкам"></div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="secondary" id="example">Пример</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{s.pick=+b.dataset.o;renderCtx();});$('adapt').oninput=()=>s.adapt=$('adapt').value;$('prev').disabled=step===0;$('prev').onclick=prev;$('example').onclick=()=>showEx(c.ex);$('next').onclick=()=>{let ok=s.pick===c.correct&&s.adapt.trim().length>8;s.ok=ok;let fb=$('fb');document.querySelectorAll('[data-o]').forEach(b=>{let j=+b.dataset.o;b.classList.toggle('correct',j===c.correct);b.classList.toggle('wrong',s.pick===j&&j!==c.correct)});fb.textContent=ok?'Принцип выбран верно. Адаптация заполнена.':'Выберите верный принцип и кратко опишите адаптацию к закупкам.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},250);}}
function renderCard(i){let [text,correct]=cards[i],s=state.cards[i];$('main').innerHTML=`<div class="case">${text}</div><p class="sub">К какой группе относится этот вариант?</p><div class="options two">${cats.map(x=>`<button class="opt ${s.pick===x?'selected':''}" data-cat="${x}">${x}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{s.pick=b.dataset.cat;renderCard(i);});$('prev').onclick=prev;$('next').onclick=()=>{s.ok=s.pick===correct;let fb=$('fb');document.querySelectorAll('[data-cat]').forEach(b=>{b.classList.toggle('correct',b.dataset.cat===correct);b.classList.toggle('wrong',s.pick===b.dataset.cat&&b.dataset.cat!==correct)});fb.textContent=s.ok?'Верно.':'Проверьте: важно определить механизм изменения, а не тему варианта.';fb.className='feedback show '+(s.ok?'ok':'bad');if(s.ok)setTimeout(()=>{step++;render()},220)}}
function renderOwn(){$('main').innerHTML=`<div class="case">Добавьте еще один вариант решения проблемы согласования закупок.</div><p class="sub">Он должен отличаться по механике от уже разобранных решений.</p><textarea id="own" placeholder="Ваш вариант">${state.own}</textarea><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="secondary" id="example">Пример</button><button class="primary wide" id="finish">Завершить</button></div>`;$('own').oninput=()=>state.own=$('own').value;$('prev').onclick=prev;$('example').onclick=()=>showEx('Назначить правило: неполная заявка возвращается инициатору автоматически до начала согласования. Это небольшое локальное вмешательство, которое убирает повторные проверки.');$('finish').onclick=()=>{state.ownOk=state.own.trim().length>10;let fb=$('fb');if(!state.ownOk){fb.textContent='Добавьте короткий вариант решения.';fb.className='feedback show bad';return}showSummary();}}
function prev(){if(step>0){step--;render()}}function showEx(t){$('exampleText').textContent=t;$('modal').classList.add('show')}function showSummary(){$('task').style.display='none';$('summary').classList.add('show');let correct=state.ctx.filter(x=>x.ok).length+state.cards.filter(x=>x.ok).length;$('score').textContent=`Проверяемых шагов выполнено: ${correct} из ${contexts.length+cards.length}. Свой вариант добавлен.`}
$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('backSummary').onclick=()=>{$('summary').classList.remove('show');$('task').style.display='block';step=total-1;render()};$('restart').onclick=()=>{state.ctx=contexts.map(()=>({pick:null,adapt:'',ok:false}));state.cards=cards.map(()=>({pick:'',ok:false}));state.own='';state.ownOk=false;step=0;$('summary').classList.remove('show');$('task').style.display='block';render();};render();
</script></body></html>
