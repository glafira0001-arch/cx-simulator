<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Найти точку выхода</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.message{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.message:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:92%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.history{max-height:132px;overflow:auto;padding-right:2px}
.summary{font-size:12px;line-height:1.45}
.sequence{font-size:11px;line-height:1.45;color:#475467;margin-top:6px}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="endTalkTask">

  <div class="head">
    <div class="kicker">Завершение разговора</div>
    <h2>Найдите точку выхода</h2>
    <p class="lead">Выберите первую реплику, после которой разговор перестал вести к решению, затем подберите корректное завершение.</p>
  </div>
  <div class="body">
    <div data-role="dialogue"></div>
    <div data-role="finishBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Как завершить контакт?</div>
      <div class="grid2" data-role="finishes"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('endTalkTask');
  if (!root) return;

  const lines=[
    '1. Вы: «Нам нужно решить, переносим ли запуск на два дня».',
    '2. Коллега: «Я считаю, что запускать сейчас рискованно».',
    '3. Вы: «Каких данных не хватает для решения?»',
    '4. Коллега: «Я уже сказал: все рискованно. Вы никогда меня не слушаете».',
    '5. Вы: «Давайте вернемся к конкретным рискам».',
    '6. Коллега: «Какая разница? Вы все равно сделаете по-своему».'
  ];
  const correctPoint=5;
  const finishes=[
    {text:'Раз вы не хотите обсуждать нормально, разговор окончен.', correct:false},
    {text:'Я услышал вашу позицию. Сейчас новых аргументов нет. Вернемся завтра в 10:00 с перечнем рисков.', correct:true},
    {text:'Я просто ухожу, потому что это бессмысленно.', correct:false},
    {text:'Последнее: в прошлый раз неправы были именно вы.', correct:false}
  ];
  let point=null,finish=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);

  function renderDialogue(){
    q('dialogue').innerHTML=lines.map((line,i)=>
      `<button type="button" class="message ${point===i?'selected':''}" data-line="${i}" style="margin-bottom:5px">${line}</button>`
    ).join('');
    q('dialogue').querySelectorAll('[data-line]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        point=Number(btn.dataset.line);
        renderDialogue();
        q('finishBlock').classList.remove('hidden');
        q('check').disabled=finish===null;
      });
    });
  }

  q('finishes').innerHTML=finishes.map((f,i)=>
    `<button type="button" class="choice" data-finish="${i}">${f.text}</button>`
  ).join('');
  q('finishes').querySelectorAll('[data-finish]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('finishes').querySelectorAll('[data-finish]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      finish=Number(btn.dataset.finish);
      q('check').disabled=point===null;
    });
  });

  q('check').addEventListener('click',()=>{
    const pointOk=point===correctPoint;
    const finishOk=finish!==null&&finishes[finish].correct;
    q('dialogue').querySelectorAll('[data-line]').forEach(btn=>{
      const i=Number(btn.dataset.line);
      if(i===correctPoint)btn.classList.add('good');
      else if(i===point)btn.classList.add('bad');
      btn.disabled=true;
    });
    q('finishes').querySelectorAll('[data-finish]').forEach(btn=>{
      const i=Number(btn.dataset.finish);
      if(finishes[i].correct)btn.classList.add('good');
      else if(i===finish)btn.classList.add('bad');
      btn.disabled=true;
    });
    const ok=pointOk&&finishOk;
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Точка выхода выбрана точно.</strong><br>Собеседник отказался возвращаться к фактам, поэтому вы зафиксировали итог и назначили следующий контакт.'
      : '<strong>Проверьте момент и формулировку завершения.</strong><br>Выход нужен после отказа обсуждать факты. Финальная фраза должна содержать краткое резюме и точный мостик в будущее.';
    q('check').disabled=true;
  });

  q('reset').addEventListener('click',()=>{
    point=null;finish=null;
    q('finishes').querySelectorAll('[data-finish]').forEach(x=>{x.className='choice';x.disabled=false;});
    q('finishBlock').classList.add('hidden');
    q('fb').className='feedback';
    q('check').disabled=true;
    renderDialogue();
  });

  renderDialogue();

})();
</script>
</body>
</html>
