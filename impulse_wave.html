<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Волна импульса</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.slot{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn,.block-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover,.block-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.timeline{display:grid;grid-template-columns:68px 1fr;gap:6px}
.time{font-size:10px;color:var(--muted);display:flex;align-items:center}
.slot{min-height:42px;cursor:pointer;padding:7px}
.slot.selected{background:var(--accent-soft)}
.slot-title{font-size:11px;font-weight:800}
.slot-sub{font-size:10px;color:var(--muted);margin-top:2px}
.wave{height:10px;border-radius:999px;background:#e8ebf3;overflow:hidden}
.wave>div{height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:93%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="impulseWave">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Сиюминутные импульсы</div>
    <h2>Переждите волну отвлечения</h2>
    <p class="lead">Выберите реакцию на импульс. При точном ответе запустится короткая модель того, как желание ослабевает.</p>
  </div>
  <div class="body">
    <div class="card">
      <span class="badge" data-role="step"></span>
      <p data-role="case" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p>
    </div>
    <div class="grid2" data-role="options" style="margin-top:7px"></div>
    <div data-role="waveBlock" class="hidden" style="margin-top:9px">
      <div class="metric"><span class="small">Сила импульса</span><span class="badge" data-role="waveLabel">100%</span></div>
      <div class="wave" style="margin-top:5px"><div data-role="wave"></div></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('impulseWave');
  if (!root) return;

  const cases=[
    {
      text:'Во время сложного расчета захотелось проверить Telegram «одним глазком».',
      options:[
        {text:'Открыть сейчас, чтобы быстрее снять напряжение',correct:false},
        {text:'Сказать «через 10 минут» и продолжить до логической точки',correct:true},
        {text:'Переключиться на сортировку почты',correct:false},
        {text:'Ругать себя за слабую дисциплину',correct:false}
      ],
      note:'Отсрочка не запрещает действие навсегда, но дает волне импульса пройти.'
    },
    {
      text:'В середине отчета появилась идея для другого проекта.',
      options:[
        {text:'Записать идею одной строкой и вернуться к отчету',correct:true},
        {text:'Сразу открыть новый документ',correct:false},
        {text:'Начать подробно развивать идею в заметках',correct:false},
        {text:'Пытаться удерживать идею в голове до конца работы',correct:false}
      ],
      note:'Короткая парковка освобождает рабочую память без нового переключения.'
    },
    {
      text:'Вы уже отвлеклись на ленту и заметили это через пять минут.',
      options:[
        {text:'Продолжить, раз фокус все равно потерян',correct:false},
        {text:'Наказать себя дополнительным часом работы',correct:false},
        {text:'Зафиксировать факт и спокойно вернуться к текущей задаче',correct:true},
        {text:'Перейти к уборке стола как к «полезному» делу',correct:false}
      ],
      note:'Самобичевание создает еще одно отвлечение. Нужен простой возврат без драматизации.'
    }
  ];
  let index=0,selected=null,checked=false,score=0,timer=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function render(){
    clearInterval(timer);
    const item=cases[index];
    selected=null;checked=false;
    q('step').textContent=`Ситуация ${index+1} из ${cases.length}`;
    q('case').textContent=item.text;
    q('bar').style.width=`${index/cases.length*100}%`;
    q('options').classList.remove('hidden');
    q('options').innerHTML=item.options.map((o,i)=>
      `<button type="button" class="choice" data-option="${i}">${o.text}</button>`).join('');
    q('options').querySelectorAll('[data-option]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(checked)return;
        q('options').querySelectorAll('[data-option]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        selected=Number(btn.dataset.option);
        q('next').disabled=false;
      });
    });
    q('waveBlock').classList.add('hidden');
    q('next').disabled=true;
    q('next').textContent='Проверить';
    q('fb').className='feedback';
  }
  function runWave(callback){
    q('waveBlock').classList.remove('hidden');
    let value=100;
    q('wave').style.width='100%';
    q('waveLabel').textContent='100%';
    timer=setInterval(()=>{
      value-=10;
      q('wave').style.width=`${value}%`;
      q('waveLabel').textContent=`${value}%`;
      if(value<=0){
        clearInterval(timer);
        callback();
      }
    },120);
  }
  q('next').addEventListener('click',()=>{
    const item=cases[index];
    if(!checked){
      if(selected===null)return;
      const ok=item.options[selected].correct;
      if(ok)score++;
      q('options').querySelectorAll('[data-option]').forEach(btn=>{
        const i=Number(btn.dataset.option);
        if(item.options[i].correct)btn.classList.add('good');
        else if(i===selected)btn.classList.add('bad');
        btn.disabled=true;
      });
      q('fb').className=`feedback show ${ok?'ok':'warn'}`;
      q('fb').innerHTML=`<strong>${ok?'Импульс пережит.':'Этот выбор усиливает дофаминовую петлю.'}</strong><br>${item.note}`;
      checked=true;
      q('next').disabled=true;
      if(ok){
        runWave(()=>{
          q('next').disabled=false;
          q('next').textContent=index===cases.length-1?'Показать результат':'Следующая ситуация';
        });
      }else{
        q('next').disabled=false;
        q('next').textContent=index===cases.length-1?'Показать результат':'Следующая ситуация';
      }
      return;
    }
    if(index<cases.length-1){index++;render();}
    else{
      q('bar').style.width='100%';
      q('options').classList.add('hidden');
      q('waveBlock').classList.add('hidden');
      q('case').innerHTML=`Точных реакций: <strong>${score} из ${cases.length}</strong>.`;
      q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;
      q('fb').innerHTML='Импульс не нужно побеждать силой. Его достаточно отсрочить, припарковать или спокойно переждать.';
      q('next').disabled=true;
      q('next').textContent='Готово';
    }
  });
  q('reset').addEventListener('click',()=>{
    clearInterval(timer);
    index=0;selected=null;checked=false;score=0;
    q('options').classList.remove('hidden');
    render();
  });
  render();

})();
</script>
</body>
</html>
