<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выберите рабочий сценарий точки истины</title><style>
:root{
  --bg:#d9d4d1; --card:#fffaf1; --navy:#082a57; --text:#10233f;
  --yellow:#ffc83d; --red:#cc4747; --line:#ddd7cf; --soft:#f7f4ef; --blue:#eef3fb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.32}
button{font-family:inherit}
.wrap{width:min(560px,calc(100% - 10px));margin:5px auto 10px}
.hero,.panel{background:var(--card);border-radius:14px;box-shadow:0 5px 16px rgba(24,36,54,.07)}
.hero{position:relative;overflow:hidden;padding:13px 14px}
.hero:after{content:"";position:absolute;width:155px;height:155px;border:15px solid rgba(8,42,87,.05);border-radius:50%;right:-48px;top:-66px}
.tag{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#eef2f7;color:var(--navy);font-weight:800;font-size:9.2px;text-transform:uppercase}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
.hero h1{position:relative;z-index:1;margin:7px 0 5px;font-size:20px;line-height:1.06;color:#071d3c}
.hero p{position:relative;z-index:1;margin:0;font-size:12.4px;line-height:1.34}
.hero .btn{position:relative;z-index:1;margin-top:10px;width:100%}
.panel{padding:11px}
.status{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.progress{flex:1;height:4px;background:#d7d1ca;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--yellow);transition:.2s}
.counter{flex:0 0 auto;color:var(--navy);font-size:11px;font-weight:800}
.stage-title{margin:0 0 4px;color:var(--navy);font-size:15px;line-height:1.15;font-weight:800}
.stage-text{margin:0 0 8px;color:#40566c;font-size:11.8px;line-height:1.34}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:15px;line-height:1.16}
.card p{margin:0;color:#45596d;font-size:11.8px;line-height:1.34}
.options{display:grid;gap:6px;margin-top:9px}
.choice{min-height:37px;border:1px solid #d8d3cb;border-radius:10px;padding:7px 9px;background:var(--soft);color:#173250;font-size:12.1px;line-height:1.22;text-align:left;cursor:pointer}
.choice.selected{background:#f3f7fb;border-color:var(--navy);box-shadow:0 0 0 1px rgba(8,42,87,.11)}
.actions{display:flex;justify-content:space-between;gap:7px;margin-top:8px}
.btn{min-height:37px;border:0;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.secondary{background:#f0ece7;color:var(--navy)}
.btn.alt{background:var(--yellow);color:#3d2d00}
.btn:disabled{opacity:.4;cursor:default}
.result{background:#0d315e;color:#fff;border-radius:12px;padding:13px}
.result h2{margin:0 0 5px;font-size:17px;line-height:1.16}
.result p{margin:0;font-size:12.5px;line-height:1.36}
.result .mini{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);font-size:11.8px}
.hidden{display:none!important}

/* Конструктор */
.casebar{margin-bottom:8px;padding:8px 9px;border-radius:10px;background:#f2eee8;color:#31485f;font-size:11.5px;line-height:1.32}
.template{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{
  position:relative;min-height:67px;border:1px dashed #bfc7d0;border-radius:10px;
  background:rgba(255,255,255,.68);padding:7px;cursor:pointer;
}
.slot.over,.slot.active{border-style:solid;border-color:var(--navy);background:#f4f7fb}
.slot-label{font-size:9.5px;text-transform:uppercase;font-weight:800;color:#69788a;margin-bottom:4px}
.slot-empty{font-size:11px;color:#87919c;line-height:1.25}
.placed{font-size:11.2px;line-height:1.27;color:#173250;font-weight:700;padding-right:18px}
.remove{
  position:absolute;right:5px;top:5px;width:19px;height:19px;border:0;border-radius:50%;
  background:#ece8e2;color:#526275;font-size:13px;line-height:19px;padding:0;cursor:pointer
}
.bank{
  margin-top:8px;border-top:1px solid #e2ddd6;padding-top:8px
}
.bank-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.bank-title{font-size:11px;font-weight:800;color:var(--navy)}
.bank-count{font-size:10.5px;color:#667586}
.bank-card{
  min-height:64px;border:1px solid #cfd5dc;border-radius:10px;background:#fff;padding:9px;
  cursor:grab;user-select:none
}
.bank-card.selected{outline:2px solid #bfd2ef;background:#f7faff}
.bank-card strong{display:block;color:var(--navy);font-size:12.3px;margin-bottom:3px}
.bank-card span{display:block;color:#45596d;font-size:11.3px;line-height:1.3}
.bank-nav{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:6px}
.bank-nav .btn{min-height:34px;padding:7px 9px}
.keep{width:100%}
.hint{margin-top:6px;font-size:10.5px;color:#718090;line-height:1.3}

@media(max-width:440px){
  .wrap{width:min(100%,calc(100% - 6px));margin:3px auto 8px}
  .hero h1{font-size:18.5px}
  .choice{font-size:11.8px}
  .template{grid-template-columns:1fr 1fr}
}
</style></head>
<body><div class="wrap">
<section class="hero" id="intro">
  <div class="tag">Практика · метод точки истины</div>
  <h1>Выберите рабочий сценарий точки истины</h1>
  <p>В каждой ситуации выберите формулировку, где есть конкретный клиентский сегмент, момент пути и риск для доверия или продолжения отношений.</p>
  <button class="btn primary" id="start">Начать</button>
</section>

<section class="panel hidden" id="work">
  <div class="status"><div class="counter" id="counter"></div><div class="progress"><div id="progress"></div></div></div>
  <h2 class="stage-title">Какой вариант подходит для метода точки истины?</h2>
  <div class="card">
    <h3 id="title"></h3>
    <p id="desc"></p>
    <div class="options" id="options"></div>
  </div>
  <div class="actions">
    <button class="btn secondary" id="back">Назад</button>
    <button class="btn primary" id="next" disabled>Дальше</button>
  </div>

  <div id="result" class="hidden">
    <div class="result">
      <h2 id="resultTitle"></h2><p id="resultText"></p><div class="mini" id="resultMini"></div>
    </div>
    <div class="actions"><button class="btn alt" id="restart">Пройти еще раз</button></div>
  </div>
</section>
</div>
<script>
const cases=[
 {title:"1. Компания хочет снизить отток после первой покупки",desc:"Нужно выбрать сценарий для командной сессии.",correct:1,opts:[
   "Все новые клиенты",
   "Новые клиенты после оплаты, которые за 7 дней не дошли до первого использования",
   "Клиенты, которым нужно улучшить сервис"
 ]},
 {title:"2. B2B-компания хочет повысить продления договоров",desc:"Нужно выбрать участок, где клиент принимает решение о продолжении отношений.",correct:2,opts:[
   "Все действующие B2B-клиенты",
   "Клиенты, которым менеджеры должны чаще звонить",
   "Ключевые клиенты за 60–90 дней до продления, у которых снизилась активность или ценность результата"
 ]},
 {title:"3. Премиальный продукт хочет увеличить повторные покупки",desc:"Ищем момент, где обещание бренда впервые проверяется реальностью.",correct:0,opts:[
   "Покупатели премиального продукта в момент распаковки и первого использования",
   "Все посетители сайта",
   "Клиенты, которым нравится красивый сервис"
 ]},
 {title:"4. Клиника хочет уменьшить число отказов после первого визита",desc:"Нужно выбрать конкретный момент с риском для доверия.",correct:1,opts:[
   "Все пациенты клиники",
   "Новые пациенты в первые 10 минут визита: вход, навигация, ожидание и первый контакт",
   "Пациенты, которым персонал должен улыбаться"
 ]}
];
let i=0,answers=new Array(cases.length).fill(null);
const $=id=>document.getElementById(id);
function render(){
 const x=cases[i];
 $("counter").textContent=`${i+1} / ${cases.length}`;
 $("progress").style.width=((answers.filter(v=>v!==null).length/cases.length)*100)+"%";
 $("title").textContent=x.title;$("desc").textContent=x.desc;
 const box=$("options");box.innerHTML="";
 x.opts.forEach((t,idx)=>{const b=document.createElement("button");b.className="choice"+(answers[i]===idx?" selected":"");b.textContent=t;b.onclick=()=>{answers[i]=idx;render();};box.appendChild(b);});
 $("back").disabled=i===0;$("next").disabled=answers[i]===null;$("next").textContent=i===cases.length-1?"Результат":"Дальше";
}
$("back").onclick=()=>{if(i>0){i--;render();}};
$("next").onclick=()=>{
 if(i<cases.length-1){i++;render();return;}
 const total=answers.reduce((s,v,idx)=>s+(v===cases[idx].correct?1:0),0);
 document.querySelector(".card").classList.add("hidden");$("back").classList.add("hidden");$("next").classList.add("hidden");
 document.querySelector(".stage-title").classList.add("hidden");$("result").classList.remove("hidden");$("progress").style.width="100%";$("counter").textContent=`${total} / 4`;
 if(total<=1){$("resultTitle").textContent="Сценарий пока слишком общий";$("resultText").textContent="Формулировки чаще описывают широкую аудиторию или пожелание улучшить сервис, но не конкретный момент риска.";$("resultMini").textContent="Рабочий сценарий = сегмент + момент пути + риск для доверия или продолжения отношений.";}
 else if(total<=3){$("resultTitle").textContent="Вы уже выделяете рабочие сценарии";$("resultText").textContent="В большинстве ситуаций вы находите достаточно конкретный участок пути, но некоторые формулировки еще можно сузить.";$("resultMini").textContent="Чем точнее сценарий, тем легче команде найти ожидание, риск, действие, владельца и показатель.";}
 else{$("resultTitle").textContent="Вы уверенно выбираете сценарии точки истины";$("resultText").textContent="Вы отделяете конкретный управляемый момент пути от общих разговоров о клиентах и сервисе.";$("resultMini").textContent="Такой сценарий уже можно брать в рабочую сессию и разбирать методом точки истины.";}
};
$("start").onclick=()=>{$("intro").classList.add("hidden");$("work").classList.remove("hidden");render();};
$("restart").onclick=()=>location.reload();
</script></body></html>
