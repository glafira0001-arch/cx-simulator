<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поддержать, не втягиваясь</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4a56d4;--accent-soft:#eef0ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#fafbff,#eef0ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card+.card{margin-top:9px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;line-height:1.4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit}
.choice,.chip,.tile,.cycle,.message{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover,.chip:hover,.tile:hover,.cycle:hover,.message:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}.feedback.bad{background:var(--bad-soft);color:#8f1b13}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1f6;
  color:#475467;font-size:11px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:5px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f6f7fa;font-size:11px;line-height:1.4;color:#586174}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.4}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.assembled{font-size:13px;line-height:1.55}
.counter{font-size:18px;font-weight:800}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .task{border-radius:14px}
  .head,.body{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="task">
  <div class="progress"><div id="bar"></div></div>
  <div class="head">
    <div class="kicker">Чужие жалобы</div>
    <h2>Поддержать, не втягиваясь</h2>
    <p class="lead">Проведите короткий разговор: признайте состояние собеседника, сохраните границы и переведите беседу к следующему шагу.</p>
  </div>
  <div class="body">
    <div class="chat" id="chat"></div>
    <div class="small" style="margin:12px 0 6px" id="prompt"></div>
    <div id="options" class="grid2"></div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="next" disabled>Ответить</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const stages=[
 {them:'«Все пропало. Клиент снова все переделал, команда бесполезна, я больше не могу».',
  prompt:'Ваш первый ответ',
  opts:[
   ['Понимаю, сейчас ты очень вымотан и расстроен.',1],
   ['Да, это ужас. У меня вчера было еще хуже.',0],
   ['Не драматизируй, ничего страшного не произошло.',0],
   ['Расскажи подробно все с самого начала.',0]
  ]},
 {them:'«Да! И самое ужасное — никто меня не поддерживает».',
  prompt:'Как сохранить дистанцированную эмпатию?',
  opts:[
   ['Я слышу, что тебе сейчас тяжело. Что из этой ситуации нужно решить первым?',1],
   ['Я сейчас все брошу и сам разберусь с твоим проектом.',0],
   ['Ты прав, команда действительно подвела тебя.',0],
   ['Продолжай, мне важно узнать каждую деталь.',0]
  ]},
 {them:'«Наверное, сначала нужно уточнить у клиента, какие правки обязательны».',
  prompt:'Как завершить разговор конструктивно?',
  opts:[
   ['Хороший первый шаг. Нужна ли тебе помощь сформулировать вопрос клиенту?',1],
   ['Вот видишь, я сразу знал, что делать.',0],
   ['Давай еще полчаса обсудим, почему все так вышло.',0],
   ['Я сам напишу клиенту вместо тебя.',0]
  ]}
];
let i=0,score=0,sel=null;
const $=s=>document.querySelector(s);
function render(){
 const s=stages[i];sel=null;
 if(i===0) $('#chat').innerHTML='';
 $('#chat').innerHTML+=`<div class="bubble them">${s.them}</div>`;
 $('#prompt').textContent=s.prompt;
 $('#options').innerHTML=s.opts.map((o,n)=>`<button class="choice" data-i="${n}">${o[0]}</button>`).join('');
 $('#options').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  $('#options').querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');sel=+b.dataset.i;$('#next').disabled=false;
 });
 $('#bar').style.width=`${i/stages.length*100}%`;$('#next').disabled=true;$('#fb').className='feedback';
 $('#next').textContent=i===stages.length-1?'Завершить разговор':'Ответить';
}
$('#next').onclick=()=>{
 const s=stages[i],ok=s.opts[sel][1]===1;if(ok)score++;
 $('#chat').innerHTML+=`<div class="bubble me">${s.opts[sel][0]}</div>`;
 if(i<stages.length-1){i++;render();}
 else{
  $('#bar').style.width='100%';$('#options').classList.add('hidden');$('#prompt').classList.add('hidden');
  $('#fb').className=`feedback show ${score===3?'ok':'warn'}`;
  $('#fb').innerHTML=score===3
   ?'<strong>Разговор проведен устойчиво.</strong><br>Вы признали чувства, не согласились с паникой, не забрали чужую ответственность и помогли собеседнику перейти к действию.'
   :`<strong>Устойчивых ответов: ${score} из 3.</strong><br>Проверьте, не начали ли вы соревноваться жалобами, давать непрошеные советы, погружаться в детали или решать задачу вместо собеседника.`;
  $('#next').disabled=true;$('#next').textContent='Готово';
 }
};
$('#reset').onclick=()=>{i=0;score=0;$('#options').classList.remove('hidden');$('#prompt').classList.remove('hidden');render();};
render();
</script>
</body>
</html>
