<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выбор двигательной техники</title>
<style>
:root{
  --ink:#172033; --muted:#667085; --line:#d9e0e8; --bg:#f5f7fa; --card:#fff;
  --accent:#4a56d4; --accent-soft:#eef0ff; --ok:#167451; --ok-soft:#eaf8f1;
  --bad:#b42318; --bad-soft:#fff0ee; --warn:#986700; --warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#fafbff,#eef0ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card+.card{margin-top:9px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;line-height:1.4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit}
.choice,.chip,.tile,.slot,.cycle{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover,.chip:hover,.tile:hover,.slot:hover,.cycle:hover{border-color:#a8b2ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}.feedback.bad{background:var(--bad-soft);color:#8f1b13}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1f6;
  color:#475467;font-size:11px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:5px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.sequence{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.seq-box{min-height:72px;border:1px dashed #b8c0cd;border-radius:11px;padding:8px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;font-size:12px;line-height:1.25;background:#fafbfc}
.seq-box strong{display:block;font-size:17px;margin-bottom:3px}
.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f6f7fa;font-size:11px;line-height:1.4;color:#586174}
.counter{font-size:18px;font-weight:800}
@media(max-width:430px){
  .grid2,.grid3{grid-template-columns:1fr}
  .sequence{grid-template-columns:1fr 1fr}
  .task{border-radius:14px}
  .head,.body{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="task">
  <div class="progress"><div id="bar"></div></div>
  <div class="head">
    <div class="kicker">Движение и сброс напряжения</div>
    <h2>Подберите действие под контекст</h2>
    <p class="lead">Выберите не самое интенсивное, а самое уместное действие с учетом пространства и состояния человека.</p>
  </div>
  <div class="body">
    <div class="card case">
      <span class="badge" id="step"></span>
      <p id="case" style="margin:9px 0 0"></p>
    </div>
    <div id="answers" class="grid2" style="margin-top:10px"></div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="next" disabled>Проверить</button>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="note">При боли в груди, предобморочном состоянии, травме или резком ухудшении самочувствия интенсивное движение прекращают.</div>
  </div>
</div>

<script>
const cases=[
 {case:'Вы один в кабинете. После конфликтного звонка чувствуете сильное раздражение, но через пять минут нужна ясная голова.',
  a:[['Упереться руками в стену на 10–15 секунд, затем стряхнуть напряжение',1],['Сесть неподвижно и подавлять дрожь',0],['Сразу перейти к растяжке',0],['Продолжить звонки без паузы',0]],
  note:'Краткая силовая работа крупными мышцами уместна в ограниченном пространстве. После нее нужен сброс остаточного тонуса.'},
 {case:'Во время стресса появилась естественная дрожь в руках. Боли и головокружения нет.',
  a:[['Дать телу безопасно протрястись и выдыхать свободно',1],['Жестко зафиксировать руки усилием воли',0],['Задержать дыхание до прекращения дрожи',0],['Сразу лечь и не двигаться весь день',0]],
  note:'В рамках техники дрожь не подавляют насильно. Движение должно оставаться контролируемым и прекращаться при ухудшении самочувствия.'},
 {case:'Вы собирались быстро пройти два пролета, но внезапно возникли боль в груди и слабость.',
  a:[['Остановиться и обратиться за медицинской помощью',1],['Ускориться, чтобы “сжечь” стресс',0],['Начать бокс с тенью',0],['Продолжить через силу',0]],
  note:'Тревожные физические симптомы меняют приоритет: сначала безопасность, а не выполнение техники.'},
 {case:'Вы в рабочей одежде перед встречей, пространство ограничено, интенсивно двигаться нельзя.',
  a:[['Кратко надавить ладонями в стену или стол, затем расслабить руки',1],['Начать бегать по кабинету',0],['Сделать минуту ударов рядом с коллегами',0],['Сесть и читать тревожные новости',0]],
  note:'Уместность важнее силы. Изометрическое усилие позволяет задействовать крупные мышцы без демонстративного движения.'}
];
let i=0,sel=null,checked=false,score=0;
const $=s=>document.querySelector(s);
function render(){
 const c=cases[i];sel=null;checked=false;$('#step').textContent=`Ситуация ${i+1} из ${cases.length}`;$('#case').textContent=c.case;
 $('#answers').innerHTML=c.a.map((x,n)=>`<button class="choice" data-i="${n}">${x[0]}</button>`).join('');
 $('#answers').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  $('#answers').querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sel=+b.dataset.i;$('#next').disabled=false;
 });
 $('#bar').style.width=`${i/cases.length*100}%`;$('#next').textContent='Проверить';$('#next').disabled=true;$('#fb').className='feedback';
}
$('#next').onclick=()=>{
 if(!checked){
  const c=cases[i],ok=c.a[sel][1]===1;if(ok)score++;
  $('#answers').querySelectorAll('.choice').forEach((b,n)=>b.classList.add(c.a[n][1]?'good':(n===sel?'bad':'')));
  $('#fb').className=`feedback show ${ok?'ok':'warn'}`;$('#fb').innerHTML=`<strong>${ok?'Действие уместно.':'Контекст учтен не полностью.'}</strong><br>${c.note}`;
  checked=true;$('#next').textContent=i===cases.length-1?'Показать результат':'Следующая ситуация';
 }else if(i<cases.length-1){i++;render();}
 else{
  $('#bar').style.width='100%';$('#answers').classList.add('hidden');$('#step').textContent='Результат';$('#case').innerHTML=`Уместные решения: <strong>${score} из ${cases.length}</strong>.`;
  $('#fb').className=`feedback show ${score>=3?'ok':'warn'}`;
  $('#fb').innerHTML=score>=3?'Вы выбираете действие по состоянию, пространству и рискам, а не по принципу «чем сильнее, тем лучше».':'Перед выбором техники проверьте три фактора: симптомы, ограничения пространства и наличие медицинских рисков.';
  $('#next').disabled=true;$('#next').textContent='Готово';
 }
};
$('#reset').onclick=()=>{i=0;score=0;$('#answers').classList.remove('hidden');render();};
render();
</script>
</body>
</html>
