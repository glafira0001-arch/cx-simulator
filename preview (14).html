<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Decision Room</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb}
.widget{width:520px;max-width:calc(100vw - 20px);margin:15px auto}
.instruction,.box,.result{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
.instruction{font-size:13px;line-height:1.4}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.card{background:#fff;border:1px solid #d7dce3;border-radius:10px;padding:8px;font-size:12px;min-height:38px;display:flex;align-items:center;cursor:grab}
.card.dragging{opacity:.55}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone{background:#fff;border:1.5px solid #b9c0ca;border-radius:14px;padding:10px;min-height:88px}
.zone h4{margin:0 0 4px;font-size:14px}
.zone small{color:#777;font-size:11px}
.human{width:250px;margin:8px auto}
.zone .card{font-size:11px;padding:6px;min-height:30px;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}
button{border:0;border-radius:12px;padding:10px;cursor:pointer}
.check{flex:1;background:#2563eb;color:#fff}
.check:disabled{background:#cbd5e1}
.reset{background:#e5e7eb;color:#111;min-width:72px}
.result{display:none;font-size:12px;line-height:1.45}
.result b{font-size:13px}
</style>
</head>
<body>
<div class="widget">

<div class="instruction">
<b>Вы хотите сократить рутину и повысить продуктивность команды.</b><br>
Распределите функции между ИИ и сотрудниками.
</div>

<div class="box">
<b>Функции компании</b>
<div class="tasks" id="pool">
<div class="card" draggable="true" data-type="ai">Типовой договор</div>
<div class="card" draggable="true" data-type="human">Сложный клиент</div>
<div class="card" draggable="true" data-type="ai">Отчет</div>
<div class="card" draggable="true" data-type="mix">Юридический спор</div>
<div class="card" draggable="true" data-type="ai">Дизайн</div>
<div class="card" draggable="true" data-type="human">Стратегия</div>
</div>
</div>

<div class="zones">
<div class="zone" data-zone="ai">
<h4>🤖 ИИ</h4>
<small>Рутинные функции</small>
</div>

<div class="zone" data-zone="mix">
<h4>🤝 Вместе</h4>
<small>ИИ + эксперт</small>
</div>
</div>

<div class="zone human" data-zone="human">
<h4>👤 Человек</h4>
<small>Стратегия и решения</small>
</div>

<div class="actions">
<button class="check" id="check" disabled>Проверить модель</button>
<button class="reset" onclick="resetGame()">Сбросить</button>
</div>

<div class="result" id="result"></div>

</div>

<script>
let dragged=null;

document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('dragstart',()=>{
    dragged=c;
    c.classList.add('dragging');
  });
  c.addEventListener('dragend',()=>{
    c.classList.remove('dragging');
  });
});

document.querySelectorAll('.zone,#pool').forEach(area=>{
  area.addEventListener('dragover',e=>e.preventDefault());
  area.addEventListener('drop',()=>{
    if(!dragged) return;
    area.appendChild(dragged);
    checkReady();
  });
});

function checkReady(){
  document.getElementById('check').disabled =
    document.querySelectorAll('.zone .card').length !== 6;
}

document.getElementById('check').onclick=()=>{
  let score=0;
  document.querySelectorAll('.zone').forEach(zone=>{
    zone.querySelectorAll('.card').forEach(card=>{
      if(card.dataset.type===zone.dataset.zone) score++;
    });
  });

  const result=document.getElementById('result');
  result.style.display='block';

  let analysis='';
  if(score===6){
    analysis='Вы точно отделили рутинные задачи от тех, где нужны экспертиза, переговоры и ответственность.';
  } else if(score>=4){
    analysis='Модель близка к рабочей: часть функций уже распределена правильно, но некоторые задачи стоит пересмотреть с учетом роли эксперта.';
  } else {
    analysis='Стоит еще раз разделить повторяемые задачи, совместную работу ИИ с экспертом и решения, которые должен принимать человек.';
  }

  result.innerHTML=
    '<b>Результат:</b><br>'+
    score+' из 6 решений соответствуют модели.<br><br>'+
    '<b>Аналитика ИИ:</b><br>'+analysis+'<br><br>'+
    '<b>Вывод:</b><br>ИИ берет рутину и подготовку, а человек сохраняет контроль над сложными решениями.';
};

function resetGame(){
  const pool=document.getElementById('pool');
  document.querySelectorAll('.zone .card').forEach(c=>pool.appendChild(c));
  document.getElementById('result').style.display='none';
  document.getElementById('result').innerHTML='';
  document.getElementById('check').disabled=true;
}
</script>
</body>
</html>
