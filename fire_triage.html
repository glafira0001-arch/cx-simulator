<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Триаж чужого пожара</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.zone{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{font:inherit}
.choice,.tile,.answer-btn,.task-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover,.task-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.zone{min-height:78px;background:#fafbfc}
.zone-title{font-size:10px;font-weight:800;line-height:1.25;margin-bottom:5px}
.zone-list{display:flex;flex-direction:column;gap:4px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-size:10px;line-height:1.25;cursor:pointer}
.capacity{height:8px;border-radius:999px;background:#e8ebf3;overflow:hidden;margin-top:5px}
.capacity>div{height:100%;background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:93%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
@media(max-width:430px){
  .grid2,.grid4,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="fireTriageTask">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Чужой «пожар»</div>
    <h2>Проведите холодный триаж</h2>
    <p class="lead">Выберите три вопроса, которые отделят фактический риск от паники. После этого примите решение.</p>
  </div>
  <div class="body">
    <div class="chat" data-role="chat">
      <div class="bubble them">«Все горит! Клиент ждет обновленную презентацию к 15:00. Я не успеваю — помогите прямо сейчас!»</div>
    </div>
    <div class="small" data-role="prompt" style="margin:8px 0 5px">Какой вопрос задать первым?</div>
    <div class="grid2" data-role="questions"></div>
    <div data-role="decisionBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Как ответить после выяснения фактов?</div>
      <div class="grid2" data-role="decisions"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить решение</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('fireTriageTask');
  if (!root) return;

  const questions=[
    {id:'consequence',text:'Что реально произойдет, если презентация не будет готова к 15:00?',answer:'Клиент хотел посмотреть ее заранее. Встреча только завтра утром.',correct:true},
    {id:'timing',text:'Как вышло, что мы узнали об этом только сейчас?',answer:'Письмо пришло вчера вечером, но я открыл его только утром.',correct:true},
    {id:'attempts',text:'Какие варианты решения ты уже попробовал?',answer:'Пока никакие. Я сразу пришел к вам.',correct:true},
    {id:'blame',text:'Кто виноват в этой ситуации?',answer:'Я не знаю, но сейчас это не помогает решить задачу.',correct:false},
    {id:'emotion',text:'Почему ты так нервничаешь?',answer:'Потому что боюсь реакции клиента.',correct:false}
  ];
  const decisions=[
    {text:'Бросить свои задачи и срочно переделывать презентацию вместе',correct:false},
    {text:'«За 10 минут письменно перечисли, что осталось, и предложи два варианта. Я смогу проверить завтра утром. В следующий раз присылай минимум за день».',correct:true},
    {text:'«Это твоя проблема, разбирайся сам».',correct:false},
    {text:'Сразу позвонить клиенту и извиниться за сотрудника',correct:false}
  ];
  let asked=[],decision=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function renderQuestions(){
    q('questions').innerHTML=questions.map((x,i)=>asked.includes(i)?'':
      `<button type="button" class="choice" data-question="${i}">${x.text}</button>`).join('');
    q('questions').querySelectorAll('[data-question]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.question);
        asked.push(i);
        q('chat').innerHTML+=`<div class="bubble me">${questions[i].text}</div><div class="bubble them">${questions[i].answer}</div>`;
        if(asked.length===3){
          q('questions').classList.add('hidden');
          q('prompt').textContent='Факты собраны';
          q('decisionBlock').classList.remove('hidden');
        }else{
          q('prompt').textContent=`Выберите еще ${3-asked.length} вопрос(а)`;
          renderQuestions();
        }
      });
    });
    q('bar').style.width=`${asked.length/3*70}%`;
  }
  q('decisions').innerHTML=decisions.map((d,i)=>
    `<button type="button" class="choice" data-decision="${i}">${d.text}</button>`
  ).join('');
  q('decisions').querySelectorAll('[data-decision]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('decisions').querySelectorAll('[data-decision]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      decision=Number(btn.dataset.decision);
      q('check').disabled=false;
    });
  });
  q('check').addEventListener('click',()=>{
    const questionScore=asked.filter(i=>questions[i].correct).length;
    const decisionOk=decision!==null&&decisions[decision].correct;
    const ok=questionScore===3&&decisionOk;
    q('bar').style.width='100%';
    q('decisions').querySelectorAll('[data-decision]').forEach(btn=>{
      const i=Number(btn.dataset.decision);
      if(decisions[i].correct)btn.classList.add('good');
      else if(i===decision)btn.classList.add('bad');
      btn.disabled=true;
    });
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Паника отделена от фактов.</strong><br>Вы проверили последствия, источник задержки и уже предпринятые действия, а затем вернули ответственность сотруднику.'
      : `<strong>Полезных диагностических вопросов: ${questionScore} из 3.</strong><br>Нужны последствия, причина позднего сигнала и уже опробованные варианты — не поиск виноватого и не обсуждение эмоций вместо фактов.`;
    q('check').disabled=true;
  });
  q('reset').addEventListener('click',()=>{
    asked=[];decision=null;
    q('chat').innerHTML='<div class="bubble them">«Все горит! Клиент ждет обновленную презентацию к 15:00. Я не успеваю — помогите прямо сейчас!»</div>';
    q('questions').classList.remove('hidden');
    q('decisionBlock').classList.add('hidden');
    q('prompt').textContent='Какой вопрос задать первым?';
    q('decisions').querySelectorAll('[data-decision]').forEach(x=>{x.disabled=false;x.className='choice';});
    q('check').disabled=true;
    q('fb').className='feedback';
    renderQuestions();
  });
  renderQuestions();

})();
</script>
</body>
</html>
