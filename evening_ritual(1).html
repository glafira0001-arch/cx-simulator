<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гибкий вечерний ритуал</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="eveningRitualTask">

  <div class="head">
    <div class="kicker">Ритуалы и дисциплина</div>
    <h2>Соберите гибкий вечерний ритуал</h2>
    <p class="lead">Выберите четыре действия, которые помогают перейти к отдыху, затем проверьте реакцию на изменение привычного сценария.</p>
  </div>
  <div class="body">
    <div class="grid2" data-role="actions"></div>
    <div data-role="flexBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Горячую воду отключили. Что делать?</div>
      <div class="grid2" data-role="flex"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('eveningRitualTask');
  if (!root) return;

  const actions = [
    {text:'Ответить на рабочую почту', correct:false},
    {text:'Приглушить верхний свет', correct:true},
    {text:'Проверить все мессенджеры', correct:false},
    {text:'Записать дела на завтра', correct:true},
    {text:'Включить разговорный подкаст', correct:false},
    {text:'Проветрить комнату', correct:true},
    {text:'Посмотреть новости перед сном', correct:false},
    {text:'Принять теплый душ', correct:true}
  ];
  const flexOptions = [
    {text:'Отменить весь ритуал: без душа он не работает', correct:false},
    {text:'Заменить душ другим спокойным тактильным действием', correct:true},
    {text:'Решить, что ночь теперь точно будет плохой', correct:false},
    {text:'Искать способ принять душ любой ценой', correct:false}
  ];
  let selected = new Set();
  let flex = null;
  const q = role => root.querySelector(`[data-role="${role}"]`);

  function render(){
    q('actions').innerHTML = actions.map((a,i) =>
      `<button type="button" class="tile ${selected.has(i)?'selected':''}" data-action="${i}">${a.text}</button>`
    ).join('');
    q('actions').querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.action);
        if(selected.has(i)) selected.delete(i);
        else if(selected.size < 4) selected.add(i);
        q('fb').className = 'feedback';
        render();
      });
    });
    const ready = selected.size === 4;
    q('flexBlock').classList.toggle('hidden', !ready);
    q('check').disabled = !(ready && flex !== null);
  }

  q('flex').innerHTML = flexOptions.map((o,i) =>
    `<button type="button" class="choice" data-flex="${i}">${o.text}</button>`
  ).join('');
  q('flex').querySelectorAll('[data-flex]').forEach(btn => {
    btn.addEventListener('click', () => {
      q('flex').querySelectorAll('[data-flex]').forEach(x => x.classList.remove('selected'));
      btn.classList.add('selected');
      flex = Number(btn.dataset.flex);
      q('check').disabled = selected.size !== 4;
    });
  });

  q('check').addEventListener('click', () => {
    const setOk = selected.size === 4 && [...selected].every(i => actions[i].correct);
    const flexOk = flex !== null && flexOptions[flex].correct;

    q('actions').querySelectorAll('[data-action]').forEach(btn => {
      const i = Number(btn.dataset.action);
      if(actions[i].correct) btn.classList.add('good');
      else if(selected.has(i)) btn.classList.add('bad');
      btn.disabled = true;
    });
    q('flex').querySelectorAll('[data-flex]').forEach(btn => {
      const i = Number(btn.dataset.flex);
      if(flexOptions[i].correct) btn.classList.add('good');
      else if(i === flex) btn.classList.add('bad');
      btn.disabled = true;
    });

    const ok = setOk && flexOk;
    q('fb').className = `feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML = ok
      ? '<strong>Ритуал собран.</strong><br>Он снижает количество стимулов, включает разные каналы и остается гибким.'
      : '<strong>В ритуале осталась нагрузка или лишняя жесткость.</strong><br>Уберите работу и информационный поток. Отдельный шаг можно заменить без отмены всего ритуала.';
    q('check').disabled = true;
  });

  q('reset').addEventListener('click', () => {
    selected = new Set();
    flex = null;
    q('flex').querySelectorAll('[data-flex]').forEach(x => {x.className='choice';x.disabled=false;});
    q('fb').className = 'feedback';
    render();
  });

  render();

})();
</script>
</body>
</html>
