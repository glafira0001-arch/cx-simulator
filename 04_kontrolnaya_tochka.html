<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Контрольная точка изменения: проверьте эффект без надзора</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:15px;line-height:1.42}.task{width:100%;max-width:560px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.04)}h2{font-size:19px;line-height:1.25;margin:0 0 8px}p{margin:0 0 10px}.case{background:#f1f5f9;border-radius:10px;padding:11px;margin:10px 0 12px}.step{font-size:12px;color:#64748b;margin:0 0 8px}.progress{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;background:#2563eb;transition:width .2s}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn:disabled{opacity:.4;cursor:default}.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:9px;font-size:14px}.feedback.ok{display:block;background:#ecfdf5;border:1px solid #86efac}.feedback.bad{display:block;background:#fff7ed;border:1px solid #fdba74}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;margin:7px 0}.option:hover,.option.selected{background:#eff6ff;border-color:#60a5fa}.mini{font-size:13px;color:#64748b}.grid{display:grid;gap:8px}.row{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff}.row b{display:block;margin-bottom:5px}.select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.checkline{display:flex;gap:8px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff;margin:7px 0;cursor:pointer}.checkline input{margin-top:3px}.bubble{border-radius:12px;padding:10px 11px;margin:8px 0}.bubble.emp{background:#eef2ff}.bubble.mgr{background:#f8fafc;border:1px solid #dbe2ea}.builder{display:grid;gap:8px}.slot{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#f8fafc}.slot b{display:block;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 9px;font:inherit;cursor:pointer;text-align:left}.chip.selected{background:#eff6ff;border-color:#60a5fa}.chip.used{opacity:.35}.quote{padding:10px;border-left:3px solid #94a3b8;background:#f8fafc;border-radius:0 8px 8px 0;margin:8px 0}.hidden{display:none!important}.badge{display:inline-block;border-radius:999px;padding:2px 7px;font-size:12px;background:#e2e8f0;color:#475569;margin-left:4px}.choice3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.choice3 button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 5px;font:inherit;font-size:13px;cursor:pointer}.choice3 button.selected{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;font-weight:700}.dialog{display:grid;gap:7px}.line{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff;cursor:pointer}.line.selected{background:#fff7ed;border-color:#fb923c}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.zone{border:1px dashed #94a3b8;border-radius:10px;padding:8px;min-height:94px;background:#f8fafc}.zone h4{margin:0 0 6px;font-size:14px}.item{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}.item.active{outline:2px solid #60a5fa}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tri .zone{min-height:76px}.smallbtn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 7px;font:inherit;font-size:13px;cursor:pointer}.smallbtn.selected{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;font-weight:700}@media(max-width:430px){.choice3,.tri{grid-template-columns:1fr}.board{grid-template-columns:1fr}}</style></head><body><main class="task"><section class="card"><h2>Контрольная точка изменения: проверьте эффект без надзора</h2><div class="case">Соберите контрольную точку для конкретной договоренности, а затем определите момент, когда очередная обратная связь уже не является достаточным действием.</div><div class="progress"><span id="bar"></span></div><div class="step" id="lab"></div><div id="screen"></div><div class="controls"><button class="btn ghost" id="back">Назад</button><button class="btn primary" id="check">Проверить ответ</button><button class="btn secondary" id="reset">Начать заново</button></div><div class="feedback" id="fb"></div></section></main><script>let step=0;let vals={where:'',when:'',crit:''},ans=null,opts=[];const s=document.getElementById('screen'),fb=document.getElementById('fb'),bar=document.getElementById('bar'),lab=document.getElementById('lab'),back=document.getElementById('back'),check=document.getElementById('check'),reset=document.getElementById('reset');const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function render(){fb.className='feedback';fb.textContent='';bar.style.width=step===0?'50%':'100%';lab.textContent=step===0?'Шаг 1 из 2 — соберите контрольную точку':'Шаг 2 из 2 — определите границу обратной связи';back.disabled=step===0;if(step===0){s.innerHTML=`<div class="quote">Сотрудник после обратной связи договорился перед внешней отправкой проверять период данных и номер версии файла.</div><div class="grid"><div class="row"><b>Где увидим изменение?</b><select class="select" id="where"><option value="">Выберите</option><option value="a">В ежедневном отчете о самопроверке</option><option value="b">В следующих трех внешних отчетах</option><option value="c">На отдельном учебном тесте</option></select></div><div class="row"><b>Когда сверимся?</b><select class="select" id="when"><option value="">Выберите</option><option value="a">Каждый вечер</option><option value="b">После третьего отчета</option><option value="c">Через полгода</option></select></div><div class="row"><b>Что проверим?</b><select class="select" id="crit"><option value="">Выберите</option><option value="a">Общее впечатление от внимательности</option><option value="b">Нет возвратов из-за периода или версии</option><option value="c">Сколько раз руководитель напомнил о проверке</option></select></div></div>`;['where','when','crit'].forEach(id=>{const el=document.getElementById(id);el.value=vals[id];el.onchange=()=>{vals[id]=el.value}})}else{if(!opts.length)opts=shuffle([{t:'Еще раз объяснить то же правило другими словами и дать новый месяц на наблюдение.',ok:false},{t:'Каждый день проверять выполнение лично, пока привычка не закрепится.',ok:false},{t:'Зафиксировать невыполнение обязательного требования и перейти к принятой в компании процедуре управления результативностью.',ok:true},{t:'Снять требование: если обратная связь не сработала, значит оно было слишком жестким.',ok:false}]);s.innerHTML='<div class="quote">Требование понятно, навык есть, ресурсы доступны. Сотрудник несколько раз подтверждал договоренность, но сознательно продолжает ее нарушать.</div>'+opts.map((o,i)=>`<button class="option ${ans===i?'selected':''}" data-o="${i}">${o.t}</button>`).join('');s.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{ans=+x.dataset.o;render()})}}
check.onclick=()=>{if(step===0){if(!vals.where||!vals.when||!vals.crit){fb.className='feedback bad';fb.textContent='Заполните все три элемента контрольной точки.';return}if(vals.where==='b'&&vals.when==='b'&&vals.crit==='b'){fb.className='feedback ok';fb.textContent='Верно. Проверка встроена в обычную работу, имеет понятный момент возврата и один наблюдаемый критерий.';setTimeout(()=>{step=1;render()},650)}else{fb.className='feedback bad';fb.textContent='Контрольная точка не должна создавать ежедневный надзор или оценивать человека в целом. Используйте обычную работу, заранее известный срок и конкретный критерий.'}}else{if(ans===null){fb.className='feedback bad';fb.textContent='Выберите действие руководителя.';return}if(opts[ans].ok){fb.className='feedback ok';fb.textContent='Верно. Когда ожидания, компетенции и условия уже ясны, бесконечно повторять развивающую обратную связь не нужно.'}else{fb.className='feedback bad';fb.textContent='Здесь проблема уже не в понимании обратной связи. Руководителю нужен переход к управлению результативностью по правилам компании.'}}};back.onclick=()=>{if(step){step=0;ans=null;opts=[];render()}};reset.onclick=()=>{step=0;vals={where:'',when:'',crit:''};ans=null;opts=[];render()};render();</script></body></html>
