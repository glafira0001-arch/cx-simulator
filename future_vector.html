<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Управляемый вектор</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card+.card{margin-top:9px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;line-height:1.4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit}
.choice,.chip,.tile,.cycle,.task-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover,.chip:hover,.tile:hover,.cycle:hover,.task-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}.feedback.bad{background:var(--bad-soft);color:#8f1b13}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1f6;
  color:#475467;font-size:11px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:5px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f6f7fa;font-size:11px;line-height:1.4;color:#586174}
.sequence{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.seq-box{min-height:72px;border:1px dashed #b9c1ce;border-radius:11px;padding:8px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;background:#fafbfc;font-size:12px;line-height:1.25}
.seq-box strong{font-size:17px;margin-bottom:3px}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .sequence{grid-template-columns:1fr 1fr}
  .task{border-radius:14px}
  .head,.body{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="task">
  <div class="progress"><div id="bar"></div></div>
  <div class="head">
    <div class="kicker">Гибкое планирование будущего</div>
    <h2>Переведите цель в управляемый вектор</h2>
    <p class="lead">Для каждой большой цели выберите процесс, который зависит от вас, и добавьте реалистичный план Б.</p>
  </div>
  <div class="body">
    <div class="card case">
      <span class="badge" id="step"></span>
      <p id="goal" style="margin:9px 0 0"></p>
    </div>
    <div class="small" style="margin:10px 0 6px">Выберите управляемый вектор</div>
    <div class="grid2" id="vectors"></div>
    <div id="planBBlock" class="hidden">
      <div class="small" style="margin:12px 0 6px">Выберите план Б</div>
      <div class="grid2" id="plans"></div>
    </div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="next" disabled>Проверить</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const cases=[
 {goal:'«Через пять лет купить квартиру».',
  v:[['Ежемесячно переводить фиксированную долю дохода на накопительный счет',1],['Гарантировать, что цены не вырастут',0],['Каждый день представлять готовую квартиру',0],['Ждать идеального момента для покупки',0]],
  b:[['Если доход снизится, временно уменьшить сумму, но сохранить регулярность',1],['Если план нарушится, отказаться от цели полностью',0],['Занять деньги любой ценой',0],['Не рассматривать отклонения от плана',0]]},
 {goal:'«Сохранить хорошее здоровье в зрелом возрасте».',
  v:[['Поддерживать регулярное движение, сон и профилактические обследования',1],['Запланировать никогда не болеть',0],['Сравнивать себя с самыми спортивными знакомыми',0],['Рассчитывать только на будущую медицину',0]],
  b:[['При снижении ресурса перейти на более мягкий, но регулярный режим',1],['При первом пропуске прекратить программу',0],['Удвоить нагрузку после каждого перерыва',0],['Следовать одному плану независимо от состояния',0]]},
 {goal:'«Через год свободно говорить на иностранном языке».',
  v:[['Заниматься по 20 минут четыре раза в неделю и регулярно практиковать речь',1],['Запланировать чувствовать уверенность на каждом занятии',0],['Купить самый дорогой курс и ждать результата',0],['Сравнивать начало с уровнем преподавателя',0]],
  b:[['В загруженные недели сохранять хотя бы два коротких занятия',1],['Если пропущена неделя, начать со следующего года',0],['Компенсировать пропуск ночными занятиями',0],['Отказаться от практики, пока не появится идеальный график',0]]}
];
let i=0,v=null,b=null,checked=false,score=0;
const $=s=>document.querySelector(s);
function render(){
 const c=cases[i];v=null;b=null;checked=false;$('#step').textContent=`Цель ${i+1} из ${cases.length}`;$('#goal').textContent=c.goal;
 $('#vectors').innerHTML=c.v.map((x,n)=>`<button class="choice" data-i="${n}">${x[0]}</button>`).join('');
 $('#plans').innerHTML=c.b.map((x,n)=>`<button class="choice" data-i="${n}">${x[0]}</button>`).join('');
 $('#vectors').querySelectorAll('.choice').forEach(x=>x.onclick=()=>{
  $('#vectors').querySelectorAll('.choice').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');v=+x.dataset.i;
  $('#planBBlock').classList.remove('hidden');$('#next').disabled=b===null;
 });
 $('#plans').querySelectorAll('.choice').forEach(x=>x.onclick=()=>{
  $('#plans').querySelectorAll('.choice').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');b=+x.dataset.i;$('#next').disabled=v===null;
 });
 $('#planBBlock').classList.add('hidden');$('#next').disabled=true;$('#next').textContent='Проверить';$('#bar').style.width=`${i/cases.length*100}%`;$('#fb').className='feedback';
}
$('#next').onclick=()=>{
 const c=cases[i];
 if(!checked){
  const ok=c.v[v][1]===1&&c.b[b][1]===1;if(ok)score++;
  $('#vectors').querySelectorAll('.choice').forEach((x,n)=>x.classList.add(c.v[n][1]?'good':(n===v?'bad':'')));
  $('#plans').querySelectorAll('.choice').forEach((x,n)=>x.classList.add(c.b[n][1]?'good':(n===b?'bad':'')));
  $('#fb').className=`feedback show ${ok?'ok':'warn'}`;
  $('#fb').innerHTML=ok
   ?'<strong>План остается управляемым и живым.</strong><br>Вы выбрали повторяемый процесс и заранее предусмотрели адаптацию, которая сохраняет движение при снижении ресурса.'
   :'<strong>В плане слишком много контроля над результатом или слишком мало гибкости.</strong><br>Фокусируйтесь на регулярном действии, которое зависит от вас, а план Б должен уменьшать нагрузку, но не обнулять направление.';
  checked=true;$('#next').textContent=i===cases.length-1?'Показать результат':'Следующая цель';
 }else if(i<cases.length-1){i++;render();}
 else{
  $('#bar').style.width='100%';$('#vectors').classList.add('hidden');$('#planBBlock').classList.add('hidden');$('#goal').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
  $('#fb').className=`feedback show ${score===3?'ok':'warn'}`;$('#fb').innerHTML='Устойчивый долгосрочный план задает направление, ограничивает число целей и заранее допускает изменение темпа без отказа от курса.';
  $('#next').disabled=true;$('#next').textContent='Готово';
 }
};
$('#reset').onclick=()=>{i=0;score=0;$('#vectors').classList.remove('hidden');render();};
render();
</script>
</body>
</html>
