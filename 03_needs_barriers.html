<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Диагностируйте потребность и барьер</title><style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#1f2933}
.app{width:100%;max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
.head{background:#2f6b4f;color:#fff;padding:13px 16px;font-weight:700}
.screen{display:none;padding:15px}.screen.active{display:block}
h2{font-size:19px;margin:0 0 9px}p{font-size:13.5px;line-height:1.42;margin:7px 0}
.case{background:#f0f6f3;border-left:4px solid #2f6b4f;padding:9px 11px;border-radius:8px;margin:10px 0;font-size:13.5px;line-height:1.4}
.opt{display:block;border:1px solid #cfd8df;border-radius:8px;padding:9px 10px;margin:7px 0;font-size:13.5px;cursor:pointer}
.opt input{margin-right:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer;font-size:12.5px}
.primary{background:#2f6b4f;color:#fff}.secondary{background:#e8edf0}.ghost{background:#fff;border:1px solid #cfd8df}
.fb{display:none;margin-top:10px;padding:9px;border-radius:8px;font-size:13px;line-height:1.4}.fb.show{display:block}
.good{background:#e9f7ef;border:1px solid #a8d7b9}.bad{background:#fff3e8;border:1px solid #e5ba89}
.result{background:#eef6f2;border:1px solid #b9d7c7;padding:12px;border-radius:10px;margin-top:10px}
select{width:100%;padding:8px;border:1px solid #cfd8df;border-radius:8px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.card{border:1px solid #d6dde3;border-radius:8px;padding:9px;font-size:12.8px}
.small{font-size:11.8px;color:#64727d}
.pill{display:inline-block;background:#eef3f0;padding:3px 6px;border-radius:999px;font-size:11px;margin:2px}
.row{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;align-items:center;margin:8px 0}
</style></head><body><div class="app"><div class="head">Диагностируйте потребность и барьер</div>
<section class="screen active"><h2>Найдите вероятный барьер</h2>
<div class="case">Активный клиент регулярно покупает основной продукт. Страницу дополнительного сервиса он открывал несколько раз, но не подключал его.</div>
<label class="opt"><input type="radio" name="q1" value="a">Не знает бренд</label>
<label class="opt"><input type="radio" name="q1" value="b">Не понимает ценность или выбор сервиса</label>
<label class="opt"><input type="radio" name="q1" value="c">Не умеет покупать основной продукт</label>
<label class="opt"><input type="radio" name="q1" value="d">Полностью потерял интерес к компании</label>
<div id="f1" class="fb"></div><div class="actions"><button class="primary" onclick="c1()">Проверить</button><button class="secondary" onclick="next()">Дальше</button></div></section>
<section class="screen"><h2>Что проверить в данных?</h2>
<label class="opt"><input type="radio" name="q2" value="a">Только возраст клиента</label>
<label class="opt"><input type="radio" name="q2" value="b">Историю просмотров, отказов и обращений</label>
<label class="opt"><input type="radio" name="q2" value="c">Количество постов бренда</label>
<label class="opt"><input type="radio" name="q2" value="d">Общий размер базы</label>
<div id="f2" class="fb"></div><div class="actions"><button class="ghost" onclick="back()">Назад</button><button class="primary" onclick="c2()">Проверить</button><button class="secondary" onclick="next();final(2)">Результат</button></div></section>
<section class="screen"><h2>Общий результат</h2><div id="final"></div><div class="actions"><button class="secondary" onclick="restart()">Пройти заново</button></div></section>
</div><script>
let cur=0,score=0,done={};const sc=[...document.querySelectorAll('.screen')];
function show(i){cur=Math.max(0,Math.min(i,sc.length-1));sc.forEach((x,n)=>x.classList.toggle('active',n===cur));}
function next(){show(cur+1)} function back(){show(cur-1)} function restart(){location.reload()}
function val(n){return document.querySelector('input[name="'+n+'"]:checked')?.value}
function fb(id,ok,good,bad){let e=document.getElementById(id);e.className='fb show '+(ok?'good':'bad');e.innerHTML=ok?good:bad}
function award(id,ok){if(done[id])return;done[id]=true;if(ok)score++}
function final(total){
 let pct=Math.round(score/total*100), label=pct===100?'Отлично: логика собрана точно.':pct>=67?'Хорошо: основная логика верна, но есть что уточнить.':'Стоит вернуться к ключевым решениям темы.';
 document.getElementById('final').innerHTML='<div class="result"><b>Итог: '+score+' из '+total+'</b><p>'+label+'</p></div>';
}
show(0);

function c1(){let ok=val('q1')==='b';award('q1',ok);fb('f1',ok,'Да. Интерес уже есть, но что-то мешает перейти к подключению.','Барьер должен объяснять, почему конкретное следующее действие не происходит.')}
function c2(){let ok=val('q2')==='b';award('q2',ok);fb('f2',ok,'Да. Такие данные помогают проверить гипотезу о сложности выбора или непонятной ценности.','Не стройте барьер только на интуиции — ищите подтверждение в поведении и обратной связи.')}
</script></body></html>
