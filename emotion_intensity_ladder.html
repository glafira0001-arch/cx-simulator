<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шкала интенсивности</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.zone{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.summary{font-size:12px;line-height:1.45}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:94%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.zone{min-height:82px;background:#fafbfc;cursor:pointer}
.zone-title{font-size:10px;font-weight:800;line-height:1.25;margin-bottom:5px}
.zone-list{display:flex;flex-direction:column;gap:4px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-size:10px;line-height:1.25;cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:7px}
.scale button{height:31px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:11px}
.scale button.selected{background:var(--accent-soft)}
.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){
  .grid2,.grid3,.inline-choices{grid-template-columns:1fr}
  .scale{grid-template-columns:repeat(5,1fr)}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="intensityTask">

  <div class="head">
    <div class="kicker">Интенсивность эмоции</div>
    <h2>Подберите инструмент под уровень возбуждения</h2>
    <p class="lead">Для каждой ситуации сначала оцените интенсивность от 1 до 10, затем выберите действие. Точной цифры нет — важен подходящий диапазон.</p>
  </div>
  <div class="body">
    <div class="card">
      <span class="badge" data-role="caseNum"></span>
      <p data-role="case" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p>
      <div class="scale" data-role="scale"></div>
    </div>
    <div class="small" style="margin:8px 0 5px">Что делать сейчас?</div>
    <div class="grid2" data-role="tools"></div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('intensityTask');
  if (!root) return;

  const cases=[
    {
      text:'Перед письмом руководителю есть легкое беспокойство, вы можете ясно думать.',
      range:[1,3],tool:'brief'
    },
    {
      text:'Страх заметный: мысли скачут, но вы можете читать и отвечать на вопросы.',
      range:[4,7],tool:'analyze'
    },
    {
      text:'Паника: сильное сердцебиение, ощущение потери контроля, трудно анализировать.',
      range:[8,10],tool:'ground'
    }
  ];
  const tools=[
    {value:'brief',text:'Назвать чувство, сделать несколько спокойных выдохов и продолжить задачу'},
    {value:'analyze',text:'Снизить возбуждение, затем выписать риск, ресурс и следующий шаг'},
    {value:'ground',text:'Перейти к заземлению и спокойному дыханию; отложить крупные решения'},
    {value:'decide',text:'Принять важное решение немедленно, используя силу эмоции'}
  ];
  let index=0,intensity=null,tool=null,checked=false,score=0;
  const q=r=>root.querySelector(`[data-role="${r}"]`);

  function render(){
    const item=cases[index];intensity=null;tool=null;checked=false;
    q('caseNum').textContent=`Ситуация ${index+1} из ${cases.length}`;q('case').textContent=item.text;
    q('scale').innerHTML=Array.from({length:10},(_,i)=>`<button type="button" data-level="${i+1}">${i+1}</button>`).join('');
    q('scale').querySelectorAll('[data-level]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('scale').querySelectorAll('[data-level]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');intensity=Number(btn.dataset.level);q('next').disabled=tool===null;
      });
    });
    q('tools').classList.remove('hidden');
    q('tools').innerHTML=tools.map(t=>`<button type="button" class="choice" data-tool="${t.value}">${t.text}</button>`).join('');
    q('tools').querySelectorAll('[data-tool]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('tools').querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');tool=btn.dataset.tool;q('next').disabled=intensity===null;
      });
    });
    q('next').disabled=true;q('next').textContent='Проверить';q('fb').className='feedback';
  }

  q('next').addEventListener('click',()=>{
    const item=cases[index];
    if(!checked){
      const rangeOk=intensity>=item.range[0]&&intensity<=item.range[1];
      const toolOk=tool===item.tool;
      if(rangeOk&&toolOk)score++;
      q('scale').querySelectorAll('[data-level]').forEach(btn=>{
        const v=Number(btn.dataset.level);
        if(v>=item.range[0]&&v<=item.range[1])btn.classList.add('good');else if(v===intensity)btn.classList.add('bad');btn.disabled=true;
      });
      q('tools').querySelectorAll('[data-tool]').forEach(btn=>{
        if(btn.dataset.tool===item.tool)btn.classList.add('good');else if(btn.dataset.tool===tool)btn.classList.add('bad');btn.disabled=true;
      });
      q('fb').className=`feedback show ${rangeOk&&toolOk?'ok':'warn'}`;
      q('fb').innerHTML=rangeOk&&toolOk
        ? '<strong>Инструмент соответствует интенсивности.</strong><br>Чем выше возбуждение, тем меньше сложного анализа и больше простых телесных действий и безопасности.'
        : '<strong>Инструмент не соответствует состоянию.</strong><br>При высокой интенсивности сначала снизьте возбуждение; анализ и важные решения оставьте на более спокойный момент.';
      checked=true;q('next').textContent=index===cases.length-1?'Показать результат':'Следующая ситуация';return;
    }
    if(index<cases.length-1){index++;render();}
    else{
      q('tools').classList.add('hidden');q('case').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
      q('scale').innerHTML='';
      q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;
      q('fb').innerHTML='Шкала нужна не для идеальной точности, а чтобы не требовать сложного анализа от себя в состоянии сильного возбуждения.';
      q('next').disabled=true;q('next').textContent='Готово';
    }
  });

  q('reset').addEventListener('click',()=>{index=0;intensity=null;tool=null;checked=false;score=0;q('tools').classList.remove('hidden');render();});
  render();

})();
</script>
</body>
</html>
