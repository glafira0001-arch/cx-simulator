<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Услышал — уточнил — проверил</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:15px;line-height:1.42}.task{width:100%;max-width:560px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.04)}h2{font-size:19px;line-height:1.25;margin:0 0 8px}p{margin:0 0 10px}.case{background:#f1f5f9;border-radius:10px;padding:11px;margin:10px 0 12px}.step{font-size:12px;color:#64748b;margin:0 0 8px}.progress{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;background:#2563eb;transition:width .2s}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn:disabled{opacity:.4;cursor:default}.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:9px;font-size:14px}.feedback.ok{display:block;background:#ecfdf5;border:1px solid #86efac}.feedback.bad{display:block;background:#fff7ed;border:1px solid #fdba74}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;margin:7px 0}.option:hover,.option.selected{background:#eff6ff;border-color:#60a5fa}.mini{font-size:13px;color:#64748b}.grid{display:grid;gap:8px}.row{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff}.row b{display:block;margin-bottom:5px}.select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.checkline{display:flex;gap:8px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff;margin:7px 0;cursor:pointer}.checkline input{margin-top:3px}.order{display:grid;gap:7px}.orderItem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;background:#fff}.orderBtns{display:flex;gap:4px}.iconbtn{border:1px solid #cbd5e1;background:#f8fafc;border-radius:7px;width:31px;height:31px;cursor:pointer;font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 9px;font:inherit;cursor:pointer;text-align:left}.chip.used{opacity:.35;text-decoration:line-through}.build{min-height:58px;border:1px dashed #94a3b8;border-radius:10px;padding:8px;background:#f8fafc;margin:8px 0 11px}.built{display:block;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:7px 8px;margin:4px 0}.tag{display:inline-block;border-radius:999px;background:#e2e8f0;padding:2px 7px;font-size:12px;margin-bottom:5px}.fragment{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;margin:7px 0}.fragment.selected{background:#fff7ed;border-color:#fb923c}.bubble{border-radius:12px;padding:10px 11px;margin:8px 0}.bubble.emp{background:#eef2ff}.bubble.mgr{background:#f8fafc;border:1px solid #dbe2ea}.hidden{display:none!important}</style></head><body><main class="task"><section class="card"><h2>«Услышал — уточнил — проверил»: проведите короткий диалог</h2>
<div class="case"><b>Сотрудник:</b> «Я не мог закончить отчет вовремя, потому что аналитический отдел прислал данные только вечером».</div>
<div class="progress"><span id="bar"></span></div><div class="step" id="stepLabel"></div><div id="screen"></div>
<div class="controls"><button class="btn ghost" id="back">Назад</button><button class="btn primary" id="check">Проверить ответ</button><button class="btn secondary" id="reset">Начать заново</button></div><div class="feedback" id="fb"></div></section></main><script>let step=0,answers=[null,[],null],sets=[];const screen=document.getElementById('screen'),fb=document.getElementById('fb'),bar=document.getElementById('bar'),lab=document.getElementById('stepLabel');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function init(){sets=[shuffle([
 {t:'«Понял. Расскажи, как развивалась ситуация до этого»',ok:true},{t:'«Срок все равно был твой»',ok:false},{t:'«Значит, полностью виноват аналитический отдел»',ok:false}
]),shuffle([
 {t:'Когда ты запросил данные?',ok:true},{t:'Когда стало понятно, что они задерживаются?',ok:true},{t:'Почему ты всегда ждешь до последнего?',ok:false},{t:'Кто виноват в задержке?',ok:false}
]),shuffle([
 {t:'«Правильно понимаю: в среду ты уже видел риск, но решил ждать данные и руководителю о риске не сообщил?»',ok:true},{t:'«То есть ты просто ничего не делал и ждал?»',ok:false},{t:'«Правильно понимаю, аналитики полностью отвечают за срыв?»',ok:false}
])];}
function render(){fb.className='feedback';fb.textContent='';lab.textContent=`Шаг ${step+1} из 3 — ${['услышать','уточнить','проверить понимание'][step]}`;bar.style.width=((step+1)/3*100)+'%';document.getElementById('back').disabled=step===0;if(step===0){screen.innerHTML='<div class="bubble emp"><b>Сотрудник:</b> Данные пришли только вечером.</div><p><b>Как ответить первым?</b></p>'+sets[0].map((o,i)=>`<button class="option ${answers[0]===i?'selected':''}" data-i="${i}">${o.t}</button>`).join('');screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[0]=+b.dataset.i;render()})}else if(step===1){screen.innerHTML='<div class="bubble mgr"><b>Руководитель:</b> Понял. Расскажи, как развивалась ситуация до этого.</div><div class="bubble emp"><b>Сотрудник:</b> Я запросил данные заранее, но дальше просто ждал.</div><p><b>Выберите два вопроса, которые восстановят факты.</b></p>'+sets[1].map((o,i)=>`<label class="checkline"><input type="checkbox" data-i="${i}" ${answers[1].includes(i)?'checked':''}><span>${o.t}</span></label>`).join('');screen.querySelectorAll('input').forEach(x=>x.onchange=()=>{const i=+x.dataset.i;if(x.checked&&!answers[1].includes(i))answers[1].push(i);if(!x.checked)answers[1]=answers[1].filter(v=>v!==i)})}else{screen.innerHTML='<div class="bubble emp"><b>Сотрудник:</b> Во вторник запросил данные, в среду понял, что срок под риском, но никому не сообщил — ждал до пятницы.</div><p><b>Как проверить понимание?</b></p>'+sets[2].map((o,i)=>`<button class="option ${answers[2]===i?'selected':''}" data-i="${i}">${o.t}</button>`).join('');screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[2]=+b.dataset.i;render()})}}
document.getElementById('check').onclick=()=>{let ok=false;if(step===1){if(answers[1].length!==2){fb.className='feedback bad';fb.textContent='Выберите ровно два вопроса.';return}ok=answers[1].every(i=>sets[1][i].ok)}else ok=answers[step]!==null&&sets[step][answers[step]].ok;if(!ok){fb.className='feedback bad';fb.textContent=step===0?'Сначала примите информацию и откройте рассказ, не назначая виноватого.':step===1?'Нужны вопросы о времени и действиях, а не о вине и характере.':'Проверка понимания должна пересказать факты без обвинительного вывода.';return}if(step<2){fb.className='feedback ok';fb.textContent='Верно.';setTimeout(()=>{step++;render()},500)}else{fb.className='feedback ok';fb.textContent='Готово. Вы не спорили с объяснением, восстановили события и только затем проверили свою версию.'}};
document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};document.getElementById('reset').onclick=()=>{step=0;answers=[null,[],null];init();render()};init();render();</script></body></html>
