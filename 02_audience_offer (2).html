<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аудитория и предложение</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2933}.app{max-width:560px;margin:auto;background:#fff;min-height:100vh}.head{background:#2f6b4f;color:#fff;padding:14px 16px;font-weight:700}.screen{display:none;padding:16px}.screen.active{display:block}h2{font-size:19px;margin:0 0 10px}p{font-size:13.5px;line-height:1.45}.case{background:#f0f6f3;border-left:4px solid #2f6b4f;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13.5px;line-height:1.42}.opt{display:block;border:1px solid #cfd8df;border-radius:8px;padding:10px;margin:7px 0;font-size:13.5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:12.5px}.primary{background:#2f6b4f;color:#fff}.secondary{background:#e8edf0}.ghost{background:#fff;border:1px solid #cfd8df}.fb{display:none;margin-top:10px;padding:9px;border-radius:8px;font-size:13px;line-height:1.4}.fb.show{display:block}.good{background:#e9f7ef;border:1px solid #a8d7b9}.bad{background:#fff3e8;border:1px solid #e5ba89}.result{background:#eef6f2;border:1px solid #b9d7c7;padding:12px;border-radius:10px;margin-top:10px}select,input[type=number]{width:100%;padding:8px;border:1px solid #cfd8df;border-radius:8px;font-size:13px}.row{display:grid;grid-template-columns:1.1fr 1fr;gap:8px;align-items:center;margin:9px 0}</style></head><body><div class="app"><div class="head">Аудитория и предложение</div>
<section class="screen active"><h2>Сопоставьте аудиторию и способ поиска</h2>
<div class="row"><b>Уже ищет курс английского</b><select id="s1"><option value="">Выберите</option><option value="a">Ключевые фразы</option><option value="b">Интересы</option><option value="c">Ретаргетинг</option></select></div>
<div class="row"><b>Был на сайте, но не записался</b><select id="s2"><option value="">Выберите</option><option value="a">Ключевые фразы</option><option value="b">Интересы</option><option value="c">Ретаргетинг</option></select></div>
<div id="f1" class="fb"></div><div class="actions"><button class="primary" onclick="c1()">Проверить</button><button class="secondary" onclick="next()">Дальше</button></div></section>
<section class="screen"><h2>Выберите оффер</h2><div class="case">Аудитория готовится к собеседованию на английском и уже ищет обучение.</div>
<label class="opt"><input type="radio" name="q2" value="a">Современная онлайн-школа</label><label class="opt"><input type="radio" name="q2" value="b">Подготовка к собеседованию за 8 занятий</label><label class="opt"><input type="radio" name="q2" value="c">Индивидуальный подход</label><label class="opt"><input type="radio" name="q2" value="d">Опытные преподаватели</label><div id="f2" class="fb"></div><div class="actions"><button class="ghost" onclick="back()">Назад</button><button class="primary" onclick="c2()">Проверить</button><button class="secondary" onclick="next();final(2)">Результат</button></div></section><section class="screen"><h2>Результат</h2><div id="final"></div></section>
</div><script>let cur=0,score=0,done={};const sc=[...document.querySelectorAll('.screen')];function show(i){cur=Math.max(0,Math.min(i,sc.length-1));sc.forEach((x,n)=>x.classList.toggle('active',n===cur));}function next(){show(cur+1)}function back(){show(cur-1)}function restart(){location.reload()}function val(n){return document.querySelector('input[name="'+n+'"]:checked')?.value}function fb(id,ok,g,b){let e=document.getElementById(id);e.className='fb show '+(ok?'good':'bad');e.innerHTML=ok?g:b}function award(id,ok){if(done[id])return;done[id]=true;if(ok)score++}function final(t){document.getElementById('final').innerHTML='<div class="result"><b>Итог: '+score+' из '+t+'</b></div>'}show(0);function c1(){let ok=s1.value==='a'&&s2.value==='c';award('q1',ok);fb('f1',ok,'Да. Спрос ловим ключевыми фразами, знакомую аудиторию — ретаргетингом.','Разделите сформированный спрос и знакомую аудиторию.')}function c2(){let ok=val('q2')==='b';award('q2',ok);fb('f2',ok,'Да. Оффер связан с конкретной задачей и результатом.','Общие преимущества слабее конкретного результата.')}</script></body></html>
