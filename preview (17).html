<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Четыре вопроса</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:15px;line-height:1.42}.task{width:100%;max-width:560px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.04)}h2{font-size:19px;line-height:1.25;margin:0 0 8px}p{margin:0 0 10px}.case{background:#f1f5f9;border-radius:10px;padding:11px;margin:10px 0 12px}.step{font-size:12px;color:#64748b;margin:0 0 8px}.progress{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;background:#2563eb;transition:width .2s}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn:disabled{opacity:.4;cursor:default}.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:9px;font-size:14px}.feedback.ok{display:block;background:#ecfdf5;border:1px solid #86efac}.feedback.bad{display:block;background:#fff7ed;border:1px solid #fdba74}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;margin:7px 0}.option:hover,.option.selected{background:#eff6ff;border-color:#60a5fa}.mini{font-size:13px;color:#64748b}.grid{display:grid;gap:8px}.row{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff}.row b{display:block;margin-bottom:5px}.select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.checkline{display:flex;gap:8px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff;margin:7px 0;cursor:pointer}.checkline input{margin-top:3px}.order{display:grid;gap:7px}.orderItem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;background:#fff}.orderBtns{display:flex;gap:4px}.iconbtn{border:1px solid #cbd5e1;background:#f8fafc;border-radius:7px;width:31px;height:31px;cursor:pointer;font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 9px;font:inherit;cursor:pointer;text-align:left}.chip.used{opacity:.35;text-decoration:line-through}.build{min-height:58px;border:1px dashed #94a3b8;border-radius:10px;padding:8px;background:#f8fafc;margin:8px 0 11px}.built{display:block;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:7px 8px;margin:4px 0}.tag{display:inline-block;border-radius:999px;background:#e2e8f0;padding:2px 7px;font-size:12px;margin-bottom:5px}.fragment{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;margin:7px 0}.fragment.selected{background:#fff7ed;border-color:#fb923c}.bubble{border-radius:12px;padding:10px 11px;margin:8px 0}.bubble.emp{background:#eef2ff}.bubble.mgr{background:#f8fafc;border:1px solid #dbe2ea}.hidden{display:none!important}</style></head><body><main class="task"><section class="card"><h2>Четыре вопроса: соберите карточку разговора</h2>
<div class="case"><b>Ситуация.</b> Сотрудник дважды сообщил о существенном риске уже после того, как он повлиял на клиента. Руководитель собирается поговорить «об ответственности».</div>
<div class="progress"><span id="bar"></span></div><div class="step" id="stepLabel"></div><div id="screen"></div>
<div class="controls"><button class="btn ghost" id="back">Назад</button><button class="btn primary" id="check">Проверить ответ</button><button class="btn secondary" id="reset">Начать заново</button></div><div class="feedback" id="fb"></div></section></main><script>const cards=[
 {t:'Понять причину двух поздних сообщений и проверить, одинаково ли стороны видят проблему',ok:true},
 {t:'Добиться обещания: «Больше так не сделаю»',ok:false},
 {t:'Позднее сообщение лишает команду времени изменить план и предупредить клиента',ok:true},
 {t:'Обсудить заодно опоздания на планерки и оформление презентаций',ok:false},
 {t:'Проект А: риск сообщен утром в день срока; проект Б: вечером накануне',ok:true},
 {t:'Сотрудник в целом безответственный и недостаточно самостоятельный',ok:false},
 {t:'Оформление отчетов оставить за границами этой встречи',ok:true},
 {t:'Заранее решить за сотрудника, что он будет делать при следующем риске',ok:false}
];
let step=0, sel=[], choice=null, options=[];const screen=document.getElementById('screen'),fb=document.getElementById('fb'),bar=document.getElementById('bar'),lab=document.getElementById('stepLabel');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){fb.className='feedback';fb.textContent='';lab.textContent=step===0?'Шаг 1 из 2 — выберите четыре элемента карточки':'Шаг 2 из 2 — отделите результат разговора от будущего поведения';bar.style.width=step===0?'50%':'100%';document.getElementById('back').disabled=step===0;if(step===0){screen.innerHTML='<p><b>Отметьте ровно четыре пункта, которые руководителю стоит зафиксировать до встречи.</b></p>'+cards.map((c,i)=>`<label class="checkline"><input type="checkbox" data-i="${i}" ${sel.includes(i)?'checked':''}><span>${c.t}</span></label>`).join('');screen.querySelectorAll('input').forEach(x=>x.onchange=()=>{const i=+x.dataset.i;if(x.checked&&!sel.includes(i))sel.push(i);if(!x.checked)sel=sel.filter(v=>v!==i)})}else{if(!options.length)options=shuffle([
 {t:'Результат подготовки: понять причины и убедиться, что стороны одинаково видят проблему',ok:true},
 {t:'Результат подготовки: заранее назначить сотруднику конкретное действие на будущее',ok:false},
 {t:'Результат подготовки: доказать сотруднику, что его поведение недопустимо',ok:false}
]);screen.innerHTML='<p><b>Что относится именно к подготовке разговора?</b></p>'+options.map((o,i)=>`<button class="option ${choice===i?'selected':''}" data-i="${i}">${o.t}</button>`).join('');screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>{choice=+b.dataset.i;render()})}}
document.getElementById('check').onclick=()=>{if(step===0){if(sel.length!==4){fb.className='feedback bad';fb.textContent='Нужно выбрать ровно четыре пункта.';return}const ok=sel.every(i=>cards[i].ok)&&cards.filter(c=>c.ok).length===sel.length;if(!ok){fb.className='feedback bad';fb.textContent='В карточке должны остаться: результат разговора, главная мысль, факты и границы темы. Не добавляйте диагноз личности и решение за сотрудника.';return}fb.className='feedback ok';fb.textContent='Верно. Карточка собрана без лишних тем и без заранее навязанного решения.';setTimeout(()=>{step=1;render()},650)}else{if(choice===null){fb.className='feedback bad';fb.textContent='Выберите вариант.';return}if(options[choice].ok){fb.className='feedback ok';fb.textContent='Точно. На этапе подготовки вы задаете предмет и результат разговора, а будущее действие появится позже — после разбора ситуации.'}else{fb.className='feedback bad';fb.textContent='Подготовка не должна заранее подменять диалог готовым решением или превращаться в доказательство вины.'}}};
document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};document.getElementById('reset').onclick=()=>{step=0;sel=[];choice=null;options=[];render()};render();</script></body></html>
