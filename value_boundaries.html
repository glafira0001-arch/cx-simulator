<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Защитить личный приоритет</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="valueBoundariesTask">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Личные границы</div>
    <h2>Защитите приоритет, а не оправдание</h2>
    <p class="lead">Для каждой просьбы определите, какую ценность вы защищаете, и выберите прямую формулировку.</p>
  </div>
  <div class="body">
    <div class="card">
      <span class="badge" data-role="step"></span>
      <p data-role="case" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p>
    </div>
    <div class="small" style="margin:8px 0 5px">Какой приоритет защищается?</div>
    <div class="grid2" data-role="values"></div>
    <div data-role="phraseBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Как ответить?</div>
      <div class="grid2" data-role="phrases"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('valueBoundariesTask');
  if (!root) return;

  const cases=[
    {
      text:'Вас просят остаться после 19:00, но вы обещали провести вечер с ребенком.',
      value:'Семья и близкие',
      values:['Профессиональный рост','Семья и близкие','Статус в команде','Желание избежать неловкости'],
      phrases:[
        {text:'«Извини, может быть, в другой раз, если получится…»',correct:false},
        {text:'«Сегодня после 19:00 мое время с семьей, поэтому дополнительную задачу я не беру»',correct:true},
        {text:'«Наверное, я плохой коллега, но не смогу»',correct:false},
        {text:'«Я останусь, только постараюсь уйти пораньше»',correct:false}
      ]
    },
    {
      text:'Коллега просит передать вам часть своей работы в неделю, когда вы готовитесь к профессиональной сертификации.',
      value:'Профессиональный рост',
      values:['Профессиональный рост','Удобство коллеги','Страх критики','Желание нравиться'],
      phrases:[
        {text:'«Сейчас мой приоритет — подготовка к сертификации, поэтому новую задачу я не беру»',correct:true},
        {text:'«Ну, давай, хотя мне будет очень тяжело»',correct:false},
        {text:'«Почему ты сам не можешь это сделать?»',correct:false},
        {text:'Подробно доказывать ценность сертификации',correct:false}
      ]
    },
    {
      text:'Вас зовут на ранний нетворкинг после недели недосыпа и плохого самочувствия.',
      value:'Здоровье',
      values:['Страх упустить возможность','Здоровье','Чужое мнение','Рабочая репутация'],
      phrases:[
        {text:'«Если вы считаете это важным, я приду»',correct:false},
        {text:'«Мне так неловко, но врач, сон, усталость…»',correct:false},
        {text:'«Сейчас мой приоритет — восстановление, поэтому эту встречу я пропущу»',correct:true},
        {text:'«Может быть, решу утром»',correct:false}
      ]
    }
  ];
  let index=0,value=null,phrase=null,checked=false,score=0;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function render(){
    const item=cases[index];
    value=null;phrase=null;checked=false;
    q('step').textContent=`Ситуация ${index+1} из ${cases.length}`;
    q('case').textContent=item.text;
    q('bar').style.width=`${index/cases.length*100}%`;
    q('values').innerHTML=item.values.map((v,i)=>
      `<button type="button" class="choice" data-value="${i}">${v}</button>`
    ).join('');
    q('phrases').innerHTML=item.phrases.map((p,i)=>
      `<button type="button" class="choice" data-phrase="${i}">${p.text}</button>`
    ).join('');
    q('values').querySelectorAll('[data-value]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('values').querySelectorAll('[data-value]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        value=Number(btn.dataset.value);
        q('phraseBlock').classList.remove('hidden');
        q('next').disabled=phrase===null;
      });
    });
    q('phrases').querySelectorAll('[data-phrase]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('phrases').querySelectorAll('[data-phrase]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        phrase=Number(btn.dataset.phrase);
        q('next').disabled=value===null;
      });
    });
    q('phraseBlock').classList.add('hidden');
    q('next').disabled=true;
    q('next').textContent='Проверить';
    q('fb').className='feedback';
  }
  q('next').addEventListener('click',()=>{
    const item=cases[index];
    if(!checked){
      if(value===null||phrase===null)return;
      const valueOk=item.values[value]===item.value;
      const phraseOk=item.phrases[phrase].correct;
      const ok=valueOk&&phraseOk;
      if(ok)score++;
      q('values').querySelectorAll('[data-value]').forEach(btn=>{
        const i=Number(btn.dataset.value);
        if(item.values[i]===item.value)btn.classList.add('good');
        else if(i===value)btn.classList.add('bad');
        btn.disabled=true;
      });
      q('phrases').querySelectorAll('[data-phrase]').forEach(btn=>{
        const i=Number(btn.dataset.phrase);
        if(item.phrases[i].correct)btn.classList.add('good');
        else if(i===phrase)btn.classList.add('bad');
        btn.disabled=true;
      });
      q('fb').className=`feedback show ${ok?'ok':'warn'}`;
      q('fb').innerHTML=ok
        ? '<strong>Граница опирается на ценность.</strong><br>Вы не оправдываетесь и не предлагаете обсуждать важность своего приоритета.'
        : '<strong>Проверьте приоритет или формулировку.</strong><br>Называйте ценность прямо и не превращайте отказ в просьбу разрешить вам иметь границы.';
      checked=true;
      q('next').textContent=index===cases.length-1?'Показать результат':'Следующая ситуация';
      return;
    }
    if(index<cases.length-1){index++;render();}
    else{
      q('bar').style.width='100%';
      q('values').classList.add('hidden');
      q('phraseBlock').classList.add('hidden');
      q('case').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
      q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;
      q('fb').innerHTML='Устойчивая граница отвечает на вопрос: «Что важное я сейчас защищаю?» — и не требует одобрения собеседника.';
      q('next').disabled=true;
      q('next').textContent='Готово';
    }
  });
  q('reset').addEventListener('click',()=>{
    index=0;value=null;phrase=null;checked=false;score=0;
    q('values').classList.remove('hidden');
    render();
  });
  render();

})();
</script>
</body>
</html>
