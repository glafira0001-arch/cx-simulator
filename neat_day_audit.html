<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Найдите скрытые точки активности</title><style>
:root{--ink:#172033;--muted:#667085;--line:#d9e0e8;--accent:#4658d6;--accent-soft:#eef1ff;--ok:#147552;--ok-soft:#eaf8f1;--bad:#b42318;--bad-soft:#fff0ee;--warn:#936500;--warn-soft:#fff7dc}
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}.body{padding:12px 15px 14px}
.card,.row-card,.slot{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.row-card+.row-card{margin-top:7px}.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}button{font:inherit}
.choice,.tile,.answer-btn,.block-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;font-size:12px;line-height:1.3}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#edf0f5;color:var(--ink)}.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;color:#475467;font-size:10px;font-weight:800}.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}.hidden{display:none!important}.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.timeline{display:grid;grid-template-columns:64px 1fr;gap:6px}.time{font-size:10px;color:var(--muted);display:flex;align-items:center}.slot{min-height:43px;cursor:pointer;padding:7px}.slot-title{font-size:11px;font-weight:800}.slot-sub{font-size:10px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:999px;background:#e8ebf3;overflow:hidden}.bar>div{height:100%;background:var(--accent);transition:.2s}.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr}.task{border-radius:12px}.head,.body{padding-left:12px;padding-right:12px}}
</style></head><body><div class="task" id="neatdayaudit"><div class="progress"><div data-role="bar"></div></div><div class="head"><div class="kicker">Движение вне зала</div><h2>Найдите скрытые точки активности</h2><p class="lead">Замените сидячие сценарии на реалистичные активные решения.</p></div><div class="body"><div class="card"><span class="badge" data-role="step"></span><p data-role="case" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p></div><div class="grid2" data-role="options" style="margin-top:7px"></div><div class="actions"><button type="button" class="secondary" data-role="reset">Начать заново</button><button type="button" class="primary" data-role="next" disabled>Проверить</button></div><div class="feedback" data-role="fb"></div></div></div><script>(()=>{const root=document.getElementById('neatdayaudit');if(!root)return;const cases=[{"text": "Дорога до офиса", "options": [{"text": "Выйти на одну остановку раньше", "correct": true}, {"text": "Искать место максимально близко ко входу", "correct": false}], "note": "Активный маршрут добавляет движение без отдельной тренировки."}, {"text": "Телефонный разговор", "options": [{"text": "Ходить во время звонка, если это безопасно", "correct": true}, {"text": "Оставаться неподвижно весь разговор", "correct": false}], "note": "Звонок можно превратить в короткий активный блок."}, {"text": "Работа за компьютером", "options": [{"text": "Периодически вставать и менять положение", "correct": true}, {"text": "Компенсировать десять часов сидения одной тренировкой", "correct": false}], "note": "Тренировка полезна, но не отменяет длительное непрерывное сидение."}];let idx=0,pick=null,checked=false,score=0;const q=r=>root.querySelector(`[data-role="${r}"]`);function render(){const c=cases[idx];pick=null;checked=false;q('step').textContent=`Ситуация ${idx+1} из ${cases.length}`;q('case').textContent=c.text;q('bar').style.width=`${idx/cases.length*100}%`;q('options').classList.remove('hidden');q('options').innerHTML=c.options.map((o,i)=>`<button type="button" class="choice" data-i="${i}">${o.text}</button>`).join('');q('options').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{q('options').querySelectorAll('[data-i]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');pick=Number(b.dataset.i);q('next').disabled=false;}));q('next').disabled=true;q('next').textContent='Проверить';q('fb').className='feedback';}q('next').addEventListener('click',()=>{const c=cases[idx];if(!checked){const ok=c.options[pick].correct;if(ok)score++;q('options').querySelectorAll('[data-i]').forEach(b=>{const i=Number(b.dataset.i);if(c.options[i].correct)b.classList.add('good');else if(i===pick)b.classList.add('bad');b.disabled=true;});q('fb').className=`feedback show ${ok?'ok':'warn'}`;q('fb').innerHTML=`<strong>${ok?'Верно.':'Нужно пересмотреть решение.'}</strong><br>${c.note}`;checked=true;q('next').textContent=idx===cases.length-1?'Показать результат':'Следующая ситуация';return;}if(idx<cases.length-1){idx++;render();}else{q('bar').style.width='100%';q('options').classList.add('hidden');q('case').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;q('fb').innerHTML="Небольшие активные решения дополняют тренировку и уменьшают длительные периоды неподвижности.";q('next').disabled=true;q('next').textContent='Готово';}});q('reset').addEventListener('click',()=>{idx=0;pick=null;checked=false;score=0;q('options').classList.remove('hidden');render();});render();})();</script></body></html>
