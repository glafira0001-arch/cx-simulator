function build(){document.querySelectorAll('.card').forEach(x=>x.remove());cards.length=0;status=false;result.classList.add('hidden');images.forEach((item,i)=>{const el=document.createElement('button');el.type='button';el.className='card';el.setAttribute('aria-label','Отчёт '+(i+1)+'. Перетащите или нажмите для увеличения');el.innerHTML='<span class="dot"></span><img draggable="false" src="'+item.img+'" alt="Отчёт '+(i+1)+'">';el.style.left=original[i].x+'%';el.style.top=original[i].y+'%';el.style.zIndex=++z;board.appendChild(el);cards.push({el,item,x:original[i].x,y:original[i].y});wire(cards[i]);refresh(cards[i]);});}
function refresh(c){const center=c.x+9.75;const side=center<50?'left':'right';c.el.classList.toggle('right',side==='right');c.el.classList.toggle('left',side==='left');if(status){c.el.classList.add('checked');c.el.classList.toggle('correct',(side==='left'?'good':'bad')===c.item.answer);c.el.classList.toggle('incorrect',(side==='left'?'good':'bad')!==c.item.answer);}else{c.el.classList.remove('checked','correct','incorrect');}}
function wire(c){const el=c.el;let start=null;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;start={px:e.clientX,py:e.clientY,x:c.x,y:c.y,moved:false};el.setPointerCapture(e.pointerId);el.style.zIndex=++z;el.classList.add('dragging');});el.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.px,dy=e.clientY-start.py;if(Math.hypot(dx,dy)>5)start.moved=true;if(!start.moved)return;const r=board.getBoundingClientRect();c.x=Math.max(0,Math.min(100-19.5,start.x+dx/r.width*100));c.y=Math.max(3,Math.min(100-25,start.y+dy/r.height*100));el.style.left=c.x+'%';el.style.top=c.y+'%';status=false;result.classList.add('hidden');refresh(c);});el.addEventListener('pointerup',e=>{if(!start)return;let moved=start.moved;start=null;el.classList.remove('dragging');if(moved)refresh(c);else openZoom(c.item.img);});el.addEventListener('pointercancel',()=>{start=null;el.classList.remove('dragging');});}

document.getElementById('zoomClose').onclick=()=>document.getElementById('zoom').classList.add('hidden');document.getElementById('zoom').addEventListener('click',e=>{if(e.target.id==='zoom')e.currentTarget.classList.add('hidden')});document.getElementById('ok').onclick=()=>document.getElementById('instructions').classList.add('hidden');document.getElementById('help').onclick=()=>document.getElementById('instructions').classList.remove('hidden');document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await board.requestFullscreen();}catch(e){}};
document.getElementById('check').onclick=()=>{status=true;cards.forEach(refresh);const correct=cards.filter(c=>(c.x+9.75<50?'good':'bad')===c.item.answer).length;result.classList.remove('hidden');result.innerHTML='<strong>'+(correct===5?'Все пять отчётов распределены верно!':'Верно распределено: '+correct+' из 5.')+'</strong><div class="actions"><button type="button" id="retry">Попробовать снова</button><button type="button" id="reset">Начать заново</button></div>';document.getElementById('retry').onclick=()=>{status=false;cards.forEach(refresh);result.classList.add('hidden')};document.getElementById('reset').onclick=build;};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('zoom').classList.add('hidden')});build();</script></body></html>
