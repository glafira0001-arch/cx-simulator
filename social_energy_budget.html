<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Социальный бюджет</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:93%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.energy{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.energy span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eef1ff;font-size:11px;font-weight:800}
.energy span.used{background:#ffdede;color:#8f1c1c}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="socialBudgetTask">

  <div class="head">
    <div class="kicker">Социальный бюджет</div>
    <h2>Распределите энергию на выходные</h2>
    <p class="lead">У вас 6 единиц ресурса. Выберите планы, после которых останется минимум 2 единицы на восстановление перед рабочей неделей.</p>
  </div>
  <div class="body">
    <div class="card">
      <div class="metric"><span class="small">Ресурс</span><span class="badge" data-role="score">6 из 6</span></div>
      <div class="energy" data-role="energy"></div>
    </div>
    <div class="grid2" data-role="plans" style="margin-top:8px"></div>
    <div data-role="replyBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Как ответить друзьям на клуб в воскресенье?</div>
      <div class="grid2" data-role="replies"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить выбор</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('socialBudgetTask');
  if (!root) return;

  const plans=[
    {text:'Субботний кофе с другом',cost:1,good:true},
    {text:'Ночной клуб в воскресенье',cost:4,good:false},
    {text:'Тихая прогулка одному',cost:0,good:true},
    {text:'Большая вечеринка в субботу',cost:3,good:false},
    {text:'Обед с друзьями на 90 минут',cost:2,good:true},
    {text:'Вечер без встреч и сообщений',cost:0,good:true}
  ];
  const replies=[
    {text:'«Может быть, посмотрим ближе к вечеру».',correct:false},
    {text:'Не отвечать, чтобы никого не обидеть',correct:false},
    {text:'«Спасибо, что позвали. После этой недели мне нужен тихий вечер. Давайте в четверг выпьем кофе в обед».',correct:true},
    {text:'«У меня слишком важная работа для таких встреч».',correct:false}
  ];
  let selected=new Set(),reply=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function used(){return [...selected].reduce((s,i)=>s+plans[i].cost,0);}
  function render(){
    const spent=used(),left=6-spent;
    q('score').textContent=`${left} из 6`;
    q('energy').innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<spent?'used':''}">${i<spent?'−':'•'}</span>`).join('');
    q('plans').innerHTML=plans.map((p,i)=>
      `<button type="button" class="tile ${selected.has(i)?'selected':''}" data-plan="${i}">
        ${p.text}<br><span class="small">Затраты: ${p.cost}</span>
      </button>`
    ).join('');
    q('plans').querySelectorAll('[data-plan]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.plan);
        if(selected.has(i))selected.delete(i);
        else if(used()+plans[i].cost<=6)selected.add(i);
        q('fb').className='feedback';
        render();
      });
    });
    const enough=selected.size>=2;
    q('replyBlock').classList.toggle('hidden',!enough);
    q('check').disabled=!(enough&&reply!==null);
  }
  q('replies').innerHTML=replies.map((r,i)=>
    `<button type="button" class="choice" data-reply="${i}">${r.text}</button>`
  ).join('');
  q('replies').querySelectorAll('[data-reply]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('replies').querySelectorAll('[data-reply]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      reply=Number(btn.dataset.reply);
      q('check').disabled=selected.size<2;
    });
  });
  q('check').addEventListener('click',()=>{
    const left=6-used();
    const budgetOk=left>=2 && [...selected].every(i=>plans[i].good);
    const replyOk=reply!==null&&replies[reply].correct;
    q('plans').querySelectorAll('[data-plan]').forEach(btn=>{
      const i=Number(btn.dataset.plan);
      if(plans[i].good)btn.classList.add('good');
      else if(selected.has(i))btn.classList.add('bad');
      btn.disabled=true;
    });
    q('replies').querySelectorAll('[data-reply]').forEach(btn=>{
      const i=Number(btn.dataset.reply);
      if(replies[i].correct)btn.classList.add('good');
      else if(i===reply)btn.classList.add('bad');
      btn.disabled=true;
    });
    const ok=budgetOk&&replyOk;
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Социальный бюджет сохранен.</strong><br>Вы выбрали встречи, которые не создают энергетический долг, и дали друзьям ясный ответ с альтернативой.'
      : '<strong>В выходных остался энергетический овердрафт или размытый ответ.</strong><br>Оставьте не менее двух единиц ресурса и не подвешивайте планы друзей словом «может быть».';
    q('check').disabled=true;
  });
  q('reset').addEventListener('click',()=>{
    selected=new Set();reply=null;
    q('replies').querySelectorAll('[data-reply]').forEach(x=>{x.disabled=false;x.className='choice';});
    q('fb').className='feedback';
    render();
  });
  render();

})();
</script>
</body>
</html>
