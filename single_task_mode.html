<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Режим одной задачи</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.slot{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn,.block-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover,.block-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.timeline{display:grid;grid-template-columns:68px 1fr;gap:6px}
.time{font-size:10px;color:var(--muted);display:flex;align-items:center}
.slot{min-height:42px;cursor:pointer;padding:7px}
.slot.selected{background:var(--accent-soft)}
.slot-title{font-size:11px;font-weight:800}
.slot-sub{font-size:10px;color:var(--muted);margin-top:2px}
.wave{height:10px;border-radius:999px;background:#e8ebf3;overflow:hidden}
.wave>div{height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:93%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="singleTaskMode">

  <div class="head">
    <div class="kicker">Режим одной задачи</div>
    <h2>Настройте 40 минут полного погружения</h2>
    <p class="lead">Выберите пять условий для фокуса, затем решите, что делать с внезапной идеей во время работы.</p>
  </div>
  <div class="body">
    <div class="grid2" data-role="settings"></div>
    <div data-role="interruptBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Через 12 минут появилась идея проверить новый сервис. Что делать?</div>
      <div class="grid2" data-role="interrupts"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить режим</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('singleTaskMode');
  if (!root) return;

  const settings=[
    {text:'Отключить уведомления',correct:true},
    {text:'Оставить телефон рядом экраном вниз',correct:false},
    {text:'Закрыть почту и лишние вкладки',correct:true},
    {text:'Включить подкаст с разговором',correct:false},
    {text:'Убрать телефон из поля зрения',correct:true},
    {text:'Открыть отдельный лист для парковки идей',correct:true},
    {text:'Выбрать одну логическую точку завершения',correct:true},
    {text:'Проверять чаты после каждого абзаца',correct:false}
  ];
  const interrupts=[
    {text:'Сразу открыть сервис: это займет минуту',correct:false},
    {text:'Записать идею в парковочный лист и продолжить до выбранной точки',correct:true},
    {text:'Переключиться на почту, раз фокус уже нарушен',correct:false},
    {text:'Начать ругать себя за потерю концентрации',correct:false}
  ];
  let selected=new Set(),interrupt=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function render(){
    q('settings').innerHTML=settings.map((s,i)=>
      `<button type="button" class="tile ${selected.has(i)?'selected':''}" data-setting="${i}">${s.text}</button>`
    ).join('');
    q('settings').querySelectorAll('[data-setting]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.setting);
        if(selected.has(i))selected.delete(i);
        else if(selected.size<5)selected.add(i);
        q('fb').className='feedback';
        render();
      });
    });
    const ready=selected.size===5;
    q('interruptBlock').classList.toggle('hidden',!ready);
    q('check').disabled=!(ready&&interrupt!==null);
  }
  q('interrupts').innerHTML=interrupts.map((x,i)=>
    `<button type="button" class="choice" data-interrupt="${i}">${x.text}</button>`
  ).join('');
  q('interrupts').querySelectorAll('[data-interrupt]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('interrupts').querySelectorAll('[data-interrupt]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      interrupt=Number(btn.dataset.interrupt);
      q('check').disabled=selected.size!==5;
    });
  });
  q('check').addEventListener('click',()=>{
    const settingsOk=selected.size===5&&[...selected].every(i=>settings[i].correct);
    const interruptOk=interrupt!==null&&interrupts[interrupt].correct;
    q('settings').querySelectorAll('[data-setting]').forEach(btn=>{
      const i=Number(btn.dataset.setting);
      if(settings[i].correct)btn.classList.add('good');
      else if(selected.has(i))btn.classList.add('bad');
      btn.disabled=true;
    });
    q('interrupts').querySelectorAll('[data-interrupt]').forEach(btn=>{
      const i=Number(btn.dataset.interrupt);
      if(interrupts[i].correct)btn.classList.add('good');
      else if(i===interrupt)btn.classList.add('bad');
      btn.disabled=true;
    });
    const ok=settingsOk&&interruptOk;
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Фокус защищен.</strong><br>Вы закрыли цифровые двери, убрали телефон, обозначили точку завершения и припарковали новую идею.'
      : '<strong>В режиме осталась точка переключения.</strong><br>Человеческая речь, видимый телефон и регулярные проверки чатов сохраняют когнитивный налог.';
    q('check').disabled=true;
  });
  q('reset').addEventListener('click',()=>{
    selected=new Set();interrupt=null;
    q('interrupts').querySelectorAll('[data-interrupt]').forEach(x=>{x.disabled=false;x.className='choice';});
    q('fb').className='feedback';
    render();
  });
  render();

})();
</script>
</body>
</html>
