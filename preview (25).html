<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пауза — признать — вернуть к предмету</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:15px;line-height:1.42}.task{width:100%;max-width:560px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.04)}h2{font-size:19px;line-height:1.25;margin:0 0 8px}p{margin:0 0 10px}.case{background:#f1f5f9;border-radius:10px;padding:11px;margin:10px 0 12px}.step{font-size:12px;color:#64748b;margin:0 0 8px}.progress{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;background:#2563eb;transition:width .2s}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn:disabled{opacity:.4;cursor:default}.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:9px;font-size:14px}.feedback.ok{display:block;background:#ecfdf5;border:1px solid #86efac}.feedback.bad{display:block;background:#fff7ed;border:1px solid #fdba74}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;margin:7px 0}.option:hover,.option.selected{background:#eff6ff;border-color:#60a5fa}.mini{font-size:13px;color:#64748b}.grid{display:grid;gap:8px}.row{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff}.row b{display:block;margin-bottom:5px}.select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.checkline{display:flex;gap:8px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff;margin:7px 0;cursor:pointer}.checkline input{margin-top:3px}.timeline{display:grid;gap:7px}.event{display:flex;gap:9px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff;cursor:pointer}.event .num{width:25px;height:25px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}.event.selected{border-color:#2563eb;background:#eff6ff}.event.selected .num{background:#2563eb;color:#fff}.builder{display:grid;gap:8px}.slot{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#f8fafc}.slot b{display:block;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 9px;font:inherit;cursor:pointer;text-align:left}.chip.selected{background:#eff6ff;border-color:#60a5fa}.chip.used{opacity:.35}.bubble{border-radius:12px;padding:10px 11px;margin:8px 0}.bubble.emp{background:#eef2ff}.bubble.mgr{background:#f8fafc;border:1px solid #dbe2ea}.build{min-height:54px;border:1px dashed #94a3b8;border-radius:10px;padding:8px;background:#f8fafc;margin:8px 0 11px}.built{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:7px 8px;margin:4px 0}.xbtn{border:0;background:transparent;cursor:pointer;font-size:17px}.fragment{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;margin:7px 0}.fragment.selected{background:#fff7ed;border-color:#fb923c}.tag{display:inline-block;border-radius:999px;background:#e2e8f0;padding:2px 7px;font-size:12px;margin-right:5px}.match{display:grid;gap:8px}.matchRow{border:1px solid #d8dee8;border-radius:10px;padding:9px}.quote{padding:10px;border-left:3px solid #94a3b8;background:#f8fafc;border-radius:0 8px 8px 0;margin:8px 0}.hidden{display:none!important}</style></head><body><main class="task"><section class="card"><h2>Пауза — признать — вернуть к предмету</h2><div class="case"><b>Ситуация.</b> Вы разбираете с сотрудником два ошибочных расчета. В середине разговора он резко меняет реакцию.</div><div class="progress"><span id="bar"></span></div><div class="step" id="lab"></div><div id="screen"></div><div class="controls"><button class="btn ghost" id="back">Назад</button><button class="btn primary" id="check">Проверить ответ</button><button class="btn secondary" id="reset">Начать заново</button></div><div class="feedback" id="fb"></div></section></main><script>const stages=[
{emp:'«Понятно. Я вообще ничего нормально не делаю. Наверное, вам проще найти другого человека».',prompt:'Что ответить первым?',opts:[['Давай на минуту остановимся. Вижу, что этот разговор тебя сильно задел.',1],['Я такого не говорил, не надо драматизировать.',0],['Но ошибки ведь реально есть, давай не уходить от темы.',0]]},
{emp:'Сотрудник отвечает: «Вы все равно уже решили, что я не справляюсь».',prompt:'Как продолжить?',opts:[['Что в моих словах дало тебе такое ощущение?',1],['Если бы я так решил, мы бы сейчас не разговаривали.',0],['Тебе нужно научиться спокойнее воспринимать замечания.',0]]},
{emp:'Сотрудник объясняет: его задела фраза «мне приходится тебя перепроверять», но уже говорит спокойно.',prompt:'Что сделать дальше?',opts:[['Уточнить рамку: речь только о двух расчетах — и вернуться к конкретной ошибке.',1],['Закончить разговор, чтобы больше не расстраивать сотрудника.',0],['Перейти к обсуждению его общей стрессоустойчивости.',0]]}
];let step=0,picks=[null,null,null],opts=stages.map(x=>({...x,opts:[...x.opts].sort(()=>Math.random()-.5)}));const s=document.getElementById('screen'),fb=document.getElementById('fb'),bar=document.getElementById('bar'),lab=document.getElementById('lab'),back=document.getElementById('back'),check=document.getElementById('check'),reset=document.getElementById('reset');function render(){fb.className='feedback';fb.textContent='';bar.style.width=((step+1)/3*100)+'%';lab.textContent=`Шаг ${step+1} из 3`;back.disabled=step===0;const st=opts[step];s.innerHTML=`<div class="bubble emp"><b>Сотрудник:</b> ${st.emp}</div><p><b>${st.prompt}</b></p>`+st.opts.map((o,i)=>`<button class="option ${picks[step]===i?'selected':''}" data-i="${i}">${o[0]}</button>`).join('');s.querySelectorAll('.option').forEach(x=>x.onclick=()=>{picks[step]=+x.dataset.i;render()})}
check.onclick=()=>{if(picks[step]===null){fb.className='feedback bad';fb.textContent='Выберите ответ руководителя.';return}if(!opts[step].opts[picks[step]][1]){fb.className='feedback bad';fb.textContent=step===0?'Сейчас сотрудник уже не обсуждает содержание. Сначала остановите прежний ход разговора и признайте наблюдаемую реакцию.':step===1?'Не спорьте с интерпретацией сотрудника. Сначала выясните, что именно он услышал как общую оценку.':'Когда сотрудник снова способен обсуждать содержание, верните разговор к конкретному предмету — не отменяйте рабочий вопрос.';return}fb.className='feedback ok';fb.textContent=step<2?'Верно. Переходим к следующему шагу реакции.':'Верно. Вы не спорили с эмоцией, не ставили диагноз и после стабилизации вернули разговор к работе.';if(step<2)setTimeout(()=>{step++;render()},650)};back.onclick=()=>{if(step>0){step--;render()}};reset.onclick=()=>{step=0;picks=[null,null,null];opts=stages.map(x=>({...x,opts:[...x.opts].sort(()=>Math.random()-.5)}));render()};render();</script></body></html>
