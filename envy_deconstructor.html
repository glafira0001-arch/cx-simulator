<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Деконструктор зависти</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.zone{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.summary{font-size:12px;line-height:1.45}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:94%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.zone{min-height:82px;background:#fafbfc;cursor:pointer}
.zone-title{font-size:10px;font-weight:800;line-height:1.25;margin-bottom:5px}
.zone-list{display:flex;flex-direction:column;gap:4px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-size:10px;line-height:1.25;cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:7px}
.scale button{height:31px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:11px}
.scale button.selected{background:var(--accent-soft)}
.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){
  .grid2,.grid3,.inline-choices{grid-template-columns:1fr}
  .scale{grid-template-columns:repeat(5,1fr)}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="envyTask">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Зависть и социальное сравнение</div>
    <h2>Разберите зависть на конкретный запрос</h2>
    <p class="lead">Пройдите четыре шага: назовите желаемый результат, отделите факт от обесценивания, найдите наблюдаемые действия и выберите свой эксперимент.</p>
  </div>
  <div class="body">
    <div class="card">
      <span class="badge" data-role="step"></span>
      <p data-role="prompt" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p>
    </div>
    <div class="grid2" data-role="options" style="margin-top:7px"></div>
    <div class="card hidden" data-role="result" style="margin-top:8px">
      <strong style="font-size:12px">Вектор развития</strong>
      <div class="summary" data-role="plan" style="margin-top:5px"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Продолжить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('envyTask');
  if (!root) return;

  const stages=[
    {
      prompt:'Коллега часто выступает на конференциях. Чему именно вы завидуете?',
      options:[
        {text:'Видимости и признанию экспертности',correct:true},
        {text:'Его личности целиком',correct:false},
        {text:'Тому, что он «хуже меня, но всем нравится»',correct:false}
      ]
    },
    {
      prompt:'Как отделить факт от обесценивания?',
      options:[
        {text:'Факт: он выступил на трех конференциях. Оценка: «ему просто везет»',correct:true},
        {text:'Если мне неприятно, значит, он мошенник',correct:false},
        {text:'Нужно найти его слабости, чтобы стало легче',correct:false}
      ]
    },
    {
      prompt:'Какие наблюдаемые действия могут вести к результату?',
      options:[
        {text:'Подает заявки, пишет материалы, тренирует выступления и поддерживает контакты',correct:true},
        {text:'Вероятно, обладает секретным врожденным талантом',correct:false},
        {text:'Ничего не делает, успех появляется случайно',correct:false}
      ]
    },
    {
      prompt:'Какой эксперимент провести в ближайшие 30 дней?',
      options:[
        {text:'Подготовить тезисы и подать одну заявку на выступление или статью',correct:true},
        {text:'Ждать, пока зависть полностью исчезнет',correct:false},
        {text:'Публично критиковать коллегу, чтобы уравнять позиции',correct:false}
      ]
    }
  ];
  let index=0,selected=null,score=0,chosen=[];
  const q=r=>root.querySelector(`[data-role="${r}"]`);

  function render(){
    const item=stages[index];selected=null;
    q('bar').style.width=`${index/stages.length*100}%`;
    q('step').textContent=`Шаг ${index+1} из ${stages.length}`;q('prompt').textContent=item.prompt;
    q('options').classList.remove('hidden');q('result').classList.add('hidden');
    q('options').innerHTML=item.options.map((o,i)=>`<button type="button" class="choice" data-option="${i}">${o.text}</button>`).join('');
    q('options').querySelectorAll('[data-option]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('options').querySelectorAll('[data-option]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');selected=Number(btn.dataset.option);q('next').disabled=false;
      });
    });
    q('next').disabled=true;q('next').textContent=index===stages.length-1?'Собрать вектор':'Продолжить';q('fb').className='feedback';
  }

  q('next').addEventListener('click',()=>{
    if(selected===null)return;
    const option=stages[index].options[selected];if(option.correct)score++;
    chosen.push(option.text);
    if(index<stages.length-1){index++;render();}
    else{
      q('bar').style.width='100%';q('options').classList.add('hidden');q('result').classList.remove('hidden');
      q('plan').innerHTML=chosen.map((x,i)=>`${i+1}. ${x}`).join('<br>');
      q('fb').className=`feedback show ${score===stages.length?'ok':'warn'}`;
      q('fb').innerHTML=score===stages.length
        ? '<strong>Социальное сравнение превращено в эксперимент.</strong><br>Вы выделили конкретную желаемую ценность и перевели ее в наблюдаемое действие.'
        : `<strong>Конструктивных шагов: ${score} из ${stages.length}.</strong><br>Зависть становится полезнее, когда вместо глобального сравнения вы выделяете конкретный результат и доступный навык.`;
      q('next').disabled=true;q('next').textContent='Готово';
    }
  });

  q('reset').addEventListener('click',()=>{
    index=0;selected=null;score=0;chosen=[];
    q('options').classList.remove('hidden');q('result').classList.add('hidden');q('fb').className='feedback';render();
  });
  render();

})();
</script>
</body>
</html>
