<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практика</title><style>
*{box-sizing:border-box} body{margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#1f2933}
.app{width:100%;max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
.head{background:#2f6b4f;color:#fff;padding:14px 16px;font-weight:700}
.screen{display:none;padding:16px}.screen.active{display:block}
h2{font-size:20px;margin:0 0 10px} p{font-size:14px;line-height:1.45;margin:8px 0}
.case{background:#f0f6f3;border-left:4px solid #2f6b4f;padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
.opt{display:block;border:1px solid #cfd8df;border-radius:8px;padding:10px 11px;margin:8px 0;font-size:14px;cursor:pointer}
.opt input{margin-right:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;font-size:13px}
.primary{background:#2f6b4f;color:#fff}.secondary{background:#e8edf0}.ghost{background:#fff;border:1px solid #cfd8df}
.fb{display:none;margin-top:12px;padding:10px;border-radius:8px;font-size:14px;line-height:1.45}.fb.show{display:block}
.good{background:#e9f7ef;border:1px solid #a8d7b9}.bad{background:#fff3e8;border:1px solid #e5ba89}
select{width:100%;padding:9px;border:1px solid #cfd8df;border-radius:8px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.card{border:1px solid #d6dde3;border-radius:8px;padding:10px;font-size:13px}
.sort{display:grid;gap:8px}.item{border:1px solid #cfd8df;border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.move button{padding:4px 7px;background:#eef2f4}
.small{font-size:12px;color:#64727d}
</style></head><body><div class="app"><div class="head">Практика</div>
<section class="screen active">
<h2>Подберите формат</h2>
<div class="row">
<div class="card"><b>Один признак перегрузки участка</b><select id="s1"><option value="">Формат</option><option>Клип</option><option>Видео</option><option>Серия</option><option>Эфир</option></select></div>
<div class="card"><b>Как подготовить проект автоматизации</b><select id="s2"><option value="">Формат</option><option>Клип</option><option>Видео</option><option>Серия</option><option>Эфир</option></select></div>
<div class="card"><b>Ответы эксперта после запуска продукта</b><select id="s3"><option value="">Формат</option><option>Клип</option><option>Видео</option><option>Серия</option><option>Эфир</option></select></div>
<div class="card"><b>Что автоматизировать первым</b><select id="s4"><option value="">Формат</option><option>Клип</option><option>Видео</option><option>Серия</option><option>Эфир</option></select></div>
</div>
<div id="f1" class="fb"></div>
<div class="actions"><button class="primary" onclick="check()">Проверить ответ</button><button class="secondary" onclick="next()">Дальше</button></div>
</section>
<section class="screen">
<h2>Найдите лишнее</h2>
<p>Команда хочет каждую тему делать и клипом, и длинным видео. Что лучше?</p>
<label class="opt"><input type="radio" name="q2" value="a">Делать оба формата всегда</label>
<label class="opt"><input type="radio" name="q2" value="b">Оставить только клипы</label>
<label class="opt"><input type="radio" name="q2" value="c">Проверять задачу каждого формата</label>
<label class="opt"><input type="radio" name="q2" value="d">Оставить только длинные видео</label>
<div id="f2" class="fb"></div>
<div class="actions"><button class="ghost" onclick="back()">Вернуться назад</button><button class="primary" onclick="c2()">Проверить ответ</button><button class="secondary" onclick="restart()">Пройти всё заново</button></div>
</section>
</div><script>
let cur=0; const sc=[...document.querySelectorAll('.screen')];
function show(i){cur=Math.max(0,Math.min(i,sc.length-1));sc.forEach((x,n)=>x.classList.toggle('active',n===cur));}
function next(){show(cur+1)} function back(){show(cur-1)} function restart(){location.reload()} show(0);
function fb(id,ok,good,bad){let e=document.getElementById(id);e.className='fb show '+(ok?'good':'bad');e.innerHTML=ok?good:bad}
function val(n){return document.querySelector('input[name="'+n+'"]:checked')?.value}

function check(){let ok=s1.value==='Клип'&&s2.value==='Серия'&&s3.value==='Эфир'&&s4.value==='Видео';fb('f1',ok,'Верно. Формат соответствует глубине задачи.','Один тезис — клип, большая тема — серия, вопросы в моменте — эфир, подробный разбор — видео.')}
function c2(){fb('f2',val('q2')==='c','Верно. Второй формат нужен только при отдельной задаче.','Количество форматов само по себе не добавляет пользы.')}
</script></body></html>
