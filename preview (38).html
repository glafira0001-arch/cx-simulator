<div id="aiLesson8">
<style>
#aiLesson8{max-width:560px;margin:0 auto;font-family:Arial,sans-serif;color:#202938}
#aiLesson8 *{box-sizing:border-box}
#aiLesson8 .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}
#aiLesson8 .header,#aiLesson8 .screen,#aiLesson8 .result{padding:16px}
#aiLesson8 .header{border-bottom:1px solid #e5e7eb}
#aiLesson8 .label{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:5px}
#aiLesson8 h3{margin:0;font-size:18px}
#aiLesson8 .progress{height:5px;margin-top:12px;background:#eef2f6;border-radius:9px;overflow:hidden}
#aiLesson8 .progress-fill{height:100%;background:#2563eb}
#aiLesson8 .meta{font-size:12px;color:#667085;margin-bottom:8px}
#aiLesson8 .question-title{font-size:16px;font-weight:700;margin-bottom:10px}
#aiLesson8 .box{padding:10px 11px;border:1px solid #e5e7eb;border-radius:11px;background:#f8fafc;font-size:13px;line-height:1.45;margin:9px 0}
#aiLesson8 .table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:11px;margin:9px 0}
#aiLesson8 table{width:100%;border-collapse:collapse;font-size:12px}
#aiLesson8 th,#aiLesson8 td{padding:7px 8px;border-bottom:1px solid #e5e7eb;text-align:left}
#aiLesson8 .question{font-size:14px;line-height:1.45;margin:11px 0}
#aiLesson8 .options{display:grid;gap:8px}
#aiLesson8 .option{padding:10px 11px;border:1px solid #e5e7eb;border-radius:11px;font-size:13px;cursor:pointer}
#aiLesson8 .option.selected{border-color:#7ca5ff;background:#f5f8ff}
#aiLesson8 .feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:11px;font-size:13px;line-height:1.45}
#aiLesson8 .feedback.correct{display:block;background:#ecfdf3;color:#065f46;border:1px solid #abefc6}
#aiLesson8 .feedback.wrong{display:block;background:#fff1f0;color:#7a271a;border:1px solid #fecdca}
#aiLesson8 .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
#aiLesson8 button{padding:8px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#aiLesson8 button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
#aiLesson8 button:disabled{opacity:.4}
#aiLesson8 .score{font-size:30px;font-weight:800}
#aiLesson8 .row{display:flex;justify-content:space-between;padding:8px 9px;border:1px solid #e5e7eb;border-radius:9px;margin:7px 0;font-size:12px}
#aiLesson8 .ok{color:#067647;font-weight:700}
#aiLesson8 .bad{color:#b42318;font-weight:700}
#aiLesson8 .final{margin-top:12px;padding:10px 11px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;font-size:13px;line-height:1.45}
</style>

<div class="card">
<div class="header">
<div class="label">Практикум · Урок 8</div>
<h3>Отличите тренд от сезонности</h3>
<div class="progress"><div class="progress-fill" id="l8Progress"></div></div>
</div>

<div class="screen" id="l8Screen">
<div class="meta" id="l8Meta"></div>
<div class="question-title" id="l8Title"></div>
<div id="l8Scenario"></div>
<div class="question" id="l8Question"></div>
<div class="options" id="l8Options"></div>
<div class="feedback" id="l8Feedback"></div>

<div class="actions">
<button id="l8Back">Назад</button>
<button class="primary" id="l8Check">Проверить</button>
<button id="l8Edit">Изменить ответ</button>
<button class="primary" id="l8Next">Далее</button>
</div>
</div>

<div class="result" id="l8Result" style="display:none">
<div class="meta">Результат симулятора</div>
<div class="score" id="l8Score"></div>
<div id="l8Rows"></div>
<div class="final"><strong>Логика:</strong><br>разовое изменение ≠ тренд; один год ≠ подтверждённая сезонность; повторяемость важнее красивой интерпретации.</div>
<div class="actions">
<button id="l8Error">Вернуться к ошибке</button>
<button class="primary" id="l8Restart">Пройти заново</button>
</div>
</div>
</div>

<script>
(function(){
function startLesson8(){

const questions=[
{
 title:"Не объявляйте тренд слишком рано",
 scenario:'<div class="box"><strong>Выручка, млн ₽:</strong><br>5,00 → 5,25 → 5,52 → 5,46 → 4,90</div>',
 question:"Какой вывод наиболее точен?",
 options:[
   "Начался устойчивый нисходящий тренд.",
   "После периода роста произошёл спад; для нового тренда нужны следующие периоды.",
   "Продажи остаются полностью стабильными.",
   "Это подтверждённая сезонность."
 ],
 correct:1,
 explanation:"Есть период роста и последующее снижение. Пока недостаточно последовательных периодов, чтобы уверенно объявить новый тренд.",
 short:"Тренд"
},
{
 title:"Один год — ещё не сезонность",
 scenario:'<div class="box">За 2026 год август оказался самым слабым месяцем, а декабрь — самым сильным.</div>',
 question:"Как корректнее сформулировать вывод?",
 options:[
   "Август — подтверждённый низкий сезон.",
   "Есть возможные сезонные точки, которые нужно проверить по другим годам.",
   "Сезонность доказана большой разницей между месяцами.",
   "Такие месяцы нельзя анализировать вообще."
 ],
 correct:1,
 explanation:"Один год позволяет увидеть пики и спады, но ещё не доказывает их повторяемость.",
 short:"Один год"
},
{
 title:"Проверьте повторяемость",
 scenario:'<div class="table-wrap"><table><tr><th>Год</th><th>Изменение в августе</th></tr><tr><td>2024</td><td>−11%</td></tr><tr><td>2025</td><td>−9%</td></tr><tr><td>2026</td><td>−13%</td></tr></table></div>',
 question:"Какой вывод обоснован лучше?",
 options:[
   "Причина спада — отпуска клиентов.",
   "Август всегда будет снижаться примерно на 11%.",
   "Есть повторяющийся августовский спад.",
   "Нужны данные декабря, иначе вывод невозможен."
 ],
 correct:2,
 explanation:"Повторение в одном и том же месяце нескольких лет позволяет говорить о сезонном паттерне. Причину и точную величину будущего спада эти данные не доказывают.",
 short:"Повторяемость"
},
{
 title:"Не спрячьте сегмент внутри общего результата",
 scenario:'<div class="box">Общая выручка компании выросла на 8%. При этом продажи малого бизнеса снижаются четвёртый месяц подряд.</div>',
 question:"Что нужно отразить в карте динамики?",
 options:[
   "Только общий рост компании.",
   "Только снижение малого бизнеса.",
   "Общий рост и отдельную устойчивую отрицательную динамику сегмента.",
   "Ни один вывод: показатели противоречат друг другу."
 ],
 correct:2,
 explanation:"Общий рост может скрывать локальную устойчивую проблему. Оба уровня анализа важны.",
 short:"Общий итог и сегмент"
}
];

const E=id=>document.getElementById(id);

const screen=E("l8Screen"),result=E("l8Result"),progress=E("l8Progress"),
meta=E("l8Meta"),title=E("l8Title"),scenario=E("l8Scenario"),
question=E("l8Question"),options=E("l8Options"),feedback=E("l8Feedback"),
back=E("l8Back"),check=E("l8Check"),edit=E("l8Edit"),next=E("l8Next"),
score=E("l8Score"),rows=E("l8Rows"),error=E("l8Error"),restart=E("l8Restart");

let current=0,answers=[],checked=[];

function good(i){return answers[i]===questions[i].correct}

function render(){
 screen.style.display="block";
 result.style.display="none";

 const q=questions[current];

 meta.textContent="Экран "+(current+1)+" из "+questions.length;
 title.textContent=q.title;
 scenario.innerHTML=q.scenario;
 question.textContent=q.question;
 options.innerHTML="";

 q.options.forEach(function(text,index){
   const el=document.createElement("div");
   el.className="option"+(answers[current]===index?" selected":"");
   el.textContent=text;
   el.onclick=function(){answers[current]=index;render()};
   options.appendChild(el);
 });

 feedback.className="feedback";
 feedback.innerHTML="";

 if(checked[current]){
   const ok=good(current);
   feedback.classList.add(ok?"correct":"wrong");
   feedback.innerHTML="<strong>"+(ok?"Верно":"Не совсем")+"</strong><br>"+q.explanation;
 }

 back.disabled=current===0;
 check.style.display=checked[current]?"none":"inline-block";
 edit.style.display=checked[current]?"inline-block":"none";
 next.style.display=checked[current]?"inline-block":"none";
 next.textContent=current===questions.length-1?"Посмотреть результат":"Далее";
 progress.style.width=((current+1)/questions.length*100)+"%";
}

check.onclick=function(){
 if(answers[current]===undefined){alert("Сначала выберите ответ.");return}
 checked[current]=true;render();
};

edit.onclick=function(){checked[current]=false;render()};
back.onclick=function(){if(current>0){current--;render()}};
next.onclick=function(){
 if(current<questions.length-1){current++;render()}
 else showResult();
};

function showResult(){
 screen.style.display="none";
 result.style.display="block";
 let count=0;
 rows.innerHTML="";

 questions.forEach(function(q,index){
   const ok=good(index);
   if(ok)count++;

   const row=document.createElement("div");
   row.className="row";
   row.innerHTML="<span>"+(index+1)+". "+q.short+"</span><span class='"+(ok?"ok":"bad")+"'>"+(ok?"верно":"ошибка")+"</span>";
   rows.appendChild(row);
 });

 score.textContent=count+" / "+questions.length;
 error.style.display=count===questions.length?"none":"inline-block";
}

error.onclick=function(){
 const first=questions.findIndex(function(_,i){return !good(i)});
 if(first!==-1){current=first;render()}
};

restart.onclick=function(){current=0;answers=[];checked=[];render()};

render();
}

if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded",startLesson8);
}else{
 startLesson8();
}
})();
</script>
</div>
