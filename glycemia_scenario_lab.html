<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Управление гликемией</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.slot{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
button,input{font:inherit}
.choice,.tile,.answer-btn,.block-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover,.block-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.timeline{display:grid;grid-template-columns:68px 1fr;gap:6px}
.time{font-size:10px;color:var(--muted);display:flex;align-items:center}
.slot{min-height:44px;cursor:pointer;padding:7px}
.slot-title{font-size:11px;font-weight:800}
.slot-sub{font-size:10px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:999px;background:#e8ebf3;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:.2s}
.input-row{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:center}
input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.score-big{font-size:27px;font-weight:900;color:var(--accent)}
.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){
  .grid2,.grid3,.inline-choices{grid-template-columns:1fr}
  .input-row{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="glycemiaTask">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Стабильная энергия</div>
    <h2>Снизьте вероятность резкого спада после еды</h2>
    <p class="lead">Для каждой ситуации выберите практичное решение без самодиагностики по одному симптому.</p>
  </div>
  <div class="body">
    <div class="card">
      <span class="badge" data-role="step"></span>
      <p data-role="case" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p>
    </div>
    <div class="grid2" data-role="options" style="margin-top:7px"></div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('glycemiaTask');
  if (!root) return;

  const cases=[
    {
      text:'Завтрак состоит из сладкого кофе и выпечки, а через час снова хочется есть.',
      options:[
        {text:'Добавить белок и продукты с клетчаткой, уменьшив долю добавленного сахара',correct:true},
        {text:'Выпить еще один сладкий кофе',correct:false},
        {text:'Полностью запретить любые углеводы',correct:false},
        {text:'Считать это доказанной гипергликемией',correct:false}
      ],
      note:'Сочетание клетчатки, белка и менее рафинированных углеводов обычно дает более устойчивую сытость.'
    },
    {
      text:'После обеда есть возможность спокойно пройтись 10–15 минут.',
      options:[
        {text:'Выбрать короткую прогулку в комфортном темпе',correct:true},
        {text:'Сразу лечь спать на час',correct:false},
        {text:'Выпить уксус независимо от состояния желудка и лекарств',correct:false},
        {text:'Компенсировать обед интенсивной тренировкой',correct:false}
      ],
      note:'Небольшое движение после еды — реалистичная привычка без необходимости использовать сомнительные «трюки».'
    },
    {
      text:'Сильная жажда и сонливость после еды повторяются часто.',
      options:[
        {text:'Обсудить симптомы с врачом и при необходимости проверить уровень глюкозы',correct:true},
        {text:'Поставить диагноз по ощущениям',correct:false},
        {text:'Пить воду с лимоном, чтобы «разбавить сахар в крови»',correct:false},
        {text:'Отказаться от еды до следующего дня',correct:false}
      ],
      note:'Повторяющиеся симптомы требуют оценки, а не домашней диагностики по списку ощущений.'
    }
  ];
  let index=0,pick=null,checked=false,score=0;
  const q=r=>root.querySelector(`[data-role="${r}"]`);
  function render(){
    const item=cases[index];pick=null;checked=false;
    q('step').textContent=`Ситуация ${index+1} из ${cases.length}`;q('case').textContent=item.text;q('bar').style.width=`${index/cases.length*100}%`;
    q('options').classList.remove('hidden');
    q('options').innerHTML=item.options.map((o,i)=>`<button type="button" class="choice" data-option="${i}">${o.text}</button>`).join('');
    q('options').querySelectorAll('[data-option]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('options').querySelectorAll('[data-option]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');pick=Number(btn.dataset.option);q('next').disabled=false;
      });
    });
    q('next').disabled=true;q('next').textContent='Проверить';q('fb').className='feedback';
  }
  q('next').addEventListener('click',()=>{
    const item=cases[index];
    if(!checked){
      const ok=item.options[pick].correct;if(ok)score++;
      q('options').querySelectorAll('[data-option]').forEach(btn=>{
        const i=Number(btn.dataset.option);
        if(item.options[i].correct)btn.classList.add('good');else if(i===pick)btn.classList.add('bad');btn.disabled=true;
      });
      q('fb').className=`feedback show ${ok?'ok':'warn'}`;q('fb').innerHTML=`<strong>${ok?'Решение реалистично.':'Выбор опирается на крайность или самодиагностику.'}</strong><br>${item.note}`;
      checked=true;q('next').textContent=index===cases.length-1?'Показать результат':'Следующая ситуация';return;
    }
    if(index<cases.length-1){index++;render();}
    else{
      q('bar').style.width='100%';q('options').classList.add('hidden');q('case').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
      q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;q('fb').innerHTML='Стабильность питания строится на составе, порции, движении и индивидуальном состоянии, а не на одном обязательном порядке блюд.';
      q('next').disabled=true;q('next').textContent='Готово';
    }
  });
  q('reset').addEventListener('click',()=>{index=0;pick=null;checked=false;score=0;q('options').classList.remove('hidden');render();});
  render();

})();
</script>
</body>
</html>
