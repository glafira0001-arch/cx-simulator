<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Миссия компании «Елочка» — задание</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#222;background:#fff;font-size:16px}*{box-sizing:border-box}body{margin:0}.app{position:relative;min-height:320px;height:100vh;min-height:340px;overflow:auto;background:white}.topbtn{position:absolute;top:10px;z-index:5;border:0;background:transparent;cursor:pointer;font-size:23px;padding:3px;line-height:1}.help{left:12px;color:#23803d;text-shadow:1px 1px #fff}.fullscreen{right:12px;color:#ed434e;font-size:20px}.exercise{max-width:790px;margin:0 auto;padding:clamp(80px,15vh,130px) 30px 125px}.sentence{font-size:clamp(18px,2.3vw,23px);line-height:2.2;letter-spacing:0}.slot{display:inline-flex;vertical-align:middle;position:relative;align-items:center;line-height:1.3;min-height:40px;margin:0 4px;max-width:100%}.choice{font:inherit;background:#fff;border:1px solid #ccc;border-radius:5px;min-height:40px;max-width:100%;padding:6px 11px;cursor:pointer;text-align:center;color:#222;white-space:normal}.choice.empty{width:64px}.choice.open{background:#e6e6e6;border-color:#999}.choice.correct{background:#8eed94;border-color:#33b948;color:#111}.choice.wrong{background:#fff;border:1.5px solid #e84343;color:#d62020}.menu{position:absolute;left:0;top:calc(100% + 3px);min-width:300px;max-width:min(460px,90vw);max-height:235px;overflow:auto;background:#fff;box-shadow:0 4px 16px #0003;border:1px solid #ccc;border-radius:4px;z-index:12;padding:4px 0;font-size:17px;line-height:1.35}.menu button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;background:#fff;font:inherit;cursor:pointer}.menu button:hover,.menu button:focus-visible{background:#e9f1ff}.bottom{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}.check{border:0;border-radius:50%;background:#2997e8;color:white;font-size:25px;width:58px;height:58px;box-shadow:0 3px 5px #0003;cursor:pointer}.check:hover{background:#157ac4}.feedback{background:#fff;border:1px solid #dadada;border-radius:10px;padding:12px 15px;box-shadow:0 3px 10px #0002;max-width:340px;font-size:16px;line-height:1.4;display:none}.feedback.show{display:block}.retry{background:white;border:1px solid #aaa;border-radius:6px;font-size:15px;padding:8px 13px;margin-top:9px;cursor:pointer}.shade{position:fixed;inset:0;background:#0003;display:flex;justify-content:center;align-items:center;z-index:50;padding:15px}.dialog{width:min(510px,100%);background:#fafafa;border:10px solid #d2d2d2;border-radius:14px;box-shadow:0 3px 17px #0006;padding:18px 15px 14px;text-align:center}.dialog h2{font-size:23px;margin:0 0 14px}.dialog p{text-align:left;font-size:18px;line-height:1.45;margin:0 0 16px}.ok{font-size:19px;border:1px solid #888;background:#f4f4f4;padding:5px 12px;cursor:pointer}.status{position:absolute;left:20px;bottom:24px;color:#666;font-size:13px}.app:fullscreen .exercise{max-width:1150px;padding-top:17vh}.app:fullscreen .sentence{font-size:clamp(24px,2.2vw,36px)}.app:fullscreen .choice{min-height:52px}.app:fullscreen .menu{font-size:21px;max-height:350px}@media(max-width:600px){.exercise{padding:80px 17px 130px}.sentence{font-size:18px;line-height:2.25}.menu{min-width:min(285px,82vw);font-size:15px}.menu button{padding:10px}.choice{padding:7px}.bottom{right:12px;bottom:12px}.status{left:12px;bottom:20px;max-width:65%}}
</style>
</head>
<body>
<main class="app" id="app">
<button class="topbtn help" id="help" aria-label="Посмотреть задание" title="Посмотреть задание">❔</button>
<button class="topbtn fullscreen" id="fullscreen" aria-label="На весь экран" title="На весь экран">⛶</button>
<div class="exercise"><div class="sentence" id="sentence">Миссия компании «Елочка» – <span class="slot" data-i="0"></span> традиции <span class="slot" data-i="1"></span> и ручной художественной росписи, чтобы <span class="slot" data-i="2"></span>.</div></div>
<div class="status" id="status" aria-live="polite"></div>
<div class="bottom"><div class="feedback" id="feedback" aria-live="polite"></div><button class="check" id="check" aria-label="Проверить ответ" title="Проверить ответ">☑</button></div>
</main>
<div class="shade" id="shade" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle">Задание</h2><p>Нажмите на пустое поле и выберите верный вариант ответа.</p><button class="ok" id="ok">OK</button></div></div>
<script>
'use strict';
const opts=[
 ['обеспечивать сохранность, развивая','сохранность и развитость','сохранять и развивать'],
 ['клиентов в разных городах России','ключевых партнеров','русского стекольного ремесла'],
 ['приумножить прибыль бизнеса','сделать мир красивее','устранить конкурентов']
];
const correct=[2,2,1], answers=[null,null,null];
const slots=[...document.querySelectorAll('.slot')], fb=document.getElementById('feedback');
let finished=false;
function closeMenus(){document.querySelectorAll('.menu').forEach(x=>x.remove());document.querySelectorAll('.choice.open').forEach(x=>x.classList.remove('open'))}
function render(){slots.forEach((slot,i)=>{slot.replaceChildren();const button=document.createElement('button');button.type='button';button.className='choice'+(answers[i]===null?' empty':'');button.textContent=answers[i]===null?'':opts[i][answers[i]];button.setAttribute('aria-label','Выберите ответ для поля '+(i+1));if(finished&&answers[i]!==null)button.classList.add(answers[i]===correct[i]?'correct':'wrong');button.addEventListener('click',e=>{e.stopPropagation();if(finished)return;const already=slot.querySelector('.menu');closeMenus();if(already)return;button.classList.add('open');const menu=document.createElement('div');menu.className='menu';menu.setAttribute('role','listbox');opts[i].forEach((s,j)=>{const option=document.createElement('button');option.type='button';option.textContent=s;option.setAttribute('role','option');option.addEventListener('click',ev=>{ev.stopPropagation();answers[i]=j;finished=false;fb.classList.remove('show');render()});menu.append(option)});slot.append(menu)});slot.append(button)})}
document.addEventListener('click',closeMenus);
document.getElementById('check').addEventListener('click',()=>{closeMenus();if(answers.some(v=>v===null)){fb.innerHTML='Заполните все три поля, затем проверьте ответ.';fb.classList.add('show');return;}finished=true;render();const n=answers.filter((v,i)=>v===correct[i]).length;fb.replaceChildren();const s=document.createElement('div');s.textContent=n===3?'Верно! Все три ответа правильные.':`Правильных ответов: ${n} из 3. Неверные варианты выделены красным.`;fb.append(s);const b=document.createElement('button');b.className='retry';b.textContent='Попробовать снова';b.addEventListener('click',()=>{answers.fill(null);finished=false;fb.classList.remove('show');render()});fb.append(b);fb.classList.add('show')});
document.getElementById('help').addEventListener('click',()=>{closeMenus();document.getElementById('shade').hidden=false;document.getElementById('shade').style.display='flex'});
document.getElementById('ok').addEventListener('click',()=>{document.getElementById('shade').style.display='none'});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.getElementById('app').requestFullscreen();else await document.exitFullscreen()}catch(e){document.getElementById('status').textContent='Полноэкранный режим недоступен в этом окне.'}});
render();
</script>
</body></html>
