<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Разорвите четыре часа сидения</title><style>
:root{--ink:#172033;--muted:#667085;--line:#d9e0e8;--accent:#4658d6;--accent-soft:#eef1ff;--ok:#147552;--ok-soft:#eaf8f1;--bad:#b42318;--bad-soft:#fff0ee;--warn:#936500;--warn-soft:#fff7dc}
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}.body{padding:12px 15px 14px}
.card,.row-card,.slot{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.row-card+.row-card{margin-top:7px}.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}button{font:inherit}
.choice,.tile,.answer-btn,.block-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;font-size:12px;line-height:1.3}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#edf0f5;color:var(--ink)}.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;color:#475467;font-size:10px;font-weight:800}.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}.hidden{display:none!important}.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.timeline{display:grid;grid-template-columns:64px 1fr;gap:6px}.time{font-size:10px;color:var(--muted);display:flex;align-items:center}.slot{min-height:43px;cursor:pointer;padding:7px}.slot-title{font-size:11px;font-weight:800}.slot-sub{font-size:10px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:999px;background:#e8ebf3;overflow:hidden}.bar>div{height:100%;background:var(--accent);transition:.2s}.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr}.task{border-radius:12px}.head,.body{padding-left:12px;padding-right:12px}}
</style></head><body><div class="task" id="microbreaktimeline"><div class="head"><div class="kicker">Микродвижения</div><h2>Разорвите четыре часа сидения</h2><p class="lead">Распределите короткие движения по часовым слотам, не дожидаясь боли и затекания.</p></div><div class="body"><div class="grid2" data-role="pool"></div><div class="timeline" data-role="timeline" style="margin-top:8px"></div><div class="actions"><button type="button" class="secondary" data-role="reset">Начать заново</button><button type="button" class="primary" data-role="check" disabled>Проверить</button></div><div class="feedback" data-role="fb"></div></div></div><script>(()=>{const root=document.getElementById('microbreaktimeline');if(!root)return;const moves=[{"id": "walk", "text": "Пройтись 2 минуты"}, {"id": "heels", "text": "Подъемы пяток и движение стоп"}, {"id": "reach", "text": "Встать и потянуться"}, {"id": "call", "text": "Провести звонок стоя"}],times=["10:00", "11:00", "12:00", "13:00"];let p=Array(times.length).fill(null),sel=null;const q=r=>root.querySelector(`[data-role="${r}"]`),by=id=>moves.find(x=>x.id===id);function render(){const used=new Set(p.filter(Boolean));q('pool').innerHTML=moves.map(m=>!used.has(m.id)?`<button type="button" class="block-card ${sel===m.id?'selected':''}" data-m="${m.id}">${m.text}</button>`:'').join('');q('pool').querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{sel=b.dataset.m;render();}));q('timeline').innerHTML=times.map((t,i)=>{const m=p[i]?by(p[i]):null;return `<div class="time">${t}</div><button type="button" class="slot ${m?'selected':''}" data-s="${i}"><div class="slot-title">${m?m.text:'Добавьте движение'}</div><div class="slot-sub">${m?'1–2 минуты':'до появления боли'}</div></button>`;}).join('');q('timeline').querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.s);if(sel){const old=p.indexOf(sel);if(old>=0)p[old]=null;p[i]=sel;sel=null;}else if(p[i]){sel=p[i];p[i]=null;}q('fb').className='feedback';render();}));q('check').disabled=p.some(v=>v===null);}q('check').addEventListener('click',()=>{q('timeline').querySelectorAll('[data-s]').forEach(b=>{b.classList.add('good');b.disabled=true;});q('fb').className='feedback show ok';q('fb').innerHTML="<strong>Неподвижность регулярно прерывается.</strong><br>Микродвижения не заменяют недельную норму активности, но помогают не сохранять одну позу часами.";q('check').disabled=true;});q('reset').addEventListener('click',()=>{p=Array(times.length).fill(null);sel=null;q('fb').className='feedback';render();});render();})();</script></body></html>
