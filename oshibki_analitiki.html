<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Истинные и ложные ошибки аналитики</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#242424}body{background:#f8f8f8}.shell{position:relative;width:100%;height:min(670px,100dvh);min-height:430px;overflow:hidden;background:#f9f0b0}.board{position:absolute;inset:0;overflow:hidden;background:linear-gradient(90deg,#cde3a8 0 50%,#ffce9f 50% 100%)}.board:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.1;background-image:radial-gradient(#b5a268 1px,transparent 1.4px);background-size:39px 41px}.zone-title{position:absolute;top:47%;width:50%;font-size:clamp(20px,3vw,29px);text-align:center;color:#222;transform:translateY(-50%);pointer-events:none}.zone-title.right{left:50%}.card{position:absolute;width:20%;max-width:175px;min-width:116px;min-height:64px;padding:14px 9px 12px;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid transparent;border-radius:15px;box-shadow:0 5px 11px #0003;line-height:1.13;font-size:clamp(11px,1.65vw,15px);text-align:center;cursor:grab;touch-action:none;user-select:none;z-index:2;transition:box-shadow .18s,border-color .18s}.card:active{cursor:grabbing}.card.dragging{z-index:30;box-shadow:0 10px 22px #0005}.pin{position:absolute;top:-12px;left:calc(50% - 10px);width:20px;height:20px;border-radius:50%;box-shadow:0 2px 5px #0003;background:#12a954;pointer-events:none}.card.right .pin{background:#ff4a2c}.card.correct{border:5px solid #7aed8b;padding:11px 6px 9px}.card.wrong{border:5px solid #fa7077;padding:11px 6px 9px}.topbtn{position:absolute;z-index:45;top:8px;width:30px;height:30px;background:#ffffff95;border:1px solid #bdc0c5;cursor:pointer;font-size:22px;line-height:1}.help{left:9px;color:green}.full{right:9px;color:#f0445b}.check{position:absolute;z-index:40;right:18px;bottom:18px;border:0;border-radius:50%;width:57px;height:57px;background:#2789e3;color:white;font-size:30px;cursor:pointer;box-shadow:0 3px 7px #0003}.result{position:absolute;z-index:39;bottom:19px;left:16px;right:88px;display:none;align-items:center;flex-wrap:wrap;gap:8px;background:#ffffffec;border-radius:10px;padding:9px 11px;font-size:13px;box-shadow:0 2px 8px #0003}.result.show{display:flex}.result button{border:1px solid #999;border-radius:6px;background:white;padding:6px 9px;cursor:pointer;font-size:13px}.overlay{position:absolute;inset:0;z-index:60;background:#0002;display:flex;justify-content:center;align-items:center;padding:12px}.overlay[hidden]{display:none}.modal{background:#f8f8f8;border:11px solid #d4d4d4;border-radius:13px;width:min(540px,96%);box-shadow:0 5px 19px #0007;padding:16px 14px 13px;text-align:center}.modal h2{font-size:21px;margin:0 0 12px}.modal p{font-size:16px;line-height:1.42;text-align:left;margin:0 0 14px}.modal button{font-size:17px;padding:4px 14px;border:1px solid #777;background:#f5f5f5;cursor:pointer}.shell:fullscreen{height:100dvh;width:100vw}.shell:fullscreen .card{font-size:clamp(15px,1.4vw,21px);min-height:90px;max-width:260px;padding:20px 12px}.shell:fullscreen .zone-title{font-size:clamp(26px,3vw,42px)}.shell:fullscreen .modal{width:min(640px,90%)}@media(max-width:600px){.shell{height:min(650px,100dvh)}.card{min-width:98px;font-size:11px;padding:12px 5px 8px;border-radius:10px}.zone-title{font-size:20px}.result{font-size:12px}}
</style></head><body>
<main class="shell" id="shell"><section class="board" id="board" aria-label="Распределите ошибки"><div class="zone-title">Истинные ошибки</div><div class="zone-title right">Ложные ошибки</div></section>
<button class="topbtn help" id="help" title="Посмотреть задание ещё раз" aria-label="Посмотреть задание">❔</button><button class="topbtn full" id="full" title="Развернуть на весь экран" aria-label="Полноэкранный режим">⛶</button><div class="result" id="result" role="status"><span id="msg"></span><button id="retry">Попробовать снова</button><button id="reset">Начать заново</button></div><button class="check" id="check" title="Проверить ответы" aria-label="Проверить ответы">☑</button>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Задание</h2><p>Перед вами восемь ошибок при внедрении аналитики. Перетащите пять истинных в левый столбец, а три ложных — в правый.</p><button id="ok">OK</button></div></div></main>
<script>
(()=>{'use strict';
const items=[
{id:0,t:'Отсутствие методологии расчета',answer:'left',x:30,y:19},
{id:1,t:'Использование слишком простых инструментов, например Excel',answer:'right',x:51,y:17},
{id:2,t:'Фокус только на финансовых показателях',answer:'left',x:26,y:36},
{id:3,t:'Измерение дорогостоящих показателей',answer:'left',x:49,y:37},
{id:4,t:'Чрезмерное упорядочивание данных',answer:'right',x:21,y:56},
{id:5,t:'Несоответствие показателей на разных уровнях',answer:'left',x:41,y:67},
{id:6,t:'Отсутствие в компании штатного аналитика',answer:'right',x:78,y:58},
{id:7,t:'Игнорирование целей аналитики',answer:'left',x:61,y:73}
];
const board=document.getElementById('board'),result=document.getElementById('result'),msg=document.getElementById('msg');let checked=false,drag=null;
function side(el){return parseFloat(el.style.left)+el.offsetWidth/board.clientWidth*50 < 50?'left':'right'}
function updatePin(el){el.classList.toggle('right',side(el)==='right')}
function clearFeedback(){checked=false;result.classList.remove('show');document.querySelectorAll('.card').forEach(el=>el.classList.remove('correct','wrong'))}
function position(el,x,y){const maxX=Math.max(0,100-100*el.offsetWidth/board.clientWidth),maxY=Math.max(0,100-100*el.offsetHeight/board.clientHeight);el.style.left=Math.max(0,Math.min(maxX,x))+'%';el.style.top=Math.max(0,Math.min(maxY,y))+'%';updatePin(el)}
function init(){board.querySelectorAll('.card').forEach(el=>el.remove());items.forEach(item=>{const el=document.createElement('div');el.className='card';el.dataset.id=item.id;el.innerHTML='<span class="pin" aria-hidden="true"></span><span>'+item.t+'</span>';board.append(el);position(el,item.x,item.y);el.addEventListener('pointerdown',down)});clearFeedback()}
function down(e){if(e.button!==0&&e.pointerType==='mouse')return;const el=e.currentTarget,rect=board.getBoundingClientRect();drag={el,id:e.pointerId,dx:e.clientX-el.getBoundingClientRect().left,dy:e.clientY-el.getBoundingClientRect().top};el.classList.add('dragging');window.topCardZ=(window.topCardZ||20)+1;el.style.zIndex=window.topCardZ;el.setPointerCapture(e.pointerId);if(checked)clearFeedback();e.preventDefault()}
board.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const r=board.getBoundingClientRect();position(drag.el,100*(e.clientX-r.left-drag.dx)/r.width,100*(e.clientY-r.top-drag.dy)/r.height)});
function up(e){if(drag&&drag.id===e.pointerId){drag.el.classList.remove('dragging');drag=null}}
board.addEventListener('pointerup',up);board.addEventListener('pointercancel',up);
document.getElementById('check').onclick=()=>{let count=0;board.querySelectorAll('.card').forEach(el=>{const item=items[Number(el.dataset.id)],good=side(el)===item.answer;el.classList.toggle('correct',good);el.classList.toggle('wrong',!good);if(good)count++});checked=true;msg.textContent=count===8?'Все 8 ответов верны!':`Верно: ${count} из 8. Красные карточки нужно переместить.`;result.classList.add('show')};
document.getElementById('retry').onclick=clearFeedback;document.getElementById('reset').onclick=init;
const overlay=document.getElementById('overlay');document.getElementById('help').onclick=()=>overlay.hidden=false;document.getElementById('ok').onclick=()=>overlay.hidden=true;document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.getElementById('shell').requestFullscreen();else await document.exitFullscreen()}catch(e){}};
window.addEventListener('resize',()=>{board.querySelectorAll('.card').forEach(el=>position(el,parseFloat(el.style.left),parseFloat(el.style.top))) });init();
})();
</script></body></html>
