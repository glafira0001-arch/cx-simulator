<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Полезные и бесполезные приёмы — цели</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#252525}body{background:#f8f8f8}.activity{position:relative;width:min(100%,900px);height:560px;margin:0 auto;overflow:hidden;isolation:isolate;background:linear-gradient(90deg,#d6e9b9 0 50%,#ffd0a1 50% 100%)}.activity:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#a98a4d 0.6px,transparent 1px),radial-gradient(#fff6d6 1.1px,transparent 1.5px);background-size:47px 55px,83px 76px}.zone{position:absolute;top:0;bottom:0;width:50%}.zone.left{left:0}.zone.right{left:50%}.zone h2{position:absolute;top:46%;width:100%;text-align:center;font-size:clamp(18px,3vw,26px);font-weight:400;margin:0;pointer-events:none}.corner{position:absolute;z-index:30;top:8px;appearance:none;border:0;background:none;cursor:pointer;font-size:23px;line-height:1;padding:3px 6px}.help{left:5px;color:#269f3c;text-shadow:1px 1px #fff}.full{right:5px;color:#ea5454}.check{position:absolute;z-index:30;right:17px;bottom:17px;width:49px;height:49px;border-radius:50%;border:0;background:#2d91e2;color:white;box-shadow:0 2px 4px #0004;font-size:25px;cursor:pointer}.card{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;width:clamp(136px,20%,176px);min-height:72px;padding:12px 9px 9px;background:white;border:1px solid #e8e8e8;border-radius:15px;box-shadow:0 4px 8px #0003;font-size:clamp(12px,1.6vw,14px);line-height:1.17;cursor:grab;touch-action:none;user-select:none;transform:translate(-50%,-50%);transition:box-shadow .2s,border-color .2s}.card:active{cursor:grabbing}.card .dot{position:absolute;top:-10px;left:calc(50% - 9px);width:18px;height:18px;background:#18a257;border-radius:50%;box-shadow:0 1px 5px #0003}.card[data-zone="right"] .dot{background:#ff4a2b}.card.checked.correct{outline:5px solid #80ec88;outline-offset:0}.card.checked.incorrect{outline:5px solid #f25c67;outline-offset:0}.card.dragging{z-index:25!important;box-shadow:0 8px 20px #0005;transition:none}.footer{position:relative;margin:10px auto;width:min(100%,900px);display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;min-height:35px}.footer button,.again{border:1px solid #a6a6a6;background:white;padding:9px 13px;border-radius:7px;cursor:pointer;font-size:14px}.footer button:hover,.again:hover{background:#f2f2f2}.feedback{font-size:14px;line-height:1.35}.shade{position:absolute;z-index:50;inset:0;background:#0002;display:grid;place-items:center;padding:18px}.shade[hidden],.footer[hidden]{display:none}.modal{width:min(520px,100%);background:#f7f7f7;border:10px solid #d8d8d8;box-shadow:0 3px 13px #0006;border-radius:13px;padding:13px 15px 16px}.modal h3{font-size:20px;text-align:center;margin:0 0 13px}.modal p{line-height:1.42;font-size:16px;margin:0 0 14px}.modal button{display:block;margin:auto;padding:4px 13px;font-size:16px;cursor:pointer}.activity:fullscreen{width:100vw;height:100vh;max-width:none}.activity:fullscreen .card{font-size:clamp(15px,1.3vw,19px);width:clamp(180px,18vw,270px);min-height:clamp(90px,11vh,135px)}.activity:fullscreen .zone h2{font-size:clamp(25px,3vw,42px)}.activity:fullscreen .corner{font-size:30px}@media(max-width:500px){.activity{height:650px}.zone h2{top:49%;font-size:17px}.card{width:43%;font-size:12px;min-height:82px;padding:14px 7px}.modal p{font-size:14px}}
</style></head><body>
<main class="activity" id="activity" aria-label="Распределите приёмы по двум зонам"><section class="zone left"><h2>Полезные приёмы</h2></section><section class="zone right"><h2>Бесполезные приёмы</h2></section><button class="corner help" id="help" title="Открыть задание" aria-label="Открыть инструкцию">❔</button><button class="corner full" id="fullscreen" title="На весь экран" aria-label="На весь экран">⛶</button><div id="cards"></div><button class="check" id="check" title="Проверить ответ" aria-label="Проверить ответ">☑</button><div class="shade" id="shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="instructionTitle"><h3 id="instructionTitle">Задание</h3><p>Перед вами шесть приёмов, которые помогут избежать ошибок при внедрении аналитики. Перетащите четыре полезных в левую часть, а два бесполезных — в правую.</p><button id="ok">OK</button></div></div></main>
<div class="footer" id="footer" hidden><span class="feedback" id="feedback" aria-live="polite"></span><button class="again" id="retry">Попробовать снова</button><button class="again" id="restart">Начать заново</button></div>
<script>
(()=>{'use strict';
const items=[
{id:'focus',text:'Фокусироваться на нескольких прозрачных показателях',answer:'left',x:42,y:25},
{id:'delegate',text:'Оставлять достижение целей на усмотрение сотрудников',answer:'right',x:22,y:32},
{id:'break',text:'Раскладывать цель на составляющие и доводить до сотрудников',answer:'left',x:63,y:34},
{id:'visible',text:'Постоянно держать цель в поле зрения',answer:'left',x:47,y:55},
{id:'month',text:'Не придерживаться одной цели дольше месяца',answer:'right',x:40,y:76},
{id:'persist',text:'Сразу не отказываться от недостигнутых целей',answer:'left',x:75,y:68}
];
const board=document.getElementById('activity'),host=document.getElementById('cards'),shade=document.getElementById('shade'),footer=document.getElementById('footer'),feedback=document.getElementById('feedback');let checked=false,topZ=8;
function zoneFromX(x){return x<50?'left':'right'}
function updateZone(el){el.dataset.zone=zoneFromX(parseFloat(el.dataset.x))}
function place(el,x,y){const hw=el.offsetWidth/2/board.clientWidth*100,hh=el.offsetHeight/2/board.clientHeight*100;const px=Math.min(100-hw,Math.max(hw,x)),py=Math.min(100-hh,Math.max(hh,y));el.dataset.x=px;el.dataset.y=py;el.style.left=px+'%';el.style.top=py+'%';updateZone(el)}
function render(){host.innerHTML='';items.forEach(item=>{const el=document.createElement('div');el.className='card';el.dataset.id=item.id;el.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+item.text+'</span>';host.append(el);place(el,item.x,item.y);bindDrag(el)})}
function clearCheck(){checked=false;host.querySelectorAll('.card').forEach(el=>el.classList.remove('checked','correct','incorrect'));footer.hidden=true}
function bindDrag(el){let state=null;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;state={x:e.clientX,y:e.clientY,startX:parseFloat(el.dataset.x),startY:parseFloat(el.dataset.y)};el.setPointerCapture(e.pointerId);el.style.zIndex=++topZ;el.classList.add('dragging');if(checked)clearCheck()});el.addEventListener('pointermove',e=>{if(!state)return;const dx=(e.clientX-state.x)/board.clientWidth*100,dy=(e.clientY-state.y)/board.clientHeight*100;place(el,state.startX+dx,state.startY+dy)});function finish(){state=null;el.classList.remove('dragging')}el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish)}
document.getElementById('ok').onclick=()=>{shade.hidden=true};document.getElementById('help').onclick=()=>{shade.hidden=false};document.getElementById('check').onclick=()=>{checked=true;let correct=0;host.querySelectorAll('.card').forEach(el=>{const expected=items.find(i=>i.id===el.dataset.id).answer,good=el.dataset.zone===expected;el.classList.add('checked',good?'correct':'incorrect');if(good)correct++});footer.hidden=false;feedback.textContent=correct===6?'Верно! Все 6 приёмов распределены правильно.':'Верно: '+correct+' из 6. Красным отмечены ошибки.'};document.getElementById('retry').onclick=clearCheck;document.getElementById('restart').onclick=()=>{clearCheck();render()};document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await board.requestFullscreen()}catch(e){alert('Полноэкранный режим недоступен в этом окне.')}};
render();window.addEventListener('resize',()=>{host.querySelectorAll('.card').forEach(el=>place(el,parseFloat(el.dataset.x),parseFloat(el.dataset.y)))})
})();
</script></body></html>
