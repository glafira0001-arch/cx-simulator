<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Аналитика и статистика — найди пары</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#303030;background:#f7f2d9}body{display:flex;justify-content:center;align-items:flex-start}.activity{position:relative;width:100%;max-width:1100px;aspect-ratio: 2.19;min-height:300px;overflow:hidden;background:radial-gradient(circle at 9% 33%,#e8c56e32 0 1px,transparent 3px),radial-gradient(circle at 76% 69%,#e9bd6633 0 2px,transparent 6px),radial-gradient(circle at 56% 9%,#eacb8544 0 3px,transparent 9px),linear-gradient(125deg,#fff5b8,#fff1bd 53%,#ffefb5);box-shadow:inset 0 0 20px #f0da8a40}#stage{position:absolute;width:880px;height:400px;left:0;top:0;transform-origin:top left}.item{position:absolute;width:154px;min-height:48px;background:white;border:1px solid #e3e3e3;border-radius:14px;box-shadow:0 4px 7px #0003;display:flex;align-items:center;justify-content:center;padding:13px 8px 10px;text-align:center;font-size:15px;line-height:1.12;cursor:grab;touch-action:none;user-select:none;z-index:2}.item:focus-visible{outline:3px solid #247dc2}.item.dragging{cursor:grabbing;z-index:60;box-shadow:0 7px 14px #0005}.pin{position:absolute;top:-11px;left:calc(50% - 10px);border-radius:50%;height:20px;width:20px;background:#349bd6;box-shadow:0 1px 4px #0002;pointer-events:none}.definition .pin{background:#ffa454}.item.matched{visibility:hidden}.pair{position:absolute;width:160px;z-index:20;cursor:pointer}.pair .item{position:relative;left:auto!important;top:auto!important;margin:0 auto;min-height:45px;width:154px;box-shadow:0 3px 8px #0002;cursor:pointer;touch-action:auto}.pair .item .pin{z-index:2}.pair .bridge{height:16px;width:142px;margin:-2px auto;background:repeating-linear-gradient(180deg,#e2f6df 0 3px,#d6efd2 3px 6px);border-inline:3px solid #ccecc9}.pair.good .item{border:5px solid #7aee8c;padding:9px 4px 6px}.pair.bad .item{border:5px solid #ff3c37;background:repeating-linear-gradient(135deg,#fff 0px,#fff 11px,#ffe1e1 11px,#ffe1e1 18px);padding:9px 4px 6px}.pair.bad .bridge{background:repeating-linear-gradient(180deg,#ffc1c1 0 3px,#fda7a7 3px 6px);border-color:#ff3c37}.toolbar{position:absolute;z-index:80;display:flex;justify-content:space-between;width:100%;padding:9px 12px;pointer-events:none}.tool{pointer-events:auto;cursor:pointer;border:none;background:#ffffffa8;border-radius:3px;color:#219956;font-size:20px;line-height:1;padding:2px 3px}.tool.fs{color:#f45c58}.bottom{position:absolute;right:18px;bottom:13px;z-index:70;display:flex;align-items:center;gap:10px}.reset{border:0;background:#2f98e4;color:white;border-radius:22px;padding:10px 15px;font-size:14px;cursor:pointer;box-shadow:0 2px 5px #0003}.count{font-size:13px;background:#ffffffc2;border-radius:14px;padding:6px 9px}.backdrop{position:absolute;z-index:120;inset:0;display:grid;place-items:center;background:#0002}.backdrop[hidden]{display:none}.dialog{width:min(540px,90%);padding:12px;background:#d7d7d7;border:1px solid #b5b5b5;border-radius:12px;box-shadow:0 3px 17px #0006}.dialog-inner{background:#fafafa;padding:17px 17px 13px;text-align:left}.dialog h2{font-size:20px;text-align:center;margin:0 0 11px}.dialog p{margin:0 0 15px;font-size:16px;line-height:1.45}.dialog button{display:block;margin:auto;background:#efefef;border:1px solid #999;padding:4px 11px;font-size:17px;cursor:pointer}.notice{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:72;background:#fffdf5;border:1px solid #ddd;border-radius:10px;padding:8px 12px;box-shadow:0 3px 8px #0002;font-size:13px;max-width:65%;text-align:center}.notice[hidden]{display:none}.activity:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto}.activity:-webkit-full-screen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto}@media(max-width:620px){.activity{min-height:360px;aspect-ratio:1.25}.dialog h2{font-size:18px}.dialog p{font-size:14px}.count{display:none}.bottom{right:9px;bottom:9px}}
</style></head>
<body><main class="activity" id="activity" aria-label="Найди пары: аналитика и статистика">
<div class="toolbar"><button class="tool" id="help" aria-label="Посмотреть задание ещё раз" title="Посмотреть задание ещё раз">❔</button><button class="tool fs" id="full" aria-label="Развернуть на весь экран" title="Развернуть на весь экран">⛶</button></div>
<div id="stage" aria-label="Игровое поле"></div>
<div class="bottom"><span class="count" id="count">Найдено пар: 0 из 2</span><button class="reset" id="reset">Начать заново ↻</button></div>
<div class="notice" id="notice" hidden></div>
<div class="backdrop" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="tasktitle"><div class="dialog-inner"><h2 id="tasktitle">Задание</h2><p>Как думаете, чем аналитика отличается от статистики? Перетащите карточку с подходящим термином на каждое определение.</p><button id="ok">OK</button></div></section></div>
</main><script>
(()=>{'use strict';
const activity=document.getElementById('activity'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),notice=document.getElementById('notice');
const W=880,H=400;
const definitions={outcome:{label:'Делает выводы',kind:'definition',match:'analytics',x:210,y:149},data:{label:'Поставляет данные',kind:'definition',match:'statistics',x:454,y:143}};
const terms={analytics:{label:'Аналитика',kind:'term',match:'outcome',x:355,y:40},statistics:{label:'Статистика',kind:'term',match:'data',x:352,y:258}};
const initial={...definitions,...terms};let cards={},pairs=[],z=3,drag=null,shownTimer=null;
function fit(){const r=activity.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H);stage.style.transform=`scale(${scale})`;stage.style.left=`${(r.width-W*scale)/2}px`;stage.style.top=`${(r.height-H*scale)/2}px`;}
if('ResizeObserver'in window)new ResizeObserver(fit).observe(activity);window.addEventListener('resize',fit);
function showNotice(txt){notice.textContent=txt;notice.hidden=false;clearTimeout(shownTimer);shownTimer=setTimeout(()=>notice.hidden=true,1900)}
function element(item,id){const node=document.createElement('div');node.className='item '+(item.kind==='definition'?'definition':'term');node.tabIndex=0;node.dataset.id=id;node.innerHTML=`<span class="pin"></span><span>${item.label}</span>`;node.style.left=item.x+'px';node.style.top=item.y+'px';node.style.zIndex=++z;node.addEventListener('pointerdown',down);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const target=Object.values(cards).find(v=>v!==node&&v.dataset.selected==='1');if(target){target.dataset.selected='0';target.style.outline='';combine(node,target)}else{node.dataset.selected='1';node.style.outline='3px solid #38a0de';showNotice('Выберите вторую карточку для соединения')}}});return node}
function reset(){stage.replaceChildren();cards={};pairs=[];z=3;for(const [id,item] of Object.entries(initial)){const node=element(item,id);cards[id]=node;stage.append(node)}updateCount();fit();notice.hidden=true}
function down(e){if(e.button!==0)return;const node=e.currentTarget,id=node.dataset.id,scale=stage.getBoundingClientRect().width/W;drag={id,node,pointer:e.pointerId,ox:e.clientX,oy:e.clientY,left:parseFloat(node.style.left),top:parseFloat(node.style.top),scale,moved:false};node.setPointerCapture(e.pointerId);node.classList.add('dragging');node.style.zIndex=++z}
stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;const dx=(e.clientX-drag.ox)/drag.scale,dy=(e.clientY-drag.oy)/drag.scale;if(Math.hypot(dx,dy)>4)drag.moved=true;drag.node.style.left=Math.max(0,Math.min(W-154,drag.left+dx))+'px';drag.node.style.top=Math.max(14,Math.min(H-55,drag.top+dy))+'px'});
stage.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;d.node.classList.remove('dragging');if(!d.moved)return;const a=d.node.getBoundingClientRect();let candidate=null,best=0;for(const other of Object.values(cards)){if(other===d.node||other.classList.contains('matched')||initial[other.dataset.id].kind===initial[d.id].kind)continue;const b=other.getBoundingClientRect(),ox=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left)),oy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)),area=ox*oy;if(area>best){best=area;candidate=other}}if(candidate&&best>Math.min(a.width*a.height,candidate.getBoundingClientRect().width*candidate.getBoundingClientRect().height)*.18)combine(d.node,candidate)});
function combine(a,b){const ai=initial[a.dataset.id],bi=initial[b.dataset.id];if(ai.kind===bi.kind)return;const def=ai.kind==='definition'?a:b,term=ai.kind==='term'?a:b,good=initial[def.dataset.id].match===term.dataset.id;const pos={x:Math.max(5,Math.min(W-164,(parseFloat(def.style.left)+parseFloat(term.style.left))/2)),y:Math.max(20,Math.min(H-120,(parseFloat(def.style.top)+parseFloat(term.style.top))/2))};a.classList.add('matched');b.classList.add('matched');const pair=document.createElement('div');pair.className='pair '+(good?'good':'bad');pair.style.left=pos.x+'px';pair.style.top=pos.y+'px';pair.style.zIndex=++z;pair.innerHTML=`<div class="item definition"><span class="pin"></span>${initial[def.dataset.id].label}</div><div class="bridge"></div><div class="item term"><span class="pin"></span>${initial[term.dataset.id].label}</div>`;stage.append(pair);const rec={pair,a,b,good};pairs.push(rec);pair.setAttribute('title',good?'Верная пара':'Неверная пара. Нажмите, чтобы разъединить');if(!good){showNotice('Неверная пара. Нажмите на красную связку, чтобы разъединить.');pair.onclick=()=>{pair.remove();a.classList.remove('matched');b.classList.remove('matched');pairs=pairs.filter(p=>p!==rec);updateCount()}}else{updateCount();showNotice(pairs.filter(p=>p.good).length===2?'Верно! Все пары найдены.':'Верно! Пара найдена.')}}
function updateCount(){document.getElementById('count').textContent=`Найдено пар: ${pairs.filter(p=>p.good).length} из 2`}
document.getElementById('ok').onclick=()=>{overlay.hidden=true};document.getElementById('help').onclick=()=>{overlay.hidden=false};document.getElementById('reset').onclick=reset;document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await activity.requestFullscreen();else await document.exitFullscreen();fit()}catch{showNotice('Полноэкранный режим недоступен в этом браузере')}};document.addEventListener('fullscreenchange',fit);reset();
})();
</script></body></html>
