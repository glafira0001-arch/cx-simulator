<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кому написать первым?</title>
<style>
:root{
  --ink:#152238;--muted:#667085;--line:#dbe2ea;--bg:#fff;
  --accent:#2f6fd2;--accent2:#2558a8;--soft:#edf4ff;
  --ok:#147552;--oksoft:#eaf8f1;--warn:#8a5a00;--warnsoft:#fff5d6;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{
  width:100%;max-width:560px;margin:0 auto;background:var(--bg);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 6px 18px rgba(30,55,90,.08)
}
.progress{height:4px;background:#e8edf5}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.head{
  padding:13px 15px 11px;
  background:linear-gradient(135deg,var(--accent2),#347bdc);
  color:#fff
}
.kicker{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.82}
h2{font-size:19px;line-height:1.15;margin:4px 0 4px}
.lead{font-size:12px;line-height:1.35;margin:0;opacity:.92}
.body{padding:12px 15px 14px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.badge{
  display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;
  background:#eef2f7;color:#475467;font-size:10px;font-weight:800
}
.dots{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:#d9e0ea}
.dot.done{background:var(--accent)}
.case{
  border:1px solid var(--line);border-radius:10px;padding:8px 9px;
  background:#f8fafc;font-size:11.5px;line-height:1.35
}
.question{font-size:13px;font-weight:800;line-height:1.3;margin:9px 0 6px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choice{
  width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px;text-align:left;cursor:pointer;
  font-size:11.5px;line-height:1.28;transition:.12s
}
.choice:hover{border-color:#9db8e5}
.choice.selected{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent) inset}
.actions{display:flex;gap:7px;margin-top:10px}
.primary,.secondary{
  border:0;border-radius:9px;padding:8px 10px;font-weight:800;
  cursor:pointer;font-size:11.5px
}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#eef1f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{
  display:none;margin-top:8px;border-radius:9px;padding:8px 9px;
  font-size:11.5px;line-height:1.35
}
.feedback.show{display:block}
.feedback.ok{background:var(--oksoft);color:#0c5a3f}
.feedback.warn{background:var(--warnsoft);color:#6e4900}
.result{
  display:none;border:1px solid var(--line);border-radius:10px;
  padding:9px;background:#fafcff;margin-top:8px
}
.result.show{display:block}
.result-title{font-size:11px;font-weight:800;margin-bottom:5px}
.result-line{font-size:11px;line-height:1.35;padding:4px 0;border-bottom:1px dashed #e0e5ec}
.result-line:last-child{border-bottom:0}
@media(max-width:430px){
  .options{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:11px;padding-right:11px}
}
</style>
</head>
<body>
<div class="task" id="firstClientsTask">
  <div class="progress"><div data-role="bar"></div></div>

  <div class="head">
    <div class="kicker">Практическое задание</div>
    <h2>Кому написать первым?</h2>
    <p class="lead">Соберите стратегию первых заказов без спама, навязчивости и потери доверия.</p>
  </div>

  <div class="body">
    <div class="topline">
      <span class="badge" data-role="step"></span>
      <div class="dots" data-role="dots"></div>
    </div>

    <div class="case" data-role="case"></div>
    <div class="question" data-role="question"></div>
    <div class="options" data-role="options"></div>

    <div class="result" data-role="result"></div>

    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Сбросить</button>
      <button type="button" class="primary" data-role="next" disabled>Продолжить</button>
    </div>

    <div class="feedback" data-role="fb"></div>
  </div>
</div>

<script>
(() => {
  const root = document.getElementById('firstClientsTask');
  if (!root) return;

  const steps = [
    {
      label: 'Первый круг',
      case: 'Вы только закончили обучение. Отзывов и постоянных клиентов пока нет.',
      question: 'Кому лучше сообщить о новой услуге первым?',
      correct: 1,
      options: [
        'Случайным людям из чужих чатов',
        'Знакомым, родственникам и подписчикам личной страницы',
        'Только крупным компаниям',
        'Никому, пока не появятся отзывы'
      ]
    },
    {
      label: 'Сообщение',
      case: 'Нужно рассказать о новой квалификации без ощущения навязчивой рекламы.',
      question: 'Как сформулировать сообщение?',
      correct: 2,
      options: [
        '«Срочно закажите ремонт у меня!»',
        '«Мне очень нужны деньги, помогите заказом»',
        '«Я прошел обучение и теперь принимаю заказы как частный мастер. Буду благодарен за рекомендацию»',
        'Разослать только прайс без пояснений'
      ]
    },
    {
      label: 'Районный чат',
      case: 'Вы вступили в чат своего дома или соседнего жилого комплекса.',
      question: 'Как вести себя в чате?',
      correct: 0,
      options: [
        'Один раз представить услугу по правилам чата и отвечать на реальные запросы соседей',
        'Публиковать объявление каждый день',
        'Писать всем участникам в личные сообщения',
        'Спорить с другими мастерами'
      ]
    },
    {
      label: 'Первый заказ',
      case: 'Сосед готов вызвать вас, но у вас еще мало практики и отзывов.',
      question: 'Какое предложение выглядит честно?',
      correct: 3,
      options: [
        'Сделать любую работу бесплатно',
        'Назвать нулевую цену, а потом увеличить ее',
        'Не обсуждать стоимость до конца ремонта',
        'Предложить прозрачную стартовую скидку или понятные условия диагностики'
      ]
    },
    {
      label: 'Рекомендация',
      case: 'Ремонт завершен, клиент доволен результатом.',
      question: 'Как попросить о рекомендации?',
      correct: 1,
      options: [
        'Самостоятельно написать отзыв от имени клиента',
        'Попросить короткий честный отзыв или рекомендацию в домовом чате',
        'Требовать видеоотзыв как условие скидки',
        'Добавить клиента в рекламную рассылку без согласия'
      ]
    }
  ];

  let index = 0;
  let selected = null;
  let score = 0;
  const answers = [];

  const q = role => root.querySelector(`[data-role="${role}"]`);

  function render() {
    const step = steps[index];
    selected = null;

    q('bar').style.width = `${index / steps.length * 100}%`;
    q('step').textContent = `${index + 1} из ${steps.length}`;
    q('dots').innerHTML = steps
      .map((_, i) => `<span class="dot ${i <= index ? 'done' : ''}"></span>`)
      .join('');

    q('case').textContent = step.case;
    q('question').textContent = step.question;
    q('options').style.display = 'grid';
    q('options').innerHTML = step.options
      .map((text, i) => `<button type="button" class="choice" data-option="${i}">${text}</button>`)
      .join('');

    q('options').querySelectorAll('[data-option]').forEach(button => {
      button.addEventListener('click', () => {
        q('options').querySelectorAll('.choice').forEach(item => item.classList.remove('selected'));
        button.classList.add('selected');
        selected = Number(button.dataset.option);
        q('next').disabled = false;
      });
    });

    q('next').disabled = true;
    q('next').textContent = index === steps.length - 1 ? 'Собрать стратегию' : 'Продолжить';
    q('fb').className = 'feedback';
    q('result').className = 'result';
  }

  q('next').addEventListener('click', () => {
    const step = steps[index];

    answers.push({
      label: step.label,
      text: step.options[selected]
    });

    if (selected === step.correct) score += 1;

    if (index < steps.length - 1) {
      index += 1;
      render();
      return;
    }

    q('bar').style.width = '100%';
    q('case').innerHTML = `Верных решений: <strong>${score} из ${steps.length}</strong>.`;
    q('question').textContent = '';
    q('options').style.display = 'none';

    q('result').className = 'result show';
    q('result').innerHTML =
      '<div class="result-title">Стратегия первых заказов</div>' +
      answers.map(item =>
        `<div class="result-line"><strong>${item.label}:</strong> ${item.text}</div>`
      ).join('');

    q('fb').className = `feedback show ${score === steps.length ? 'ok' : 'warn'}`;
    q('fb').innerHTML = score === steps.length
      ? '<strong>Стратегия запускает сарафанное радио без навязывания.</strong><br>Вы опираетесь на доверие, локальные контакты, прозрачные условия и честные отзывы.'
      : '<strong>Часть решений может выглядеть как спам или обесценивание своей работы.</strong><br>Начинайте с теплого круга, пишите один раз и заранее объясняйте условия.';

    q('next').disabled = true;
    q('next').textContent = 'Готово';
  });

  q('reset').addEventListener('click', () => {
    index = 0;
    selected = null;
    score = 0;
    answers.length = 0;
    render();
  });

  render();
})();
</script>
</body>
</html>
