<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сэндвич отказа</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:92%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="sandwichTask">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Эмпатичное «нет»</div>
    <h2>Соберите отказ по формуле «сэндвича»</h2>
    <p class="lead">На каждом шаге выберите одну фразу. В конце получится готовый ответ.</p>
  </div>
  <div class="body">
    <div class="statement">Коллега просит вечером срочно помочь с отчетом к завтрашней встрече. Ваш график уже заполнен.</div>
    <div class="small" data-role="prompt" style="margin:8px 0 5px"></div>
    <div class="grid2" data-role="options"></div>
    <div class="card hidden" data-role="result" style="margin-top:8px">
      <strong style="font-size:12px">Собранный ответ</strong>
      <div class="summary" data-role="assembled" style="margin-top:5px"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Продолжить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('sandwichTask');
  if (!root) return;

  const stages=[
    {
      name:'Признание',
      options:[
        {text:'«Я понимаю, что отчет важен для завтрашней встречи».',correct:true},
        {text:'«Да ладно, там же простая задачка».',correct:false},
        {text:'«Мне тоже сейчас очень тяжело».',correct:false}
      ]
    },
    {
      name:'Четкий отказ',
      options:[
        {text:'«Но, наверное, я попробую что-нибудь придумать».',correct:false},
        {text:'«И сегодня мой график полностью занят, поэтому я не смогу подключиться».',correct:true},
        {text:'«Извини, извини, я ужасно виноват, но не смогу».',correct:false}
      ]
    },
    {
      name:'Доброе пожелание',
      options:[
        {text:'«Надеюсь, ты найдешь решение и встреча пройдет хорошо».',correct:true},
        {text:'«Могу еще поискать тебе исполнителя и проверить итог».',correct:false},
        {text:'«Ну, удачи тебе с этим проектиком».',correct:false}
      ]
    }
  ];
  let index=0,selected=null,score=0,chosen=[];
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function render(){
    const stage=stages[index];
    selected=null;
    q('bar').style.width=`${index/stages.length*100}%`;
    q('prompt').textContent=`Шаг ${index+1}: ${stage.name}`;
    q('options').innerHTML=stage.options.map((o,i)=>
      `<button type="button" class="choice" data-option="${i}">${o.text}</button>`
    ).join('');
    q('options').querySelectorAll('[data-option]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('options').querySelectorAll('[data-option]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        selected=Number(btn.dataset.option);
        q('next').disabled=false;
      });
    });
    q('next').disabled=true;
    q('next').textContent=index===stages.length-1?'Собрать ответ':'Продолжить';
    q('fb').className='feedback';
  }
  q('next').addEventListener('click',()=>{
    if(selected===null)return;
    const option=stages[index].options[selected];
    if(option.correct)score++;
    chosen.push(option.text);
    if(index<stages.length-1){index++;render();}
    else{
      q('bar').style.width='100%';
      q('options').classList.add('hidden');
      q('prompt').classList.add('hidden');
      q('result').classList.remove('hidden');
      q('assembled').textContent=chosen.join(' ');
      q('fb').className=`feedback show ${score===stages.length?'ok':'warn'}`;
      q('fb').innerHTML=score===stages.length
        ? '<strong>Сэндвич собран правильно.</strong><br>Есть признание, твердый отказ и доброжелательное завершение — без «но», оправданий и дополнительных обязательств.'
        : `<strong>Верно выбрано: ${score} из ${stages.length} частей.</strong><br>Не добавляйте смягчающие обещания, лишние объяснения и новую помощь после отказа.`;
      q('next').disabled=true;
      q('next').textContent='Готово';
    }
  });
  q('reset').addEventListener('click',()=>{
    index=0;selected=null;score=0;chosen=[];
    q('options').classList.remove('hidden');
    q('prompt').classList.remove('hidden');
    q('result').classList.add('hidden');
    render();
  });
  render();

})();
</script>
</body>
</html>
