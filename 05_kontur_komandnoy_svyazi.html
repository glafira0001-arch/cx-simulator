<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Контур командной обратной связи: разделите уровни</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:15px;line-height:1.42}.task{width:100%;max-width:560px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.04)}h2{font-size:19px;line-height:1.25;margin:0 0 8px}p{margin:0 0 10px}.case{background:#f1f5f9;border-radius:10px;padding:11px;margin:10px 0 12px}.step{font-size:12px;color:#64748b;margin:0 0 8px}.progress{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;background:#2563eb;transition:width .2s}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn:disabled{opacity:.4;cursor:default}.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:9px;font-size:14px}.feedback.ok{display:block;background:#ecfdf5;border:1px solid #86efac}.feedback.bad{display:block;background:#fff7ed;border:1px solid #fdba74}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;margin:7px 0}.option:hover,.option.selected{background:#eff6ff;border-color:#60a5fa}.mini{font-size:13px;color:#64748b}.grid{display:grid;gap:8px}.row{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff}.row b{display:block;margin-bottom:5px}.select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.checkline{display:flex;gap:8px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff;margin:7px 0;cursor:pointer}.checkline input{margin-top:3px}.bubble{border-radius:12px;padding:10px 11px;margin:8px 0}.bubble.emp{background:#eef2ff}.bubble.mgr{background:#f8fafc;border:1px solid #dbe2ea}.builder{display:grid;gap:8px}.slot{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#f8fafc}.slot b{display:block;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 9px;font:inherit;cursor:pointer;text-align:left}.chip.selected{background:#eff6ff;border-color:#60a5fa}.chip.used{opacity:.35}.quote{padding:10px;border-left:3px solid #94a3b8;background:#f8fafc;border-radius:0 8px 8px 0;margin:8px 0}.hidden{display:none!important}.badge{display:inline-block;border-radius:999px;padding:2px 7px;font-size:12px;background:#e2e8f0;color:#475569;margin-left:4px}.choice3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.choice3 button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 5px;font:inherit;font-size:13px;cursor:pointer}.choice3 button.selected{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;font-weight:700}.dialog{display:grid;gap:7px}.line{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff;cursor:pointer}.line.selected{background:#fff7ed;border-color:#fb923c}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.zone{border:1px dashed #94a3b8;border-radius:10px;padding:8px;min-height:94px;background:#f8fafc}.zone h4{margin:0 0 6px;font-size:14px}.item{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}.item.active{outline:2px solid #60a5fa}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tri .zone{min-height:76px}.smallbtn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 7px;font:inherit;font-size:13px;cursor:pointer}.smallbtn.selected{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;font-weight:700}@media(max-width:430px){.choice3,.tri{grid-template-columns:1fr}.board{grid-template-columns:1fr}}</style></head><body><main class="task"><section class="card"><h2>Контур командной обратной связи: разделите уровни</h2><div class="case">Разложите факты по трем уровням: результат, процесс и персональное действие. Затем определите, что обсуждать при команде, а что вынести один на один.</div><div class="progress"><span id="bar"></span></div><div class="step" id="lab"></div><div id="screen"></div><div class="controls"><button class="btn ghost" id="back">Назад</button><button class="btn primary" id="check">Проверить ответ</button><button class="btn secondary" id="reset">Начать заново</button></div><div class="feedback" id="fb"></div></section></main><script>let step=0;let labls=[null,null,null,null,null],ans=null,opts=[];const s=document.getElementById('screen'),fb=document.getElementById('fb'),bar=document.getElementById('bar'),lab=document.getElementById('lab'),back=document.getElementById('back'),check=document.getElementById('check'),reset=document.getElementById('reset');const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const data=[
{t:'Запуск состоялся на 8 дней позже плана.',ok:'res'},
{t:'У команды не было общего критерия, когда риск нужно эскалировать.',ok:'proc'},
{t:'После официального сообщения о срыве Сергей еще два дня никого не предупредил.',ok:'pers'},
{t:'Требования дважды менялись после начала разработки.',ok:'proc'},
{t:'Клиент получил ответ через три дня вместо одного.',ok:'res'}];const names={res:'Результат',proc:'Процесс',pers:'Персональное'};
function render(){fb.className='feedback';fb.textContent='';bar.style.width=step===0?'50%':'100%';lab.textContent=step===0?'Шаг 1 из 2 — разложите факты по уровням':'Шаг 2 из 2 — определите границу общей встречи';back.disabled=step===0;if(step===0){s.innerHTML='<div class="grid">'+data.map((d,i)=>`<div class="row"><b>${d.t}</b><div class="choice3">${Object.entries(names).map(([v,n])=>`<button data-i="${i}" data-v="${v}" class="${labls[i]===v?'selected':''}">${n}</button>`).join('')}</div></div>`).join('')+'</div>';s.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{labls[+x.dataset.i]=x.dataset.v;render()})}else{if(!opts.length)opts=shuffle([{t:'На общей встрече подробно разобрать, почему Сергей ждал два дня, чтобы команда увидела пример.',ok:false},{t:'На общей встрече исправить правило эскалации, а персональный эпизод Сергея вынести в разговор один на один.',ok:true},{t:'Не обсуждать процесс, пока Сергей не признает личную ответственность.',ok:false},{t:'Обсудить только результат и не искать причины, чтобы избежать конфликта.',ok:false}]);s.innerHTML='<div class="quote">Выяснилось одновременно: общего правила эскалации нет, а один сотрудник после однозначного сигнала о срыве еще два дня молчал.</div>'+opts.map((o,i)=>`<button class="option ${ans===i?'selected':''}" data-o="${i}">${o.t}</button>`).join('');s.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{ans=+x.dataset.o;render()})}}
check.onclick=()=>{if(step===0){if(labls.some(x=>x===null)){fb.className='feedback bad';fb.textContent='Разнесите все факты по трем уровням.';return}if(labls.some((x,i)=>x!==data[i].ok)){fb.className='feedback bad';fb.textContent='Результат описывает общий итог, процесс — правила и организацию работы, персональное — конкретное действие отдельного сотрудника.';return}fb.className='feedback ok';fb.textContent='Верно. Вы отделили системный материал для команды от индивидуального эпизода.';setTimeout(()=>{step=1;render()},650)}else{if(ans===null){fb.className='feedback bad';fb.textContent='Выберите границу обсуждения.';return}if(opts[ans].ok){fb.className='feedback ok';fb.textContent='Верно. На общей встрече меняют процесс, а личную ответственность разбирают без публичного обсуждения мотивов сотрудника.'}else{fb.className='feedback bad';fb.textContent='Командная встреча не должна становиться публичным персональным разбором и не должна скрывать системную проблему.'}}};back.onclick=()=>{if(step){step=0;ans=null;opts=[];render()}};reset.onclick=()=>{step=0;labls=[null,null,null,null,null];ans=null;opts=[];render()};render();</script></body></html>
