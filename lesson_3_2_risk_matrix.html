<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Матрица рисков</title><style>
:root{--bg:#fff;--text:#202733;--muted:#707784;--line:#d9dde4;--soft:#f3f5f7;--dark:#303744;--ok:#eef6f0;--okb:#cfe2d3;--bad:#fbf0ef;--badb:#ead0cd}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text)}body{display:flex;justify-content:center;padding:8px}.app{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:18px;line-height:1.2}h2{margin:0 0 7px;font-size:18px}.counter{font-size:12px;color:var(--muted);white-space:nowrap}.progress{display:flex;gap:5px;margin-top:9px}.progress i{flex:1;height:5px;border-radius:999px;background:var(--soft)}.progress i.active{background:var(--dark)}.progress i.done{background:#a8afb9}.main{padding:12px 16px 14px}.card{background:var(--soft);border-radius:10px;padding:10px 11px;margin-bottom:10px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:4px}.text{font-size:13.5px;line-height:1.35;font-weight:700}.context{font-size:11px;line-height:1.4;color:var(--muted);margin-top:6px}.options{display:grid;gap:6px}.option{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:12px;line-height:1.3;cursor:pointer;text-align:left}.option.selected{border-color:#7e8794;background:#f7f8fa}.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 8px;font-size:11px;line-height:1.25;cursor:pointer}.pill.selected{background:var(--dark);color:#fff;border-color:var(--dark)}.selectrow{display:grid;grid-template-columns:145px 1fr;gap:7px;align-items:center;margin-bottom:7px}.selectrow label{font-size:11.5px;font-weight:700;line-height:1.25}select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12px;background:#fff;color:var(--text);outline:none}select{height:35px;padding:0 8px}textarea{m </style></head><body><div class="app">

<section class="finish" id="finish"><h2>Готово</h2><p>Вы завершили практику. Можно вернуться к последнему экрану или начать задание заново.</p><div class="finish-actions"><button class="secondary" id="returnBtn">Вернуться</button><button class="primary" id="restartBtn">Начать заново</button></div></section>

<script>

t": "manual"}, {"key": "r", "label": "Реакция", "options": [{"id": "reserve", "text": "Резервный маршрут для исключений"}, {"id": "full", "text": "Массовый запуск"}, {"id": "hide", "text": "Не считать показатель"}], "correct": "reserve"}, {"key": "o", "label": "Владелец", "options": [{"id": "sys", "text": "Владелец информационной системы"}, {"id": "all", "text": "Все руководители"}, {"id": "client", "text": "Клиент"}], "correct": "sys"}], "success": "Верно. Профилактика снижает вероятность, резервный маршрут — ущерб."}, {"type": "grid", "title": "Риск: ручное распределение", "prompt": "Назначьте профилактику, сигнал, реакцию и владельца.", "fields": [{"key": "p", "label": "Профилактика", "options": [{"id": "rule", "text": "Закрепить полномочия и убрать двойной учет"}, {"id": "report", "text": "Добавить еще один отчет"}, {"id": "bonus", "text": "Сразу менять премию"}], "correct": "rule"}, {"key": "s", "label": "Сигнал", "options": [{"id": "outside", "text": "Доля задач, назначенных вне очереди"}, {"id": "mood", "text": "Настроение"}, {"id": "hours", "text": "Длительность совещаний"}], "correct": "outside"}, {"key": "r", "label": "Реакция", "options": [{"id": "stop", "text": "Остановить параллельный процесс и разобрать исключения"}, {"id": "ignore", "text": "Не вмешиваться"}, {"id": "manual", "text": "Усилить ручное распределение"}], "correct": "stop"}, {"key": "o", "label": "Владелец", "options": [{"id": "dept", "text": "Руководитель отдела"}, {"id": "team", "text": "Проектная команда"}, {"id": "none", "text": "Никто"}], "correct": "dept"}], "success": "Верно. Владелец отвечает за своевременный запуск реакции, а не за все действия лично."}, {"type": "grid", "title": "Редкий тяжелый риск", "prompt": "Соберите защитный сценарий для редкого сбоя с потерей части очереди.", "fields": [{"key": "p", "label": "Профилактика", "options": [{"id": "backup", "text": "Проверить резервное копирование и восстановление"}, {"id": "ignore", "text": "Не тратить время"}, {"id": "meet", " const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function sameSet(a,b){if(a.length!==b.length)return false;const A=[...a].sort(),B=[...b].sort();return A.every((x,i)=>x===B[i])}
function render(){const s=CONFIG.screens[idx],st=states[idx];$('counter').textContent=`${idx+1} из ${CONFIG.screens.length}`;$('progress').innerHTML=CONFIG.screens.map((_,i)=>`<i class="${i===idx?'active':states[i].checked?'done':''}"></i>`).join('');$('title').textContent=s.title||CONFIG.title;$('prompt').textContent=s.prompt;$('context').textContent=s.context||'';$('context').style.display=s.context?'block':'none';$('answerArea').innerHTML='';
if(s.type==='single'){$('answerArea').innerHTML=`<div class="options">${s.options.map(o=>`<button class="option ${st.value===o.id?'selected':''}" data-single="${esc(o.id)}">${esc(o.text)}</button>`).join('')}</div>`;document.querySelectorAll('[data-single]').forEach(b=>b.onclick=()=>{st.value=b.dataset.single;st.checked=false;render()})}
if(s.type==='multi'){const lim=s.limit||s.correct.length;$('answerArea').innerHTML=`<div class="pills">${s.options.map(o=>`<button class="pill ${st.value.includes(o.id)?'selected':''}" data-multi="${esc(o.id)}">${esc(o.text)}</button>`).join('')}</div><div class="note">Выберите ${lim}.</div>`;document.querySelectorAll('[data-multi]').forEach(b=>b.onclick=()=>{const id=b.dataset.multi;if(st.value.includes(id))st.value=st.value.filter(x=>x!==id);else if(st.value.length<lim)st.value=[...st.value,id];st.checked=false;render()})}
if(s.type==='grid'){$('answerArea').innerHTML=s.fields.map(f=>{const v=st.value[f.key]||'';return `<div class="selectrow"><label>${esc(f.label)}</label><select data-grid="${esc(f.key)}"><option value="">Выберите</option>${f.options.map(o=>`<option value="${esc(o.id)}" ${v===o.id?'selected':''}>${esc(o.text)}</option>`).join('')}</select></div>`}).join('');document.querySelectorAll('[data-grid]').forEach(sel=>sel.onchange=()=>{st.value[sel.dataset.grid]=sel.value;st.checked=false;render()})}
if(s.type==='open'){$('answerArea').innerHTML=`<textarea id="openText" placeholder="${esc(s.placeholder||'Введите ответ')}">${esc(st.value||'')}</textarea><div class="note">${esc(s.note||'')}</div>`;$('openText').oninput=e=>{st.value=e.target.value;st.checked=false;hideFeedbackOnly()}}
$('prevBtn').disabled=idx===0;$('exampleBtn').style.display=s.example?'block':'none';if(st.checked){showFeedback(s.success||'Верно. Обратная связь останется на экране, пока вы сами не нажмете «Дальше».',true);$('nextRow').classList.remove('hidden')}else{hideFeedbackOnly()}$('nextBtn').textContent=idx===CONFIG.screens.length-1?'Завершить':'Дальше'}
function hideFeedbackOnly(){$('feedback').className='feedback';$('feedback').textContent='';$('nextRow').classList.add('hidden')}
function validate(s,st){if(s.type==='single')return st.value===s.correct;if(s.type==='multi')return sameSet(st.value,s.correct);if(s.type==='grid')return s.fields.every(f=>st.value[f.key]===f.correct);if(s.type==='open'){const t=(st.value||'').trim();if(t.length<(s.minLength||35))return false;if(s.forbidden&&s.forbidden.some(x=>t.toLowerCase().includes(x.toLowerCase())))return false;return true}return false}
function check(){const s=CONFIG.screens[idx],st=states[idx];if(validate(s,st)){st.checked=true;showFeedback(s.success||'Верно. Прочитайте обратную связь и переходите дальше, когда будете готовы.',true);$('nextRow').classList.remove('hidden');$('progress').innerHTML=CONFIG.screens.map((_,i)=>`<i class="${i===idx?'active':states[i].checked?'done':''}"></i>`).join('')}else{st.checked=false;showFeedback(s.fail||'Есть неточность. Перепроверьте ответ или откройте пример.',false);$('nextRow').classList.add('hidden')}}
function showFeedback(t,ok){$('feedback').textContent=t;$('feedback').className='feedback show '+(ok?'ok':'bad')}
$('checkBtn').onclick=check;$('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};$('nextBtn').onclick=()=>{if(!states[idx].checked)return;if(idx<CONFIG.screens.length-1){idx++;render()}else finish()};$('exampleBtn').onclick=()=>{const s=CONFIG.screens[idx];$('modalTitle').textContent=s.exampleTitle||'Разбор';$('exampleText').innerHTML=s.example||'';$('modal').classList.add('show')};$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};function finish(){$('task').style.display='none';$('finish').classList.add('show')}$('returnBtn').onclick=()=>{$('finish').classList.remove('show');$('task').style.display='block';idx=CONFIG.screens.length-1;render()};$('restartBtn').onclick=()=>{states.forEach((st,i)=>{st.value=CONFIG.screens[i].type==='multi'?[]:CONFIG.screens[i].type==='grid'?{}:'';st.checked=false});idx=0;$('finish').classList.remove('show');$('task').style.display='block';render()};render();
</script>
