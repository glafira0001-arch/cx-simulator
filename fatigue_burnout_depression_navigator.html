<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Навигатор состояния</title><style>
:root{--ink:#172033;--muted:#667085;--line:#d9e0e8;--accent:#4658d6;--soft:#eef1ff;--ok:#147552;--oksoft:#eaf8f1;--bad:#b42318;--badsoft:#fff0ee;--warn:#936500;--warnsoft:#fff7dc;--urgent:#7a271a;--urgentsoft:#fff1ef}
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}.body{padding:12px 15px 14px}
.card,.row-card,.zone{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.row-card+.row-card{margin-top:7px}.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button,input{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;font-size:12px;line-height:1.3}
.selected{border-color:var(--accent)!important;background:var(--soft)!important;box-shadow:0 0 0 1px var(--accent) inset}.good{border-color:var(--ok)!important;background:var(--oksoft)!important}.bad{border-color:var(--bad)!important;background:var(--badsoft)!important}
.actions{display:flex;gap:7px;margin-top:11px}.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#edf0f5;color:var(--ink)}.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}.feedback.show{display:block}.feedback.ok{background:var(--oksoft);color:#0c5a3f}.feedback.warn{background:var(--warnsoft);color:#704d00}.feedback.urgent{background:var(--urgentsoft);color:var(--urgent)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;color:#475467;font-size:10px;font-weight:800}.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}.hidden{display:none!important}
.range-row{display:grid;grid-template-columns:76px 1fr 28px;gap:8px;align-items:center}input[type=range]{width:100%}.chart{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;height:95px;align-items:end;margin-top:8px}.bar-wrap{height:100%;display:flex;align-items:flex-end}.bar{width:100%;min-height:6px;background:var(--accent);border-radius:5px 5px 2px 2px}.labels{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:3px}.labels span{font-size:8px;color:var(--muted);text-align:center}
.zone{min-height:76px;background:#fafbfc;cursor:pointer}.zone-title{font-size:10px;font-weight:800;line-height:1.25;margin-bottom:5px}.zone-list{display:flex;flex-direction:column;gap:4px}.chip{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-size:10px;line-height:1.25;cursor:pointer}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0}.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr}.range-row{grid-template-columns:62px 1fr 24px}.task{border-radius:12px}.head,.body{padding-left:12px;padding-right:12px}}
</style></head><body><div class="task" id="navigatorTask">
<div class="progress"><div data-role="bar"></div></div><div class="head"><div class="kicker">Итоговая самопроверка</div><h2>Пройдите навигатор следующего шага</h2><p class="lead">Ответьте на четыре вопроса. Навигатор не определяет диагноз, а подсказывает безопасный уровень действий.</p></div>
<div class="body"><div class="card"><span class="badge" data-role="step"></span><p data-role="question" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p></div>
<div class="grid2" data-role="options" style="margin-top:7px"></div>
<div class="actions"><button type="button" class="secondary" data-role="reset">Начать заново</button><button type="button" class="primary" data-role="next" disabled>Продолжить</button></div><div class="feedback" data-role="fb"></div></div>
</div><script>(()=>{const root=document.getElementById('navigatorTask');if(!root)return;
const questions=[
{text:'Состояние заметно улучшается после сна, снижения нагрузки и спокойного отдыха?',options:[{text:'Да',value:'yes'},{text:'Нет или почти нет',value:'no'}]},
{text:'Основные раздражение, цинизм и ощущение неэффективности связаны именно с работой?',options:[{text:'Да, преимущественно с работой',value:'yes'},{text:'Нет, состояние затрагивает все сферы',value:'no'}]},
{text:'Сниженное настроение или потеря интереса держатся большую часть дня почти ежедневно около двух недель или дольше?',options:[{text:'Да',value:'yes'},{text:'Нет',value:'no'}]},
{text:'Есть мысли о смерти, самоповреждении или непосредственная опасность для себя?',options:[{text:'Да',value:'yes'},{text:'Нет',value:'no'}]}];
let index=0,selected=null,answers=[];const q=r=>root.querySelector(`[data-role="${r}"]`);
function render(){const item=questions[index];selected=null;q('bar').style.width=`${index/questions.length*100}%`;q('step').textContent=`Вопрос ${index+1} из ${questions.length}`;q('question').textContent=item.text;q('options').classList.remove('hidden');q('options').innerHTML=item.options.map((o,i)=>`<button type="button" class="choice" data-option="${i}">${o.text}</button>`).join('');q('options').querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>{q('options').querySelectorAll('button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');selected=Number(btn.dataset.option);q('next').disabled=false;}));q('next').disabled=true;q('next').textContent=index===questions.length-1?'Показать следующий шаг':'Продолжить';q('fb').className='feedback';}
q('next').addEventListener('click',()=>{if(selected===null)return;answers.push(questions[index].options[selected].value);if(index<questions.length-1){index++;render();return;}q('bar').style.width='100%';q('options').classList.add('hidden');q('next').disabled=true;q('next').textContent='Готово';const [restHelps,workLinked,longMood,urgent]=answers;if(urgent==='yes'){q('fb').className='feedback show urgent';q('fb').innerHTML='<strong>Нужна срочная помощь.</strong><br>Не оставайтесь с этим в одиночку: обратитесь в экстренную службу или к доступному медицинскому специалисту и сообщите человеку, которому доверяете.';}else if(longMood==='yes'||(restHelps==='no'&&workLinked==='no')){q('fb').className='feedback show warn';q('fb').innerHTML='<strong>Нужна профессиональная оценка состояния.</strong><br>Симптомы длительны или затрагивают разные сферы жизни. Запишитесь к врачу или специалисту по психическому здоровью.';}else if(workLinked==='yes'&&restHelps==='no'){q('fb').className='feedback show warn';q('fb').innerHTML='<strong>Есть риск рабочего выгорания.</strong><br>Сделайте нагрузку прозрачной, сократите необязательные задачи и обсудите изменение условий или поддержку. При выраженных симптомах обратитесь к специалисту.';}else{q('fb').className='feedback show ok';q('fb').innerHTML='<strong>Состояние больше похоже на временное истощение.</strong><br>Запланируйте сон, снижение информационной нагрузки и спокойное восстановление. Если улучшения нет или состояние ухудшается, обратитесь к врачу.';}});
q('reset').addEventListener('click',()=>{index=0;selected=null;answers=[];q('options').classList.remove('hidden');q('fb').className='feedback';render();});render();
})();</script></body></html>
