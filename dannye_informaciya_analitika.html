<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Данные, информация и аналитика — интерактивное задание</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#292929}body{background:#fff}.stage{width:100%;min-height:590px;position:relative;overflow:hidden;background:#fff1be;background-image:radial-gradient(ellipse at 20% 25%,#fff8dc70 0,transparent 35%),radial-gradient(circle at 76% 76%,#d8b76e21 0,transparent 22%)}.zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.zone{height:100%;position:relative}.zone:nth-child(1){background:#b9db995c}.zone:nth-child(2){background:#ffe6a16a}.zone:nth-child(3){background:#ffc18b83}.zone-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(19px,3.4vw,30px);font-weight:400;white-space:nowrap;pointer-events:none;z-index:0}.cards{position:absolute;inset:0;z-index:2}.card{position:absolute;width:clamp(123px,19%,178px);min-height:45px;border:1px solid #e7e7e7;background:white;border-radius:15px;box-shadow:0 4px 9px #0003;display:flex;justify-content:center;align-items:center;text-align:center;padding:12px 9px 10px;font-size:clamp(12px,1.65vw,15px);line-height:1.2;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .15s,border-color .15s;z-index:1}.card:active{cursor:grabbing}.card.dragging{z-index:8;box-shadow:0 8px 22px #0005}.pin{position:absolute;top:-10px;left:calc(50% - 9px);width:18px;height:18px;border-radius:100%;box-shadow:0 2px 5px #0003;pointer-events:none}.card.correct{border:4px solid #7be891;padding:9px 6px 7px}.card.wrong{border:3px solid #ec4f4f;padding:10px 7px 8px;background:repeating-linear-gradient(135deg,#fff,#fff 7px,#ffebeb 7px,#ffebeb 13px)}.tool{position:absolute;top:8px;z-index:22;border:0;background:transparent;cursor:pointer;padding:3px;line-height:1;font-size:23px}.help{left:7px;color:#189844;text-shadow:1px 1px #fff}.full{right:7px;color:#f36d68}.check{position:absolute;bottom:17px;right:16px;width:52px;height:52px;border-radius:50%;border:0;background:#298cde;color:white;font-weight:bold;font-size:23px;box-shadow:0 3px 7px #0003;cursor:pointer;z-index:21}.footer{position:absolute;left:15px;bottom:14px;z-index:20;display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-right:72px}.action{border:1px solid #aac1c9;background:#fffdf3;border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer}.action:hover{background:#f4f8fa}.status{background:#ffffffed;border-radius:8px;padding:8px 11px;font-size:13px;max-width:380px}.overlay{position:fixed;inset:0;background:#0004;z-index:100;display:flex;align-items:center;justify-content:center;padding:15px}.overlay[hidden]{display:none}.dialog{background:#f5f5f5;border:10px solid #cfcfcf;border-radius:14px;width:min(530px,96vw);padding:18px 16px 14px;box-shadow:0 4px 19px #0007}.dialog h2{text-align:center;font-size:22px;margin:0 0 12px}.dialog p{font-size:16px;line-height:1.45;margin:0 0 16px}.dialog button{display:block;margin:auto;border:1px solid #777;background:#eee;font-size:17px;padding:5px 16px;cursor:pointer}.stage:fullscreen{height:100vh!important;min-height:100vh}.stage:fullscreen .card{font-size:clamp(15px,1.3vw,22px);width:clamp(160px,17%,245px);min-height:60px}.stage:fullscreen .zone-label{font-size:clamp(24px,2.6vw,42px)}.stage:fullscreen .check{width:65px;height:65px;font-size:29px}@media(max-width:600px){.stage{min-height:560px}.card{width:29%;font-size:12px;min-height:46px;padding:12px 5px 8px}.zone-label{font-size:20px}.footer{bottom:10px}.check{bottom:12px;right:10px;width:44px;height:44px}} 
</style></head><body>
<main id="stage" class="stage" aria-label="Задание по распределению вопросов"><div class="zones"><section class="zone"><div class="zone-label">Данные</div></section><section class="zone"><div class="zone-label">Информация</div></section><section class="zone"><div class="zone-label">Аналитика</div></section></div><div id="cards" class="cards"></div><button class="tool help" id="help" aria-label="Посмотреть задание" title="Посмотреть задание">❔</button><button class="tool full" id="full" aria-label="На весь экран" title="На весь экран">⛶</button><div class="footer"><button class="action" id="retry" hidden>Попробовать снова</button><button class="action" id="reset">Начать заново</button><span id="status" class="status" hidden></span></div><button class="check" id="check" title="Проверить ответы" aria-label="Проверить ответы">☑</button></main>
<div class="overlay" id="modal"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="taskTitle"><h2 id="taskTitle">Задание</h2><p>На какие вопросы отвечают данные, информация и аналитика? Перетащите вопросы на нужные поля.</p><button id="ok">OK</button></div></div>
<script>
(()=>{
const questions=[
{id:'relation',text:'«Какова взаимосвязь?»',right:2,x:31,y:14},
{id:'whenfull',text:'«Когда?» полностью',right:1,x:59,y:15},
{id:'why',text:'«Почему?»',right:2,x:49,y:29},
{id:'dynamic',text:'«Какая динамика?»',right:1,x:64,y:39},
{id:'wherepart',text:'«Где?» частично',right:0,x:15,y:46},
{id:'whatpart',text:'«Что?» частично',right:0,x:39,y:47},
{id:'whenpart',text:'«Когда?» частично',right:0,x:61,y:56},
{id:'whatfull',text:'«Что?» полностью',right:1,x:16,y:57},
{id:'howmany',text:'«Много ли это?»',right:2,x:37,y:61},
{id:'wherefull',text:'«Где?» полностью',right:1,x:53,y:72}
];
const stage=document.getElementById('stage'), layer=document.getElementById('cards'), status=document.getElementById('status'), retry=document.getElementById('retry'), check=document.getElementById('check');
const colors=['#19a859','#f74325','#329bdb'];
let positions={}, checked=false, moved=false;
function zoneOf(left,width){return Math.min(2,Math.max(0,Math.floor((left+width/2)/3*3)))}
function zoneFor(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return Math.min(2,Math.max(0,Math.floor(((r.left+r.width/2)-s.left)/(s.width/3))))}
function paint(el){el.querySelector('.pin').style.background=colors[zoneFor(el)]}
function position(el,x,y){const w=stage.clientWidth,h=stage.clientHeight;el.style.left=Math.max(0,Math.min(w-el.offsetWidth,x))+'px';el.style.top=Math.max(22,Math.min(h-el.offsetHeight-66,y))+'px';paint(el)}
function build(){checked=false;moved=false;positions={};layer.innerHTML='';status.hidden=true;retry.hidden=true;check.hidden=false;questions.forEach(q=>{const el=document.createElement('div');el.className='card';el.dataset.id=q.id;el.innerHTML='<span class="pin"></span><span>'+q.text+'</span>';layer.appendChild(el);let x=stage.clientWidth*q.x/100,y=stage.clientHeight*q.y/100;position(el,x,y);positions[q.id]={x:x/stage.clientWidth,y:y/stage.clientHeight};attachDrag(el);});}
function attachDrag(el){let drag=null;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();const bounds=stage.getBoundingClientRect();drag={id:e.pointerId,dx:e.clientX-el.getBoundingClientRect().left,dy:e.clientY-el.getBoundingClientRect().top};el.setPointerCapture(e.pointerId);el.classList.add('dragging');});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const s=stage.getBoundingClientRect();position(el,e.clientX-s.left-drag.dx,e.clientY-s.top-drag.dy);moved=true;if(checked){checked=false;el.classList.remove('correct','wrong');status.hidden=true;retry.hidden=true;check.hidden=false;layer.querySelectorAll('.card').forEach(c=>c.classList.remove('correct','wrong'))}});function finish(e){if(!drag||drag.id!==e.pointerId)return;drag=null;el.classList.remove('dragging');positions[el.dataset.id]={x:el.offsetLeft/stage.clientWidth,y:el.offsetTop/stage.clientHeight};paint(el)}el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish)}
function evaluate(){let total=0;layer.querySelectorAll('.card').forEach(el=>{const q=questions.find(q=>q.id===el.dataset.id);const good=zoneFor(el)===q.right;total+=good?1:0;el.classList.toggle('correct',good);el.classList.toggle('wrong',!good)});checked=true;status.hidden=false;status.textContent=total===questions.length?'Верно! Все 10 карточек на своих местах.':'Верно: '+total+' из 10. Красным отмечены карточки, которые нужно переместить.';retry.hidden=false;check.hidden=true;}
check.addEventListener('click',evaluate);retry.addEventListener('click',()=>{checked=false;layer.querySelectorAll('.card').forEach(c=>c.classList.remove('correct','wrong'));status.hidden=true;retry.hidden=true;check.hidden=false});document.getElementById('reset').addEventListener('click',build);
const modal=document.getElementById('modal');document.getElementById('help').addEventListener('click',()=>modal.hidden=false);document.getElementById('ok').addEventListener('click',()=>modal.hidden=true);document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch{status.hidden=false;status.textContent='Полноэкранный режим не поддерживается в этой среде.'}});
function resize(){layer.querySelectorAll('.card').forEach(el=>{let p=positions[el.dataset.id];if(p)position(el,p.x*stage.clientWidth,p.y*stage.clientHeight)})}window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',()=>setTimeout(resize,80));build();
})();
</script></body></html>
