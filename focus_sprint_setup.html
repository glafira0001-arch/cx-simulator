<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фокус-спринт</title><style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.progress{height:4px;background:#e8ebf3}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.head{padding:13px 14px 10px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:17px;line-height:1.18;margin:4px 0 4px}
.lead{font-size:12px;line-height:1.34;color:var(--muted);margin:0}
.body{padding:11px 14px 13px}
.card,.case,.result,.zone{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.case{background:#f8f9fb}
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:9.5px;line-height:1.2;padding:4px 7px;border-radius:999px;background:#eef1ff;color:#3949b8}
.question{font-size:13px;font-weight:800;line-height:1.32;margin:9px 0 6px}
.small{font-size:10.5px;line-height:1.35;color:var(--muted)}
.options,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice,.tile{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px;text-align:left;cursor:pointer;font-size:11.5px;line-height:1.3;transition:.12s}
.choice:hover,.tile:hover{border-color:#a6b0ed}
.choice.selected,.tile.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.choice.good,.tile.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad,.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:7px;margin-top:10px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer;font-size:11.5px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:8px;border-radius:9px;padding:8px 9px;font-size:11.5px;line-height:1.36}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.hidden{display:none!important}
.result{margin-top:7px;background:#fafbff}
.result-title{font-size:11px;font-weight:800;margin-bottom:5px}
.result-line{font-size:11px;line-height:1.35;padding:4px 0;border-bottom:1px dashed #e1e5eb}
.result-line:last-child{border-bottom:0}
.timer{font-size:34px;font-weight:900;text-align:center;color:var(--accent);line-height:1;margin:8px 0 4px}
.ring{width:94px;height:94px;border-radius:50%;margin:0 auto;border:8px solid #e8ebf3;display:flex;align-items:center;justify-content:center}
.ring.active{border-color:#aeb8ff;background:#f6f7ff}
.zone{min-height:84px;background:#fafbfc}
.zone-title{font-size:10px;font-weight:800;margin-bottom:5px}
.chip{font-size:10px;line-height:1.25;border:1px solid var(--line);border-radius:8px;padding:5px;background:#fff;margin-top:4px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.scale button{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
.scale button.selected{background:var(--accent-soft);border-color:var(--accent)}
.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){
  .options,.grid2,.grid3{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:11px;padding-right:11px}
}
</style></head><body>
<div class="task" id="focusTask">
<div class="head"><div class="kicker">Когнитивная нагрузка</div><h2>Настройте один фокус-спринт</h2>
<p class="lead">Выберите четыре условия, которые уменьшают переключения. Длительность спринта адаптируйте под задачу и состояние.</p></div>
<div class="body"><div class="grid2" data-role="items"></div>
<div class="question hidden" data-role="breakQ">Как провести короткий перерыв?</div><div class="options hidden" data-role="breaks"></div>
<div class="actions"><button type="button" class="secondary" data-role="reset">Сбросить</button><button type="button" class="primary" data-role="check" disabled>Проверить спринт</button></div><div class="feedback" data-role="fb"></div></div>
</div>
<script>(() => { const root=document.getElementById('focusTask'); if(!root)return; 
const items=[
 {t:'Одна конкретная задача и критерий завершения',ok:true},
 {t:'Отключенные необязательные уведомления',ok:true},
 {t:'Лист для парковки посторонних мыслей',ok:true},
 {t:'Заранее выбранная реалистичная длительность',ok:true},
 {t:'Параллельно открытые почта, чат и новости',ok:false},
 {t:'Обязательные 90 минут независимо от самочувствия',ok:false},
 {t:'Пять новых задач «на всякий случай»',ok:false},
 {t:'Проверка телефона при каждом импульсе',ok:false}
];const breaks=[{t:'Встать, сменить фокус зрения или немного пройтись без нового потока',ok:true},{t:'Открыть короткие видео',ok:false},{t:'Начать другую сложную задачу',ok:false}];let sel=new Set(),bp=null;const q=r=>root.querySelector(`[data-role="${r}"]`);
function render(){q('items').innerHTML=items.map((x,i)=>`<button type="button" class="tile ${sel.has(i)?'selected':''}" data-i="${i}">${x.t}</button>`).join('');q('items').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<4)sel.add(i);render()});const ready=sel.size===4;q('breakQ').classList.toggle('hidden',!ready);q('breaks').classList.toggle('hidden',!ready);q('check').disabled=!(ready&&bp!==null)}
q('breaks').innerHTML=breaks.map((x,i)=>`<button type="button" class="choice" data-b="${i}">${x.t}</button>`).join('');q('breaks').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{q('breaks').querySelectorAll('.choice').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');bp=+b.dataset.b;q('check').disabled=sel.size!==4});
q('check').onclick=()=>{const ok=[...sel].every(i=>items[i].ok)&&breaks[bp].ok;q('items').querySelectorAll('[data-i]').forEach(b=>{const i=+b.dataset.i;if(items[i].ok)b.classList.add('good');else if(sel.has(i))b.classList.add('bad');b.disabled=true});q('breaks').querySelectorAll('[data-b]').forEach(b=>{const i=+b.dataset.b;if(breaks[i].ok)b.classList.add('good');else if(i===bp)b.classList.add('bad');b.disabled=true});q('fb').className=`feedback show ${ok?'ok':'warn'}`;q('fb').innerHTML=ok?'<strong>Спринт снижает переключения и не превращает таймер в наказание.</strong>':'<strong>В настройке остались параллельные стимулы или жесткая длительность.</strong>';q('check').disabled=true};
q('reset').onclick=()=>{sel=new Set();bp=null;q('breaks').querySelectorAll('.choice').forEach(z=>{z.disabled=false;z.className='choice'});q('fb').className='feedback';render()};render();
 })();</script>
</body></html>
