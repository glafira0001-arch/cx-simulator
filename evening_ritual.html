<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вечерний ритуал</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card+.card{margin-top:9px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;line-height:1.4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit}
.choice,.chip,.tile,.cycle,.task-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover,.chip:hover,.tile:hover,.cycle:hover,.task-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}.feedback.bad{background:var(--bad-soft);color:#8f1b13}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1f6;
  color:#475467;font-size:11px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:5px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f6f7fa;font-size:11px;line-height:1.4;color:#586174}
.sequence{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.seq-box{min-height:72px;border:1px dashed #b9c1ce;border-radius:11px;padding:8px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;background:#fafbfc;font-size:12px;line-height:1.25}
.seq-box strong{font-size:17px;margin-bottom:3px}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .sequence{grid-template-columns:1fr 1fr}
  .task{border-radius:14px}
  .head,.body{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="task">
  <div class="head">
    <div class="kicker">Ритуалы и дисциплина</div>
    <h2>Соберите вечерний переход к отдыху</h2>
    <p class="lead">Выберите четыре действия разных модальностей и проверьте, остается ли ритуал гибким, если одно из них невозможно выполнить.</p>
  </div>
  <div class="body">
    <div class="small" style="margin-bottom:6px">Выберите ровно четыре элемента</div>
    <div class="grid2" id="actions"></div>
    <div id="flexBlock" class="hidden">
      <div class="small" style="margin:12px 0 6px">Вечером отключили горячую воду. Что делать?</div>
      <div class="grid2" id="flex">
        <button class="choice" data-ok="1">Заменить душ другим спокойным тактильным действием</button>
        <button class="choice" data-ok="0">Отменить весь ритуал: без душа он не работает</button>
        <button class="choice" data-ok="0">Продолжать искать способ принять душ любой ценой</button>
        <button class="choice" data-ok="0">Решить, что теперь ночь точно будет плохой</button>
      </div>
    </div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="check" disabled>Проверить ритуал</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const actions=[
 {t:'Приглушить верхний свет',m:'visual',ok:1},
 {t:'Записать дела на завтра',m:'cognitive',ok:1},
 {t:'Проветрить комнату',m:'physical',ok:1},
 {t:'Принять теплый душ',m:'tactile',ok:1},
 {t:'Посмотреть новости перед сном',m:'info',ok:0},
 {t:'Ответить на рабочую почту',m:'work',ok:0},
 {t:'Включить разговорный подкаст',m:'speech',ok:0},
 {t:'Проверить все мессенджеры',m:'info2',ok:0}
];
let selected=new Set(),flex=null;
const $=s=>document.querySelector(s);
function render(){
 $('#actions').innerHTML=actions.map((a,i)=>`<button class="tile ${selected.has(i)?'selected':''}" data-i="${i}">${a.t}</button>`).join('');
 $('#actions').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i;
  if(selected.has(i)) selected.delete(i); else if(selected.size<4) selected.add(i);
  render();
 });
 const ready=selected.size===4;
 $('#flexBlock').classList.toggle('hidden',!ready);
 $('#check').disabled=!(ready&&flex!==null);
}
document.querySelectorAll('#flex .choice').forEach((b,i)=>b.onclick=()=>{
 document.querySelectorAll('#flex .choice').forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected');flex=i;$('#check').disabled=selected.size!==4;
});
$('#check').onclick=()=>{
 const setOk=[...selected].every(i=>actions[i].ok===1);
 const flexOk=document.querySelectorAll('#flex .choice')[flex].dataset.ok==='1';
 $('#actions').querySelectorAll('.tile').forEach((b,i)=>b.classList.add(actions[i].ok?'good':(selected.has(i)?'bad':'')));
 document.querySelectorAll('#flex .choice').forEach((b,i)=>b.classList.add(b.dataset.ok==='1'?'good':(i===flex?'bad':'')));
 const fb=$('#fb');fb.className=`feedback show ${setOk&&flexOk?'ok':'warn'}`;
 fb.innerHTML=setOk&&flexOk
 ?'<strong>Ритуал собран устойчиво.</strong><br>В нем есть свет, воздух, тактильный сигнал и разгрузка памяти. При этом отдельный элемент можно заменить без ощущения, что весь вечер «сломался».'
 :'<strong>Ритуал либо продолжает нагружать мозг, либо стал слишком жестким.</strong><br>Хороший ритуал снижает количество стимулов, включает разные сенсорные каналы и допускает замену отдельных действий.';
};
$('#reset').onclick=()=>{
 selected=new Set();flex=null;document.querySelectorAll('#flex .choice').forEach(x=>x.className='choice');
 $('#fb').className='feedback';render();
};
render();
</script>
</body>
</html>
