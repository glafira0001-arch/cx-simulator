<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отдых под тип нагрузки</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card+.card{margin-top:9px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;line-height:1.4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit}
.choice,.chip,.tile,.cycle,.task-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover,.chip:hover,.tile:hover,.cycle:hover,.task-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}.feedback.bad{background:var(--bad-soft);color:#8f1b13}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1f6;
  color:#475467;font-size:11px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:5px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f6f7fa;font-size:11px;line-height:1.4;color:#586174}
.sequence{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.seq-box{min-height:72px;border:1px dashed #b9c1ce;border-radius:11px;padding:8px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;background:#fafbfc;font-size:12px;line-height:1.25}
.seq-box strong{font-size:17px;margin-bottom:3px}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
  .sequence{grid-template-columns:1fr 1fr}
  .task{border-radius:14px}
  .head,.body{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="task">
  <div class="progress"><div id="bar"></div></div>
  <div class="head">
    <div class="kicker">Баланс работы и отдыха</div>
    <h2>Подберите отдых под тип нагрузки</h2>
    <p class="lead">Не всякая приятная активность восстанавливает. Для каждой ситуации выберите паузу, которая действительно меняет режим работы мозга.</p>
  </div>
  <div class="body">
    <div class="card case">
      <span class="badge" id="step"></span>
      <p id="case" style="margin:9px 0 0"></p>
    </div>
    <div class="grid2" id="answers" style="margin-top:10px"></div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="next" disabled>Проверить</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const cases=[
 {case:'После 90 минут работы с таблицами и текстами вы чувствуете, что перечитываете строки и перестаете замечать ошибки.',
  a:[['10 минут посмотреть вдаль и немного пройтись',1],['Открыть короткие видео',0],['Почитать новости',0],['Перейти к другому отчету',0]],
  note:'После когнитивной нагрузки полезно расширить фокус и включить тело, а не продолжать обработку новой информации.'},
 {case:'После трех часов переговоров вы чувствуете раздражение от любого голоса.',
  a:[['Побыть 10 минут в тишине без телефона',1],['Позвонить другу и обсудить встречу',0],['Послушать разговорный подкаст',0],['Ответить на голосовые сообщения',0]],
  note:'После общения восстанавливает снижение социальной и речевой нагрузки, а не новый разговор.'},
 {case:'После физической работы тело устало, но голова остается ясной.',
  a:[['Сесть у окна и спокойно наблюдать за окружающим пространством',1],['Сделать интенсивную тренировку',0],['Начать уборку дома',0],['Проверить рабочую почту',0]],
  note:'После физической нагрузки нужен спокойный режим без новой телесной или информационной перегрузки.'}
];
let i=0,sel=null,checked=false,score=0;
const $=s=>document.querySelector(s);
function render(){
 const c=cases[i];sel=null;checked=false;$('#step').textContent=`Ситуация ${i+1} из ${cases.length}`;$('#case').textContent=c.case;
 $('#answers').innerHTML=c.a.map((a,n)=>`<button class="choice" data-i="${n}">${a[0]}</button>`).join('');
 $('#answers').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  $('#answers').querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sel=+b.dataset.i;$('#next').disabled=false;
 });
 $('#bar').style.width=`${i/cases.length*100}%`;$('#next').disabled=true;$('#next').textContent='Проверить';$('#fb').className='feedback';
}
$('#next').onclick=()=>{
 const c=cases[i];
 if(!checked){
  const ok=c.a[sel][1]===1;if(ok)score++;
  $('#answers').querySelectorAll('.choice').forEach((b,n)=>b.classList.add(c.a[n][1]?'good':(n===sel?'bad':'')));
  $('#fb').className=`feedback show ${ok?'ok':'warn'}`;$('#fb').innerHTML=`<strong>${ok?'Пауза подобрана точно.':'Нагрузка фактически не изменилась.'}</strong><br>${c.note}`;
  checked=true;$('#next').textContent=i===cases.length-1?'Показать результат':'Следующая ситуация';
 }else if(i<cases.length-1){i++;render();}
 else{
  $('#bar').style.width='100%';$('#answers').classList.add('hidden');$('#case').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
  $('#fb').className=`feedback show ${score===3?'ok':'warn'}`;
  $('#fb').innerHTML='Качественный отдых меняет тип нагрузки: после информации — тишина и пространство, после общения — одиночество, после физической работы — спокойное созерцание.';
  $('#next').disabled=true;$('#next').textContent='Готово';
 }
};
$('#reset').onclick=()=>{i=0;score=0;$('#answers').classList.remove('hidden');render();};
render();
</script>
</body>
</html>
