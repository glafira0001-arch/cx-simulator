<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прерывание мысленной жвачки</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card+.card{margin-top:9px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;line-height:1.4;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit}
.choice,.chip,.tile,.cycle,.source,.option{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover,.chip:hover,.tile:hover,.cycle:hover,.source:hover,.option:hover{border-color:#a5b0ef}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}.feedback.bad{background:var(--bad-soft);color:#8f1b13}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef1f6;
  color:#475467;font-size:11px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:5px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f6f7fa;font-size:11px;line-height:1.4;color:#586174}
.statement{font-size:14px;line-height:1.5;padding:12px;border-radius:12px;background:#f8f9fb;border:1px solid var(--line)}
.slots{display:grid;gap:8px}
.slot{border:1px dashed #b9c1ce;border-radius:11px;padding:10px;background:#fafbfc}
.slot strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.assembled{font-size:13px;line-height:1.55}
@media(max-width:430px){
  .grid2,.grid3{grid-template-columns:1fr}
  .task{border-radius:14px}
  .head,.body{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="task">
  <div class="progress"><div id="bar"></div></div>
  <div class="head">
    <div class="kicker">Прерывание мысленной жвачки</div>
    <h2>Отличите решение от повторения</h2>
    <p class="lead">Для каждой мысли определите, двигает ли она ситуацию вперед, и выберите следующий шаг.</p>
  </div>
  <div class="body">
    <div class="card case">
      <span class="badge" id="step"></span>
      <p id="thought" style="margin:9px 0 0"></p>
    </div>
    <div class="small" style="margin:10px 0 6px">Что происходит?</div>
    <div class="grid2">
      <button class="choice kind" data-kind="solve">Работа над решением</button>
      <button class="choice kind" data-kind="ruminate">Мысленная жвачка</button>
    </div>
    <div id="actionBlock" class="hidden">
      <div class="small" style="margin:12px 0 6px">Лучший следующий шаг</div>
      <div class="grid2" id="nextActions"></div>
    </div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="next" disabled>Проверить</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const cases=[
 {thought:'«Надо было ответить иначе… Почему я снова промолчал? Надо было сказать…» — мысль повторяется уже двадцать минут.',
  kind:'ruminate',a:[['Назвать процесс, встать и назначить 15 минут на разбор вечером',1],['Еще раз подробно прокрутить диалог',0],['Позвонить трем людям и пересказать ситуацию',0],['Запретить себе думать об этом вообще',0]],
  note:'Повторение не добавляет данных и не создает решения. Его лучше назвать, прервать действием и перенести в ограниченный временной слот.'},
 {thought:'«Если клиент не ответит до 14:00, я отправлю вариант B и перенесу внутренний созвон».',
  kind:'solve',a:[['Записать условие и выполнить план при наступлении события',1],['Продолжать строить еще двадцать сценариев',0],['Проверять почту каждую минуту',0],['Ночью пересчитать все риски',0]],
  note:'Есть условие и конкретный алгоритм. Это уже решение, поэтому мысль нужно зафиксировать и перестать расширять сценарий.'},
 {thought:'«Почему это всегда происходит со мной? Наверняка и следующий проект закончится так же».',
  kind:'ruminate',a:[['Заменить обобщение на один проверяемый факт и одно действие',1],['Искать доказательства, что так будет всегда',0],['Обсудить прошлый провал еще раз',0],['Считать мысль объективным прогнозом',0]],
  note:'Слова «всегда» и «следующий тоже» расширяют единичное событие до неизбежного будущего. Вернитесь к факту и ближайшему действию.'}
];
let i=0,kind=null,act=null,checked=false,score=0;
const $=s=>document.querySelector(s);
function render(){
 const c=cases[i];kind=null;act=null;checked=false;
 $('#step').textContent=`Ситуация ${i+1} из ${cases.length}`;$('#thought').textContent=c.thought;
 document.querySelectorAll('.kind').forEach(x=>x.className='choice kind');
 $('#nextActions').innerHTML=c.a.map((a,n)=>`<button class="choice" data-i="${n}">${a[0]}</button>`).join('');
 $('#nextActions').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  $('#nextActions').querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');act=+b.dataset.i;$('#next').disabled=kind===null;
 });
 $('#actionBlock').classList.add('hidden');$('#bar').style.width=`${i/cases.length*100}%`;$('#next').textContent='Проверить';$('#next').disabled=true;$('#fb').className='feedback';
}
document.querySelectorAll('.kind').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.kind').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');kind=b.dataset.kind;
 $('#actionBlock').classList.remove('hidden');$('#next').disabled=act===null;
});
$('#next').onclick=()=>{
 const c=cases[i];
 if(!checked){
  const ok=kind===c.kind&&c.a[act][1]===1;if(ok)score++;
  document.querySelectorAll('.kind').forEach(x=>x.classList.add(x.dataset.kind===c.kind?'good':(x.classList.contains('selected')?'bad':'')));
  $('#nextActions').querySelectorAll('.choice').forEach((x,n)=>x.classList.add(c.a[n][1]?'good':(n===act?'bad':'')));
  $('#fb').className=`feedback show ${ok?'ok':'warn'}`;$('#fb').innerHTML=`<strong>${ok?'Процесс распознан.':'Есть риск продолжить цикл.'}</strong><br>${c.note}`;
  checked=true;$('#next').textContent=i===cases.length-1?'Показать результат':'Следующая ситуация';
 }else if(i<cases.length-1){i++;render();}
 else{
  $('#bar').style.width='100%';$('#thought').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
  $('#actionBlock').classList.add('hidden');document.querySelectorAll('.kind').forEach(x=>x.classList.add('hidden'));
  $('#fb').className=`feedback show ${score===3?'ok':'warn'}`;$('#fb').innerHTML='Критерий простой: решение добавляет факт, выбор или действие. Жвачка повторяет эмоцию и сценарий без изменения результата.';
  $('#next').disabled=true;$('#next').textContent='Готово';
 }
};
$('#reset').onclick=()=>{i=0;score=0;document.querySelectorAll('.kind').forEach(x=>x.classList.remove('hidden'));render();};
render();
</script>
</body>
</html>
