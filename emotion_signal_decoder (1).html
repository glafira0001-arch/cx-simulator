<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дешифратор эмоций</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.progress{height:4px;background:#e8ebf3}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.head{padding:13px 14px 10px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:17px;line-height:1.18;margin:4px 0 4px}
.lead{font-size:12px;line-height:1.34;color:var(--muted);margin:0}
.body{padding:11px 14px 13px}
.card,.case,.result{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.case{background:#f8f9fb}
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.dots{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:#d8dde6}
.dot.done{background:var(--accent)}
.question{font-size:13px;font-weight:800;line-height:1.32;margin:9px 0 6px}
.small{font-size:10.5px;line-height:1.35;color:var(--muted)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choice{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px;text-align:left;cursor:pointer;font-size:11.5px;line-height:1.3;transition:.12s}
.choice:hover{border-color:#a6b0ed}
.choice.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:7px;margin-top:10px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer;font-size:11.5px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:8px;border-radius:9px;padding:8px 9px;font-size:11.5px;line-height:1.36}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.hidden{display:none!important}
.result{margin-top:7px;background:#fafbff}
.result-title{font-size:11px;font-weight:800;margin-bottom:5px}
.result-line{font-size:11px;line-height:1.35;padding:4px 0;border-bottom:1px dashed #e1e5eb}
.result-line:last-child{border-bottom:0}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{font-size:10px;line-height:1.2;padding:4px 7px;border-radius:999px;background:#eef1ff;color:#3949b8}
.scale-row{display:flex;align-items:center;gap:8px}
input[type=range]{width:100%}
.scale-value{min-width:36px;text-align:center;font-size:16px;font-weight:900;color:var(--accent)}
@media(max-width:430px){
  .options{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:11px;padding-right:11px}
}
</style>
</head>
<body>
<div class="task" id="decoderCompact">

<div class="progress"><div data-role="bar"></div></div>
<div class="head">
  <div class="kicker">Дешифратор эмоций</div>
  <h2>Что может сообщать эмоция?</h2>
  <p class="lead">Одна ситуация — один выбор. В конце проверьте, не приняли ли вы гипотезу за факт.</p>
</div>
<div class="body">
  <div class="stepbar"><span class="badge" data-role="step"></span><div class="dots" data-role="dots"></div></div>
  <div class="case" data-role="case"></div>
  <div class="question" data-role="question"></div>
  <div class="options" data-role="options"></div>
  <div class="actions">
    <button type="button" class="secondary" data-role="reset">Сбросить</button>
    <button type="button" class="primary" data-role="next" disabled>Продолжить</button>
  </div>
  <div class="feedback" data-role="fb"></div>
</div>

</div>
<script>
(() => {
  const root = document.getElementById('decoderCompact');
  if (!root) return;

  const cases=[
    {case:'После очередной внеплановой просьбы вы чувствуете злость.',question:'Какую гипотезу стоит проверить?',correct:0,options:['Возможно, нарушена граница','Я точно плохой коллега','Другой человек точно хотел навредить']},
    {case:'Перед новым проектом появляется тревога и желание все отложить.',question:'Какую гипотезу стоит проверить?',correct:1,options:['Я не способен учиться','Не хватает ясности, опыта или ресурса','Проект обязательно провалится']},
    {case:'После отмены важной инициативы ощущаются тяжесть и грусть.',question:'Какую гипотезу стоит проверить?',correct:0,options:['Потеряно что-то значимое','Нужно немедленно забыть проект','Грусть доказывает слабость']},
    {case:'При участии в сомнительной схеме возникает отвращение.',question:'Какую гипотезу стоит проверить?',correct:2,options:['Я слишком чувствительный','Нужно подавить реакцию','Ситуация противоречит ценностям или безопасности']},
    {case:'После нарушения собственного обещания появляется вина.',question:'Какую гипотезу стоит проверить?',correct:1,options:['Я навсегда ненадежный','Нужно восстановить нарушенное обязательство','Нужно избегать человека']},
    {case:'После публичной ошибки возникает стыд и желание исчезнуть.',question:'Какую гипотезу стоит проверить?',correct:0,options:['Есть страх оценки или отвержения','Ошибка определяет всю личность','Нужно больше никогда не выступать']},
    {case:'Вы выбрали возможный смысл эмоции.',question:'Как не превратить гипотезу в приговор?',correct:1,options:['Сразу действовать на пике эмоции','Проверить факты и другие объяснения','Считать чувство доказательством чужой вины']}
  ];
  let index=0,selected=null,score=0,checked=false;
  const q=r=>root.querySelector(`[data-role="${r}"]`);
  function render(){
    const item=cases[index];selected=null;checked=false;
    q('bar').style.width=`${index/cases.length*100}%`;
    q('step').textContent=`${index+1} из ${cases.length}`;
    q('dots').innerHTML=cases.map((_,i)=>`<span class="dot ${i<=index?'done':''}"></span>`).join('');
    q('case').textContent=item.case;
    q('question').textContent=item.question;
    q('options').innerHTML=item.options.map((o,i)=>`<button type="button" class="choice" data-option="${i}">${o}</button>`).join('');
    q('options').querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>{
      if(checked)return;
      q('options').querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');selected=Number(btn.dataset.option);q('next').disabled=false;
    }));
    q('next').disabled=true;
    q('next').textContent=index===cases.length-1?'Показать результат':'Продолжить';
    q('fb').className='feedback';
  }
  q('next').addEventListener('click',()=>{
    if(selected===null)return;
    const item=cases[index];
    if(selected===item.correct)score++;
    if(index<cases.length-1){index++;render();return;}
    q('bar').style.width='100%';
    q('options').classList.add('hidden');q('question').classList.add('hidden');
    q('case').innerHTML=`Точных расшифровок: <strong>${score} из ${cases.length}</strong>.`;
    q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;
    q('fb').innerHTML=score===cases.length
      ? '<strong>Эмоции прочитаны как гипотезы.</strong><br>Вы заметили возможную потребность и оставили место для проверки фактов.'
      : '<strong>Не каждая эмоция имеет одно значение.</strong><br>Назовите возможный сигнал, затем проверьте контекст и альтернативные объяснения.';
    q('next').disabled=true;q('next').textContent='Готово';
  });
  q('reset').addEventListener('click',()=>{index=0;selected=null;score=0;q('options').classList.remove('hidden');q('question').classList.remove('hidden');render();});
  render();

})();
</script>
</body>
</html>
