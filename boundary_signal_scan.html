<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Диагностика нарушения границ</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.inline-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:93%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.pause{height:7px;border-radius:999px;background:#e8ebf3;overflow:hidden;margin-top:6px}
.pause>div{height:100%;width:0;background:var(--accent);transition:width .1s linear}
.coins{display:flex;gap:6px;margin-top:7px}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef1ff;border:1px solid #cbd2ff;font-size:16px}
.coin.filled{background:#eaf8f1;border-color:#98d7bd}
.range-row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
input[type="range"]{width:100%}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .range-row{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="boundarySignalTask">

  <div class="head">
    <div class="kicker">Ранние сигналы</div>
    <h2>Распознайте нарушение до взрыва</h2>
    <p class="lead">Для каждого сигнала определите его тип, затем выберите действие, которое возвращает контроль.</p>
  </div>
  <div class="body">
    <div data-role="signals"></div>
    <div data-role="actionBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Что сделать после обнаружения нескольких сигналов?</div>
      <div class="grid2" data-role="actions"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить диагностику</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('boundarySignalTask');
  if (!root) return;

  const signals=[
    {text:'Вы раздражаетесь при каждом новом сообщении коллеги',correct:'emotion'},
    {text:'Начали откладывать открытие чата с близким человеком',correct:'avoid'},
    {text:'К выходным регулярно болит голова и зажаты плечи',correct:'body'},
    {text:'После просьбы появляется скрытая злость на того, кто попросил',correct:'emotion'},
    {text:'Вы придумываете причины не отвечать человеку',correct:'avoid'},
    {text:'После очередного согласия ухудшается сон',correct:'body'}
  ];
  const labels=[
    {value:'emotion',text:'Эмоция'},
    {value:'avoid',text:'Избегание'},
    {value:'body',text:'Тело'}
  ];
  const actions=[
    {text:'Продолжить терпеть: возможно, человек сам догадается',correct:false},
    {text:'Обвинить человека во всех накопленных обидах',correct:false},
    {text:'Зафиксировать эпизод, определить нарушенный лимит и подготовить своевременную границу',correct:true},
    {text:'Объяснить себе, что другому нужнее',correct:false}
  ];
  let answers=Array(signals.length).fill(null),action=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);

  function render(){
    q('signals').innerHTML=signals.map((s,i)=>`
      <div class="row-card" data-row="${i}">
        <div style="font-size:12px;line-height:1.35">${s.text}</div>
        <div class="inline-choices">
          ${labels.map(l=>`<button type="button" class="answer-btn ${answers[i]===l.value?'selected':''}" data-value="${l.value}">${l.text}</button>`).join('')}
        </div>
      </div>`).join('');

    q('signals').querySelectorAll('[data-row]').forEach(row=>{
      const i=Number(row.dataset.row);
      row.querySelectorAll('[data-value]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          answers[i]=btn.dataset.value;
          q('fb').className='feedback';
          render();
        });
      });
    });

    const complete=answers.every(v=>v!==null);
    q('actionBlock').classList.toggle('hidden',!complete);
    q('check').disabled=!(complete&&action!==null);
  }

  q('actions').innerHTML=actions.map((a,i)=>
    `<button type="button" class="choice" data-action="${i}">${a.text}</button>`
  ).join('');

  q('actions').querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('actions').querySelectorAll('[data-action]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      action=Number(btn.dataset.action);
      q('check').disabled=!answers.every(v=>v!==null);
    });
  });

  q('check').addEventListener('click',()=>{
    let score=0;
    q('signals').querySelectorAll('[data-row]').forEach(row=>{
      const i=Number(row.dataset.row);
      row.querySelectorAll('[data-value]').forEach(btn=>{
        const value=btn.dataset.value;
        if(value===signals[i].correct)btn.classList.add('good');
        else if(value===answers[i])btn.classList.add('bad');
        btn.disabled=true;
      });
      if(answers[i]===signals[i].correct)score++;
    });

    q('actions').querySelectorAll('[data-action]').forEach(btn=>{
      const i=Number(btn.dataset.action);
      if(actions[i].correct)btn.classList.add('good');
      else if(i===action)btn.classList.add('bad');
      btn.disabled=true;
    });

    const ok=score===signals.length&&actions[action].correct;
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Сигналы распознаны вовремя.</strong><br>Раздражение, избегание и телесное напряжение — не доказательство плохого характера, а данные о потерянном контроле.'
      : `<strong>Верно распознано: ${score} из ${signals.length} сигналов.</strong><br>Не ждите взрыва. Зафиксируйте повторяющийся эпизод и определите, какой лимит нужно обозначить словами.`;
    q('check').disabled=true;
  });

  q('reset').addEventListener('click',()=>{
    answers=Array(signals.length).fill(null);
    action=null;
    q('actions').querySelectorAll('[data-action]').forEach(x=>{x.disabled=false;x.className='choice';});
    q('fb').className='feedback';
    render();
  });

  render();

})();
</script>
</body>
</html>
