<div id="aiLesson5">
<style>
#aiLesson5{max-width:560px;margin:0 auto;font-family:Arial,sans-serif;color:#202938}
#aiLesson5 *{box-sizing:border-box}
#aiLesson5 .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}
#aiLesson5 .header,#aiLesson5 .screen,#aiLesson5 .result{padding:16px}
#aiLesson5 .header{border-bottom:1px solid #e5e7eb}
#aiLesson5 .label{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:5px}
#aiLesson5 h3{margin:0;font-size:18px;line-height:1.3}
#aiLesson5 .progress{height:5px;margin-top:12px;background:#eef2f6;border-radius:10px;overflow:hidden}
#aiLesson5 .progress-fill{height:100%;background:#2563eb;transition:.2s}
#aiLesson5 .meta{font-size:12px;color:#667085;margin-bottom:8px}
#aiLesson5 .question-title{font-size:16px;font-weight:700;margin-bottom:10px}
#aiLesson5 .box{padding:10px 11px;border:1px solid #e5e7eb;border-radius:11px;background:#f8fafc;font-size:13px;line-height:1.45;margin:9px 0}
#aiLesson5 .box b{display:block;font-size:11px;color:#667085;margin-bottom:4px;text-transform:uppercase}
#aiLesson5 .question{font-size:14px;line-height:1.45;margin:11px 0}
#aiLesson5 .options{display:grid;gap:8px}
#aiLesson5 .option{padding:10px 11px;border:1px solid #e5e7eb;border-radius:11px;font-size:13px;line-height:1.4;cursor:pointer}
#aiLesson5 .option.selected{border-color:#7ca5ff;background:#f5f8ff}
#aiLesson5 .feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:11px;font-size:13px;line-height:1.45}
#aiLesson5 .feedback.correct{display:block;background:#ecfdf3;color:#065f46;border:1px solid #abefc6}
#aiLesson5 .feedback.wrong{display:block;background:#fff1f0;color:#7a271a;border:1px solid #fecdca}
#aiLesson5 .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
#aiLesson5 button{padding:8px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#aiLesson5 button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
#aiLesson5 button:disabled{opacity:.4}
#aiLesson5 .score{font-size:30px;font-weight:800;margin:3px 0 10px}
#aiLesson5 .row{display:flex;justify-content:space-between;gap:10px;padding:8px 9px;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:7px;font-size:12px}
#aiLesson5 .ok{color:#067647;font-weight:700}
#aiLesson5 .bad{color:#b42318;font-weight:700}
#aiLesson5 .final{margin-top:12px;padding:10px 11px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;font-size:13px;line-height:1.45}
</style>

<div class="card">
  <div class="header">
    <div class="label">Практикум · Урок 5</div>
    <h3>Соберите запрос по формуле РЗПР</h3>
    <div class="progress"><div class="progress-fill" id="l5Progress"></div></div>
  </div>

  <div class="screen" id="l5Screen">
    <div class="meta" id="l5Meta"></div>
    <div class="question-title" id="l5Title"></div>
    <div id="l5Scenario"></div>
    <div class="question" id="l5Question"></div>
    <div class="options" id="l5Options"></div>
    <div class="feedback" id="l5Feedback"></div>

    <div class="actions">
      <button id="l5Back">Назад</button>
      <button class="primary" id="l5Check">Проверить</button>
      <button id="l5Edit">Изменить ответ</button>
      <button class="primary" id="l5Next">Далее</button>
    </div>
  </div>

  <div class="result" id="l5Result" style="display:none">
    <div class="meta">Результат симулятора</div>
    <div class="score" id="l5Score"></div>
    <div id="l5Rows"></div>

    <div class="final">
      <strong>Рабочая формула:</strong><br>
      роль → конкретная задача → правила анализа → форма результата.
    </div>

    <div class="actions">
      <button id="l5Error">Вернуться к ошибке</button>
      <button class="primary" id="l5Restart">Пройти заново</button>
    </div>
  </div>
</div>

<script>
(function(){
function startLesson5(){

const questions=[
{
 title:"Найдите слабое место запроса",
 scenario:'<div class="box"><b>Запрос</b>Ты коммерческий директор. Найди причины невыполнения плана и представь результат таблицей.</div>',
 question:"Какой элемент РЗПР здесь проработан хуже всего?",
 options:["Роль","Процесс","Результат","Задача"],
 correct:1,
 explanation:"Роль, задача и форма ответа уже заданы. Не хватает процесса: какие показатели сравнивать, в какой последовательности и когда можно переходить к причинам.",
 short:"Структура РЗПР"
},
{
 title:"Сделайте задачу проверяемой",
 scenario:'<div class="box">В файле есть план, факт, демонстрации, сделки и конверсия по сегментам.</div>',
 question:"Какая постановка задачи управляемее?",
 options:[
   "Найди сегменты с невыполнением плана более 10%.",
   "Найди главные проблемы продаж.",
   "Определи слабые сегменты.",
   "Оцени эффективность бизнеса."
 ],
 correct:0,
 explanation:"В первом варианте есть конкретный критерий отбора. В остальных ИИ сам решает, что считать слабостью или проблемой.",
 short:"Задача"
},
{
 title:"Задайте процесс",
 scenario:'<div class="box">Нужно понять, где просел результат, но не выдавать гипотезу за доказанную причину.</div>',
 question:"Какой блок процесса лучше?",
 options:[
   "Найди все корреляции между числовыми полями.",
   "Сравни план и факт; для слабых сегментов проверь демонстрации, сделки и конверсию. Причины без данных не утверждай.",
   "Используй свой опыт и назови наиболее вероятную причину.",
   "Сравни показатели со средними значениями рынка."
 ],
 correct:1,
 explanation:"Процесс должен задавать последовательность анализа и ограничивать неподтверждённые интерпретации.",
 short:"Процесс"
},
{
 title:"Определите результат",
 scenario:'<div class="box">Ответ нужен для короткого совещания.</div>',
 question:"Какой формат результата полезнее?",
 options:[
   "Свободный комментарий.",
   "Подробное эссе по всем наблюдениям.",
   "Таблица по сегментам и не более трёх ключевых выводов.",
   "Максимально полный список рисков и гипотез."
 ],
 correct:2,
 explanation:"Компактная таблица и ограниченное число выводов легче проверить и использовать на совещании.",
 short:"Результат"
}
];

const screen=document.getElementById("l5Screen");
const result=document.getElementById("l5Result");
const progress=document.getElementById("l5Progress");
const meta=document.getElementById("l5Meta");
const title=document.getElementById("l5Title");
const scenario=document.getElementById("l5Scenario");
const question=document.getElementById("l5Question");
const options=document.getElementById("l5Options");
const feedback=document.getElementById("l5Feedback");
const back=document.getElementById("l5Back");
const check=document.getElementById("l5Check");
const edit=document.getElementById("l5Edit");
const next=document.getElementById("l5Next");
const score=document.getElementById("l5Score");
const rows=document.getElementById("l5Rows");
const error=document.getElementById("l5Error");
const restart=document.getElementById("l5Restart");

let current=0,answers=[],checked=[];

function isCorrect(i){return answers[i]===questions[i].correct}

function render(){
 screen.style.display="block";
 result.style.display="none";

 const q=questions[current];

 meta.textContent="Экран "+(current+1)+" из "+questions.length;
 title.textContent=q.title;
 scenario.innerHTML=q.scenario;
 question.textContent=q.question;
 options.innerHTML="";

 q.options.forEach(function(text,index){
   const el=document.createElement("div");
   el.className="option"+(answers[current]===index?" selected":"");
   el.textContent=text;
   el.addEventListener("click",function(){
     answers[current]=index;
     render();
   });
   options.appendChild(el);
 });

 feedback.className="feedback";
 feedback.innerHTML="";

 if(checked[current]){
   const good=isCorrect(current);
   feedback.classList.add(good?"correct":"wrong");
   feedback.innerHTML="<strong>"+(good?"Верно":"Не совсем")+"</strong><br>"+q.explanation;
 }

 back.disabled=current===0;
 check.style.display=checked[current]?"none":"inline-block";
 edit.style.display=checked[current]?"inline-block":"none";
 next.style.display=checked[current]?"inline-block":"none";
 next.textContent=current===questions.length-1?"Посмотреть результат":"Далее";

 progress.style.width=((current+1)/questions.length*100)+"%";
}

check.addEventListener("click",function(){
 if(answers[current]===undefined){alert("Сначала выберите ответ.");return}
 checked[current]=true;
 render();
});

edit.addEventListener("click",function(){
 checked[current]=false;
 render();
});

back.addEventListener("click",function(){
 if(current>0){current--;render()}
});

next.addEventListener("click",function(){
 if(current<questions.length-1){current++;render()}
 else showResult();
});

function showResult(){
 screen.style.display="none";
 result.style.display="block";

 let count=0;
 rows.innerHTML="";

 questions.forEach(function(q,index){
   const good=isCorrect(index);
   if(good)count++;

   const row=document.createElement("div");
   row.className="row";
   row.innerHTML="<span>"+(index+1)+". "+q.short+"</span><span class='"+(good?"ok":"bad")+"'>"+(good?"верно":"ошибка")+"</span>";
   rows.appendChild(row);
 });

 score.textContent=count+" / "+questions.length;
 error.style.display=count===questions.length?"none":"inline-block";
}

error.addEventListener("click",function(){
 const first=questions.findIndex(function(_,i){return !isCorrect(i)});
 if(first!==-1){current=first;render()}
});

restart.addEventListener("click",function(){
 current=0;answers=[];checked=[];render();
});

render();
}

if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded",startLesson5);
}else{
 startLesson5();
}
})();
</script>
</div>
