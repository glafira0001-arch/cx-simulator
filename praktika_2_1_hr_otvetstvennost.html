<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кто отвечает за передачу данных</title><style>
:root{--red:#cf2038;--red-light:#fff0f2;--text:#252630;--muted:#636976;--line:#e3e5e9;--green:#17784d;--green-light:#e9f7ef;--bg:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.43}
main{max-width:560px;width:100%;margin:0 auto;padding:17px 16px 15px;background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:12px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--red);text-transform:uppercase;margin-bottom:7px}
h1{font-size:18px;line-height:1.26;margin:0 0 9px;font-weight:750;letter-spacing:-.025em}
.case{font-size:13px;line-height:1.5;margin:0 0 12px;color:#464b55}
.question{font-weight:700;font-size:14px;margin:0 0 10px}
.options{display:grid;gap:7px}.option{display:flex;align-items:flex-start;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;text-align:left;color:var(--text);font:inherit;line-height:1.35;cursor:pointer;transition:border-color .12s,background .12s}
.option:hover{border-color:#e6aab3;background:#fff9fa}.option:focus-visible,.action:focus-visible,.drop:focus-visible{outline:3px solid #e9a6b1;outline-offset:2px}
.symbol{flex:0 0 18px;width:18px;height:18px;border:1.6px solid #bfc4cc;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:0px;color:#fff;font-size:12px;font-weight:800;line-height:1}
.option[aria-pressed=true]{border-color:var(--red);background:var(--red-light)}.option[aria-pressed=true] .symbol{border-color:var(--red);background:var(--red)}
.option.bad{border-color:#dc5060;background:#fff0f2}.option.good{border-color:#299667;background:var(--green-light)}.option.good .symbol{border-color:var(--green);background:var(--green)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.action{padding:9px 13px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--red);transition:background .15s}.primary{color:#fff;background:var(--red)}.primary:hover{background:#b91630}.secondary{background:#fff;color:var(--red)}.secondary:hover{background:#fff2f4}
.feedback{margin-top:11px;border-left:3px solid var(--red);border-radius:5px;background:#f7f7f9;padding:10px 11px;font-size:12.5px;line-height:1.5}.feedback strong{display:block;margin-bottom:4px}.feedback.good{border-color:var(--green);background:#f0faf4}.feedback.bad{border-color:var(--red);background:#fff5f6}
.hint{margin:7px 0 0;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;flex:0 0 24px;height:23px;background:#f4f4f6;border-radius:6px;font-size:11px;font-weight:750;color:#5f6470}
.option.good .chip{background:#d0ecdc;color:#126843}.option.bad .chip{background:#f7d7dd;color:#aa1e32}
.drop{min-height:55px;padding:11px;border:2px dashed #d6a1aa;border-radius:9px;background:#fff9fa;display:flex;align-items:center;gap:8px;width:100%;font:inherit;text-align:left;color:#50535c;cursor:pointer;margin:10px 0 9px}.drop.filled{background:#fff0f2;border-style:solid;border-color:var(--red);color:var(--text)}.drop.good{background:var(--green-light);border-color:var(--green)}.drop.bad{background:var(--red-light);border-color:#db485b}.drop.over{background:#fee5e9}
.dragOptions{display:grid;gap:7px}.drag{cursor:grab;user-select:none}.drag[draggable=true]:active{cursor:grabbing}.drag.selected{border-color:var(--red);background:#fff0f2}.drag.chosen{opacity:.58}.drag .chip{background:#fff0f2;color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:420px){main{border-radius:0;padding:14px 12px}.option{padding:9px}h1{font-size:17px}.actions .action{flex:1}}
</style></head><body><main><div class="kicker">Практика · один ответ</div><h1>Кто отвечает за передачу данных</h1><p class="case">HR-специалист загрузил в стороннюю нейросеть таблицу с зарплатами и персональными данными сотрудников. Компания обнаружила передачу и начала внутреннюю проверку.</p><div class="question">Какое утверждение верно?</div><div class="options"><button type="button" class="option" data-answer="0" aria-pressed="false"><span class="symbol" aria-hidden="true"></span><span>Если данные не появились в интернете, компания не может нарушить закон.</span></button><button type="button" class="option" data-answer="1" aria-pressed="false"><span class="symbol" aria-hidden="true"></span><span>За передачу данных всегда отвечает только сотрудник, который загрузил файл.</span></button><button type="button" class="option" data-answer="2" aria-pressed="false"><span class="symbol" aria-hidden="true"></span><span>Компания может столкнуться с ответственностью за нарушение правил обработки персональных данных, а сотрудник — с дисциплинарными последствиями.</span></button><button type="button" class="option" data-answer="3" aria-pressed="false"><span class="symbol" aria-hidden="true"></span><span>Если HR загрузил сведения для выполнения поручения руководителя, нарушение исключено.</span></button></div><div class="actions"><button type="button" class="action primary" id="check">Проверить ответ</button><button type="button" class="action secondary" id="retry">Попробовать еще раз</button></div><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div></main><script>(()=>{const opts=[...document.querySelectorAll('.option')],f=document.getElementById('feedback');let sel=-1;function resetMarks(){opts.forEach(x=>x.classList.remove('bad','good'));f.hidden=true;f.className='feedback'}opts.forEach((b,i)=>b.addEventListener('click',()=>{sel=i;resetMarks();opts.forEach((x,j)=>x.setAttribute('aria-pressed',String(i===j)))}));document.getElementById('check').onclick=()=>{if(sel<0){f.hidden=false;f.className='feedback';f.innerHTML='<strong>Выберите один вариант.</strong>После этого нажмите «Проверить ответ».';return;}let ok=sel===2;resetMarks();opts[sel].classList.add(ok?'good':'bad');f.hidden=false;f.className='feedback '+(ok?'good':'bad');f.innerHTML=ok?'<strong>Верно.</strong>Нарушение правил обработки персональных данных не обязательно сопровождается публикацией сведений в интернете. Ответственность компании и сотрудника оценивают отдельно. Для каждого случая проверяют основания передачи, действия участников и обстоятельства нарушения.':'<strong>Пока неверно.</strong>Данные могут быть переданы неправомерно, даже если их не публиковали. Последствия для организации и сотрудника определяют отдельно. Выберите другой вариант и проверьте ответ еще раз.'};document.getElementById('retry').onclick=()=>{sel=-1;opts.forEach(x=>x.setAttribute('aria-pressed','false'));resetMarks()};})();</script></body></html>
