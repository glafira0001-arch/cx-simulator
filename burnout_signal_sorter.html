<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сигналы выгорания</title><style>
:root{--ink:#172033;--muted:#667085;--line:#d9e0e8;--accent:#4658d6;--soft:#eef1ff;--ok:#147552;--oksoft:#eaf8f1;--bad:#b42318;--badsoft:#fff0ee;--warn:#936500;--warnsoft:#fff7dc;--urgent:#7a271a;--urgentsoft:#fff1ef}
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}.body{padding:12px 15px 14px}
.card,.row-card,.zone{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.row-card+.row-card{margin-top:7px}.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button,input{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;font-size:12px;line-height:1.3}
.selected{border-color:var(--accent)!important;background:var(--soft)!important;box-shadow:0 0 0 1px var(--accent) inset}.good{border-color:var(--ok)!important;background:var(--oksoft)!important}.bad{border-color:var(--bad)!important;background:var(--badsoft)!important}
.actions{display:flex;gap:7px;margin-top:11px}.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#edf0f5;color:var(--ink)}.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}.feedback.show{display:block}.feedback.ok{background:var(--oksoft);color:#0c5a3f}.feedback.warn{background:var(--warnsoft);color:#704d00}.feedback.urgent{background:var(--urgentsoft);color:var(--urgent)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;color:#475467;font-size:10px;font-weight:800}.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}.hidden{display:none!important}
.range-row{display:grid;grid-template-columns:76px 1fr 28px;gap:8px;align-items:center}input[type=range]{width:100%}.chart{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;height:95px;align-items:end;margin-top:8px}.bar-wrap{height:100%;display:flex;align-items:flex-end}.bar{width:100%;min-height:6px;background:var(--accent);border-radius:5px 5px 2px 2px}.labels{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:3px}.labels span{font-size:8px;color:var(--muted);text-align:center}
.zone{min-height:76px;background:#fafbfc;cursor:pointer}.zone-title{font-size:10px;font-weight:800;line-height:1.25;margin-bottom:5px}.zone-list{display:flex;flex-direction:column;gap:4px}.chip{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font-size:10px;line-height:1.25;cursor:pointer}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0}.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr}.range-row{grid-template-columns:62px 1fr 24px}.task{border-radius:12px}.head,.body{padding-left:12px;padding-right:12px}}
</style></head><body><div class="task" id="burnoutTask">
<div class="head"><div class="kicker">Риск выгорания</div><h2>Распознайте три рабочих сигнала</h2><p class="lead">Выберите карточку, затем нажмите на подходящую зону. После распределения определите профессиональный следующий шаг.</p></div>
<div class="body"><div class="grid2" data-role="pool"></div><div class="grid3" style="margin-top:8px">
<div class="zone" role="button" tabindex="0" data-zone="exhaustion"><div class="zone-title">Истощение</div><div class="zone-list" data-list="exhaustion"></div></div>
<div class="zone" role="button" tabindex="0" data-zone="distance"><div class="zone-title">Цинизм и дистанция</div><div class="zone-list" data-list="distance"></div></div>
<div class="zone" role="button" tabindex="0" data-zone="efficacy"><div class="zone-title">Снижение эффективности</div><div class="zone-list" data-list="efficacy"></div></div></div>
<div data-role="actionBlock" class="hidden"><div class="small" style="margin:8px 0 5px">Сигналы держатся и связаны с работой. Что делать?</div><div class="grid2" data-role="actions"></div></div>
<div class="actions"><button type="button" class="secondary" data-role="reset">Начать заново</button><button type="button" class="primary" data-role="check" disabled>Проверить</button></div><div class="feedback" data-role="fb"></div></div>
</div><script>(()=>{const root=document.getElementById('burnoutTask');if(!root)return;
const cards=[
{text:'К концу недели нет сил даже на простые рабочие задачи',correct:'exhaustion'},
{text:'Клиенты и коллеги воспринимаются только как раздражители',correct:'distance'},
{text:'Даже реальные результаты кажутся бессмысленными',correct:'efficacy'},
{text:'От одной мысли о рабочем чате возникает опустошение',correct:'exhaustion'},
{text:'В ответах становится все больше сарказма и безразличия',correct:'distance'},
{text:'Кажется, что вы больше ни с чем не справляетесь профессионально',correct:'efficacy'}];
const actions=[{text:'Увеличить нагрузку, чтобы вернуть азарт',correct:false},{text:'Сделать загрузку прозрачной, сократить необязательное и обсудить поддержку или изменение условий',correct:true},{text:'Считать себя ленивым и скрывать состояние',correct:false},{text:'Диагностировать у себя заболевание по одному признаку',correct:false}];
let placement=Array(cards.length).fill(null),selected=null,action=null;const q=r=>root.querySelector(`[data-role="${r}"]`);
function render(){q('pool').innerHTML=cards.map((c,i)=>placement[i]===null?`<button type="button" class="tile ${selected===i?'selected':''}" data-card="${i}">${c.text}</button>`:'').join('');q('pool').querySelectorAll('[data-card]').forEach(btn=>btn.addEventListener('click',()=>{selected=Number(btn.dataset.card);render();}));
['exhaustion','distance','efficacy'].forEach(z=>{const list=root.querySelector(`[data-list="${z}"]`);list.innerHTML=cards.map((c,i)=>placement[i]===z?`<div class="chip" data-placed="${i}">${c.text}</div>`:'').join('');list.querySelectorAll('[data-placed]').forEach(ch=>ch.addEventListener('click',e=>{e.stopPropagation();selected=Number(ch.dataset.placed);placement[selected]=null;render();}));});
const complete=placement.every(v=>v!==null);q('actionBlock').classList.toggle('hidden',!complete);q('check').disabled=!(complete&&action!==null);}
root.querySelectorAll('[data-zone]').forEach(z=>z.addEventListener('click',()=>{if(z.dataset.locked==='1'||selected===null)return;placement[selected]=z.dataset.zone;selected=null;q('fb').className='feedback';render();}));
q('actions').innerHTML=actions.map((x,i)=>`<button type="button" class="choice" data-action="${i}">${x.text}</button>`).join('');
q('actions').querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{q('actions').querySelectorAll('button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');action=Number(btn.dataset.action);q('check').disabled=placement.some(v=>v===null);}));
q('check').addEventListener('click',()=>{let score=0;placement.forEach((z,i)=>{if(z===cards[i].correct)score++;});const actionOk=action!==null&&actions[action].correct;root.querySelectorAll('[data-zone]').forEach(z=>{const wrong=placement.some((p,i)=>p===z.dataset.zone&&cards[i].correct!==z.dataset.zone);z.classList.add(wrong?'bad':'good');z.dataset.locked='1';});q('actions').querySelectorAll('[data-action]').forEach(btn=>{const i=Number(btn.dataset.action);if(actions[i].correct)btn.classList.add('good');else if(i===action)btn.classList.add('bad');btn.disabled=true;});const ok=score===cards.length&&actionOk;q('fb').className=`feedback show ${ok?'ok':'warn'}`;q('fb').innerHTML=ok?'<strong>Рабочие сигналы распознаны.</strong><br>Выгорание связано с хроническим рабочим стрессом и проявляется истощением, дистанцированием и снижением профессиональной эффективности.':`<strong>Верно распределено: ${score} из ${cards.length} сигналов.</strong><br>Не сводите выгорание только к усталости.`;q('check').disabled=true;});
q('reset').addEventListener('click',()=>{placement=Array(cards.length).fill(null);selected=null;action=null;root.querySelectorAll('[data-zone]').forEach(x=>{delete x.dataset.locked;x.className='zone';});q('actions').querySelectorAll('[data-action]').forEach(x=>{x.disabled=false;x.className='choice';});q('fb').className='feedback';render();});render();
})();</script></body></html>
