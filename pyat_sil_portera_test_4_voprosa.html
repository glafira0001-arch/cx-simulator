<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пять сил Портера — интерактивный тест</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#24303b}body{display:flex;justify-content:center;background:#fff}.exercise{position:relative;width:min(100%,900px);min-height:660px;background:#fff2b8;background-image:radial-gradient(circle at 22% 21%,#e7ca6e45 0 1px,transparent 4px),radial-gradient(circle at 70% 60%,#fffac9 0,transparent 38%);overflow:hidden;display:flex;flex-direction:column}.exercise:fullscreen{width:100vw;height:100vh;max-width:none;min-height:100vh}.topbar{position:absolute;right:9px;top:5px;z-index:5}.fullscreen{border:0;background:transparent;color:#ee5c5c;font-size:24px;cursor:pointer;padding:1px 3px}.question-box{position:relative;width:min(70%,540px);min-height:180px;margin:25px auto 24px;background:#fff;border:1px solid #aaa;border-radius:19px;box-shadow:0 4px 7px #0003;display:flex;align-items:center;justify-content:center;padding:41px 20px 26px;text-align:center}.question{font-size:clamp(21px,2.7vw,28px);line-height:1.16;font-weight:400}.step{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #dedede;border-radius:18px;min-width:100px;padding:11px 17px;font-size:18px}.reaction{position:absolute;right:-60px;top:54%;transform:translateY(-50%);font-size:62px;filter:drop-shadow(0 3px 2px #0003);animation:pop .2s ease-out}.reaction.good{color:#fb9e13}.reaction.bad{color:#eaa00d}@keyframes pop{from{scale:.6;opacity:.3}to{scale:1;opacity:1}}.divider{margin:0 5.5%;border:0;border-top:1px solid #d9c991}.choices{padding:15px 6% 110px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}.option{font:inherit;min-height:132px;border:0;border-radius:20px;background:#fff;box-shadow:0 5px 8px #0003;display:flex;align-items:stretch;cursor:pointer;text-align:left;color:#273340;overflow:hidden;transition:box-shadow .15s,background .15s;outline:3px solid transparent;outline-offset:0}.option:focus-visible{outline-color:#469eea}.check-area{width:25%;min-width:82px;max-width:104px;border-right:1px solid #e1e1e1;display:flex;align-items:center;justify-content:center;flex-shrink:0}.square{width:23px;height:23px;border:4px solid #283542;border-radius:6px;display:grid;place-items:center;font-size:21px;line-height:1;font-weight:bold}.option.selected .square:after{content:'✓';font-size:25px;color:#273747;position:relative;top:-3px;left:2px}.answer{font-size:clamp(18px,2.55vw,27px);line-height:1.13;align-self:center;padding:12px 12px;overflow-wrap:break-word}.option.correct{outline:6px solid #81e995}.option.wrong{outline:6px solid #ff6969;background:#fff4f3}.option.disabled{cursor:default}.option:nth-child(3):last-child{grid-column:1/-1;width:49%;justify-self:center}.bottom{position:absolute;right:24px;bottom:20px;display:flex;align-items:center;gap:12px;z-index:4}.circle-button{border:0;border-radius:100%;width:62px;height:62px;background:#308ee1;box-shadow:0 3px 6px #0004;color:white;font-size:32px;cursor:pointer;display:grid;place-items:center}.circle-button:hover{background:#1676ca}.retry{background:#fff;border:1px solid #b6b6b6;border-radius:10px;font-size:16px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 5px #0002}.feedback{position:absolute;bottom:28px;left:6%;right:125px;font-size:16px;font-weight:600;min-height:24px}.feedback.error{color:#ab2525}.feedback.success{color:#267a38}.summary{display:none;text-align:center;margin:auto;padding:40px 20px;max-width:650px}.summary h2{font-size:34px}.summary p{font-size:21px;line-height:1.45}.summary button{background:#308ee1;color:#fff;border:0;padding:13px 24px;font-size:18px;border-radius:12px;cursor:pointer}.exercise:fullscreen .question-box{width:min(65%,850px);min-height:24vh;margin-top:5vh}.exercise:fullscreen .question{font-size:clamp(25px,3.2vh,46px)}.exercise:fullscreen .choices{padding-inline:10%;gap:2vh}.exercise:fullscreen .option{min-height:clamp(105px,19vh,200px)}.exercise:fullscreen .answer{font-size:clamp(22px,2.5vh,34px)}
@media(max-width:600px){.exercise{min-height:640px}.question-box{width:82%;min-height:148px;padding:38px 14px 18px;margin-top:28px}.question{font-size:20px}.reaction{right:-25px;font-size:38px;top:90%}.choices{padding:12px 5% 115px;gap:10px}.option{min-height:105px;border-radius:13px}.check-area{min-width:47px;width:25%}.square{height:19px;width:19px;border-width:3px}.option.selected .square:after{font-size:21px}.answer{font-size:16px;padding:10px}.option:nth-child(3):last-child{width:75%}.feedback{bottom:95px;right:6%;font-size:14px}.bottom{bottom:16px;right:15px}.circle-button{width:54px;height:54px}}
@media(max-width:385px){.choices{grid-template-columns:1fr}.option{min-height:70px}.option:nth-child(3):last-child{width:100%}.exercise{min-height:830px}.check-area{min-width:55px}}
</style></head><body><main class="exercise" id="exercise"><div class="topbar"><button class="fullscreen" id="fullscreen" title="На весь экран" aria-label="Развернуть на весь экран">⛶</button></div><section id="quiz"><div class="question-box"><div class="step" id="step">1 / 4</div><div class="question" id="question"></div><span class="reaction" id="reaction" hidden></span></div><hr class="divider"><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="bottom"><button type="button" class="retry" id="retry" hidden>Попробовать снова</button><button type="button" class="circle-button" id="action" title="Проверить ответ" aria-label="Проверить ответ">☑</button></div></section><section class="summary" id="summary"><h2 id="summaryTitle">Тест пройден!</h2><p id="summaryText"></p><button type="button" id="restart">Пройти заново</button></section></main>
<script>
const questions=[
{q:'Вам необходимо запланировать стратегию развития компании на ближайшие 6 лет, какой метод подойдет?',choices:['Пять сил Портера','PEST-анализ','SWOT-анализ','Квадрат Декарта'],correct:[0]},
{q:'В каких ситуациях нужно использовать Пять сил Портера?',choices:['Для оценки факторов, которые будут угрожать бизнесу в будущем','При планировании запуска нового товара или услуги','При смене стратегии развития компании','Все варианты верны'],correct:[3]},
{q:'В чем суть пяти сил Портера?',choices:['Метод оценки рисков компании, конкуренции и выработки стратегии развития бизнеса','Оценка компании с точки зрения новых возможностей на ближайшие три года','Анализ пяти самых серьезных ошибок и подготовка плана, как их избежать в будущем'],correct:[0]},
{q:'Какие стороны анализируют с помощью пяти сил Портера? Выберите пять вариантов',choices:['Продукты-заменители','Клиенты','Экономика','Внешние факторы','Поставщики','Конкуренты','Рынок','Потенциальные конкуренты'],correct:[0,1,4,5,7],multiple:true}
];
let index=0,chosen=new Set(),checked=false,score=0;const $=id=>document.getElementById(id);
function render(){const item=questions[index];checked=false;chosen.clear();$('step').textContent=`${index+1} / ${questions.length}`;$('question').textContent=item.q;$('reaction').hidden=true;$('feedback').textContent='';$('feedback').className='feedback';$('retry').hidden=true;$('action').textContent='☑';$('action').title='Проверить ответ';$('action').setAttribute('aria-label','Проверить ответ');$('choices').innerHTML='';item.choices.forEach((choice,i)=>{const button=document.createElement('button');button.className='option';button.type='button';button.setAttribute('aria-pressed','false');button.innerHTML='<span class="check-area"><span class="square"></span></span><span class="answer"></span>';button.querySelector('.answer').textContent=choice;button.addEventListener('click',()=>select(i));$('choices').appendChild(button)});}
function select(i){if(checked)return;const q=questions[index];if(q.multiple){if(chosen.has(i))chosen.delete(i);else if(chosen.size<5)chosen.add(i);else{$('feedback').textContent='Выберите ровно пять вариантов.';return}}else{chosen.clear();chosen.add(i)};[...$('choices').children].forEach((b,j)=>{b.classList.toggle('selected',chosen.has(j));b.setAttribute('aria-pressed',chosen.has(j)?'true':'false')});$('feedback').textContent=q.multiple?`Выбрано: ${chosen.size} из 5`:'';}
function validate(){const q=questions[index];if(chosen.size!==(q.multiple?5:1)){$('feedback').textContent=q.multiple?'Выберите пять вариантов ответа.':'Выберите один вариант ответа.';$('feedback').className='feedback error';return}checked=true;const ok=chosen.size===q.correct.length&&q.correct.every(x=>chosen.has(x));if(ok)score++;[...$('choices').children].forEach((b,i)=>{b.classList.add('disabled');if(chosen.has(i))b.classList.add(q.correct.includes(i)?'correct':'wrong')});const reaction=$('reaction');reaction.hidden=false;reaction.textContent=ok?'😄':'😟';reaction.className='reaction '+(ok?'good':'bad');$('feedback').className='feedback '+(ok?'success':'error');$('feedback').textContent=ok?'Верно! Переходите к следующему вопросу.':'Неверно. Вы можете попробовать снова.';$('retry').hidden=ok;$('action').textContent=ok?'➜':'↻';$('action').title=ok?'Следующий вопрос':'Попробовать снова';$('action').setAttribute('aria-label',$('action').title)}
function action(){if(!checked){validate();return}const q=questions[index],correct=q.correct.every(v=>chosen.has(v))&&chosen.size===q.correct.length;if(!correct){render();return}if(index<questions.length-1){index++;render()}else{showSummary()}}
function showSummary(){$('quiz').style.display='none';$('summary').style.display='block';$('summaryTitle').textContent='Тест завершён!';$('summaryText').textContent='Все четыре вопроса выполнены правильно. Вы можете пройти тест ещё раз.'}
$('action').addEventListener('click',action);$('retry').addEventListener('click',render);$('restart').addEventListener('click',()=>{index=0;score=0;$('quiz').style.display='block';$('summary').style.display='none';render()});$('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await $('exercise').requestFullscreen();else await document.exitFullscreen()}catch(e){$('feedback').textContent='Полноэкранный режим недоступен в этом окне браузера.'}});render();
</script></body></html>
