<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Матрица причин</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:15px;line-height:1.42}.task{width:100%;max-width:560px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.04)}h2{font-size:19px;line-height:1.25;margin:0 0 8px}p{margin:0 0 10px}.case{background:#f1f5f9;border-radius:10px;padding:11px;margin:10px 0 12px}.step{font-size:12px;color:#64748b;margin:0 0 8px}.progress{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;background:#2563eb;transition:width .2s}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn:disabled{opacity:.4;cursor:default}.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:9px;font-size:14px}.feedback.ok{display:block;background:#ecfdf5;border:1px solid #86efac}.feedback.bad{display:block;background:#fff7ed;border:1px solid #fdba74}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;margin:7px 0}.option:hover,.option.selected{background:#eff6ff;border-color:#60a5fa}.mini{font-size:13px;color:#64748b}.grid{display:grid;gap:8px}.row{border:1px solid #d8dee8;border-radius:10px;padding:9px;background:#fff}.row b{display:block;margin-bottom:5px}.select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}.checkline{display:flex;gap:8px;align-items:flex-start;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff;margin:7px 0;cursor:pointer}.checkline input{margin-top:3px}.order{display:grid;gap:7px}.orderItem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;background:#fff}.orderBtns{display:flex;gap:4px}.iconbtn{border:1px solid #cbd5e1;background:#f8fafc;border-radius:7px;width:31px;height:31px;cursor:pointer;font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 9px;font:inherit;cursor:pointer;text-align:left}.chip.used{opacity:.35;text-decoration:line-through}.build{min-height:58px;border:1px dashed #94a3b8;border-radius:10px;padding:8px;background:#f8fafc;margin:8px 0 11px}.built{display:block;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:7px 8px;margin:4px 0}.tag{display:inline-block;border-radius:999px;background:#e2e8f0;padding:2px 7px;font-size:12px;margin-bottom:5px}.fragment{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;margin:7px 0}.fragment.selected{background:#fff7ed;border-color:#fb923c}.bubble{border-radius:12px;padding:10px 11px;margin:8px 0}.bubble.emp{background:#eef2ff}.bubble.mgr{background:#f8fafc;border:1px solid #dbe2ea}.hidden{display:none!important}</style></head><body><main class="task"><section class="card"><h2>Матрица причин: поставьте диагноз до разговора</h2>
<div class="case"><b>Задача.</b> Перед вами четыре сбоя. Определите, где искать основную причину, а затем решите, когда уже нужна персональная корректирующая обратная связь.</div>
<div class="progress"><span id="bar"></span></div><div class="step" id="stepLabel"></div><div id="screen"></div>
<div class="controls"><button class="btn ghost" id="back">Назад</button><button class="btn primary" id="check">Проверить ответ</button><button class="btn secondary" id="reset">Начать заново</button></div><div class="feedback" id="fb"></div></section></main><script>const cases=[
['Аналитик не включил выводы: в задаче их не просили, единого стандарта нет.','Понимание'],
['Руководитель проекта знает, что нужно предупреждать заранее, но не умеет видеть зависимости между этапами.','Компетенции'],
['Специалист умеет делать расчет, но у него нет доступа к обязательным данным.','Ресурсы и полномочия'],
['После обновления шаблона одна и та же формула ломается у трех сотрудников.','Процесс']
];
const cats=['Процесс','Понимание','Ресурсы и полномочия','Компетенции'];
let step=0, picks=Array(4).fill(''), decision=null, opts=[];
const screen=document.getElementById('screen'),fb=document.getElementById('fb'),bar=document.getElementById('bar'),lab=document.getElementById('stepLabel');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){fb.className='feedback';fb.textContent='';lab.textContent=step===0?'Шаг 1 из 2 — классифицируйте причины':'Шаг 2 из 2 — примите управленческое решение';bar.style.width=step===0?'50%':'100%';document.getElementById('back').disabled=step===0;
 if(step===0){screen.innerHTML='<div class="grid">'+cases.map((c,i)=>`<div class="row"><b>${i+1}. ${c[0]}</b><select class="select" data-i="${i}"><option value="">Выберите область</option>${cats.map(x=>`<option ${picks[i]===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')+'</div>';screen.querySelectorAll('select').forEach(s=>s.onchange=()=>picks[+s.dataset.i]=s.value)}
 else{if(!opts.length)opts=shuffle([
  {t:'Дать корректирующую обратную связь по конкретному действию',ok:true},
  {t:'Снова объяснить стандарт, хотя сотрудник его знает',ok:false},
  {t:'Ввести ежедневную проверку всех его документов',ok:false},
  {t:'Отправить сотрудника на обучение без диагностики навыка',ok:false}
 ]);screen.innerHTML='<p><b>Иван знает стандарт, умеет выполнять работу, доступы есть, процесс исправен. Он сознательно отправил документ без обязательной проверки. Что делать руководителю?</b></p>'+opts.map((o,i)=>`<button class="option ${decision===i?'selected':''}" data-i="${i}">${o.t}</button>`).join('');screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>{decision=+b.dataset.i;render()})}}
document.getElementById('check').onclick=()=>{if(step===0){if(picks.some(x=>!x)){fb.className='feedback bad';fb.textContent='Заполните все четыре строки.';return}const bad=cases.map((c,i)=>picks[i]===c[1]).filter(x=>!x).length;if(bad){fb.className='feedback bad';fb.textContent='Есть неточность. Проверьте: проблема в ожиданиях, навыке, условиях или в самом процессе?';return}fb.className='feedback ok';fb.textContent='Верно. Вы развели четыре источника проблемы. Теперь решите, когда уже нужна персональная обратная связь.';setTimeout(()=>{step=1;render()},650)}else{if(decision===null){fb.className='feedback bad';fb.textContent='Выберите действие.';return}if(opts[decision].ok){fb.className='feedback ok';fb.textContent='Верно. Когда ожидания, навык и условия в порядке, а сотрудник выбирает нежелательное действие, предмет для корректирующей обратной связи есть.'}else{fb.className='feedback bad';fb.textContent='Здесь уже исключены непонимание, дефицит навыка, ограничения и сбой процесса. Нужна работа именно с выбранным действием сотрудника.'}}};
document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};document.getElementById('reset').onclick=()=>{step=0;picks=Array(4).fill('');decision=null;opts=[];render()};render();</script></body></html>
