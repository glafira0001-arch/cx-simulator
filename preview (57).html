<div id="priceLetterPractice">
<style>
#priceLetterPractice{max-width:560px;margin:0 auto;font-family:Arial,sans-serif;color:#202938}
#priceLetterPractice *{box-sizing:border-box}
#priceLetterPractice .card{border:1px solid #e5e7eb;border-radius:16px;background:#fff;overflow:hidden}
#priceLetterPractice .head,#priceLetterPractice .body,#priceLetterPractice .result{padding:16px}
#priceLetterPractice .head{border-bottom:1px solid #e5e7eb}
#priceLetterPractice .label{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:5px}
#priceLetterPractice h3{margin:0;font-size:18px}
#priceLetterPractice .intro{font-size:13px;line-height:1.45;margin-bottom:10px}
#priceLetterPractice .block{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:7px;background:#f8fafc}
#priceLetterPractice .blockText{font-size:12px;line-height:1.4;flex:1}
#priceLetterPractice .move{display:flex;gap:3px}
#priceLetterPractice .move button{padding:5px 7px;font-size:12px}
#priceLetterPractice .claim{padding:9px;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:7px;font-size:12px;cursor:pointer}
#priceLetterPractice .claim.active{border-color:#2563eb;background:#eff6ff}
#priceLetterPractice .fb{display:none;padding:9px;border-radius:9px;font-size:12px;line-height:1.45;margin-top:10px}
#priceLetterPractice .ok{display:block;background:#ecfdf3;color:#065f46}
#priceLetterPractice .bad{display:block;background:#fff1f0;color:#7a271a}
#priceLetterPractice .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
#priceLetterPractice button{padding:8px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#priceLetterPractice button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
#priceLetterPractice button:disabled{opacity:.4}
#priceLetterPractice .summary{padding:11px;background:#f8fafc;border-radius:10px;font-size:13px;line-height:1.5}
</style>

<div class="card">
<div class="head">
  <div class="label">Практика</div>
  <h3>Соберите логику письма о повышении цены</h3>
</div>

<div class="body" id="plpBody">
  <div id="plpScreen"></div>
  <div id="plpFeedback" class="fb"></div>
  <div class="actions">
    <button id="plpBack">Назад</button>
    <button class="primary" id="plpCheck">Проверить</button>
    <button id="plpEdit">Изменить ответ</button>
    <button class="primary" id="plpNext">Далее</button>
  </div>
</div>

<div class="result" id="plpResult" style="display:none">
  <h3>Логика письма собрана</h3>
  <div class="summary">Рабочая последовательность: сначала ясно сообщить изменение, затем кратко объяснить основания, обозначить переходные условия и завершить конкретным следующим действием.</div>
  <div class="actions"><button class="primary" id="plpRestart">Пройти заново</button></div>
</div>
</div>

<script>
(function(){
function initPriceLetter(){
var blocks=[
 {id:"why",t:"Кратко объяснить подтверждённые причины изменения цены."},
 {id:"change",t:"Сообщить: с 1 сентября цены повышаются на 10%."},
 {id:"cta",t:"Предложить связаться с менеджером для обсуждения перехода."},
 {id:"transition",t:"Указать согласованную рассрочку на три месяца."}
];
var correct=["change","why","transition","cta"];
var claims=[
 "Рост закупочной стоимости у поставщиков подтверждён внутренними данными.",
 "Из-за новых цен качество продукции станет заметно выше.",
 "Новый прайс начинает действовать с 1 сентября.",
 "Рассрочка на три месяца согласована для переходного периода."
];
var selected=null,page=0,checked=[false,false];
function E(id){return document.getElementById(id)}
function orderGood(){
 for(var i=0;i<correct.length;i++) if(blocks[i].id!==correct[i]) return false;
 return true;
}
function render(){
 E("plpBody").style.display="block";
 E("plpResult").style.display="none";
 E("plpScreen").innerHTML="";
 if(page===0){
   var intro=document.createElement("div");
   intro.className="intro";
   intro.innerHTML="Расставьте блоки в той последовательности, в которой они должны появляться в коротком деловом письме.";
   E("plpScreen").appendChild(intro);
   for(var i=0;i<blocks.length;i++){
     (function(i){
       var d=document.createElement("div");d.className="block";
       var txt=document.createElement("div");txt.className="blockText";txt.innerHTML=blocks[i].t;
       var m=document.createElement("div");m.className="move";
       var up=document.createElement("button");up.innerHTML="↑";up.disabled=checked[0]||i===0;
       var dn=document.createElement("button");dn.innerHTML="↓";dn.disabled=checked[0]||i===blocks.length-1;
       up.onclick=function(){var x=blocks[i-1];blocks[i-1]=blocks[i];blocks[i]=x;render()};
       dn.onclick=function(){var x=blocks[i+1];blocks[i+1]=blocks[i];blocks[i]=x;render()};
       m.appendChild(up);m.appendChild(dn);d.appendChild(txt);d.appendChild(m);E("plpScreen").appendChild(d);
     })(i);
   }
 }else{
   var intro2=document.createElement("div");intro2.className="intro";
   intro2.innerHTML="Теперь найдите тезис, который нельзя включать в письмо без дополнительного подтверждения.";
   E("plpScreen").appendChild(intro2);
   for(var j=0;j<claims.length;j++){
     (function(j){
       var c=document.createElement("div");
       c.className="claim"+(selected===j?" active":"");
       c.innerHTML=claims[j];
       c.onclick=function(){if(!checked[1]){selected=j;render()}};
       E("plpScreen").appendChild(c);
     })(j);
   }
 }
 var fb=E("plpFeedback");fb.className="fb";fb.innerHTML="";
 if(checked[page]){
   var ok=page===0?orderGood():selected===1;
   fb.classList.add(ok?"ok":"bad");
   fb.innerHTML=page===0
     ?"Главное изменение должно быть видно сразу. Аргументация объясняет решение, переходные условия смягчают его последствия, а финал задаёт следующий шаг."
     :"Утверждение о будущем росте качества не следует из изменения цены. Если такого основания нет, ИИ не должен добавлять его как аргумент.";
 }
 E("plpBack").disabled=page===0;
 E("plpCheck").style.display=checked[page]?"none":"inline-block";
 E("plpEdit").style.display=checked[page]?"inline-block":"none";
 E("plpNext").style.display=checked[page]?"inline-block":"none";
 E("plpNext").innerHTML=page===1?"Завершить":"Далее";
}
E("plpCheck").onclick=function(){
 if(page===1&&selected===null){alert("Выберите тезис.");return;}
 checked[page]=true;render();
};
E("plpEdit").onclick=function(){checked[page]=false;render()};
E("plpBack").onclick=function(){if(page>0){page--;render()}};
E("plpNext").onclick=function(){
 if(page<1){page++;render()}
 else{E("plpBody").style.display="none";E("plpResult").style.display="block"}
};
E("plpRestart").onclick=function(){
 blocks=[
 {id:"why",t:"Кратко объяснить подтверждённые причины изменения цены."},
 {id:"change",t:"Сообщить: с 1 сентября цены повышаются на 10%."},
 {id:"cta",t:"Предложить связаться с менеджером для обсуждения перехода."},
 {id:"transition",t:"Указать согласованную рассрочку на три месяца."}
 ];
 selected=null;page=0;checked=[false,false];render();
};
render();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initPriceLetter);
else initPriceLetter();
})();
</script>
</div>
