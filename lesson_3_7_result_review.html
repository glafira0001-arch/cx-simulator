<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Разберите результат</title><style>
:root{--bg:#fff;--text:#202733;--muted:#707784;--line:#d9dde4;--soft:#f3f5f7;--dark:#303744;--ok:#eef6f0;--okb:#cfe2d3;--bad:#fbf0ef;--badb:#ead0cd}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text)}body{display:flex;justify-content:center;padding:8px}.app{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:18px;line-height:1.2}h2{margin:0 0 7px;font-size:18px}.counter{font-size:12px;color:var(--muted);white-space:nowrap}.progress{display:flex;gap:5px;margin-top:9px}.progress i{flex:1;height:5px;border-radius:999px;background:var(--soft)}.progress i.active{background:var(--dark)}.progress i.done{background:#a8afb9}.main{padding:12px 16px 14px}.card{background:var(--soft);border-radius:10px;padding:10px 11px;margin-bottom:10px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:4px}.text{font-size:13.5px;line-height:1.35;font-weight:700}.context{font-size:11px;line-height:1.4;color:var(--muted);margin-top:6px}.options{display:grid;gap:6px}.option{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:12px;line-height:1.3;cursor:pointer;text-align:left}.option.selected{border-color:#7e8794;background:#f7f8fa}.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 8px;font-size:11px;line-height:1.25;cursor:pointer}.pill.selected{background:var(--dark);color:#fff;border-color:var(--dark)}.selectrow{display:grid;grid-template-columns:145px 1fr;gap:7px;align-items:center;margin-bottom:7px}.selectrow label{font-size:11.5px;font-weight:700;line-height:1.25}select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12px;background:#fff;color:var(--text);outline:none}select{height:35px;padding:0 8px}textarea{min-height:82px;resize:vertical;line-height:1.35}.feedback{display:none;margin-top:9px;border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.4}.feedback.show{display:block}.feedback.ok{background:var(--ok);border:1px solid var(--okb)}.feedback.bad{background:var(--bad);border:1px solid var(--badb)}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}button{min-height:36px;border:0;border-radius:9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:8px 10px}.primary{background:var(--dark);color:#fff}.secondary{background:var(--soft);color:var(--text)}button:disabled{opacity:.38;cursor:default}.hidden{display:none!important}.finish{display:none;padding:18px 16px}.finish.show{display:block}.finish p{font-size:12.5px;line-height:1.4;color:var(--muted)}.finish-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(24,29,37,.36);z-index:20}.modal.show{display:flex}.modal-card{width:min(500px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:14px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.14)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.modal-head strong{font-size:14px}.close{width:32px;min-height:32px;padding:0;background:var(--soft);font-size:16px}.example{font-size:12px;line-height:1.5}.note{font-size:11px;color:var(--muted);line-height:1.35;margin-top:7px}@media(max-width:430px){.actions{grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}.selectrow{grid-template-columns:105px 1fr}}
</style></head><body><div class="app">
<section id="task"><div class="top"><div class="toprow"><h1 id="title"></h1><div class="counter" id="counter"></div></div><div class="progress" id="progress"></div></div><div class="main"><div class="card"><div class="kicker">Задание</div><div class="text" id="prompt"></div><div class="context" id="context"></div></div><div id="answerArea"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="secondary" id="prevBtn">Назад</button><button class="secondary" id="exampleBtn">Пример</button><button class="primary wide" id="checkBtn">Проверить</button></div><div class="actions hidden" id="nextRow"><button class="primary wide" id="nextBtn">Дальше</button></div></div></section>
<section class="finish" id="finish"><h2>Готово</h2><p>Вы завершили практику. Можно вернуться к последнему экрану или начать задание заново.</p><div class="finish-actions"><button class="secondary" id="returnBtn">Вернуться</button><button class="primary" id="restartBtn">Начать заново</button></div></section>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><strong id="modalTitle">Разбор</strong><button class="close" id="closeBtn">×</button></div><div class="example" id="exampleText"></div></div></div>
</div>
<script>
const CONFIG={"title": "Разберите результат", "screens": [{"type": "grid", "title": "Прогноз и факт", "prompt": "Оцените, насколько подтвердились ключевые ожидания.", "fields": [{"key": "time", "label": "30 мин → факт 40 мин", "options": [{"id": "yes", "text": "Подтвердилось"}, {"id": "part", "text": "Частично"}, {"id": "no", "text": "Не подтвердилось"}], "correct": "part"}, {"key": "ret", "label": "Возвраты без роста → 8% → 13%", "options": [{"id": "yes", "text": "Подтвердилось"}, {"id": "part", "text": "Частично"}, {"id": "no", "text": "Не подтвердилось"}], "correct": "no"}, {"key": "load", "label": "Нагрузка должна выровняться → 4 сотрудника +35%", "options": [{"id": "yes", "text": "Подтвердилось"}, {"id": "part", "text": "Частично"}, {"id": "no", "text": "Не подтвердилось"}], "correct": "no"}], "success": "Верно. Итог нельзя оценивать одним словом: разные ожидания подтвердились по-разному."}, {"type": "grid", "title": "Разделите причины", "prompt": "К какой группе относятся наблюдаемые причины?", "fields": [{"key": "design", "label": "В исходном процессе не было признака сложности заявки", "options": [{"id": "decision", "text": "Качество решения"}, {"id": "exec", "text": "Качество исполнения"}, {"id": "change", "text": "Изменение условий"}, {"id": "random", "text": "Случайность"}], "correct": "decision"}, {"key": "rules", "label": "Руководители дважды меняли правила приоритета", "options": [{"id": "decision", "text": "Качество решения"}, {"id": "exec", "text": "Качество исполнения"}, {"id": "change", "text": "Изменение условий"}, {"id": "random", "text": "Случайность"}], "correct": "exec"}, {"key": "direct", "label": "Часть задач продолжали выдавать напрямую", "options": [{"id": "decision", "text": "Качество решения"}, {"id": "exec", "text": "Качество исполнения"}, {"id": "change", "text": "Изменение условий"}, {"id": "random", "text": "Случайность"}], "correct": "exec"}], "success": "Верно. Дизайн исходной механики относится к качеству решения, отклонение от правил — к исполнению."}, {"type": "multi", "title": "Ранние сигналы", "prompt": "Выберите 3 сигнала, которые можно было заметить до итогового разбора.", "options": [{"id": "returns", "text": "Рост возвратов"}, {"id": "load", "text": "Неравномерная нагрузка"}, {"id": "direct", "text": "Задачи вне общей очереди"}, {"id": "result", "text": "Итоговый срок 40 минут через 6 недель"}, {"id": "random", "text": "Случайное событие после завершения"}], "correct": ["returns", "load", "direct"], "limit": 3, "success": "Верно. Эти сигналы могли запустить корректировку раньше финального результата."}, {"type": "single", "title": "Малое изменение с большим эффектом", "prompt": "Какое действие уже показало непропорционально сильный эффект?", "options": [{"id": "complex", "text": "Краткое описание сложности заявки снизило число ошибочных назначений"}, {"id": "rules", "text": "Два изменения правил приоритета"}, {"id": "direct", "text": "Прямые поручения руководителей"}], "correct": "complex", "success": "Верно. Это локальное изменение стоит сохранить и проверить при расширении."}, {"type": "multi", "title": "Новые правила", "prompt": "Выберите 3 изменения, которые реально улучшают следующий запуск.", "options": [{"id": "complex", "text": "Закрепить поле «сложность заявки» и проверить эффект в других группах"}, {"id": "load", "text": "Еженедельно проверять разницу нагрузки и задавать порог корректировки"}, {"id": "outside", "text": "Отслеживать долю задач вне очереди и назначить владельца сигнала"}, {"id": "care", "text": "В следующий раз быть внимательнее"}, {"id": "control", "text": "Лучше контролировать сотрудников"}, {"id": "all", "text": "Добавить 12 новых показателей"}], "correct": ["complex", "load", "outside"], "limit": 3, "success": "Верно. Хороший разбор заканчивается конкретными правилами, а не общими обещаниями."}, {"type": "open", "title": "Сформулируйте одно правило", "prompt": "Запишите одно новое правило для следующего запуска.", "placeholder": "Если..., то... Владелец... Проверяем...", "minLength": 55, "example": "<b>Пример:</b> в первую неделю запуска ежедневно проверяем долю задач вне общей очереди. Если показатель превышает 5%, руководитель отдела разбирает причины и прекращает параллельную выдачу задач до расширения процесса.", "success": "Ответ сохранен. Сравните его с примером: новое правило должно задавать конкретное действие, сигнал или порог и понятный момент применения."}]}; window.__TEST_CONFIG=CONFIG; let idx=0;
const states=CONFIG.screens.map(s=>({value:s.type==='multi'?[]:s.type==='grid'?{}:'',checked:false})); window.__APP_STATE=states;
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function sameSet(a,b){if(a.length!==b.length)return false;const A=[...a].sort(),B=[...b].sort();return A.every((x,i)=>x===B[i])}
function render(){const s=CONFIG.screens[idx],st=states[idx];$('counter').textContent=`${idx+1} из ${CONFIG.screens.length}`;$('progress').innerHTML=CONFIG.screens.map((_,i)=>`<i class="${i===idx?'active':states[i].checked?'done':''}"></i>`).join('');$('title').textContent=s.title||CONFIG.title;$('prompt').textContent=s.prompt;$('context').textContent=s.context||'';$('context').style.display=s.context?'block':'none';$('answerArea').innerHTML='';
if(s.type==='single'){$('answerArea').innerHTML=`<div class="options">${s.options.map(o=>`<button class="option ${st.value===o.id?'selected':''}" data-single="${esc(o.id)}">${esc(o.text)}</button>`).join('')}</div>`;document.querySelectorAll('[data-single]').forEach(b=>b.onclick=()=>{st.value=b.dataset.single;st.checked=false;render()})}
if(s.type==='multi'){const lim=s.limit||s.correct.length;$('answerArea').innerHTML=`<div class="pills">${s.options.map(o=>`<button class="pill ${st.value.includes(o.id)?'selected':''}" data-multi="${esc(o.id)}">${esc(o.text)}</button>`).join('')}</div><div class="note">Выберите ${lim}.</div>`;document.querySelectorAll('[data-multi]').forEach(b=>b.onclick=()=>{const id=b.dataset.multi;if(st.value.includes(id))st.value=st.value.filter(x=>x!==id);else if(st.value.length<lim)st.value=[...st.value,id];st.checked=false;render()})}
if(s.type==='grid'){$('answerArea').innerHTML=s.fields.map(f=>{const v=st.value[f.key]||'';return `<div class="selectrow"><label>${esc(f.label)}</label><select data-grid="${esc(f.key)}"><option value="">Выберите</option>${f.options.map(o=>`<option value="${esc(o.id)}" ${v===o.id?'selected':''}>${esc(o.text)}</option>`).join('')}</select></div>`}).join('');document.querySelectorAll('[data-grid]').forEach(sel=>sel.onchange=()=>{st.value[sel.dataset.grid]=sel.value;st.checked=false;render()})}
if(s.type==='open'){$('answerArea').innerHTML=`<textarea id="openText" placeholder="${esc(s.placeholder||'Введите ответ')}">${esc(st.value||'')}</textarea><div class="note">${esc(s.note||'')}</div>`;$('openText').oninput=e=>{st.value=e.target.value;st.checked=false;hideFeedbackOnly()}}
$('prevBtn').disabled=idx===0;$('exampleBtn').style.display=s.example?'block':'none';if(st.checked){showFeedback(s.success||'Верно. Обратная связь останется на экране, пока вы сами не нажмете «Дальше».',true);$('nextRow').classList.remove('hidden')}else{hideFeedbackOnly()}$('nextBtn').textContent=idx===CONFIG.screens.length-1?'Завершить':'Дальше'}
function hideFeedbackOnly(){$('feedback').className='feedback';$('feedback').textContent='';$('nextRow').classList.add('hidden')}
function validate(s,st){if(s.type==='single')return st.value===s.correct;if(s.type==='multi')return sameSet(st.value,s.correct);if(s.type==='grid')return s.fields.every(f=>st.value[f.key]===f.correct);if(s.type==='open'){const t=(st.value||'').trim();if(t.length<(s.minLength||35))return false;if(s.forbidden&&s.forbidden.some(x=>t.toLowerCase().includes(x.toLowerCase())))return false;return true}return false}
function check(){const s=CONFIG.screens[idx],st=states[idx];if(validate(s,st)){st.checked=true;showFeedback(s.success||'Верно. Прочитайте обратную связь и переходите дальше, когда будете готовы.',true);$('nextRow').classList.remove('hidden');$('progress').innerHTML=CONFIG.screens.map((_,i)=>`<i class="${i===idx?'active':states[i].checked?'done':''}"></i>`).join('')}else{st.checked=false;showFeedback(s.fail||'Есть неточность. Перепроверьте ответ или откройте пример.',false);$('nextRow').classList.add('hidden')}}
function showFeedback(t,ok){$('feedback').textContent=t;$('feedback').className='feedback show '+(ok?'ok':'bad')}
$('checkBtn').onclick=check;$('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};$('nextBtn').onclick=()=>{if(!states[idx].checked)return;if(idx<CONFIG.screens.length-1){idx++;render()}else finish()};$('exampleBtn').onclick=()=>{const s=CONFIG.screens[idx];$('modalTitle').textContent=s.exampleTitle||'Разбор';$('exampleText').innerHTML=s.example||'';$('modal').classList.add('show')};$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};function finish(){$('task').style.display='none';$('finish').classList.add('show')}$('returnBtn').onclick=()=>{$('finish').classList.remove('show');$('task').style.display='block';idx=CONFIG.screens.length-1;render()};$('restartBtn').onclick=()=>{states.forEach((st,i)=>{st.value=CONFIG.screens[i].type==='multi'?[]:CONFIG.screens[i].type==='grid'?{}:'';st.checked=false});idx=0;$('finish').classList.remove('show');$('task').style.display='block';render()};render();
</script>
</body></html>
