<div id="aiLesson10">
<style>
#aiLesson10{max-width:560px;margin:0 auto;font-family:Arial,sans-serif;color:#202938}
#aiLesson10 *{box-sizing:border-box}
#aiLesson10 .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}
#aiLesson10 .header,#aiLesson10 .screen,#aiLesson10 .result{padding:16px}
#aiLesson10 .header{border-bottom:1px solid #e5e7eb}
#aiLesson10 .label{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:5px}
#aiLesson10 h3{margin:0;font-size:18px}
#aiLesson10 .progress{height:5px;margin-top:12px;background:#eef2f6;border-radius:9px;overflow:hidden}
#aiLesson10 .progress-fill{height:100%;background:#2563eb}
#aiLesson10 .meta{font-size:12px;color:#667085;margin-bottom:8px}
#aiLesson10 .question-title{font-size:16px;font-weight:700;margin-bottom:10px}
#aiLesson10 .box{padding:10px 11px;border:1px solid #e5e7eb;border-radius:11px;background:#f8fafc;font-size:13px;line-height:1.45;margin:9px 0}
#aiLesson10 .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#aiLesson10 .tab{padding:5px 8px;background:#eef2f6;border-radius:20px;font-size:11px;color:#475467}
#aiLesson10 .table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:11px;margin:9px 0}
#aiLesson10 table{width:100%;border-collapse:collapse;font-size:12px}
#aiLesson10 th,#aiLesson10 td{padding:7px 8px;border-bottom:1px solid #e5e7eb;text-align:left}
#aiLesson10 .question{font-size:14px;line-height:1.45;margin:11px 0}
#aiLesson10 .options{display:grid;gap:8px}
#aiLesson10 .option{padding:10px 11px;border:1px solid #e5e7eb;border-radius:11px;font-size:13px;line-height:1.4;cursor:pointer}
#aiLesson10 .option.selected{border-color:#7ca5ff;background:#f5f8ff}
#aiLesson10 .feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:11px;font-size:13px;line-height:1.45}
#aiLesson10 .feedback.correct{display:block;background:#ecfdf3;color:#065f46;border:1px solid #abefc6}
#aiLesson10 .feedback.wrong{display:block;background:#fff1f0;color:#7a271a;border:1px solid #fecdca}
#aiLesson10 .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
#aiLesson10 button{padding:8px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#aiLesson10 button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
#aiLesson10 button:disabled{opacity:.4}
#aiLesson10 .score{font-size:30px;font-weight:800}
#aiLesson10 .row{display:flex;justify-content:space-between;padding:8px 9px;border:1px solid #e5e7eb;border-radius:9px;margin:7px 0;font-size:12px}
#aiLesson10 .ok{color:#067647;font-weight:700}
#aiLesson10 .bad{color:#b42318;font-weight:700}
#aiLesson10 .final{margin-top:12px;padding:10px 11px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;font-size:13px;line-height:1.45}
</style>

<div class="card">
<div class="header">
<div class="label">Практикум · Урок 10</div>
<h3>Проведите аудит Excel-книги</h3>
<div class="progress"><div class="progress-fill" id="l10Progress"></div></div>
</div>

<div class="screen" id="l10Screen">
<div class="meta" id="l10Meta"></div>
<div class="question-title" id="l10Title"></div>
<div id="l10Scenario"></div>
<div class="question" id="l10Question"></div>
<div class="options" id="l10Options"></div>
<div class="feedback" id="l10Feedback"></div>

<div class="actions">
<button id="l10Back">Назад</button>
<button class="primary" id="l10Check">Проверить</button>
<button id="l10Edit">Изменить ответ</button>
<button class="primary" id="l10Next">Далее</button>
</div>
</div>

<div class="result" id="l10Result" style="display:none">
<div class="meta">Результат симулятора</div>
<div class="score" id="l10Score"></div>
<div id="l10Rows"></div>
<div class="final"><strong>Логика аудита:</strong><br>структура книги → связи между листами → внутренние конфликты → структурные ошибки → карта несоответствий.</div>
<div class="actions">
<button id="l10Error">Вернуться к ошибке</button>
<button class="primary" id="l10Restart">Пройти заново</button>
</div>
</div>
</div>

<script>
(function(){
function startLesson10(){

const questions=[
{
 title:"Сначала найдите связи между листами",
 scenario:'<div class="tabs"><span class="tab">Продажи</span><span class="tab">Сегменты</span><span class="tab">План</span><span class="tab">Итоги</span></div>',
 question:"Как лучше начать аудит большой книги?",
 options:[
   "Найти сегменты с самым низким выполнением плана.",
   "Определить назначение листов и показатели, которые связаны между ними.",
   "Найти все необычные значения.",
   "Сразу попросить ИИ исправить возможные ошибки."
 ],
 correct:1,
 explanation:"Для внутреннего аудита сначала нужна карта связей: что является детализацией, что итогом и какие показатели должны согласовываться.",
 short:"Карта книги"
},
{
 title:"Локализуйте конфликт",
 scenario:'<div class="table-wrap"><table><tr><th>Источник</th><th>Выручка июня</th></tr><tr><td>Сумма сегментов</td><td>4,2 млн ₽</td></tr><tr><td>Лист «Итоги»</td><td>5,1 млн ₽</td></tr></table></div>',
 question:"Что уже можно утверждать?",
 options:[
   "Выручка в итогах завышена на 900 тыс. ₽.",
   "Между детализацией и итогом есть расхождение 900 тыс. ₽.",
   "Сегменты недосчитаны на 900 тыс. ₽.",
   "На листе «Итоги» неверная формула."
 ],
 correct:1,
 explanation:"Расхождение доказано, но пока неизвестно, где находится правильное значение. Аудит сначала фиксирует конфликт.",
 short:"Итог и детализация"
},
{
 title:"Не выбирайте источник истины заранее",
 scenario:'<div class="table-wrap"><table><tr><th>Лист</th><th>План корпоративного сегмента</th></tr><tr><td>«План»</td><td>1 000 000 ₽</td></tr><tr><td>«Итоги»</td><td>900 000 ₽</td></tr></table></div>',
 question:"Какой вывод корректен?",
 options:[
   "Правильно 1 млн ₽: значение находится на листе «План».",
   "Правильно 900 тыс. ₽: значение находится в итоговом отчёте.",
   "Есть внутренний конфликт; актуальное значение нужно установить отдельно.",
   "Для анализа можно взять среднее значение — 950 тыс. ₽."
 ],
 correct:2,
 explanation:"Название листа не гарантирует актуальность. Нужно определить источник истины или правило обновления данных.",
 short:"Источник истины"
},
{
 title:"Отделите ошибку файла от изменения бизнеса",
 scenario:'<div class="box"><strong>Сигнал 1:</strong> сделка №4581 записана дважды с одинаковыми полями.<br><br><strong>Сигнал 2:</strong> возвраты в августе выросли втрое, но все операции подтверждаются детализацией.</div>',
 question:"Что относится именно к проблеме качества Excel-книги?",
 options:[
   "Только рост возвратов.",
   "Оба сигнала.",
   "Только возможный дубль сделки.",
   "Ни один сигнал."
 ],
 correct:2,
 explanation:"Дубль — структурная проблема данных. Рост возвратов может быть реальным бизнес-изменением и сам по себе не является ошибкой книги.",
 short:"Структура или бизнес"
}
];

const E=id=>document.getElementById(id);

const screen=E("l10Screen"),result=E("l10Result"),progress=E("l10Progress"),
meta=E("l10Meta"),title=E("l10Title"),scenario=E("l10Scenario"),
question=E("l10Question"),options=E("l10Options"),feedback=E("l10Feedback"),
back=E("l10Back"),check=E("l10Check"),edit=E("l10Edit"),next=E("l10Next"),
score=E("l10Score"),rows=E("l10Rows"),error=E("l10Error"),restart=E("l10Restart");

let current=0,answers=[],checked=[];

function good(i){return answers[i]===questions[i].correct}

function render(){
 screen.style.display="block";
 result.style.display="none";

 const q=questions[current];

 meta.textContent="Экран "+(current+1)+" из "+questions.length;
 title.textContent=q.title;
 scenario.innerHTML=q.scenario;
 question.textContent=q.question;
 options.innerHTML="";

 q.options.forEach(function(text,index){
   const el=document.createElement("div");
   el.className="option"+(answers[current]===index?" selected":"");
   el.textContent=text;
   el.onclick=function(){answers[current]=index;render()};
   options.appendChild(el);
 });

 feedback.className="feedback";
 feedback.innerHTML="";

 if(checked[current]){
   const ok=good(current);
   feedback.classList.add(ok?"correct":"wrong");
   feedback.innerHTML="<strong>"+(ok?"Верно":"Не совсем")+"</strong><br>"+q.explanation;
 }

 back.disabled=current===0;
 check.style.display=checked[current]?"none":"inline-block";
 edit.style.display=checked[current]?"inline-block":"none";
 next.style.display=checked[current]?"inline-block":"none";
 next.textContent=current===questions.length-1?"Посмотреть результат":"Далее";
 progress.style.width=((current+1)/questions.length*100)+"%";
}

check.onclick=function(){
 if(answers[current]===undefined){alert("Сначала выберите ответ.");return}
 checked[current]=true;render();
};

edit.onclick=function(){checked[current]=false;render()};
back.onclick=function(){if(current>0){current--;render()}};
next.onclick=function(){
 if(current<questions.length-1){current++;render()}
 else showResult();
};

function showResult(){
 screen.style.display="none";
 result.style.display="block";

 let count=0;
 rows.innerHTML="";

 questions.forEach(function(q,index){
   const ok=good(index);
   if(ok)count++;

   const row=document.createElement("div");
   row.className="row";
   row.innerHTML="<span>"+(index+1)+". "+q.short+"</span><span class='"+(ok?"ok":"bad")+"'>"+(ok?"верно":"ошибка")+"</span>";
   rows.appendChild(row);
 });

 score.textContent=count+" / "+questions.length;
 error.style.display=count===questions.length?"none":"inline-block";
}

error.onclick=function(){
 const first=questions.findIndex(function(_,i){return !good(i)});
 if(first!==-1){current=first;render()}
};

restart.onclick=function(){current=0;answers=[];checked=[];render()};

render();
}

if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded",startLesson10);
}else{
 startLesson10();
}
})();
</script>
</div>
