<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доброта или безотказность</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="kindnessTask">

  <div class="progress"><div data-role="bar"></div></div>
  <div class="head">
    <div class="kicker">Доброта и безотказность</div>
    <h2>Определите, что стоит за согласием</h2>
    <p class="lead">Внешне человек говорит «да» в обоих случаях. Отличите свободный выбор от реакции страха.</p>
  </div>
  <div class="body">
    <div class="card">
      <span class="badge" data-role="step"></span>
      <p data-role="case" style="margin:7px 0 0;font-size:12px;line-height:1.4"></p>
    </div>
    <div class="small" style="margin:8px 0 5px">Что это?</div>
    <div class="grid2" data-role="types"></div>
    <div data-role="actionBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Лучший следующий шаг</div>
      <div class="grid2" data-role="actions"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="next" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('kindnessTask');
  if (!root) return;

  const cases=[
    {
      text:'Вы свободны, вам нравится задача, и после согласия вы чувствуете интерес, а не тяжесть.',
      type:'kindness',
      actions:[
        {text:'Согласиться и заранее обозначить объем помощи',correct:true},
        {text:'Отказать на всякий случай',correct:false},
        {text:'Согласиться на все дополнительные задачи',correct:false},
        {text:'Проверить, не осудят ли вас за отказ',correct:false}
      ],
      note:'Есть ресурс, желание и ясный объем помощи — это осознанная доброта.'
    },
    {
      text:'Вы устали, хотите отказать, но соглашаетесь только потому, что боитесь показаться эгоистичным.',
      type:'compliance',
      actions:[
        {text:'Согласиться, а потом молча злиться',correct:false},
        {text:'Пообещать помощь и отменить позже',correct:false},
        {text:'Вежливо и четко отказаться без долгих оправданий',correct:true},
        {text:'Мямлить, пока человек сам не отстанет',correct:false}
      ],
      note:'Главный мотив — страх оценки, а не желание помочь. Здесь добрым может быть именно честный отказ.'
    },
    {
      text:'Вы хотите помочь, но понимаете, что можете выделить только 20 минут, а не весь вечер.',
      type:'kindness',
      actions:[
        {text:'Отдать весь вечер, чтобы помощь считалась настоящей',correct:false},
        {text:'Предложить конкретные 20 минут и не расширять объем',correct:true},
        {text:'Сразу отказаться от любой помощи',correct:false},
        {text:'Сказать «посмотрим», не обозначая границ',correct:false}
      ],
      note:'Осознанная помощь может быть ограниченной. Доброта не требует отдавать больше ресурса, чем вы выбрали.'
    }
  ];
  const types=[
    {value:'kindness',text:'Свободная помощь'},
    {value:'compliance',text:'Безотказность из страха'}
  ];
  let index=0,type=null,action=null,checked=false,score=0;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function render(){
    const item=cases[index];
    type=null;action=null;checked=false;
    q('step').textContent=`Ситуация ${index+1} из ${cases.length}`;
    q('case').textContent=item.text;
    q('bar').style.width=`${index/cases.length*100}%`;
    q('types').innerHTML=types.map(t=>
      `<button type="button" class="choice" data-type="${t.value}">${t.text}</button>`
    ).join('');
    q('actions').innerHTML=item.actions.map((a,i)=>
      `<button type="button" class="choice" data-action="${i}">${a.text}</button>`
    ).join('');
    q('types').querySelectorAll('[data-type]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('types').querySelectorAll('[data-type]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        type=btn.dataset.type;
        q('actionBlock').classList.remove('hidden');
        q('next').disabled=action===null;
      });
    });
    q('actions').querySelectorAll('[data-action]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        q('actions').querySelectorAll('[data-action]').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        action=Number(btn.dataset.action);
        q('next').disabled=type===null;
      });
    });
    q('actionBlock').classList.add('hidden');
    q('next').disabled=true;
    q('next').textContent='Проверить';
    q('fb').className='feedback';
  }
  q('next').addEventListener('click',()=>{
    const item=cases[index];
    if(!checked){
      if(type===null||action===null)return;
      const ok=type===item.type&&item.actions[action].correct;
      if(ok)score++;
      q('types').querySelectorAll('[data-type]').forEach(btn=>{
        if(btn.dataset.type===item.type)btn.classList.add('good');
        else if(btn.dataset.type===type)btn.classList.add('bad');
        btn.disabled=true;
      });
      q('actions').querySelectorAll('[data-action]').forEach(btn=>{
        const i=Number(btn.dataset.action);
        if(item.actions[i].correct)btn.classList.add('good');
        else if(i===action)btn.classList.add('bad');
        btn.disabled=true;
      });
      q('fb').className=`feedback show ${ok?'ok':'warn'}`;
      q('fb').innerHTML=`<strong>${ok?'Верно.':'Мотив или действие определены неверно.'}</strong><br>${item.note}`;
      checked=true;
      q('next').textContent=index===cases.length-1?'Показать результат':'Следующая ситуация';
      return;
    }
    if(index<cases.length-1){index++;render();}
    else{
      q('bar').style.width='100%';
      q('types').classList.add('hidden');
      q('actionBlock').classList.add('hidden');
      q('case').innerHTML=`Точных решений: <strong>${score} из ${cases.length}</strong>.`;
      q('fb').className=`feedback show ${score===cases.length?'ok':'warn'}`;
      q('fb').innerHTML='Доброта определяется не словом «да», а свободой выбора, наличием ресурса и отсутствием скрытой злости.';
      q('next').disabled=true;
      q('next').textContent='Готово';
    }
  });
  q('reset').addEventListener('click',()=>{
    index=0;type=null;action=null;checked=false;score=0;
    q('types').classList.remove('hidden');
    render();
  });
  render();

})();
</script>
</body>
</html>
