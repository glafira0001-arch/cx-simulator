<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Предел выносливости</title>
<style>
:root{
  --ink:#18212f; --muted:#667085; --line:#d9e0e8; --bg:#f5f7fa;
  --card:#ffffff; --accent:#3157d5; --accent-soft:#eef2ff;
  --ok:#147a55; --ok-soft:#e9f8f1; --bad:#b42318; --bad-soft:#fff0ee;
  --warn:#9a6700; --warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#f8faff,#eef2ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card + .card{margin-top:10px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;color:var(--muted);line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit}
.choice,.chip,.task-card,.action{width:100%;text-align:left;border:1px solid var(--line);background:#fff;
  border-radius:11px;padding:10px 11px;cursor:pointer;color:var(--ink);transition:.15s}
.choice:hover,.chip:hover,.task-card:hover,.action:hover{border-color:#9cadf3}
.choice.selected,.chip.selected,.task-card.selected,.action.selected{
  border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.choice.good,.chip.good,.task-card.good,.action.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad,.chip.bad,.task-card.bad,.action.bad{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:white;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#0c5b3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.feedback.bad{background:var(--bad-soft);color:#8e1b13}
.progress{height:5px;background:#e7ebf2}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef1f6;color:#475467}
.hidden{display:none!important}
.metric{display:flex;justify-content:space-between;gap:12px;align-items:center}
.metric strong{font-size:18px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.task{border-radius:14px}.head,.body{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>

<div class="task">
  <div class="head">
    <div class="kicker">Предел выносливости</div>
    <h2>Собрать день без скрытой переработки</h2>
    <p class="lead">Ваш лимит — 8 эквивалентных часов. Коммуникации стоят вдвое дороже, а один час нужно оставить резервом.</p>
  </div>
  <div class="body">
    <div class="card">
      <div class="metric"><span>Выбранная нагрузка</span><strong id="load">0 / 7</strong></div>
      <div class="small">7 единиц работы + 1 единица резерва = личный предел 8</div>
    </div>
    <div class="small" style="margin:10px 0 6px">Выберите задачи на сегодня. Обязательные отмечены.</div>
    <div id="tasks" class="grid2"></div>
    <div class="actions">
      <button class="secondary" id="reset">Начать заново</button>
      <button class="primary" id="check">Проверить план</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const tasks=[
 {name:'Отчет: 2 ч в тишине',cost:2,must:true},
 {name:'Переговоры с клиентом: 1 ч',cost:2,must:true},
 {name:'Командный созвон: 1 ч',cost:2},
 {name:'Разбор почты: 1 ч',cost:1},
 {name:'Стратегическая сессия: 1,5 ч',cost:3},
 {name:'Документация: 1 ч',cost:1}
];
let selected=new Set();
const box=document.querySelector('#tasks');
function render(){
 box.innerHTML=tasks.map((t,i)=>`<button class="task-card ${selected.has(i)?'selected':''}" data-i="${i}">
   <strong style="font-size:13px">${t.name}</strong><br><span class="small">${t.cost} ед.${t.must?' · обязательно':''}</span>
 </button>`).join('');
 box.querySelectorAll('.task-card').forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i;selected.has(i)?selected.delete(i):selected.add(i);render();
 });
 const load=[...selected].reduce((s,i)=>s+tasks[i].cost,0);
 document.querySelector('#load').textContent=`${load} / 7`;
 document.querySelector('#load').style.color=load>7?'var(--bad)':load===7?'var(--ok)':'var(--ink)';
}
document.querySelector('#check').onclick=()=>{
 const load=[...selected].reduce((s,i)=>s+tasks[i].cost,0);
 const must=tasks.every((t,i)=>!t.must||selected.has(i));
 const hasReserve=load<=7, usesDay=load>=5;
 const fb=document.querySelector('#fb');
 if(must&&hasReserve&&usesDay){
   fb.className='feedback show ok';
   fb.innerHTML=`<strong>План выдерживает ваш предел.</strong><br>Нагрузка — ${load} единиц, обязательные задачи включены, резерв сохранен. Остальное нужно перенести, а не «доделать вечером».`;
 }else{
   fb.className='feedback show warn';
   let reasons=[];
   if(!must) reasons.push('не включены все обязательные задачи');
   if(!hasReserve) reasons.push(`нагрузка ${load} превышает рабочий лимит 7`);
   if(!usesDay) reasons.push('план слишком пустой и не проверяет реальный предел');
   fb.innerHTML=`<strong>План требует пересборки:</strong> ${reasons.join('; ')}.<br>Считайте стоимость коммуникаций, а резерв защищайте как часть графика.`;
 }
};
document.querySelector('#reset').onclick=()=>{selected=new Set();document.querySelector('#fb').className='feedback';render();};
render();
</script>
</body>
</html>
