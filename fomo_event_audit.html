<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аудит FOMO</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:93%;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.35}
.them{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.energy{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.energy span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eef1ff;font-size:11px;font-weight:800}
.energy span.used{background:#ffdede;color:#8f1c1c}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="fomoAuditTask">

  <div class="head">
    <div class="kicker">Осознанный пропуск</div>
    <h2>Отделите желание от страха пропустить</h2>
    <p class="lead">Для каждого события определите настоящий мотив участия и выберите решение, которое поддерживает ваш собственный вектор.</p>
  </div>
  <div class="body">
    <div data-role="events"></div>
    <div data-role="manifestBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Как сформулировать осознанный пропуск?</div>
      <div class="grid2" data-role="manifests"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить решения</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('fomoAuditTask');
  if (!root) return;

  const events=[
    {text:'Выставка художника, которого вы давно любите. Есть свободный вечер.',correct:'want'},
    {text:'Вечеринка знакомых, на которую идут «все», но вы устали и хотите тишины.',correct:'fomo'},
    {text:'Семейный ужин, где вам действительно важно увидеть близкого человека.',correct:'want'},
    {text:'Бизнес-завтрак «для галочки», хотя тема не связана с вашими задачами.',correct:'fomo'},
    {text:'Поездка, о которой вы мечтали до того, как увидели чужие фотографии.',correct:'want'}
  ];
  const manifests=[
    {text:'«Я пропущу встречу, потому что мне лень и все равно».',correct:false},
    {text:'«Я выбираю не участвовать: сейчас мне важнее восстановиться и закончить свой проект без фоновой тревоги».',correct:true},
    {text:'«Наверное, потом буду жалеть, но не пойду».',correct:false},
    {text:'«Не пойду, чтобы доказать всем независимость».',correct:false}
  ];
  let answers=Array(events.length).fill(null),manifest=null;
  const q=role=>root.querySelector(`[data-role="${role}"]`);
  function render(){
    q('events').innerHTML=events.map((e,i)=>`
      <div class="row-card" data-row="${i}">
        <div style="font-size:12px;line-height:1.35">${e.text}</div>
        <div class="inline-choices">
          <button type="button" class="answer-btn ${answers[i]==='want'?'selected':''}" data-value="want">Я действительно хочу</button>
          <button type="button" class="answer-btn ${answers[i]==='fomo'?'selected':''}" data-value="fomo">Боюсь пропустить</button>
        </div>
      </div>`).join('');
    q('events').querySelectorAll('[data-row]').forEach(row=>{
      const i=Number(row.dataset.row);
      row.querySelectorAll('[data-value]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          answers[i]=btn.dataset.value;
          q('fb').className='feedback';
          render();
        });
      });
    });
    const complete=answers.every(v=>v!==null);
    q('manifestBlock').classList.toggle('hidden',!complete);
    q('check').disabled=!(complete&&manifest!==null);
  }
  q('manifests').innerHTML=manifests.map((m,i)=>
    `<button type="button" class="choice" data-manifest="${i}">${m.text}</button>`
  ).join('');
  q('manifests').querySelectorAll('[data-manifest]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('manifests').querySelectorAll('[data-manifest]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      manifest=Number(btn.dataset.manifest);
      q('check').disabled=!answers.every(v=>v!==null);
    });
  });
  q('check').addEventListener('click',()=>{
    let score=0;
    q('events').querySelectorAll('[data-row]').forEach(row=>{
      const i=Number(row.dataset.row);
      row.querySelectorAll('[data-value]').forEach(btn=>{
        const value=btn.dataset.value;
        if(value===events[i].correct)btn.classList.add('good');
        else if(value===answers[i])btn.classList.add('bad');
        btn.disabled=true;
      });
      if(answers[i]===events[i].correct)score++;
    });
    q('manifests').querySelectorAll('[data-manifest]').forEach(btn=>{
      const i=Number(btn.dataset.manifest);
      if(manifests[i].correct)btn.classList.add('good');
      else if(i===manifest)btn.classList.add('bad');
      btn.disabled=true;
    });
    const ok=score===events.length&&manifests[manifest].correct;
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Выбор опирается на внутренний отклик.</strong><br>Вы не отказываетесь от жизни, а освобождаете время от событий, которые нужны только для ощущения «я тоже там был».'
      : `<strong>Верно определено: ${score} из ${events.length} мотивов.</strong><br>Желание существовало до внешнего давления. FOMO появляется из сравнения, статуса и страха оказаться вне общего потока.`;
    q('check').disabled=true;
  });
  q('reset').addEventListener('click',()=>{
    answers=Array(events.length).fill(null);manifest=null;
    q('manifests').querySelectorAll('[data-manifest]').forEach(x=>{x.disabled=false;x.className='choice';});
    q('fb').className='feedback';
    render();
  });
  render();

})();
</script>
</body>
</html>
