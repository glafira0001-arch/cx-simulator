<div id="priceEditPractice">
<style>
#priceEditPractice{max-width:560px;margin:0 auto;font-family:Arial,sans-serif;color:#202938}
#priceEditPractice *{box-sizing:border-box}
#priceEditPractice .card{border:1px solid #e5e7eb;border-radius:16px;background:#fff;overflow:hidden}
#priceEditPractice .head,#priceEditPractice .body,#priceEditPractice .result{padding:16px}
#priceEditPractice .head{border-bottom:1px solid #e5e7eb}
#priceEditPractice .label{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:5px}
#priceEditPractice h3{margin:0;font-size:18px}
#priceEditPractice .intro{font-size:13px;line-height:1.45;margin-bottom:10px}
#priceEditPractice .sentence{padding:9px;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:7px;font-size:12px;line-height:1.4;cursor:pointer}
#priceEditPractice .sentence.active{border-color:#dc2626;background:#fff1f2;text-decoration:line-through}
#priceEditPractice .tone{padding:9px;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:7px;font-size:12px;line-height:1.4;cursor:pointer}
#priceEditPractice .tone.active{border-color:#2563eb;background:#eff6ff}
#priceEditPractice .fb{display:none;padding:9px;border-radius:9px;font-size:12px;line-height:1.45;margin-top:10px}
#priceEditPractice .ok{display:block;background:#ecfdf3;color:#065f46}
#priceEditPractice .bad{display:block;background:#fff1f0;color:#7a271a}
#priceEditPractice .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
#priceEditPractice button{padding:8px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#priceEditPractice button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
#priceEditPractice button:disabled{opacity:.4}
#priceEditPractice .summary{padding:11px;background:#f8fafc;border-radius:10px;font-size:13px;line-height:1.5}
</style>

<div class="card">
<div class="head">
  <div class="label">Практика</div>
  <h3>Сократите письмо без потери позиции</h3>
</div>

<div class="body" id="pepBody">
  <div id="pepScreen"></div>
  <div id="pepFeedback" class="fb"></div>
  <div class="actions">
    <button id="pepBack">Назад</button>
    <button class="primary" id="pepCheck">Проверить</button>
    <button id="pepEdit">Изменить ответ</button>
    <button class="primary" id="pepNext">Далее</button>
  </div>
</div>

<div class="result" id="pepResult" style="display:none">
  <h3>Редакторская проверка завершена</h3>
  <div class="summary">При сокращении делового письма сначала убирают повторные извинения, эмоциональные вступления и общие слова. Цифры, даты, подтверждённые основания и переходные условия сохраняют.</div>
  <div class="actions"><button class="primary" id="pepRestart">Пройти заново</button></div>
</div>
</div>

<script>
(function(){
function initPriceEdit(){
var sentences=[
 "Мы очень ценим сложившиеся за многие годы отношения и искренне дорожим нашим сотрудничеством.",
 "С 1 сентября отпускные цены на продукцию увеличиваются на 10%.",
 "Изменение связано с ростом закупочной стоимости у поставщиков и логистических расходов.",
 "Мы понимаем, что любое повышение стоимости является неприятным обстоятельством и может вызвать определённые неудобства.",
 "Для переходного периода готовы предоставить рассрочку платежей на три месяца.",
 "Ещё раз выражаем надежду, что данное изменение не повлияет на наши многолетние партнёрские отношения."
];
var correctDelete=[0,3,5],deleted=[];
var toneOptions=[
 "Мы вынуждены повысить цены, и просим с пониманием отнестись к неизбежному решению.",
 "С 1 сентября отпускные цены увеличиваются на 10%. Причины изменения — рост закупочной стоимости и логистических расходов.",
 "К сожалению, нам крайне тяжело сообщать о столь неприятном изменении стоимости.",
 "С 1 сентября действует новый прайс. Просим учитывать это при дальнейших заказах."
];
var selectedTone=null,page=0,checked=[false,false];
function E(id){return document.getElementById(id)}
function same(a,b){return a.slice().sort().join(",")===b.slice().sort().join(",")}
function render(){
 E("pepBody").style.display="block";E("pepResult").style.display="none";
 E("pepScreen").innerHTML="";
 if(page===0){
   var x=document.createElement("div");x.className="intro";
   x.innerHTML="Письмо слишком длинное. Отметьте три предложения, которые можно удалить в первую очередь без потери фактов и условий.";
   E("pepScreen").appendChild(x);
   for(var i=0;i<sentences.length;i++){
     (function(i){
       var d=document.createElement("div");
       d.className="sentence"+(deleted.indexOf(i)>=0?" active":"");
       d.innerHTML=sentences[i];
       d.onclick=function(){
         if(checked[0])return;
         var p=deleted.indexOf(i);
         if(p>=0)deleted.splice(p,1);
         else if(deleted.length<3)deleted.push(i);
         render();
       };
       E("pepScreen").appendChild(d);
     })(i);
   }
 }else{
   var y=document.createElement("div");y.className="intro";
   y.innerHTML="Выберите формулировку, которая сохраняет деловой тон и сообщает главное без давления или оправданий.";
   E("pepScreen").appendChild(y);
   for(var j=0;j<toneOptions.length;j++){
     (function(j){
       var d=document.createElement("div");
       d.className="tone"+(selectedTone===j?" active":"");
       d.innerHTML=toneOptions[j];
       d.onclick=function(){if(!checked[1]){selectedTone=j;render()}};
       E("pepScreen").appendChild(d);
     })(j);
   }
 }
 var fb=E("pepFeedback");fb.className="fb";fb.innerHTML="";
 if(checked[page]){
   var ok=page===0?same(deleted,correctDelete):selectedTone===1;
   fb.classList.add(ok?"ok":"bad");
   fb.innerHTML=page===0
    ?"Удалять стоит общие декларации о ценности отношений и повторное сожаление. Размер повышения, причины и переходные условия должны остаться."
    :"Рабочий тон прямо сообщает изменение и основания. Остальные варианты либо давят на получателя, либо чрезмерно оправдываются, либо дают слишком мало контекста.";
 }
 E("pepBack").disabled=page===0;
 E("pepCheck").style.display=checked[page]?"none":"inline-block";
 E("pepEdit").style.display=checked[page]?"inline-block":"none";
 E("pepNext").style.display=checked[page]?"inline-block":"none";
 E("pepNext").innerHTML=page===1?"Завершить":"Далее";
}
E("pepCheck").onclick=function(){
 if(page===0&&deleted.length!==3){alert("Выберите три предложения для удаления.");return;}
 if(page===1&&selectedTone===null){alert("Выберите формулировку.");return;}
 checked[page]=true;render();
};
E("pepEdit").onclick=function(){checked[page]=false;render()};
E("pepBack").onclick=function(){if(page>0){page--;render()}};
E("pepNext").onclick=function(){
 if(page<1){page++;render()}
 else{E("pepBody").style.display="none";E("pepResult").style.display="block"}
};
E("pepRestart").onclick=function(){deleted=[];selectedTone=null;page=0;checked=[false,false];render()};
render();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initPriceEdit);
else initPriceEdit();
})();
</script>
</div>
