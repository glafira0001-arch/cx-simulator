<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Категории товаров — найди пару</title><style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#303030;background:#f7f2db}body{display:flex;justify-content:center}.game{position:relative;width:100%;max-width:900px;height:min(73vw,460px);min-height:345px;overflow:hidden;background:radial-gradient(circle at 15% 12%,#ebca7850 0 1px,transparent 5px),radial-gradient(circle at 75% 61%,#e5be7240 0 2px,transparent 8px),radial-gradient(circle at 61% 9%,#f3d58d5a 0 2px,transparent 7px),#fff0b4}.game:fullscreen{width:100vw;max-width:none;height:100vh}.game:-webkit-full-screen{width:100vw;max-width:none;height:100vh}#field{position:absolute;width:880px;height:450px;left:0;top:0;transform-origin:top left}.card{position:absolute;width:157px;min-height:77px;padding:13px 10px 10px;border-radius:17px;background:#fff;box-shadow:0 5px 9px #0003;border:1px solid #e5e5e5;display:flex;justify-content:center;align-items:center;text-align:center;font-size:15px;line-height:1.16;cursor:grab;touch-action:none;user-select:none;z-index:2}.card:focus-visible{outline:3px solid #2188d7}.card.moving{cursor:grabbing;box-shadow:0 9px 16px #0005}.card .pin{position:absolute;top:-10px;left:calc(50% - 10px);width:20px;height:20px;border-radius:50%;background:#ffa25c;box-shadow:0 1px 4px #0002;pointer-events:none}.card.action .pin{background:#3199d6}.card.used{visibility:hidden}.group{position:absolute;width:174px;z-index:30;cursor:pointer;touch-action:none}.group .card{position:relative;left:auto!important;top:auto!important;width:168px;margin:auto;min-height:67px;cursor:inherit;touch-action:auto}.group .bridge{margin:-3px auto;height:20px;width:150px;background:repeating-linear-gradient(0deg,#dcefd8 0 4px,#c4e9be 4px 7px);border-left:3px solid #b9e9b2;border-right:3px solid #b9e9b2}.group.good .card{border:5px solid #78e989;padding:9px 6px 6px}.group.bad .card{border:5px solid #f64040;padding:9px 6px 6px;background:repeating-linear-gradient(135deg,#fff 0 11px,#ffe2e2 11px 17px)}.group.bad .bridge{background:repeating-linear-gradient(0deg,#ffcaca 0 4px,#ffaaaa 4px 7px);border-color:#fa5555}.tools{position:absolute;z-index:80;top:7px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none}.icon-btn{pointer-events:auto;border:0;background:#ffffffb3;border-radius:3px;cursor:pointer;font-size:20px;padding:0 3px;line-height:1.15;color:#319e53}.icon-btn.fs{color:#f25656}.check{position:absolute;bottom:16px;right:18px;z-index:70;width:47px;height:47px;background:#2d96e4;color:#fff;font-size:25px;border:0;border-radius:50%;cursor:pointer;box-shadow:0 3px 6px #0003}.popup{position:absolute;z-index:90;right:12px;bottom:72px;max-width:290px;padding:12px 14px;border-radius:11px;background:#fff;box-shadow:0 4px 14px #0004;font-size:14px;line-height:1.4}.popup[hidden]{display:none}.popup button{margin-top:8px;background:#2d96e4;border:0;color:#fff;padding:7px 11px;border-radius:7px;cursor:pointer}.modal-overlay{position:absolute;z-index:110;inset:0;display:grid;place-items:center;background:#0002}.modal-overlay[hidden]{display:none}.modal{width:min(535px,90%);border-radius:13px;background:#d2d2d2;box-shadow:0 4px 18px #0006;border:1px solid #b6b6b6;padding:11px}.modal-inside{background:#fafafa;padding:16px 18px 12px}.modal h2{text-align:center;font-size:21px;margin:1px 0 12px}.modal p{font-size:16px;line-height:1.45;margin:0 0 15px}.modal button{display:block;margin:auto;padding:4px 13px;font-size:17px;cursor:pointer;border:1px solid #888;background:#eee}.toast{position:absolute;z-index:75;left:50%;bottom:15px;transform:translateX(-50%);padding:8px 12px;background:#fffef3;border:1px solid #ddd;border-radius:9px;box-shadow:0 2px 8px #0003;font-size:13px;max-width:70%;text-align:center}.toast[hidden]{display:none}@media(max-width:600px){.game{height:430px}.modal p{font-size:14px}.toast{bottom:8px}}
</style></head><body><main class="game" id="game" aria-label="Соедините категории товаров и действия"><div class="tools"><button class="icon-btn" id="help" title="Посмотреть задание ещё раз" aria-label="Посмотреть задание ещё раз">❔</button><button class="icon-btn fs" id="fullscreen" title="Развернуть на весь экран" aria-label="Развернуть на весь экран">⛶</button></div><div id="field"></div><button class="check" id="check" title="Результат и повторное прохождение" aria-label="Результат и повторное прохождение">☑</button><div class="popup" id="popup" hidden><div id="progress"></div><button id="reset">Начать заново</button></div><div class="toast" id="toast" hidden></div><div class="modal-overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-title"><div class="modal-inside"><h2 id="task-title">Задание</h2><p>Перетащите категорию товара на действие, которое с ним правильнее сделать.</p><button id="ok">OK</button></div></div></div></main>
<script>
(()=>{'use strict';
const W=880,H=450,game=document.getElementById('game'),field=document.getElementById('field'),overlay=document.getElementById('overlay'),popup=document.getElementById('popup'),toast=document.getElementById('toast');
const items={
 a:{label:'Группа А: товар приносит 80% прибыли',type:'category',match:'promote',x:187,y:152},
 b:{label:'Группа В: товар приносит 15% прибыли',type:'category',match:'stock',x:502,y:145},
 c:{label:'Группа С: товар приносит 5% прибыли',type:'category',match:'remove',x:290,y:38},
 promote:{label:'Увеличить бюджет на продвижение товара',type:'action',match:'a',x:300,y:275},
 stock:{label:'Запасать товар только в таком количестве, чтобы покрыть спрос',type:'action',match:'b',x:343,y:166},
 remove:{label:'Выводить товар из ассортимента',type:'action',match:'c',x:460,y:270}
};
let nodes={},groups=[],drag=null,z=3,pick=null,timer;
function scaleField(){let r=game.getBoundingClientRect();let s=Math.min(r.width/W,r.height/H);field.style.transform=`scale(${s})`;field.style.left=`${(r.width-W*s)/2}px`;field.style.top=`${(r.height-H*s)/2}px`}
new ResizeObserver(scaleField).observe(game);document.addEventListener('fullscreenchange',scaleField);
function card(d,id){const el=document.createElement('div');el.className='card '+d.type;el.tabIndex=0;el.dataset.id=id;el.style.left=d.x+'px';el.style.top=d.y+'px';el.style.zIndex=++z;const dot=document.createElement('span');dot.className='pin';const label=document.createElement('span');label.textContent=d.label;el.append(dot,label);el.addEventListener('pointerdown',down);el.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();if(pick&&pick!==el){const other=pick;pick=null;other.style.outline='';join(el,other)}else{if(pick)pick.style.outline='';pick=el;el.style.outline='3px solid #278fd8';message('Выберите вторую карточку')}});return el}
function init(){field.replaceChildren();nodes={};groups=[];drag=null;pick=null;z=3;for(const [id,d]of Object.entries(items)){const el=card(d,id);nodes[id]=el;field.append(el)}popup.hidden=true;toast.hidden=true;scaleField()}
function message(txt){toast.textContent=txt;toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,1850)}
function down(e){if(e.button!==0||drag)return;let el=e.currentTarget,r=field.getBoundingClientRect();if(pick){pick.style.outline='';pick=null}drag={el,id:el.dataset.id,pid:e.pointerId,s:r.width/W,x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top),moved:false};el.setPointerCapture(e.pointerId);el.classList.add('moving');el.style.zIndex=++z}
field.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag,dx=(e.clientX-d.x)/d.s,dy=(e.clientY-d.y)/d.s;if(Math.hypot(dx,dy)>5)d.moved=true;d.el.style.left=Math.max(0,Math.min(W-157,d.left+dx))+'px';d.el.style.top=Math.max(15,Math.min(H-85,d.top+dy))+'px'});
field.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;d.el.classList.remove('moving');if(!d.moved)return;const a=d.el.getBoundingClientRect();let match=null,max=0;for(const other of Object.values(nodes)){if(other===d.el||other.classList.contains('used')||items[other.dataset.id].type===items[d.id].type)continue;const b=other.getBoundingClientRect();const overlap=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));if(overlap>max){max=overlap;match=other}}if(match&&max>Math.min(a.width*a.height,match.getBoundingClientRect().width*match.getBoundingClientRect().height)*.15)join(d.el,match)});
function join(a,b){if(items[a.dataset.id].type===items[b.dataset.id])return;if(a.classList.contains('used')||b.classList.contains('used'))return;let category=items[a.dataset.id].type==='category'?a:b,action=category===a?b:a;let good=items[category.dataset.id].match===action.dataset.id;
const x=Math.max(12,Math.min(W-178,(parseFloat(a.style.left)+parseFloat(b.style.left))/2)),y=Math.max(22,Math.min(H-176,(parseFloat(a.style.top)+parseFloat(b.style.top))/2));a.classList.add('used');b.classList.add('used');const group=document.createElement('div');group.className='group '+(good?'good':'bad');group.style.left=x+'px';group.style.top=y+'px';group.style.zIndex=++z;const upper=category.cloneNode(true),lower=action.cloneNode(true),bridge=document.createElement('div');upper.classList.remove('used');lower.classList.remove('used');bridge.className='bridge';group.append(upper,bridge,lower);field.append(group);const rec={group,a,b,good};groups.push(rec);
if(!good){group.title='Нажмите, чтобы разъединить неправильную пару';group.onclick=()=>{group.remove();a.classList.remove('used');b.classList.remove('used');groups=groups.filter(g=>g!==rec);message('Пара разъединена')};message('Неверная пара. Нажмите на красную связку, чтобы разъединить.')}else{message(groups.filter(p=>p.good).length===3?'Все три пары найдены!':'Верно! Пара найдена.')}
}
document.getElementById('ok').onclick=()=>overlay.hidden=true;document.getElementById('help').onclick=()=>overlay.hidden=false;document.getElementById('check').onclick=()=>{document.getElementById('progress').textContent=`Верных пар: ${groups.filter(g=>g.good).length} из 3. ${groups.some(g=>!g.good)?'Неверные пары можно разъединить нажатием.':''}`;popup.hidden=!popup.hidden};document.getElementById('reset').onclick=init;document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await game.requestFullscreen()}catch{message('Полноэкранный режим недоступен в этом браузере')}};
init();
})();
</script></body></html>
