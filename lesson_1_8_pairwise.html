<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Попарное сравнение</title><style>
:root{--text:#222831;--muted:#6b7280;--line:#d9dde4;--soft:#f3f5f7;--dark:#303744;--ok:#edf6f0;--bad:#faf0ef;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{display:flex;justify-content:center;padding:8px}.app{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{padding:13px 15px 10px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:18px;line-height:1.2}.count{font-size:12px;color:var(--muted);white-space:nowrap}.progress{display:flex;gap:5px;margin-top:8px}.progress i{flex:1;height:5px;border-radius:999px;background:var(--soft)}.progress i.active{background:var(--dark)}.progress i.done{background:#aab1bb}
.main{padding:12px 15px 14px}.case{background:var(--soft);border-radius:10px;padding:10px 11px;font-size:13.5px;line-height:1.35;font-weight:700;margin-bottom:9px}.sub{font-size:11.5px;line-height:1.35;color:var(--muted);margin:0 0 9px}
.options{display:grid;gap:6px}.options.two{grid-template-columns:1fr 1fr}.opt{width:100%;min-height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;text-align:left;font:inherit;font-size:12px;line-height:1.25;cursor:pointer}.opt.selected{border-color:#697384;background:#f7f8fa}.opt.correct{border-color:#9bb8a3;background:var(--ok)}.opt.wrong{border-color:#d6aaa4;background:var(--bad)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:11.5px;line-height:1.25;cursor:pointer}.chip.selected{background:#eef1f5;border-color:#7b8593}.chip.correct{background:var(--ok);border-color:#9bb8a3}.chip.wrong{background:var(--bad);border-color:#d6aaa4}
.feedback{display:none;margin-top:8px;padding:8px 9px;border-radius:9px;background:var(--soft);font-size:11.5px;line-height:1.35}.feedback.show{display:block}.feedback.ok{background:var(--ok)}.feedback.bad{background:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}button{min-height:36px;border:0;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:var(--soft);color:var(--text)}button:disabled{opacity:.4;cursor:default}
.inputgrid{display:grid;grid-template-columns:104px 1fr;gap:7px;align-items:center}.label{font-size:11.8px;font-weight:700;line-height:1.2}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12px;color:var(--text);background:#fff;outline:none}input{height:36px}textarea{min-height:58px;resize:vertical}select{height:36px}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px}.card b{font-size:12px}.small{font-size:11.5px;line-height:1.35;color:var(--muted)}
.matrix-card{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px}.matrix-card .name{font-size:12px;font-weight:700;margin-bottom:5px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;line-height:1.25}.metrics span b{font-weight:700;color:#444}
.summary{display:none;padding:16px}.summary.show{display:block}.summary h2{font-size:18px;margin:0 0 7px}.summary p{font-size:12.5px;line-height:1.4;color:var(--muted)}.summarylist{display:grid;gap:6px}.summaryitem{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11.5px}
.modal{position:fixed;inset:0;background:rgba(24,29,37,.36);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.modalbox{width:min(500px,100%);max-height:78vh;overflow:auto;background:#fff;border-radius:14px;padding:13px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}.modalhead strong{font-size:13px}.close{width:32px;min-height:32px;padding:0;background:var(--soft)}.example{font-size:12px;line-height:1.45}
@media(max-width:430px){.actions{grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}.chips,.options.two{grid-template-columns:1fr}.inputgrid{grid-template-columns:88px 1fr}}
</style></head><body>
<div class="app"><section id="task"><div class="top"><div class="row"><h1>Проведите турнир вариантов</h1><div class="count" id="count"></div></div><div class="progress" id="progress"></div></div><div class="main" id="main"></div></section><section class="summary" id="summary"><h2>Решение собрано</h2><p id="finalText"></p><div class="actions"><button class="secondary" id="backSummary">Вернуться</button><button class="primary" id="restart">Начать заново</button></div></section></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><strong>Пример ответа</strong><button class="close" id="close">×</button></div><div class="example" id="exampleText"></div></div></div>
<script>
const V={A:'Распределить задачи между всеми',B:'Создать временную группу',C:'Привлечь внешних исполнителей',D:'Приостановить менее важные работы'};
const data={A:'0 тыс.; остаток 130; риск ошибок высокий; нагрузка высокая; влияние на другие работы низкое',B:'180 тыс.; остаток 60; риск средний; высокая нагрузка на 4 сотрудников; влияние среднее',C:'420 тыс.; остаток 40; риск высокий; нагрузка низкая; влияние низкое',D:'0 тыс.; остаток 75; риск низкий; нагрузка средняя; влияние на другие работы высокое'};
const rounds=[
{title:'Раунд 1',pair:['A','B'],correct:'B',why:'Вариант A оставляет 130 задач и несет высокий риск ошибок. B укладывается в лимит 200 тыс., оставляет менее 100 задач и не имеет высокого риска.'},
{title:'Раунд 2',pair:['C','D'],correct:'D',why:'C превышает бюджет 200 тыс. и несет высокий риск ошибок. D укладывается в обязательные условия.'},
{title:'Финал',pair:['B','D'],correct:'B',why:'Оба проходят обязательные условия, но приоритет — не останавливать другие работы. У B влияние среднее, у D — высокое.'}
];
let step=0;const total=6;const state={round:Array(3).fill(null),sensitivity:null,dayB:'',dayD:'',because:'',accept:'',review:'',ok:Array(total).fill(false)};const $=id=>document.getElementById(id);
function prog(){$('count').textContent=`${step+1} из ${total}`;$('progress').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i===step?'active':state.ok[i]?'done':''}"></i>`).join('')}
function render(){prog();if(step<3)renderRound();else if(step===3)renderSensitivity();else if(step===4)renderDay();else renderJustify();}
function renderRound(){let r=rounds[step],sel=state.round[step];$('main').innerHTML=`<div class="case">${r.title}. Обязательные условия: бюджет ≤ 200 тыс.; остаток очереди ≤ 100 задач; высокий риск ошибок недопустим. В финале дополнительный приоритет — не останавливать другие работы.</div><div class="options">${r.pair.map(id=>`<button class="opt ${sel===id?'selected':''}" data-v="${id}"><b>${id}. ${V[id]}</b><br><span class="small">${data[id]}</span></button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.round[step]=b.dataset.v;renderRound()});$('prev').disabled=step===0;$('prev').onclick=prev;$('next').onclick=()=>{let ok=state.round[step]===r.correct;state.ok[step]=ok;let fb=$('fb');document.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('correct',b.dataset.v===r.correct);b.classList.toggle('wrong',state.round[step]===b.dataset.v&&b.dataset.v!==r.correct)});fb.textContent=ok?r.why:'Сверьте вариант с обязательными условиями и приоритетом.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},240)}}
function renderSensitivity(){const opts=[['Бюджет становится равен нулю, а влияние на другие работы перестает быть критичным','D'],['Внешние исполнители дорожают еще на 20%','B'],['Высокий риск ошибок становится еще менее допустимым','B']];$('main').innerHTML=`<div class="case">Что должно измениться, чтобы выбор переключился с B на D?</div><div class="options">${opts.map(([x,v],i)=>`<button class="opt ${state.sensitivity===i?'selected':''}" data-s="${i}">${x}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="primary wide" id="next">Проверить и дальше</button></div>`;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.sensitivity=+b.dataset.s;renderSensitivity()});$('prev').onclick=prev;$('next').onclick=()=>{let ok=state.sensitivity===0;state.ok[3]=ok;let fb=$('fb');fb.textContent=ok?'Верно: при нулевом бюджете и меньшей важности влияния на другие работы D становится сильнее.':'Ищите изменение условий, которое реально меняет преимущество финалиста.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},240)}}
function renderDay(){$('main').innerHTML=`<div class="case">Представьте обычный рабочий день через два месяца для двух финалистов.</div><div class="inputgrid"><div class="label">Вариант B</div><textarea id="dayB" placeholder="Кто распределяет работу, где перегрузка...">${state.dayB}</textarea><div class="label">Вариант D</div><textarea id="dayD" placeholder="Что происходит с другими задачами...">${state.dayD}</textarea></div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="secondary" id="example">Пример</button><button class="primary wide" id="next">Дальше</button></div>`;$('dayB').oninput=()=>state.dayB=$('dayB').value;$('dayD').oninput=()=>state.dayD=$('dayD').value;$('prev').onclick=prev;$('example').onclick=()=>showEx('B: четыре специалиста работают в отдельной группе, руководитель следит за входящим потоком и качеством, риск — перегрузка этих четырех сотрудников. D: часть команды переключена на очередь, просрочка основной очереди снижается, но менее важные работы накапливаются.');$('next').onclick=()=>{state.dayB=$('dayB').value.trim();state.dayD=$('dayD').value.trim();let ok=state.dayB.length>15&&state.dayD.length>15;state.ok[4]=ok;let fb=$('fb');fb.textContent=ok?'Оба сценария описаны.':'Опишите оба рабочих сценария хотя бы в одном-двух предложениях.';fb.className='feedback show '+(ok?'ok':'bad');if(ok)setTimeout(()=>{step++;render()},220)}}
function renderJustify(){$('main').innerHTML=`<div class="case">Зафиксируйте итоговое обоснование.</div><div class="inputgrid"><div class="label">Выбираем</div><input value="B. Создать временную группу" disabled><div class="label">Потому что</div><textarea id="because" placeholder="Какие критерии определили выбор">${state.because}</textarea><div class="label">Принимаем</div><textarea id="accept" placeholder="Какие последствия принимаем">${state.accept}</textarea><div class="label">Пересмотрим</div><textarea id="review" placeholder="При каком изменении условий">${state.review}</textarea></div><div class="feedback" id="fb"></div><div class="actions"><button class="secondary" id="prev">Назад</button><button class="secondary" id="example">Пример</button><button class="primary wide" id="finish">Завершить</button></div>`;['because','accept','review'].forEach(id=>$(id).oninput=()=>state[id]=$(id).value);$('prev').onclick=prev;$('example').onclick=()=>showEx('Мы выбираем временную группу, потому что она сокращает очередь до 60 задач, укладывается в бюджет и не останавливает другие работы. Мы принимаем высокую нагрузку на четырех специалистов. Мы пересмотрим выбор, если бюджет сократится ниже 180 тыс. или нагрузка группы станет недопустимой.');$('finish').onclick=()=>{['because','accept','review'].forEach(id=>state[id]=$(id).value.trim());let ok=state.because.length>12&&state.accept.length>10&&state.review.length>10;state.ok[5]=ok;let fb=$('fb');if(!ok){fb.textContent='Заполните все три части обоснования.';fb.className='feedback show bad';return}$('task').style.display='none';$('summary').classList.add('show');$('finalText').textContent=`Вы выбрали B, приняли последствия и задали условие пересмотра. Формулировка сохранена.`;}}
function prev(){if(step>0){step--;render()}}function showEx(t){$('exampleText').textContent=t;$('modal').classList.add('show')}$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('backSummary').onclick=()=>{$('summary').classList.remove('show');$('task').style.display='block';step=5;render()};$('restart').onclick=()=>{state.round=Array(3).fill(null);state.sensitivity=null;state.dayB='';state.dayD='';state.because='';state.accept='';state.review='';state.ok=Array(total).fill(false);step=0;$('summary').classList.remove('show');$('task').style.display='block';render();};render();
</script></body></html>
