<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWOT-анализ — 7 действий</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f1cb;font-family:Arial,sans-serif;color:#353535}.stage{position:relative;margin:auto;width:min(100%,1100px);min-height:680px;background-color:#fff2b7;background-image:radial-gradient(#eacb7d33 .9px,transparent 1.5px),radial-gradient(#e3b85a29 1px,transparent 2px);background-size:31px 30px,67px 68px;overflow:hidden}.top{position:absolute;top:10px;z-index:90;border:0;background:transparent;cursor:pointer;font-size:23px}.help{left:10px;color:#32983a}.full{right:10px;color:#ef6666}.timeline{position:relative;margin:70px 8% 0;height:80px}.bar{position:absolute;top:20px;left:0;right:0;height:14px;background:#6b6b6b}.ticks{position:absolute;inset:0;display:flex;justify-content:space-between}.tick{position:relative;width:24px;text-align:center;z-index:2}.pin{display:block;height:32px;position:relative}.pin:before{content:'';position:absolute;top:-15px;left:8px;width:9px;height:9px;background:#319ae2;border-radius:4px}.pin:after{content:'';position:absolute;top:-6px;left:6px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:21px solid #329de7}.tick b{font-size:15px;font-weight:normal}.play{position:relative;height:450px;margin:0 5%;touch-action:none}.card{position:absolute;width:clamp(116px,16%,170px);min-height:65px;padding:12px 9px 8px;background:#fffefa;border-radius:15px;box-shadow:0 4px 9px #0003;text-align:center;font-size:14px;line-height:1.13;cursor:grab;touch-action:none;user-select:none;z-index:5;border:5px solid transparent;transform:translate(-50%,0)}.card.dragging{z-index:70;cursor:grabbing;box-shadow:0 9px 22px #0004}.card.assigned:before{content:'';position:absolute;left:50%;bottom:100%;height:var(--rope,70px);width:4px;background:repeating-linear-gradient(135deg,#aaa 0 3px,#eee 3px 6px);transform:translateX(-50%);pointer-events:none}.card.good{border-color:#83e78c;background:#fff}.card.bad{border-color:#ff1010;background:repeating-linear-gradient(135deg,#fff,#fff 12px,#fff0e9 12px,#fff0e9 24px)}.adjust{display:flex;justify-content:center;align-items:center;gap:6px;margin:8px 0 0}.adjust button{border:1px solid #888;border-radius:5px;background:#fff;min-width:28px;height:29px;cursor:pointer;font-size:18px}.adjust span{font-size:13px;font-weight:bold}.actions{position:absolute;right:22px;bottom:17px;display:flex;align-items:center;gap:10px}.check{width:52px;height:52px;border:0;background:#2d90df;border-radius:50%;color:white;font-size:25px;box-shadow:0 3px 5px #0003;cursor:pointer}.retry{border:1px solid #b1a56f;border-radius:7px;background:#fffbee;padding:10px;cursor:pointer;display:none}.status{position:absolute;bottom:15px;left:16px;max-width:63%;font-size:13px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0002;z-index:200}.dialog{width:min(520px,90vw);background:#f7f7f7;border:11px solid #d7d7d7;box-shadow:0 4px 15px #0007;border-radius:12px;padding:15px 17px;text-align:left}.dialog h2{text-align:center;margin:0 0 12px;font-size:22px}.dialog p{font-size:17px;line-height:1.4;margin:0 0 14px}.dialog button{display:block;margin:auto;background:#f6f6f6;border:1px solid #777;padding:5px 14px;font-size:18px;cursor:pointer}.hide{display:none!important}.stage:fullscreen{width:100vw;height:100vh;max-width:none}.stage:fullscreen .timeline{margin-top:9vh}.stage:fullscreen .play{height:64vh}.stage:fullscreen .card{font-size:clamp(14px,1.5vw,20px);width:clamp(135px,14vw,230px)}.stage:fullscreen .tick b{font-size:20px}@media(max-width:670px){.stage{min-height:710px}.timeline{margin:65px 6% 0}.play{height:485px;margin:0 1%}.card{font-size:12px;width:30%;padding:9px 5px 6px}.card.assigned:before{display:none}.adjust{gap:3px}.adjust button{min-width:24px;height:26px}.status{max-width:65%}}
</style></head><body><div class="stage" id="stage"><button class="top help" id="help" title="Открыть задание">❔</button><button class="top full" id="fullscreen" title="На весь экран">⛶</button><div class="timeline"><div class="bar"></div><div class="ticks" id="ticks"></div></div><div class="play" id="play"></div><div class="status" id="status" aria-live="polite"></div><div class="actions"><button class="retry" id="retry">Начать заново</button><button class="check" id="check" title="Проверить ответы">☑</button></div></div><div class="overlay" id="overlay"><div class="dialog"><h2>Задание</h2><p>SWOT-анализ состоит из 7 действий. Перед вами описания действий, расположите их в правильном порядке.</p><button id="ok">OK</button></div></div><script>
const items=[
{id:'goal',text:'Выписать цель SWOT-анализа',correct:1,x:27,y:34},
{id:'strengths',text:'Выписать сильные стороны компании',correct:2,x:59,y:7},
{id:'weaknesses',text:'Выписать слабые стороны компании',correct:3,x:25,y:7},
{id:'opportunities',text:'Выписать потенциальные возможности компании',correct:4,x:75,y:34},
{id:'threats',text:'Выписать потенциальные угрозы компании',correct:5,x:46,y:34},
{id:'table',text:'Перенести всю информацию в таблицу',correct:6,x:63,y:61},
{id:'strategy',text:'Проанализировать информацию и набросать стратегию',correct:7,x:32,y:61}
];
const play=document.getElementById('play'),stage=document.getElementById('stage');const tickEl=document.getElementById('ticks');for(let i=1;i<=7;i++){let d=document.createElement('div');d.className='tick';d.innerHTML=`<span class="pin"></span><b>${i}</b>`;tickEl.append(d)}
let assigned={},verified=false,drag=null;const clamp=(a,b,c)=>Math.max(b,Math.min(c,a));
function place(el,x,y){el.style.left=x+'%';el.style.top=y+'%';el.dataset.x=x;el.dataset.y=y}
function rebuild(){play.innerHTML='';assigned={};verified=false;document.getElementById('retry').style.display='none';document.getElementById('status').textContent='Перетащите карточку к номеру или задайте номер кнопками «−» и «+».';for(let it of items){let el=document.createElement('div');el.className='card';el.dataset.id=it.id;el.innerHTML=`<div class="copy">${it.text}</div><div class="adjust"><button data-delta="-1" aria-label="На шаг назад">−</button><span class="num">—</span><button data-delta="1" aria-label="На шаг вперёд">+</button></div>`;place(el,it.x,it.y);play.append(el);el.querySelectorAll('.adjust button').forEach(b=>b.addEventListener('pointerdown',e=>e.stopPropagation()));el.querySelectorAll('.adjust button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();let next=clamp((assigned[it.id]||0)+Number(b.dataset.delta),1,7);setAssignment(it.id,next);verified=false;refresh()}));el.addEventListener('pointerdown',startDrag)}refresh()}
function setAssignment(id,n){assigned[id]=n;const el=play.querySelector(`[data-id="${id}"]`);el.classList.add('assigned');const x=5+(n-1)*90/6;const y=Number(el.dataset.y);place(el,x,y)}
function refresh(){play.querySelectorAll('.card').forEach(el=>{const n=assigned[el.dataset.id];el.querySelector('.num').textContent=n||'—';el.classList.toggle('assigned',!!n);if(!verified)el.classList.remove('good','bad');if(n){const timelineY=document.querySelector('.timeline').getBoundingClientRect().bottom;const cardY=el.getBoundingClientRect().top;el.style.setProperty('--rope',Math.max(0,cardY-timelineY+35)+'px')}})}
function startDrag(e){if(e.target.closest('button'))return;if(e.button!==0)return;const el=e.currentTarget,box=play.getBoundingClientRect();drag={el,id:el.dataset.id,startX:e.clientX,startY:e.clientY,px:el.offsetLeft,py:el.offsetTop,moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag,{once:true});el.addEventListener('pointercancel',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;const d=drag,dx=e.clientX-d.startX,dy=e.clientY-d.startY;d.moved ||= Math.abs(dx)+Math.abs(dy)>5;const w=play.clientWidth,h=play.clientHeight;place(d.el,clamp((d.px+dx)/w*100,4,96),clamp((d.py+dy)/h*100,0,85))}
function endDrag(e){if(!drag)return;const d=drag;d.el.classList.remove('dragging');d.el.removeEventListener('pointermove',moveDrag);if(d.moved){const rect=play.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100;const n=clamp(Math.round((x-5)/90*6)+1,1,7);setAssignment(d.id,n);verified=false;refresh()}drag=null}
function check(){verified=true;let correct=0;for(let it of items){let el=play.querySelector(`[data-id="${it.id}"]`),good=assigned[it.id]===it.correct;el.classList.toggle('good',good);el.classList.toggle('bad',!good);if(good)correct++}document.getElementById('retry').style.display='block';document.getElementById('status').textContent=correct===7?'Верно! Все семь действий расположены правильно.':`Верных позиций: ${correct} из 7. Красные карточки можно переместить или изменить их номер и проверить снова.`}
document.getElementById('check').onclick=check;document.getElementById('retry').onclick=rebuild;document.getElementById('ok').onclick=()=>document.getElementById('overlay').classList.add('hide');document.getElementById('help').onclick=()=>document.getElementById('overlay').classList.remove('hide');document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch(err){document.getElementById('status').textContent='Полноэкранный режим может быть ограничен настройками платформы.'}};rebuild();
</script></body></html>
