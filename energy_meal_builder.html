<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Энергия из еды</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card,.slot{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.row-card+.row-card{margin-top:7px}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
button,input{font:inherit}
.choice,.tile,.answer-btn,.block-card{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover,.block-card:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.summary{font-size:12px;line-height:1.45}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.timeline{display:grid;grid-template-columns:68px 1fr;gap:6px}
.time{font-size:10px;color:var(--muted);display:flex;align-items:center}
.slot{min-height:44px;cursor:pointer;padding:7px}
.slot-title{font-size:11px;font-weight:800}
.slot-sub{font-size:10px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:999px;background:#e8ebf3;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:.2s}
.input-row{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:center}
input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.score-big{font-size:27px;font-weight:900;color:var(--accent)}
.note{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f6f7fa;font-size:10px;line-height:1.35;color:#586174}
@media(max-width:430px){
  .grid2,.grid3,.inline-choices{grid-template-columns:1fr}
  .input-row{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="energyMealTask">

  <div class="head">
    <div class="kicker">Энергия из еды</div>
    <h2>Соберите прием пищи без «волшебного продукта»</h2>
    <p class="lead">Выберите четыре компонента разнообразной тарелки, затем решите, что делать при постоянной усталости.</p>
  </div>
  <div class="body">
    <div class="grid2" data-role="foods"></div>
    <div data-role="fatigueBlock" class="hidden">
      <div class="small" style="margin:8px 0 5px">Усталость сохраняется неделями. Как действовать?</div>
      <div class="grid2" data-role="fatigue"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить тарелку</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('energyMealTask');
  if (!root) return;

  const foods=[
    {text:'Овощи разных цветов',group:'veg',good:true},
    {text:'Цельнозерновой гарнир или бобовые',group:'carb',good:true},
    {text:'Рыба, яйца, бобовые или другой источник белка',group:'protein',good:true},
    {text:'Орехи, семена или растительное масло',group:'fat',good:true},
    {text:'Только энергетический батончик',group:'single',good:false},
    {text:'Набор добавок вместо обычной еды',group:'supp',good:false},
    {text:'Большая порция сладостей для быстрого подъема',group:'sugar',good:false},
    {text:'Один «суперфуд», который должен решить все',group:'magic',good:false}
  ];
  const fatigue=[
    {text:'Проверить сон, питание, активность и обсудить стойкую усталость с врачом',correct:true},
    {text:'Самостоятельно принимать высокие дозы магния и витаминов',correct:false},
    {text:'Есть больше сахара при каждом спаде',correct:false},
    {text:'Считать усталость точным доказательством дефицита одного нутриента',correct:false}
  ];
  let selected=new Set(),pick=null;
  const q=r=>root.querySelector(`[data-role="${r}"]`);

  function render(){
    q('foods').innerHTML=foods.map((x,i)=>`<button type="button" class="tile ${selected.has(i)?'selected':''}" data-food="${i}">${x.text}</button>`).join('');
    q('foods').querySelectorAll('[data-food]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=Number(btn.dataset.food);
        if(selected.has(i))selected.delete(i);else if(selected.size<4)selected.add(i);
        q('fb').className='feedback';render();
      });
    });
    const ready=selected.size===4;
    q('fatigueBlock').classList.toggle('hidden',!ready);
    q('check').disabled=!(ready&&pick!==null);
  }

  q('fatigue').innerHTML=fatigue.map((x,i)=>`<button type="button" class="choice" data-pick="${i}">${x.text}</button>`).join('');
  q('fatigue').querySelectorAll('[data-pick]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      q('fatigue').querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');pick=Number(btn.dataset.pick);q('check').disabled=selected.size!==4;
    });
  });

  q('check').addEventListener('click',()=>{
    const groups=new Set([...selected].map(i=>foods[i].group));
    const plateOk=[...selected].every(i=>foods[i].good)&&['veg','carb','protein','fat'].every(g=>groups.has(g));
    const fatigueOk=pick!==null&&fatigue[pick].correct;
    q('foods').querySelectorAll('[data-food]').forEach(btn=>{
      const i=Number(btn.dataset.food);
      if(foods[i].good)btn.classList.add('good');else if(selected.has(i))btn.classList.add('bad');btn.disabled=true;
    });
    q('fatigue').querySelectorAll('[data-pick]').forEach(btn=>{
      const i=Number(btn.dataset.pick);
      if(fatigue[i].correct)btn.classList.add('good');else if(i===pick)btn.classList.add('bad');btn.disabled=true;
    });
    const ok=plateOk&&fatigueOk;
    q('fb').className=`feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML=ok
      ? '<strong>Тарелка дает разнообразные источники энергии и нутриентов.</strong><br>Стойкая усталость не указывает на один конкретный дефицит и требует оценки всей картины.'
      : '<strong>В выборе осталась ставка на быстрый сахар или «волшебное» средство.</strong><br>Энергия поддерживается разнообразным рационом, сном, движением и состоянием здоровья.';
    q('check').disabled=true;
  });

  q('reset').addEventListener('click',()=>{
    selected=new Set();pick=null;
    q('fatigue').querySelectorAll('[data-pick]').forEach(x=>{x.disabled=false;x.className='choice';});
    q('fb').className='feedback';render();
  });
  render();

})();
</script>
</body>
</html>
