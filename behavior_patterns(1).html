<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поведенческие симптомы</title>
<style>
:root{
  --ink:#18212f; --muted:#667085; --line:#d9e0e8; --bg:#f5f7fa;
  --card:#ffffff; --accent:#3157d5; --accent-soft:#eef2ff;
  --ok:#147a55; --ok-soft:#e9f8f1; --bad:#b42318; --bad-soft:#fff0ee;
  --warn:#9a6700; --warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.head{padding:18px 18px 14px;background:linear-gradient(135deg,#f8faff,#eef2ff)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h2{font-size:20px;line-height:1.2;margin:6px 0 7px}
.lead{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.body{padding:16px 18px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
.card + .card{margin-top:10px}
.case{font-size:14px;line-height:1.45}
.small{font-size:12px;color:var(--muted);line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit}
.choice,.chip,.task-card,.action{width:100%;text-align:left;border:1px solid var(--line);background:#fff;
  border-radius:11px;padding:10px 11px;cursor:pointer;color:var(--ink);transition:.15s}
.choice:hover,.chip:hover,.task-card:hover,.action:hover{border-color:#9cadf3}
.choice.selected,.chip.selected,.task-card.selected,.action.selected{
  border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.choice.good,.chip.good,.task-card.good,.action.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad,.chip.bad,.task-card.bad,.action.bad{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:8px;margin-top:14px}
.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:white;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:12px;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#0c5b3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.feedback.bad{background:var(--bad-soft);color:#8e1b13}
.progress{height:5px;background:#e7ebf2}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef1f6;color:#475467}
.hidden{display:none!important}
.metric{display:flex;justify-content:space-between;gap:12px;align-items:center}
.metric strong{font-size:18px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.task{border-radius:14px}.head,.body{padding-left:14px;padding-right:14px}}

button[type="button"]{appearance:none}
.answer-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pattern-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.pattern-text{font-size:13px;line-height:1.4;margin-bottom:8px}
.pattern-card .choice{text-align:center;padding:8px 5px;font-size:12px}
.locked{pointer-events:none}
@media(max-width:420px){
  .answer-grid-3{grid-template-columns:1fr}
  .pattern-card .choice{text-align:left}
}
</style>
</head>
<body>

<div class="task" id="behaviorPatternsTask">
  <div class="head">
    <div class="kicker">Поведенческие симптомы</div>
    <h2>Суета, залипание или рабочее действие?</h2>
    <p class="lead">Для каждой ситуации выберите одну категорию. Проверка станет доступна, когда классифицированы все шесть действий.</p>
  </div>
  <div class="body">
    <div data-role="items"></div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="feedback"></div>
  </div>
</div>

<script>

(() => {
  const root = document.getElementById('behaviorPatternsTask');
  const data = [
    {text:'За десять минут четыре раза обновить почту, хотя новых уведомлений нет', correct:'rush'},
    {text:'Трижды перечитать одну инструкцию и так и не начать первый шаг', correct:'freeze'},
    {text:'Открыть сообщение и сразу ответить, удалить его или внести действие в план', correct:'work'},
    {text:'Несколько раз переложить одни и те же документы, не продвинув задачу', correct:'rush'},
    {text:'Бесцельно листать ленту перед сложным звонком', correct:'freeze'},
    {text:'Закрыть ноутбук после завершения рабочего блока', correct:'work'}
  ];
  const labels = [
    {id:'rush', text:'Суета'},
    {id:'freeze', text:'Залипание'},
    {id:'work', text:'Рабочее действие'}
  ];
  const items = root.querySelector('[data-role="items"]');
  const check = root.querySelector('[data-role="check"]');
  const reset = root.querySelector('[data-role="reset"]');
  const feedback = root.querySelector('[data-role="feedback"]');
  let state = Array(data.length).fill(null);
  let completed = false;

  function render() {
    items.innerHTML = data.map((item, index) => `
      <div class="pattern-card" data-index="${index}">
        <div class="pattern-text">${item.text}</div>
        <div class="answer-grid-3">
          ${labels.map(label => `<button type="button" class="choice ${state[index] === label.id ? 'selected' : ''}" data-value="${label.id}">${label.text}</button>`).join('')}
        </div>
      </div>
    `).join('');
    items.querySelectorAll('.pattern-card').forEach(card => {
      card.querySelectorAll('.choice').forEach(button => {
        button.addEventListener('click', () => {
          if (completed) return;
          state[Number(card.dataset.index)] = button.dataset.value;
          render();
        });
      });
    });
    check.disabled = completed || state.some(value => value === null);
  }
  check.addEventListener('click', () => {
    let correctCount = 0;
    items.querySelectorAll('.pattern-card').forEach((card, index) => {
      const correct = data[index].correct;
      const selected = state[index];
      card.querySelectorAll('.choice').forEach(button => {
        if (button.dataset.value === correct) button.classList.add('good');
        else if (button.dataset.value === selected) button.classList.add('bad');
      });
      if (selected === correct) correctCount++;
    });
    feedback.className = `feedback show ${correctCount === data.length ? 'ok' : 'warn'}`;
    feedback.innerHTML = correctCount === data.length
      ? '<strong>Все верно.</strong><br>Суета создает много лишних действий, залипание откладывает начало, а рабочее действие либо продвигает задачу, либо корректно завершает рабочий блок.'
      : `<strong>Верно: ${correctCount} из ${data.length}.</strong><br>Повторная проверка и перекладывание предметов относятся к суете. Перечитывание без старта и бесцельная лента — к залипанию. «Одно касание» и ритуал выхода — рабочие действия.`;
    completed = true;
    check.disabled = true;
  });
  reset.addEventListener('click', () => {
    state = Array(data.length).fill(null);
    completed = false;
    feedback.className = 'feedback';
    feedback.innerHTML = '';
    render();
  });
  render();
})();

</script>
</body>
</html>
