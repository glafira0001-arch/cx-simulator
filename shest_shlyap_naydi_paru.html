<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шесть шляп — найди пары</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#333}body{background:#fff}.app{position:relative;width:100%;height:100dvh;min-height:420px;overflow:hidden;background:#fff1b4;background-image:radial-gradient(circle at 15% 25%,#ecc76840 0 1px,transparent 3px),radial-gradient(circle at 78% 69%,#e7c97145 0 2px,transparent 8px),radial-gradient(circle at 40% 85%,#ffffff65 0 2px,transparent 11px);background-size:83px 97px,149px 131px,117px 109px}.board{position:absolute;top:0;left:0;width:860px;height:600px;transform-origin:top left}.card{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;touch-action:none;user-select:none;background:#fff;border-radius:16px;border:1px solid #e3e3e3;box-shadow:0 3px 8px #0003;line-height:1.15;padding:15px 13px;transition:box-shadow .12s;will-change:transform}.card:active{cursor:grabbing}.card.question{width:152px;min-height:118px;font-size:15px}.card.hat{width:153px;min-height:46px;font-size:16px}.pin{position:absolute;top:-9px;left:calc(50% - 9px);width:18px;height:18px;border-radius:50%;box-shadow:0 2px 5px #0002;background:#ffa262}.question .pin{background:#3299d5}.card.held{box-shadow:0 9px 20px #0005}.card.target{outline:3px dashed #5a9ed9;outline-offset:3px}.pair{position:absolute;width:178px;cursor:pointer;touch-action:none;user-select:none;z-index:80;filter:drop-shadow(0 2px 4px #0003)}.pair .card{position:relative;left:0!important;top:0!important;transform:none!important;margin:auto;cursor:pointer}.pair .question{width:170px;min-height:110px}.pair .hat{width:170px;min-height:48px}.pair .join{height:15px;width:38px;margin:-1px auto;background:#f55;border-left:3px solid #fff;border-right:3px solid #fff}.pair.wrong .card{outline:6px solid #fa2929;outline-offset:-3px;background:repeating-linear-gradient(135deg,#fff 0 8px,#fff0e9 8px 15px)}.pair.wrong .join{background:#fa2929}.pair.correct .card{outline:6px solid #78ed87;outline-offset:-3px}.pair.correct .join{background:#78ed87}.pair.fade{opacity:0;transform:scale(.93);transition:opacity .55s,transform .55s}.tool{position:absolute;z-index:200;top:9px;width:32px;height:32px;border:0;background:#ffffffb9;border-radius:5px;cursor:pointer;font-size:23px;display:grid;place-items:center;box-shadow:0 1px 3px #0003}.tool.help{left:9px;color:#308f3c}.tool.full{right:9px;color:#ed6f77}.restart{position:absolute;bottom:15px;right:15px;z-index:200;cursor:pointer;border:0;border-radius:30px;padding:10px 15px;color:white;background:#2e8bd6;font-size:14px;box-shadow:0 3px 6px #0004}.status{position:absolute;left:14px;bottom:17px;font-size:13px;color:#555;z-index:100;background:#fff9;padding:7px 11px;border-radius:10px}.overlay{position:absolute;inset:0;background:#0002;display:grid;place-items:center;z-index:300}.overlay[hidden]{display:none}.dialog{background:#f6f6f6;border:8px solid #c6c6c6;box-shadow:0 3px 11px #0006;border-radius:14px;width:min(460px,calc(100% - 24px));padding:17px 16px;text-align:center}.dialog h2{font-size:21px;margin:2px 0 10px}.dialog p{font-size:16px;line-height:1.42;text-align:left;margin:0 0 15px}.dialog button{font-size:16px;cursor:pointer;padding:4px 17px;border:1px solid #999;background:#eee}.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:220;background:#fff;border-radius:8px;padding:9px 13px;box-shadow:0 4px 14px #0003;font-size:14px;max-width:calc(100% - 100px);text-align:center;pointer-events:none}.hint[hidden]{display:none}
</style></head><body><main id="app" class="app"><div id="board" class="board"></div><button class="tool help" id="help" aria-label="Открыть задание" title="Посмотреть задание">❔</button><button class="tool full" id="fullscreen" aria-label="На весь экран" title="На весь экран">⛶</button><span class="status" id="status">Найдено пар: 0 из 6</span><button id="restart" class="restart">Начать заново</button><div id="hint" class="hint" hidden></div><div id="overlay" class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="instruction-title"><h2 id="instruction-title">Задание</h2><p>Перед вами шесть шляп и вопросы, на которые они отвечают. Ваша задача — найти шесть пар. Зажмите карточку и перетащите на подходящую. Неверную пару можно разъединить нажатием.</p><button id="ok">OK</button></div></div></main><script>
'use strict';
const items=[
{id:'white',q:'Какая информация о проблеме у нас есть? Какой информации не хватает и где мне её найти?',hat:'Белая шляпа?',x:198,y:329,hx:45,hy:341},
{id:'black',q:'Где могут возникнуть сложности? Какие неочевидные подводные камни? В каких местах нужно проявить осторожность?',hat:'Черная шляпа',x:125,y:152,hx:410,hy:204},
{id:'blue',q:'Какая проблема? Чего нужно добиться обсуждением? Какие итоги встречи и план действий?',hat:'Синяя шляпа',x:280,y:101,hx:347,hy:362},
{id:'green',q:'Как еще можно решить проблему? Какие нестандартные методы могут помочь? Как преодолеть трудности?',hat:'Зеленая шляпа',x:430,y:48,hx:443,hy:288},
{id:'yellow',q:'Что можно сделать для решения проблемы? Как это поможет? Почему это сработает?',hat:'Желтая шляпа',x:555,y:152,hx:270,hy:283},
{id:'red',q:'Что я чувствую по поводу проблемы? Что подсказывает мне интуиция, верное ли решение принято?',hat:'Красная шляпа',x:440,y:444,hx:543,hy:368}
];
const app=document.getElementById('app'),board=document.getElementById('board'),overlay=document.getElementById('overlay');
let solved=new Set(), active=null, z=10, scale=1, timer=0;
function resize(){const r=app.getBoundingClientRect();scale=Math.min(r.width/860,r.height/600);const larger=document.fullscreenElement?Math.min(r.width/860,r.height/600):scale;scale=larger;board.style.transform=`scale(${scale})`;board.style.left=Math.max(0,(r.width-860*scale)/2)+'px';board.style.top=Math.max(0,(r.height-600*scale)/2)+'px'}
new ResizeObserver(resize).observe(app);document.addEventListener('fullscreenchange',resize);
function makeCard(item,type,x,y){const e=document.createElement('div');e.className='card '+type;e.dataset.id=item.id;e.dataset.type=type;e.textContent=type==='question'?item.q:item.hat;const pin=document.createElement('span');pin.className='pin';e.append(pin);e.style.left=x+'px';e.style.top=y+'px';e.style.zIndex=++z;board.append(e);e.addEventListener('pointerdown',down);return e}
function render(){clearTimeout(timer);solved=new Set();board.replaceChildren();items.forEach(v=>{makeCard(v,'question',v.x,v.y);makeCard(v,'hat',v.hx,v.hy)});document.getElementById('status').textContent='Найдено пар: 0 из 6';hideHint()}
function down(ev){if(ev.button!==0&&ev.pointerType==='mouse')return;if(overlay.hidden===false)return;const e=ev.currentTarget;e.setPointerCapture(ev.pointerId);e.style.zIndex=++z;e.classList.add('held');const p=point(ev);active={e,pid:ev.pointerId,startX:p.x,startY:p.y,x:parseFloat(e.style.left),y:parseFloat(e.style.top),moved:false};e.addEventListener('pointermove',move);e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)}
function point(ev){const r=board.getBoundingClientRect();return{x:(ev.clientX-r.left)/scale,y:(ev.clientY-r.top)/scale}}
function move(ev){if(!active||active.pid!==ev.pointerId)return;const a=active,p=point(ev);let dx=p.x-a.startX,dy=p.y-a.startY;if(Math.abs(dx)+Math.abs(dy)>4)a.moved=true;a.e.style.left=Math.max(0,Math.min(860-a.e.offsetWidth,a.x+dx))+'px';a.e.style.top=Math.max(12,Math.min(600-a.e.offsetHeight,a.y+dy))+'px';highlightTarget(a.e)}
function overlap(a,b){const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();let x=Math.max(0,Math.min(ra.right,rb.right)-Math.max(ra.left,rb.left)),y=Math.max(0,Math.min(ra.bottom,rb.bottom)-Math.max(ra.top,rb.top));return x*y/Math.min(ra.width*ra.height,rb.width*rb.height)}
function bestTarget(e){return [...board.querySelectorAll('.card')].filter(c=>c!==e&&c.dataset.type!==e.dataset.type&&!c.closest('.pair')).map(c=>({e:c,n:overlap(e,c)})).filter(v=>v.n>.23).sort((a,b)=>b.n-a.n)[0]?.e}
function highlightTarget(e){board.querySelectorAll('.target').forEach(c=>c.classList.remove('target'));bestTarget(e)?.classList.add('target')}
function up(ev){if(!active||active.pid!==ev.pointerId)return;const a=active;active=null;a.e.classList.remove('held');a.e.removeEventListener('pointermove',move);a.e.removeEventListener('pointerup',up);a.e.removeEventListener('pointercancel',up);const target=bestTarget(a.e);board.querySelectorAll('.target').forEach(c=>c.classList.remove('target'));if(target)pair(a.e,target)}
function pair(a,b){const q=a.dataset.type==='question'?a:b,h=a.dataset.type==='hat'?a:b;const success=q.dataset.id===h.dataset.id;const x=Math.max(4,Math.min(675,parseFloat(q.style.left))),y=Math.max(25,Math.min(410,parseFloat(q.style.top)));const group=document.createElement('div');group.className='pair '+(success?'correct':'wrong');group.style.left=x+'px';group.style.top=y+'px';group.style.zIndex=++z;const qc=q.cloneNode(true),hc=h.cloneNode(true);qc.className='card question';hc.className='card hat';qc.style.left='0';qc.style.top='0';hc.style.left='0';hc.style.top='0';const join=document.createElement('div');join.className='join';group.append(qc,join,hc);q.style.visibility='hidden';h.style.visibility='hidden';board.append(group);if(success){solved.add(q.dataset.id);document.getElementById('status').textContent=`Найдено пар: ${solved.size} из 6`;notify('Верно! Пара найдена.');setTimeout(()=>group.classList.add('fade'),1000);setTimeout(()=>{group.remove();q.remove();h.remove();if(solved.size===6)done()},1650)}else{notify('Неверная пара. Нажмите на неё, чтобы разъединить.');group.addEventListener('click',()=>{group.remove();q.style.visibility='visible';h.style.visibility='visible';q.style.zIndex=++z;h.style.zIndex=++z})}}
function notify(t){const e=document.getElementById('hint');e.textContent=t;e.hidden=false;clearTimeout(timer);timer=setTimeout(hideHint,1800)}function hideHint(){document.getElementById('hint').hidden=true}
function done(){document.querySelector('.dialog h2').textContent='Все пары найдены!';document.querySelector('.dialog p').textContent='Отлично! Вы правильно соединили все шесть шляп с их вопросами. Можно пройти задание заново.';document.getElementById('ok').textContent='Закрыть';overlay.hidden=false}
function showInstructions(){document.querySelector('.dialog h2').textContent='Задание';document.querySelector('.dialog p').textContent='Перед вами шесть шляп и вопросы, на которые они отвечают. Ваша задача — найти шесть пар. Зажмите карточку и перетащите на подходящую. Неверную пару можно разъединить нажатием.';document.getElementById('ok').textContent='OK';overlay.hidden=false}
document.getElementById('ok').addEventListener('click',()=>{overlay.hidden=true});document.getElementById('help').addEventListener('click',showInstructions);document.getElementById('restart').addEventListener('click',()=>{render();showInstructions()});document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await app.requestFullscreen()}catch(e){notify('Полноэкранный режим недоступен в этом браузере.')}});render();resize();
</script></body></html>
