<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зоны личного контроля</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--line:#d9e0e8;--card:#fff;
  --accent:#4658d6;--accent-soft:#eef1ff;
  --ok:#147552;--ok-soft:#eaf8f1;
  --bad:#b42318;--bad-soft:#fff0ee;
  --warn:#936500;--warn-soft:#fff7dc;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--ink)}
.task{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(16,24,40,.07)}
.head{padding:14px 15px 11px;background:linear-gradient(135deg,#fafbff,#eef1ff)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-size:18px;line-height:1.2;margin:4px 0 5px}
.lead{font-size:13px;line-height:1.38;color:var(--muted);margin:0}
.body{padding:12px 15px 14px}
.card,.row-card{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}
.row-card+.row-card{margin-top:7px}
.case{font-size:13px;line-height:1.4}
.small{font-size:11px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit}
.choice,.tile,.answer-btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer;transition:.12s;font-size:12px;line-height:1.3}
.choice:hover,.tile:hover,.answer-btn:hover{border-color:#a6b0ed}
.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.actions{display:flex;gap:7px;margin-top:11px}
.primary,.secondary{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:12px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#edf0f5;color:var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}.feedback.ok{background:var(--ok-soft);color:#0c5a3f}
.feedback.warn{background:var(--warn-soft);color:#704d00}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#eef1f6;
  color:#475467;font-size:10px;font-weight:800}
.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:4px;background:#e8ebf3}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.hidden{display:none!important}
.statement{font-size:12px;line-height:1.4;padding:9px;border-radius:10px;background:#f8f9fb;border:1px solid var(--line)}
.inline-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.summary{font-size:12px;line-height:1.45}
@media(max-width:430px){
  .grid2,.inline-choices{grid-template-columns:1fr}
  .task{border-radius:12px}
  .head,.body{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="task" id="controlZonesTask">

  <div class="head">
    <div class="kicker">Зоны личного контроля</div>
    <h2>Верните проблему в свою зону действий</h2>
    <p class="lead">Распределите шесть элементов и выберите действие на ближайшие два часа.</p>
  </div>
  <div class="body">
    <div class="statement">Заказчик задерживает решение, а запуск запланирован на пятницу.</div>
    <div data-role="items" style="margin-top:7px"></div>
    <div data-role="actionBlock" class="hidden">
      <div class="small" style="margin:9px 0 5px">Что сделать в ближайшие два часа?</div>
      <div class="grid2" data-role="actions"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" data-role="reset">Начать заново</button>
      <button type="button" class="primary" data-role="check" disabled>Проверить</button>
    </div>
    <div class="feedback" data-role="fb"></div>
  </div>

</div>
<script>
(() => {
  const root = document.getElementById('controlZonesTask');
  if (!root) return;

  const items = [
    {text:'Качество подготовленной презентации', correct:'control'},
    {text:'Финальное решение заказчика', correct:'outside'},
    {text:'Тон следующего письма', correct:'control'},
    {text:'Внутреннее настроение каждого участника команды', correct:'outside'},
    {text:'План действий при задержке согласования', correct:'control'},
    {text:'Состояние рынка на этой неделе', correct:'outside'}
  ];
  const actions = [
    {text:'Продумать десять причин, почему заказчик молчит', correct:false},
    {text:'Составить письмо с двумя вариантами запуска и сроком ответа', correct:true},
    {text:'Гарантировать команде, что заказчик согласится', correct:false},
    {text:'До конца дня следить за новостями рынка', correct:false}
  ];
  let answers = Array(items.length).fill(null);
  let action = null;
  const q = role => root.querySelector(`[data-role="${role}"]`);

  function render() {
    q('items').innerHTML = items.map((item,i) => `
      <div class="row-card" data-row="${i}">
        <div style="font-size:12px;line-height:1.35">${item.text}</div>
        <div class="inline-choices">
          <button type="button" class="answer-btn ${answers[i]==='control'?'selected':''}" data-value="control">Под моим контролем</button>
          <button type="button" class="answer-btn ${answers[i]==='outside'?'selected':''}" data-value="outside">Вне контроля</button>
        </div>
      </div>`).join('');
    q('items').querySelectorAll('[data-row]').forEach(row => {
      const i = Number(row.dataset.row);
      row.querySelectorAll('[data-value]').forEach(btn => {
        btn.addEventListener('click', () => {
          answers[i] = btn.dataset.value;
          q('fb').className = 'feedback';
          render();
        });
      });
    });
    const complete = answers.every(v => v !== null);
    q('actionBlock').classList.toggle('hidden', !complete);
    q('check').disabled = !(complete && action !== null);
  }

  q('actions').innerHTML = actions.map((a,i) =>
    `<button type="button" class="choice" data-action="${i}">${a.text}</button>`
  ).join('');
  q('actions').querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      q('actions').querySelectorAll('[data-action]').forEach(x => x.classList.remove('selected'));
      btn.classList.add('selected');
      action = Number(btn.dataset.action);
      q('check').disabled = !answers.every(v => v !== null);
    });
  });

  q('check').addEventListener('click', () => {
    let score = 0;
    q('items').querySelectorAll('[data-row]').forEach(row => {
      const i = Number(row.dataset.row);
      row.querySelectorAll('[data-value]').forEach(btn => {
        const value = btn.dataset.value;
        if (value === items[i].correct) btn.classList.add('good');
        if (value === answers[i] && value !== items[i].correct) btn.classList.add('bad');
        btn.disabled = true;
      });
      if (answers[i] === items[i].correct) score += 1;
    });
    q('actions').querySelectorAll('[data-action]').forEach(btn => {
      const i = Number(btn.dataset.action);
      if (actions[i].correct) btn.classList.add('good');
      else if (i === action) btn.classList.add('bad');
      btn.disabled = true;
    });
    const ok = score === items.length && actions[action].correct;
    q('fb').className = `feedback show ${ok?'ok':'warn'}`;
    q('fb').innerHTML = ok
      ? '<strong>Фокус возвращен в управляемую часть.</strong><br>Вы выбрали собственные действия, а не попытку контролировать чужое решение.'
      : `<strong>Верно распределено: ${score} из ${items.length}.</strong><br>Контролировать можно свои слова, подготовку и план. Решения, чувства других людей и рынок — только учитывать.`;
    q('check').disabled = true;
  });

  q('reset').addEventListener('click', () => {
    answers = Array(items.length).fill(null);
    action = null;
    q('actions').querySelectorAll('[data-action]').forEach(x => {x.className='choice';x.disabled=false;});
    q('fb').className = 'feedback';
    render();
  });

  render();

})();
</script>
</body>
</html>
