<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Итоговое задание — выбор данных</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#26272b;background:#fff}*{box-sizing:border-box}body{margin:0}.app{width:min(560px,100%);margin:auto;border:1px solid #eee0e2;border-top:5px solid #c51d35;border-radius:13px;padding:17px 16px 16px;background:#fff}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.eyebrow{font-size:11px;font-weight:800;color:#b61d31;letter-spacing:.07em;text-transform:uppercase}.count{font-size:11px;color:#777}.progress{display:flex;gap:5px;margin:0 0 14px}.progress span{height:4px;flex:1;background:#eee7e8;border-radius:5px}.progress span.current{background:#cb1f35}.progress span.past{background:#cc7c88}h1{font-size:19px;line-height:1.25;letter-spacing:-.25px;margin:0 0 10px}.scenario{font-size:13px;line-height:1.48;padding:10px 12px;border-left:3px solid #d12b40;background:#fcf7f8;border-radius:7px;margin:0 0 11px}.q{font-size:14px;font-weight:750;line-height:1.4;margin:0 0 10px}.variant-list{margin:6px 0 0 18px;padding:0}.variant-list li{padding:0 0 3px}.choices{display:grid;gap:7px}.opt{appearance:none;border:1.5px solid #e3e2e5;background:#fff;border-radius:9px;width:100%;text-align:left;padding:10px;display:flex;align-items:flex-start;gap:9px;font:inherit;font-size:12.75px;line-height:1.38;color:#25262b;cursor:pointer}.opt:hover{border-color:#d88b95;background:#fffafa}.opt:focus-visible,.btn:focus-visible,.drop:focus-visible{outline:3px solid #f4a6b0;outline-offset:2px}.opt .number{flex:0 0 24px;height:24px;display:grid;place-items:center;background:#f3f3f4;color:#777;border-radius:6px;font-size:11px;font-weight:700}.opt.selected{border-color:#c51d35;background:#fff2f4}.opt.selected .number{background:#c51d35;color:#fff}.opt.correct{border-color:#369c5c;background:#f0f9f2}.opt.correct .number{background:#369c5c;color:#fff}.opt.wrong{border-color:#ce3d4b;background:#fff0f1}.opt.wrong .number{background:#ce3d4b;color:#fff}.drop{border:2px dashed #d5aab2;background:#fff9fa;border-radius:9px;min-height:55px;text-align:center;padding:13px 10px;font-size:12.5px;color:#885a64;margin:0 0 9px;line-height:1.35}.drop.full{border-style:solid;border-color:#c51d35;color:#343137}.drop.correct{border-color:#369c5c;background:#f0f9f2}.drop.wrong{border-color:#ce3d4b;background:#fff0f1}.drag .opt{cursor:grab}.tip{font-size:11.5px;color:#777;margin:7px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}.btn{appearance:none;background:#c51d35;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:12.5px;padding:10px 13px;cursor:pointer}.btn:hover{background:#a91a2c}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#fff;color:#ae2134;border:1px solid #e6bac1}.btn.secondary:hover{background:#fff3f4}.feedback{display:none;font-size:12.8px;line-height:1.48;padding:11px 12px;border-radius:7px;margin-top:11px;background:#fff4f5;border-left:3px solid #ca374b}.feedback.good{background:#eef8f1;border-left-color:#329b53}.feedback.show{display:block}.feedback b{display:block;margin-bottom:4px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:8px}.footer .btn{font-size:12px}.summary{padding:13px 11px;border-radius:8px;background:#f6faf6;border-left:3px solid #329b53;font-size:13px;line-height:1.5}.hidden{display:none!important}@media(max-width:560px){.app{border-radius:0;padding:15px 12px}.opt{font-size:12.5px}}
</style></head><body><main class="app"><header><span class="eyebrow">Практика</span><span id="count" class="count"></span></header><div id="progress" class="progress" aria-hidden="true"></div><div id="content"></div><div id="actions" class="actions"><button type="button" class="btn" id="check" disabled>Проверить ответ</button><button type="button" class="btn secondary" id="retry">Попробовать еще раз</button></div><div id="feedback" role="status" aria-live="polite" class="feedback"></div><div class="footer"><button type="button" class="btn secondary" id="back">← Вернуться назад</button><button type="button" class="btn" id="next" disabled>Следующее задание →</button></div></main><script>
const tasks=[{"title": "Выберите способ работы", "type": "single", "situation": "Руководитель отдела продаж готовит презентацию о результатах квартала. У него есть три файла: отчет с общими показателями продаж, таблица с персональными данными клиентов и внутренний документ с индивидуальными скидками для крупных заказчиков. Компания разрешает использовать определенный ИИ-сервис для подготовки презентаций, но запрещает загружать в него клиентские базы и закрытые коммерческие условия.<br><br>Руководитель хочет сэкономить время и передать нейросети все три файла, чтобы она сама выбрала нужную информацию.", "question": "Как ему поступить?", "options": ["Загрузить все файлы, потому что компания разрешила использовать сервис для презентаций.", "Загрузить клиентскую базу после удаления ФИО, не проверяя остальные сведения.", "Подготовить материал из разрешенных общих показателей и передать только их, а закрытые сведения обработать другим разрешенным способом.", "Отправить все файлы и сразу удалить диалог после получения презентации."], "correct": [2], "explanation": "Руководителю не нужно передавать всю исходную информацию, чтобы подготовить презентацию с результатами квартала. Он может использовать общие показатели, которые компания разрешает обрабатывать в выбранном сервисе. Клиентскую базу и закрытые коммерческие условия следует исключить из загрузки, если действующие правила запрещают их передачу.<br><br>При этом удаление ФИО из клиентской базы не гарантирует, что оставшиеся сведения больше не относятся к конкретным людям. Удаление диалога после загрузки также не исправляет нарушение правил передачи данных. Поэтому правильное решение начинается с выбора допустимых материалов, а не с последующей очистки переписки."}];
let step=0;const chosen=Array(tasks.length).fill(null), results=Array(tasks.length).fill(null);const $=s=>document.querySelector(s);const letters=['А','Б','В','Г'];
function render(){const t=tasks[step];$('#count').textContent=(step+1)+' из '+tasks.length;$('#progress').innerHTML=tasks.map((_,i)=>'<span class="'+(i===step?'current':i<step?'past':'')+'"></span>').join('');let x='<h1>'+t.title+'</h1><div class="scenario">'+t.situation;if(t.variants)x+='<ol class="variant-list">'+t.variants.map(v=>'<li>'+v+'</li>').join('')+'</ol>';x+='</div><div class="q">'+t.question+'</div>';if(t.type==='drag')x+='<div class="drop" id="drop" tabindex="0" aria-label="Поле для ответа">Перетащите сюда подходящий вывод</div>';x+='<div class="choices '+(t.type==='drag'?'drag':'')+'">'+t.options.map((v,i)=>'<button class="opt" type="button" data-i="'+i+'" '+(t.type==='drag'?'draggable="true"':'')+' aria-pressed="false"><span class="number">'+(t.type==='cards'?i+1:letters[i])+'</span><span>'+v+'</span></button>').join('')+'</div>';if(t.type==='drag')x+='<p class="tip">Можно также нажать на карточку, чтобы переместить ее в поле ответа.</p>';$('#content').innerHTML=x;$('#feedback').className='feedback';$('#feedback').innerHTML='';document.querySelectorAll('.opt').forEach(b=>{b.addEventListener('click',()=>select(Number(b.dataset.i)));if(t.type==='drag')b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.dataset.i);e.dataTransfer.effectAllowed='move';});});if(t.type==='drag'){let d=$('#drop');d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<4)select(i);});}showSelection();if(results[step]!==null)showResult();$('#check').disabled=chosen[step]===null;$('#back').disabled=step===0;$('#next').disabled=results[step]!==true;$('#next').textContent=step===tasks.length-1?'Завершить практику →':'Следующая ситуация →';}
function select(i){chosen[step]=i;results[step]=null;showSelection();$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#next').disabled=true;$('#check').disabled=false;}
function showSelection(){document.querySelectorAll('.opt').forEach(b=>{const on=Number(b.dataset.i)===chosen[step];b.classList.remove('selected','wrong','correct');b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on));});const d=$('#drop');if(d){if(chosen[step]!==null){d.textContent='Выбрано: '+tasks[step].options[chosen[step]];d.className='drop full';}else{d.textContent='Перетащите сюда подходящий вывод';d.className='drop';}}}
function showResult(){const ok=results[step]===true;let b=document.querySelector('.opt[data-i="'+chosen[step]+'"]');if(b){b.classList.remove('selected');b.classList.add(ok?'correct':'wrong');}const d=$('#drop');if(d)d.classList.add(ok?'correct':'wrong');$('#feedback').className='feedback show'+(ok?' good':'');$('#feedback').innerHTML='<b>'+(ok?'Верно!':'Пока неверно. Попробуйте еще раз.')+'</b>'+tasks[step].explanation;$('#next').disabled=!ok;}
$('#check').onclick=()=>{if(chosen[step]===null)return;results[step]=tasks[step].correct.includes(chosen[step]);showSelection();showResult();};$('#retry').onclick=()=>{chosen[step]=null;results[step]=null;render();};$('#back').onclick=()=>{if(step>0){step--;render();}};$('#next').onclick=()=>{if(results[step]!==true)return;if(step<tasks.length-1){step++;render();}else{document.querySelector('#count').textContent=tasks.length+' из '+tasks.length;$('#progress').innerHTML='<span class="past"></span>'.repeat(tasks.length);$('#content').innerHTML='<h1>Практика завершена</h1><div class="summary">Вы выбрали способ подготовки презентации без передачи клиентской базы и закрытых коммерческих условий.</div>';$('#actions').classList.add('hidden');$('#feedback').className='feedback';$('#back').classList.add('hidden');$('#next').textContent='Пройти заново';$('#next').disabled=false;$('#next').onclick=()=>{step=0;chosen.fill(null);results.fill(null);$('#actions').classList.remove('hidden');$('#back').classList.remove('hidden');$('#next').onclick=goNext;render();};}};const goNext=$('#next').onclick;
render();
</script></body></html>
